<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Figure 9.1 — Truncated axis vs zero baseline</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=EB+Garamond:wght@400;500&family=Inter:wght@400;600;700&family=JetBrains+Mono:wght@400&display=swap" rel="stylesheet">
<style>
  :root {
    --color-white:     #FFFFFF;
    --color-ink:       #121212;
    --color-red:       #C8102E;
    --color-secondary: #545454;
    --color-border:    #D4D4D4;
    --color-ochre:     #C8860E;
  }
  @media (prefers-color-scheme: dark) {
    :root {
      --color-white:     #111111;
      --color-ink:       #F0EBE3;
      --color-red:       #E8243A;
      --color-secondary: #A0978C;
      --color-border:    #2E2E2E;
      --color-ochre:     #D49A30;
    }
  }
  * { box-sizing: border-box; margin: 0; padding: 0; }
  body { background: var(--color-white); color: var(--color-ink); font-family: 'Inter', sans-serif; padding: 24px; }
  h1 { font-family: 'EB Garamond', Georgia, serif; font-weight: 400; font-size: 28px; margin-bottom: 6px; }
  .subtitle { font-family: 'EB Garamond', Georgia, serif; font-style: italic; color: var(--color-secondary); margin-bottom: 20px; }
  #chart { width: 100%; min-height: 460px; }
  .panel-title { font-family: 'Inter', sans-serif; font-size: 14px; font-weight: 600; fill: var(--color-ink); }
  .panel-sub { font-family: 'EB Garamond', Georgia, serif; font-style: italic; font-size: 12px; fill: var(--color-secondary); }
  .axis text { font-family: 'JetBrains Mono', monospace; font-size: 11px; fill: var(--color-secondary); }
  .axis path, .axis line { stroke: var(--color-secondary); }
  .gridline { stroke: var(--color-border); stroke-opacity: 0.6; }
  .bar-rect { fill: var(--color-red); transition: opacity 120ms cubic-bezier(0.2,0.8,0.2,1); }
  .bar-rect:hover { opacity: 0.85; }
  .benchmark-line { stroke: var(--color-secondary); stroke-dasharray: 4 3; }
  .benchmark-label { font-family: 'Inter', sans-serif; font-size: 11px; fill: var(--color-secondary); }
  .annotation { font-family: 'EB Garamond', Georgia, serif; font-style: italic; font-size: 12px; fill: var(--color-secondary); }
  .tooltip { position: absolute; pointer-events: none; opacity: 0; background: var(--color-ink); color: var(--color-white); padding: 6px 10px; border-radius: 4px; font-size: 13px; }
  @media (prefers-reduced-motion: reduce) { * { transition: none !important; animation: none !important; } }
</style>
</head>
<body>
  <h1>Same data, two stories</h1>
  <div class="subtitle">Six teachers, same course. The axis decides what the reader sees.</div>
  <div id="chart" role="main"></div>
  <script src="https://cdnjs.cloudflare.com/ajax/libs/d3/7.9.0/d3.min.js"></script>
  <script>
    const teacherData = [
      { teacher: 'Adams',     mean: 78.2 },
      { teacher: 'Brennan',   mean: 76.8 },
      { teacher: 'Connor',    mean: 75.3 },
      { teacher: 'Diaz',      mean: 74.1 },
      { teacher: 'Edelstein', mean: 73.6 },
      { teacher: 'Sandoval',  mean: 71.4 }
    ];

    const tooltip = d3.select('body').append('div').attr('class', 'tooltip');
    function showTooltip(event, d) {
      tooltip.html(`<strong>${d.teacher}</strong>: ${d.mean.toFixed(1)}`)
        .style('left', (event.pageX + 12) + 'px')
        .style('top',  (event.pageY - 28) + 'px')
        .transition().duration(150).style('opacity', 1);
    }
    function moveTooltip(event) {
      tooltip.style('left', (event.pageX + 12) + 'px').style('top', (event.pageY - 28) + 'px');
    }
    function hideTooltip() { tooltip.transition().duration(100).style('opacity', 0); }

    function draw() {
      d3.select('#chart').selectAll('*').remove();
      const container = document.getElementById('chart');
      const totalWidth  = container.clientWidth || 800;
      const totalHeight = 460;
      const margin = { top: 56, right: 32, bottom: 56, left: 56 };
      const panelGap = 32;
      const panelWidth = (totalWidth - margin.left - margin.right - panelGap) / 2;
      const chartHeight = totalHeight - margin.top - margin.bottom;

      const svg = d3.select('#chart').append('svg')
        .attr('width', totalWidth).attr('height', totalHeight)
        .attr('role', 'img').attr('aria-labelledby', 'c-title c-desc');
      svg.append('title').attr('id', 'c-title').text('Same six-teacher means, truncated and zero-baseline');
      svg.append('desc').attr('id', 'c-desc').text('Left panel: y-axis 70 to 80 inflates the differences. Right panel: y-axis 0 to 100 shows the six classes cluster within seven points.');

      const xScaleBand = d3.scaleBand()
        .domain(teacherData.map(d => d.teacher))
        .range([0, panelWidth])
        .padding(0.25);

      // LEFT panel — truncated 70..80
      const gLeft = svg.append('g').attr('transform', `translate(${margin.left},${margin.top})`);
      const yScaleTrunc = d3.scaleLinear().domain([70, 80]).range([chartHeight, 0]);
      gLeft.append('text').attr('class', 'panel-title').attr('x', panelWidth / 2).attr('y', -22).attr('text-anchor', 'middle').text('y-axis starts at 70 (default)');
      gLeft.append('text').attr('class', 'panel-sub').attr('x', panelWidth / 2).attr('y', -6).attr('text-anchor', 'middle').text('Sandoval looks like he is failing');

      gLeft.append('g').attr('class', 'g-gridlines').selectAll('.gridline')
        .data(yScaleTrunc.ticks(5)).join('line')
          .attr('class', 'gridline').attr('aria-hidden', 'true')
          .attr('x1', 0).attr('x2', panelWidth)
          .attr('y1', d => yScaleTrunc(d)).attr('y2', d => yScaleTrunc(d));

      gLeft.append('g').attr('class', 'axis')
        .attr('transform', `translate(0,${chartHeight})`).call(d3.axisBottom(xScaleBand));
      gLeft.append('g').attr('class', 'axis').call(d3.axisLeft(yScaleTrunc).ticks(5));

      gLeft.append('g').attr('class', 'g-bars').selectAll('.bar-rect')
        .data(teacherData, d => d.teacher)
        .join('rect')
          .attr('class', 'bar-rect')
          .attr('x', d => xScaleBand(d.teacher))
          .attr('y', d => yScaleTrunc(d.mean))
          .attr('width', xScaleBand.bandwidth())
          .attr('height', d => chartHeight - yScaleTrunc(d.mean))
          .attr('tabindex', 0)
          .attr('aria-label', d => `${d.teacher}: mean ${d.mean.toFixed(1)} (truncated axis)`)
          .on('mouseover', (event, d) => showTooltip(event, d))
          .on('mousemove', moveTooltip)
          .on('mouseout', hideTooltip);

      gLeft.append('text').attr('class', 'annotation')
        .attr('x', panelWidth / 2).attr('y', chartHeight + 44).attr('text-anchor', 'middle')
        .text('Visual ratio Adams : Sandoval ≈ 6 to 1');

      // RIGHT panel — zero-baseline 0..100
      const gRight = svg.append('g').attr('transform', `translate(${margin.left + panelWidth + panelGap},${margin.top})`);
      const yScaleZero = d3.scaleLinear().domain([0, 100]).range([chartHeight, 0]);
      gRight.append('text').attr('class', 'panel-title').attr('x', panelWidth / 2).attr('y', -22).attr('text-anchor', 'middle').text('y-axis starts at 0 (corrected)');
      gRight.append('text').attr('class', 'panel-sub').attr('x', panelWidth / 2).attr('y', -6).attr('text-anchor', 'middle').text('Six classes cluster within 7 points');

      gRight.append('g').attr('class', 'g-gridlines').selectAll('.gridline')
        .data(yScaleZero.ticks(5)).join('line')
          .attr('class', 'gridline').attr('aria-hidden', 'true')
          .attr('x1', 0).attr('x2', panelWidth)
          .attr('y1', d => yScaleZero(d)).attr('y2', d => yScaleZero(d));

      gRight.append('g').attr('class', 'axis')
        .attr('transform', `translate(0,${chartHeight})`).call(d3.axisBottom(xScaleBand));
      gRight.append('g').attr('class', 'axis').call(d3.axisLeft(yScaleZero).ticks(5));

      gRight.append('g').attr('class', 'g-bars').selectAll('.bar-rect')
        .data(teacherData, d => d.teacher)
        .join('rect')
          .attr('class', 'bar-rect')
          .attr('x', d => xScaleBand(d.teacher))
          .attr('y', d => yScaleZero(d.mean))
          .attr('width', xScaleBand.bandwidth())
          .attr('height', d => chartHeight - yScaleZero(d.mean))
          .attr('tabindex', 0)
          .attr('aria-label', d => `${d.teacher}: mean ${d.mean.toFixed(1)}`)
          .on('mouseover', (event, d) => showTooltip(event, d))
          .on('mousemove', moveTooltip)
          .on('mouseout', hideTooltip);

      gRight.append('line').attr('class', 'benchmark-line')
        .attr('x1', 0).attr('x2', panelWidth)
        .attr('y1', yScaleZero(70)).attr('y2', yScaleZero(70));
      gRight.append('text').attr('class', 'benchmark-label')
        .attr('x', panelWidth - 4).attr('y', yScaleZero(70) - 4).attr('text-anchor', 'end')
        .text('Proficiency benchmark = 70');
      gRight.append('text').attr('class', 'annotation')
        .attr('x', panelWidth / 2).attr('y', chartHeight + 44).attr('text-anchor', 'middle')
        .text('All six above benchmark; range = 6.8 points');
    }

    draw();
    const ro = new ResizeObserver(() => draw());
    ro.observe(document.getElementById('chart'));
  </script>
</body>
</html>
