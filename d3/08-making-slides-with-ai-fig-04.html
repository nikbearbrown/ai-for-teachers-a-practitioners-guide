<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Figure 8.4 — Before and after slide anatomy</title>
<style>
  :root {
    --color-white:     #FFFFFF;
    --color-ink:       #121212;
    --color-red:       #C8102E;
    --color-secondary: #545454;
    --color-border:    #D4D4D4;
    --color-ochre:     #C8860E;
  }
  @media (prefers-color-scheme: dark) {
    :root {
      --color-white:     #111111;
      --color-ink:       #F0EBE3;
      --color-red:       #E8243A;
      --color-secondary: #A0978C;
      --color-border:    #2E2E2E;
      --color-ochre:     #D49A30;
    }
  }
  * { box-sizing: border-box; margin: 0; padding: 0; }
  body {
    background: var(--color-white); color: var(--color-ink);
    font-family: 'EB Garamond', Garamond, Georgia, serif;
    padding: 24px;
  }
  #chart { width: 100%; height: 520px; }
  .eyebrow { font-family: 'EB Garamond', Georgia, serif; font-size: 13px; letter-spacing: 2px; fill: var(--color-secondary); }
  .slide-h { font-family: 'EB Garamond', Georgia, serif; font-size: 15px; fill: var(--color-ink); }
  .slide-h-after { font-family: 'EB Garamond', Georgia, serif; font-size: 16px; fill: var(--color-ink); }
  .slide-body { font-family: 'EB Garamond', Georgia, serif; font-size: 9px; fill: var(--color-secondary); }
  .ann-h   { font-family: 'EB Garamond', Georgia, serif; font-size: 12px; fill: var(--color-secondary); }
  .ann     { font-family: 'EB Garamond', Georgia, serif; font-size: 12px; font-style: italic; fill: var(--color-ink); }
  .footer  { font-family: 'EB Garamond', Georgia, serif; font-size: 15px; font-style: italic; fill: var(--color-ink); }
  .tooltip {
    position: absolute; pointer-events: none; opacity: 0;
    background: var(--color-white); color: var(--color-ink);
    border: 1px solid var(--color-border); padding: 6px 10px;
    font-family: 'EB Garamond', Georgia, serif; font-size: 13px;
  }
  @media (prefers-reduced-motion: reduce) { * { transition: none !important; animation: none !important; } }
</style>
</head>
<body>
<div id="chart" role="main"></div>
<script src="https://cdnjs.cloudflare.com/ajax/libs/d3/7.9.0/d3.min.js"></script>
<script>
  const FALLBACK_DATA = {
    before: {
      header: 'Oxidative Phosphorylation',
      body: [
        '• Oxidative phosphorylation is the metabolic',
        '  pathway in which the mitochondrion uses ...',
        '• The proton gradient established across the',
        '  inner membrane drives ATP synthase ...',
        '• This process, discovered by Peter Mitchell',
        '  in 1961 (Nobel 1978), accounts for ...'
      ],
      annotations: [
        { label: 'topic label' },
        { label: 'redundant prose' },
        { label: 'seductive detail' },
        { label: 'decorative color' },
        { label: 'notes field unused' }
      ]
    },
    after: {
      header: ['The proton gradient', 'powers ATP synthase.'],
      annotations: [
        { label: 'headline = the claim' },
        { label: 'body = the evidence' },
        { label: 'notes = the explanation' },
        { label: 'color encodes a path' },
        { label: 'diagram in place of prose' }
      ]
    }
  };

  function draw() {
    d3.select('#chart').selectAll('*').remove();
    const container = document.getElementById('chart');
    const totalWidth  = container.clientWidth  || 700;
    const totalHeight = 520;
    const half = totalWidth / 2;

    const svg = d3.select('#chart').append('svg')
      .attr('width', totalWidth).attr('height', totalHeight)
      .attr('viewBox', `0 0 ${totalWidth} ${totalHeight}`)
      .attr('role', 'img')
      .attr('aria-labelledby', 'f4-t f4-d');
    svg.append('title').attr('id', 'f4-t').text('Before and after — slide anatomy');
    svg.append('desc').attr('id', 'f4-d').text('The AI-generated original slide on the left with five named failures; the rewrite on the right with each region labeled by function.');

    svg.append('defs').append('marker')
      .attr('id', 'f4arrow').attr('viewBox', '0 0 10 10')
      .attr('refX', 9).attr('refY', 5).attr('markerWidth', 7).attr('markerHeight', 7)
      .attr('orient', 'auto-start-reverse')
      .append('path').attr('d', 'M0,0 L10,5 L0,10 z').attr('fill', 'var(--color-ink)');

    svg.append('text').attr('class', 'eyebrow').attr('x', half * 0.5).attr('y', 36).attr('text-anchor', 'middle').text('BEFORE');
    svg.append('text').attr('class', 'eyebrow').attr('x', half * 1.5).attr('y', 36).attr('text-anchor', 'middle').text('AFTER');

    // LEFT slide
    const leftX = 40;
    svg.append('rect').attr('x', leftX).attr('y', 60).attr('width', half - 80).attr('height', 156)
      .attr('fill', 'var(--color-white)').attr('stroke', 'var(--color-ink)').attr('stroke-width', 1.5);
    svg.append('text').attr('class', 'slide-h').attr('x', leftX + 14).attr('y', 88).text(FALLBACK_DATA.before.header);
    FALLBACK_DATA.before.body.forEach((line, i) => {
      svg.append('text').attr('class', 'slide-body').attr('x', leftX + 14).attr('y', 108 + i * 12).text(line);
    });
    svg.append('rect').attr('x', leftX + (half - 80) - 80).attr('y', 158).attr('width', 70).attr('height', 44)
      .attr('fill', 'var(--color-border)').attr('stroke', 'var(--color-secondary)').attr('stroke-width', 0.8);
    svg.append('text').attr('class', 'slide-body').attr('x', leftX + (half - 80) - 45).attr('y', 184).attr('text-anchor', 'middle').attr('font-style', 'italic').text('stock photo');

    // Notes empty
    svg.append('rect').attr('x', leftX).attr('y', 228).attr('width', half - 80).attr('height', 62)
      .attr('fill', 'var(--color-white)').attr('stroke', 'var(--color-border)');
    svg.append('text').attr('class', 'eyebrow').attr('x', leftX + 14).attr('y', 248).text('NOTES');
    svg.append('text').attr('class', 'slide-body').attr('x', leftX + (half - 80) / 2).attr('y', 266).attr('text-anchor', 'middle').attr('font-style', 'italic').text('empty');

    // Failure annotations
    svg.append('text').attr('class', 'ann-h').attr('x', leftX).attr('y', 314).text('Failures named:');
    const tooltip = d3.select('body').append('div').attr('class', 'tooltip');
    const annL = svg.selectAll('.ann-left')
      .data(FALLBACK_DATA.before.annotations)
      .join('text')
        .attr('class', 'ann ann-left')
        .attr('x', leftX).attr('y', (d, i) => 334 + i * 18)
        .attr('tabindex', 0)
        .attr('aria-label', d => `Failure: ${d.label}`)
        .text(d => `— ${d.label}`);

    // Center arrow
    svg.append('line').attr('x1', half - 30).attr('y1', 140).attr('x2', half + 30).attr('y2', 140)
      .attr('stroke', 'var(--color-ink)').attr('stroke-width', 1.5).attr('marker-end', 'url(#f4arrow)');
    svg.append('text').attr('class', 'ann-h').attr('x', half).attr('y', 128).attr('text-anchor', 'middle').attr('font-style', 'italic').text('rewrite');

    // RIGHT slide
    const rightX = half + 40;
    svg.append('rect').attr('x', rightX).attr('y', 60).attr('width', half - 80).attr('height', 156)
      .attr('fill', 'var(--color-white)').attr('stroke', 'var(--color-ink)').attr('stroke-width', 1.5);
    FALLBACK_DATA.after.header.forEach((line, i) => {
      svg.append('text').attr('class', 'slide-h-after').attr('x', rightX + 14).attr('y', 88 + i * 18).text(line);
    });

    // Mechanism diagram
    const gMech = svg.append('g').attr('transform', `translate(${rightX + 20}, 120)`);
    gMech.append('line').attr('x1', 0).attr('y1', 40).attr('x2', 220).attr('y2', 40).attr('stroke', 'var(--color-ink)').attr('stroke-width', 1.2);
    gMech.append('line').attr('x1', 0).attr('y1', 56).attr('x2', 220).attr('y2', 56).attr('stroke', 'var(--color-ink)').attr('stroke-width', 1.2);
    [10, 36, 62, 88].forEach(x => {
      gMech.append('text').attr('x', x).attr('y', 30).attr('font-family', "'EB Garamond', Georgia, serif").attr('font-size', 11).attr('fill', 'var(--color-ink)').text('H+');
    });
    gMech.append('rect').attr('x', 110).attr('y', 34).attr('width', 28).attr('height', 28).attr('fill', 'var(--color-border)').attr('stroke', 'var(--color-ink)');
    gMech.append('text').attr('x', 124).attr('y', 52).attr('text-anchor', 'middle').attr('font-size', 9).attr('font-family', "'EB Garamond', Georgia, serif").attr('fill', 'var(--color-ink)').text('rotor');
    gMech.append('line').attr('x1', 124).attr('y1', 26).attr('x2', 124).attr('y2', 70).attr('stroke', 'var(--color-ink)').attr('stroke-width', 1.5).attr('marker-end', 'url(#f4arrow)');
    gMech.append('text').attr('x', 160).attr('y', 78).attr('font-size', 11).attr('font-family', "'EB Garamond', Georgia, serif").attr('fill', 'var(--color-ink)').text('~32 ATP');
    gMech.append('text').attr('x', 160).attr('y', 90).attr('font-size', 9).attr('font-family', "'EB Garamond', Georgia, serif").attr('fill', 'var(--color-secondary)').text('per glucose');

    // Notes populated
    svg.append('rect').attr('x', rightX).attr('y', 228).attr('width', half - 80).attr('height', 62)
      .attr('fill', 'var(--color-white)').attr('stroke', 'var(--color-border)');
    svg.append('text').attr('class', 'eyebrow').attr('x', rightX + 14).attr('y', 248).text('NOTES');
    [256, 264, 272, 280].forEach((y, idx) => {
      svg.append('line').attr('x1', rightX + 14).attr('y1', y).attr('x2', rightX + (half - 80) - 20 - (idx === 3 ? 30 : 0)).attr('y2', y).attr('stroke', 'var(--color-ink)').attr('stroke-width', 0.7);
    });

    // Right annotations
    svg.append('text').attr('class', 'ann-h').attr('x', rightX).attr('y', 314).text('Each region by function:');
    const annR = svg.selectAll('.ann-right')
      .data(FALLBACK_DATA.after.annotations)
      .join('text')
        .attr('class', 'ann ann-right')
        .attr('x', rightX).attr('y', (d, i) => 334 + i * 18)
        .attr('tabindex', 0)
        .attr('aria-label', d => `Function: ${d.label}`)
        .text(d => `— ${d.label}`);

    svg.append('text').attr('class', 'footer').attr('x', totalWidth / 2).attr('y', 460).attr('text-anchor', 'middle')
      .text('No new content — only a decision about where each thing belongs.');

    annL.merge(annR)
      .on('mouseover', function(event, d) {
        d3.select(this).transition().duration(120).attr('fill', 'var(--color-red)');
        tooltip.html(`<strong>${d.label}</strong>`)
          .style('left', (event.pageX + 12) + 'px').style('top', (event.pageY - 28) + 'px')
          .transition().duration(150).style('opacity', 1);
      })
      .on('mousemove', function(event) {
        tooltip.style('left', (event.pageX + 12) + 'px').style('top', (event.pageY - 28) + 'px');
      })
      .on('mouseout', function() {
        d3.select(this).transition().duration(120).attr('fill', 'var(--color-ink)');
        tooltip.transition().duration(100).style('opacity', 0);
      });
  }

  draw();
  const ro = new ResizeObserver(() => draw());
  ro.observe(document.getElementById('chart'));
</script>
</body>
</html>
