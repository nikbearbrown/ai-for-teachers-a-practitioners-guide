<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Figure 9.4 — The five-question audit</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=EB+Garamond:wght@400;500&family=Inter:wght@400;600;700&family=JetBrains+Mono:wght@400&display=swap" rel="stylesheet">
<style>
  :root {
    --color-white:     #FFFFFF;
    --color-ink:       #121212;
    --color-red:       #C8102E;
    --color-secondary: #545454;
    --color-border:    #D4D4D4;
    --color-ochre:     #C8860E;
  }
  @media (prefers-color-scheme: dark) {
    :root {
      --color-white:     #111111;
      --color-ink:       #F0EBE3;
      --color-red:       #E8243A;
      --color-secondary: #A0978C;
      --color-border:    #2E2E2E;
      --color-ochre:     #D49A30;
    }
  }
  * { box-sizing: border-box; margin: 0; padding: 0; }
  body { background: var(--color-white); color: var(--color-ink); font-family: 'Inter', sans-serif; padding: 24px; }
  h1 { font-family: 'EB Garamond', Georgia, serif; font-weight: 400; font-size: 32px; margin-bottom: 6px; }
  .subtitle { font-family: 'EB Garamond', Georgia, serif; font-style: italic; color: var(--color-secondary); margin-bottom: 20px; }
  #chart { width: 100%; min-height: 540px; }
  .card-bg { fill: var(--color-white); stroke: var(--color-ink); stroke-width: 1.2; }
  .row-divider { stroke: var(--color-border); stroke-width: 0.8; }
  .row-num { font-family: 'EB Garamond', Georgia, serif; font-size: 26px; fill: var(--color-ink); }
  .row-question { font-family: 'Inter', sans-serif; font-size: 15px; font-weight: 700; fill: var(--color-ink); transition: fill 120ms cubic-bezier(0.2,0.8,0.2,1); }
  .row-body { font-family: 'Inter', sans-serif; font-size: 13px; fill: var(--color-secondary); }
  .row-group { cursor: pointer; }
  .row-group:hover .row-question { fill: var(--color-red); }
  .row-group.ai .row-bg { fill: var(--color-white); stroke: var(--color-ink); stroke-width: 1.2; }
  .row-bg { fill: transparent; }
  .footer-note { font-family: 'EB Garamond', Georgia, serif; font-style: italic; font-size: 13px; fill: var(--color-secondary); }
  .tooltip { position: absolute; pointer-events: none; opacity: 0; background: var(--color-ink); color: var(--color-white); padding: 6px 10px; border-radius: 4px; font-size: 13px; max-width: 260px; }
  @media (prefers-reduced-motion: reduce) { * { transition: none !important; animation: none !important; } }
</style>
</head>
<body>
  <h1>The five-question audit</h1>
  <div class="subtitle">Run on every chart before it leaves the building. Five minutes.</div>
  <div id="chart" role="main"></div>
  <script src="https://cdnjs.cloudflare.com/ajax/libs/d3/7.9.0/d3.min.js"></script>
  <script>
    const auditData = [
      { num: 1, question: 'What question does this chart answer?',  body: 'State it in one sentence. If you can’t, the chart isn’t ready.', ai: false },
      { num: 2, question: 'Compared with what?',                    body: 'Every claim needs an explicit reference: baseline, benchmark, prior period, peer group.', ai: false },
      { num: 3, question: 'Does the y-axis start at zero?',         body: 'For a bar chart, always. For a line chart, when magnitude is the message.', ai: false },
      { num: 4, question: 'Is the title a finding or a topic?',     body: 'A topic names the subject. A finding states what the chart shows. Write the verb.', ai: false },
      { num: 5, question: 'Did you check for hidden variance?',     body: 'If the chart shows means, ask whether distribution matters. If it does, add a box or strip plot.', ai: false },
      { num: 6, question: 'When AI is in the loop: does the chart match the data?', body: 'Verify a sample of values against the source. Adds two minutes. Not optional.', ai: true }
    ];

    const tooltip = d3.select('body').append('div').attr('class', 'tooltip');

    function draw() {
      d3.select('#chart').selectAll('*').remove();
      const container = document.getElementById('chart');
      const totalWidth = container.clientWidth || 800;
      const totalHeight = 560;
      const svg = d3.select('#chart').append('svg')
        .attr('width', totalWidth).attr('height', totalHeight)
        .attr('role', 'img').attr('aria-labelledby', 'c-title c-desc');
      svg.append('title').attr('id', 'c-title').text('The five-question chart audit, plus the AI sixth');
      svg.append('desc').attr('id', 'c-desc').text('Printable checklist card with five core audit questions and a sixth that applies whenever AI is in the loop.');

      const cardMargin = { x: 32, y: 24 };
      const cardW = totalWidth - cardMargin.x * 2;
      const cardH = totalHeight - cardMargin.y * 2 - 28;

      const gCard = svg.append('g').attr('transform', `translate(${cardMargin.x},${cardMargin.y})`);
      gCard.append('rect').attr('class', 'card-bg').attr('width', cardW).attr('height', cardH);

      const rowH = cardH / auditData.length;

      const rows = gCard.selectAll('.row-group').data(auditData, d => d.num).join('g')
        .attr('class', d => 'row-group' + (d.ai ? ' ai' : ''))
        .attr('transform', (d, i) => `translate(0, ${i * rowH})`)
        .attr('tabindex', 0)
        .attr('aria-label', d => `Question ${d.num}: ${d.question}. ${d.body}`);

      rows.append('rect').attr('class', 'row-bg')
        .attr('width', cardW).attr('height', rowH)
        .on('mouseover', (event, d) => {
          tooltip.html(`<strong>${d.num}. ${d.question}</strong><br>${d.body}`)
            .style('left', (event.pageX + 12) + 'px').style('top', (event.pageY - 28) + 'px')
            .transition().duration(150).style('opacity', 1);
        })
        .on('mousemove', (event) => tooltip.style('left', (event.pageX + 12) + 'px').style('top', (event.pageY - 28) + 'px'))
        .on('mouseout', () => tooltip.transition().duration(100).style('opacity', 0));

      rows.append('text').attr('class', 'row-num').attr('x', 24).attr('y', rowH / 2 + 8).text(d => d.num);
      rows.append('text').attr('class', 'row-question').attr('x', 64).attr('y', rowH / 2 - 6).text(d => d.question);
      rows.append('text').attr('class', 'row-body').attr('x', 64).attr('y', rowH / 2 + 14).text(d => d.body);

      // dividers
      rows.filter((d, i) => i < auditData.length - 1).append('line').attr('class', 'row-divider')
        .attr('x1', 16).attr('x2', cardW - 16)
        .attr('y1', rowH).attr('y2', rowH);

      // emphasize the AI row
      const aiRow = rows.filter(d => d.ai);
      aiRow.append('rect').attr('width', cardW - 16).attr('height', rowH - 8)
        .attr('x', 8).attr('y', 4)
        .attr('fill', 'none').attr('stroke', 'var(--color-red)').attr('stroke-width', 1.5);

      svg.append('text').attr('class', 'footer-note')
        .attr('x', totalWidth / 2).attr('y', totalHeight - 8).attr('text-anchor', 'middle')
        .text('A chart that cannot be described by a one-sentence question has not been designed; it has been generated.');
    }

    draw();
    const ro = new ResizeObserver(() => draw());
    ro.observe(document.getElementById('chart'));
  </script>
</body>
</html>
