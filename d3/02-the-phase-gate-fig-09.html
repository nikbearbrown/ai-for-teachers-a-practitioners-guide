<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Figure 2.9 — Three misconceptions, three mechanisms</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=EB+Garamond:wght@400;500;700&family=Inter:wght@400;600;700&family=JetBrains+Mono:wght@400&display=swap" rel="stylesheet">
<style>
  :root { --color-white:#FFFFFF; --color-ink:#121212; --color-red:#C8102E; --color-secondary:#545454; --color-border:#D4D4D4; --color-ochre:#C8860E; }
  @media (prefers-color-scheme: dark) {
    :root { --color-white:#111111; --color-ink:#F0EBE3; --color-red:#E8243A; --color-secondary:#A0978C; --color-border:#2E2E2E; --color-ochre:#D49A30; }
  }
  * { box-sizing: border-box; margin: 0; padding: 0; }
  body { background: var(--color-white); color: var(--color-ink); font-family: 'Inter', sans-serif; padding: 24px; }
  h1 { font-family: 'EB Garamond', Georgia, serif; font-weight: 400; font-size: 28px; margin-bottom: 4px; }
  p.subtitle { color: var(--color-secondary); font-size: 13px; margin-bottom: 24px; }
  #chart { width: 100%; height: 500px; }
  .row-hover:hover { fill: var(--color-border); fill-opacity: 0.18; cursor: pointer; }
  .row-bg { fill: transparent; transition: fill 200ms cubic-bezier(0.2,0.8,0.2,1); }
  .hdr { font-family: 'Inter', sans-serif; font-size: 13px; font-weight: 700; fill: var(--color-ink); }
  .mis { font-family: 'EB Garamond', Georgia, serif; font-size: 13px; font-style: italic; fill: var(--color-secondary); }
  .lb { font-family: 'EB Garamond', Georgia, serif; font-size: 12px; fill: var(--color-ink); }
  .sm { font-family: 'EB Garamond', Georgia, serif; font-size: 11px; fill: var(--color-secondary); }
  .mech { font-family: 'EB Garamond', Georgia, serif; font-size: 12px; font-weight: 700; fill: var(--color-red); }
  .cap { font-family: 'EB Garamond', Georgia, serif; font-size: 12px; font-style: italic; fill: var(--color-secondary); }
  .tooltip { position: absolute; pointer-events: none; opacity: 0; background: var(--color-ink); color: var(--color-white); padding: 6px 10px; font-size: 12px; max-width: 280px; }
  @media (prefers-reduced-motion: reduce) { * { transition: none !important; animation: none !important; } }
</style>
</head>
<body>
<h1>Figure 2.9 — Three misconceptions, three mechanisms</h1>
<p class="subtitle">The misconception feels true. The mechanism is what the gate is actually doing.</p>
<div id="chart" role="img" aria-labelledby="t-misc d-misc"></div>
<script src="https://cdnjs.cloudflare.com/ajax/libs/d3/7.9.0/d3.min.js"></script>
<script>
const rows = [
  {
    mis: '"Gates exist because we distrust AI."',
    misSub: 'If AI improves, the gate goes away.',
    why: 'Distrust would scale with capability.',
    whySub: 'More capable model, less suspicion required.',
    mech: 'Locks which operation stays human.',
    mechSub: 'A more capable AI still has no access to this class.',
    tip: 'The gate is calibrated to the operation, not to a capability ceiling. Capability rises; the operation stays human.'
  },
  {
    mis: '"If the AI is right, no gate is needed."',
    misSub: 'Rubric accuracy is treated as correctness.',
    why: '99.4% approved looked like 99.4% right.',
    whySub: 'No signal flagged the missing operation.',
    mech: 'Converts rubric accuracy into pedagogical fit.',
    mechSub: 'Two different properties. The teacher\'s reading is the converter.',
    tip: 'Rubric-accurate and right-for-this-student are different properties. The gate is what converts the first into the second.'
  },
  {
    mis: '"Gates slow you down."',
    misSub: 'They take some time up front.',
    why: 'Calibration is 25 minutes you did not have to spend.',
    whySub: 'Workflow reports completion faster without it.',
    mech: 'Moves the work to where it is most efficient.',
    mechSub: '25 minutes concentrated vs. 3–5 hours of re-checking.',
    tip: 'The gate moves cognitively dense time to the front, where it replaces cognitively wasteful time spread thinly across 120 instances.'
  }
];

const tooltip = d3.select('body').append('div').attr('class', 'tooltip');
function showTip(e, html) { tooltip.html(html).style('left', (e.pageX+12)+'px').style('top', (e.pageY-28)+'px').transition().duration(150).style('opacity', 1); }
function moveTip(e) { tooltip.style('left', (e.pageX+12)+'px').style('top', (e.pageY-28)+'px'); }
function hideTip() { tooltip.transition().duration(100).style('opacity', 0); }

function draw() {
  d3.select('#chart').selectAll('*').remove();
  const container = document.getElementById('chart');
  const W = container.clientWidth || 760, H = container.clientHeight || 500;
  const svg = d3.select('#chart').append('svg').attr('viewBox', `0 0 ${W} ${H}`).attr('width', W).attr('height', H)
    .attr('role', 'img').attr('aria-labelledby', 't-misc d-misc');
  svg.append('title').attr('id', 't-misc').text('Three things people get wrong');
  svg.append('desc').attr('id', 'd-misc').text('A three-column card comparing misconception, why it feels true, and what the gate actually does.');

  const margin = { top: 60, right: 24, bottom: 56, left: 24 };
  const cw = W - margin.left - margin.right;
  const ch = H - margin.top - margin.bottom;
  const colW = cw / 3;

  // Header
  ['Misconception', 'Why it feels true', 'What the gate actually does'].forEach((t, i) => {
    svg.append('text').attr('x', margin.left + i * colW + 16).attr('y', 40).attr('class', 'hdr').text(t);
  });
  svg.append('line').attr('x1', margin.left).attr('y1', 50).attr('x2', W - margin.right).attr('y2', 50).attr('stroke', 'var(--color-ink)');

  const rowH = ch / rows.length;
  rows.forEach((r, i) => {
    const ry = margin.top + i * rowH;
    const row = svg.append('g').attr('tabindex', 0).attr('role', 'group').attr('aria-label', `${r.mis} → ${r.mech}`)
      .on('mouseover', (e) => showTip(e, `<strong>${r.mech}</strong><br>${r.tip}`))
      .on('mousemove', moveTip).on('mouseout', hideTip);
    row.append('rect').attr('class', 'row-bg row-hover').attr('x', margin.left).attr('y', ry).attr('width', cw).attr('height', rowH);

    row.append('text').attr('x', margin.left + 16).attr('y', ry + 26).attr('class', 'mis').text(r.mis);
    row.append('text').attr('x', margin.left + 16).attr('y', ry + 46).attr('class', 'sm').text(r.misSub);

    row.append('text').attr('x', margin.left + colW + 16).attr('y', ry + 26).attr('class', 'lb').text(r.why);
    row.append('text').attr('x', margin.left + colW + 16).attr('y', ry + 46).attr('class', 'sm').text(r.whySub);

    row.append('text').attr('x', margin.left + 2 * colW + 16).attr('y', ry + 26).attr('class', 'mech').text(r.mech);
    row.append('text').attr('x', margin.left + 2 * colW + 16).attr('y', ry + 46).attr('class', 'sm').text(r.mechSub);

    svg.append('line').attr('x1', margin.left).attr('y1', ry + rowH).attr('x2', W - margin.right).attr('y2', ry + rowH).attr('stroke', 'var(--color-border)');
  });

  svg.append('text').attr('x', W/2).attr('y', H - 16).attr('text-anchor', 'middle').attr('class', 'cap')
    .text('Trade the misconception for the mechanism. The gate is doing work the misconception cannot.');
}

draw();
const ro = new ResizeObserver(() => draw());
ro.observe(document.getElementById('chart'));
</script>
</body>
</html>
