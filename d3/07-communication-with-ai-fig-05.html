<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Figure 7.5 — Two emails, two workflows, two timelines</title>
  <style>
    :root {
      --color-white:     #FFFFFF;
      --color-ink:       #121212;
      --color-red:       #C8102E;
      --color-secondary: #545454;
      --color-border:    #D4D4D4;
      --color-ochre:     #C8860E;
    }
    @media (prefers-color-scheme: dark) {
      :root {
        --color-white:     #111111;
        --color-ink:       #F0EBE3;
        --color-red:       #E8243A;
        --color-secondary: #A0978C;
        --color-border:    #2E2E2E;
        --color-ochre:     #D49A30;
      }
    }
    * { box-sizing: border-box; margin: 0; padding: 0; }
    body { background: var(--color-white); color: var(--color-ink); font-family: 'EB Garamond', Garamond, Georgia, serif; padding: 16px; }
    #chart { width: 100%; min-height: 520px; }
    .ti { font-family: 'EB Garamond', Garamond, Georgia, serif; font-size: 18px; font-weight: 700; fill: var(--color-ink); }
    .sub { font-family: 'EB Garamond', Garamond, Georgia, serif; font-size: 12px; font-style: italic; fill: var(--color-secondary); }
    .panel { font-family: 'EB Garamond', Garamond, Georgia, serif; font-size: 14px; font-weight: 700; fill: var(--color-white); letter-spacing: 0.4px; }
    .panelsub { font-family: 'EB Garamond', Garamond, Georgia, serif; font-size: 11px; font-style: italic; fill: var(--color-border); }
    .step { font-family: 'EB Garamond', Garamond, Georgia, serif; font-size: 11px; fill: var(--color-ink); }
    .stepb { font-family: 'EB Garamond', Garamond, Georgia, serif; font-size: 11px; font-weight: 700; fill: var(--color-ink); }
    .bullet { font-family: 'EB Garamond', Garamond, Georgia, serif; font-size: 10px; fill: var(--color-ink); }
    .blank { font-family: 'EB Garamond', Garamond, Georgia, serif; font-size: 11px; font-style: italic; fill: var(--color-secondary); }
    .timewarn { font-family: 'EB Garamond', Garamond, Georgia, serif; font-size: 11px; fill: var(--color-white); font-weight: 700; }
    .overlay { font-family: 'EB Garamond', Garamond, Georgia, serif; font-size: 10px; fill: var(--color-white); font-weight: 700; letter-spacing: 0.4px; }
    .cap { font-family: 'EB Garamond', Garamond, Georgia, serif; font-size: 12px; font-style: italic; fill: var(--color-secondary); }
    @media (prefers-reduced-motion: reduce) { * { transition: none !important; animation: none !important; } }
  </style>
</head>
<body>
  <div id="chart" role="main"></div>
  <script src="https://cdnjs.cloudflare.com/ajax/libs/d3/7.9.0/d3.min.js"></script>
  <script>
    const BULLETS = [
      'late report, third time',
      'work quality strong',
      'quieter in class lately',
      'short call, not meeting',
      'mom prefers Spanish'
    ];

    function draw() {
      d3.select('#chart').selectAll('*').remove();
      const container = document.getElementById('chart');
      const W = container.clientWidth || 700;
      const H = 520;

      const svg = d3.select('#chart').append('svg')
        .attr('width', W).attr('height', H)
        .attr('viewBox', `0 0 ${W} ${H}`)
        .attr('role', 'img')
        .attr('aria-labelledby', 'chart-title chart-desc');
      svg.append('title').attr('id', 'chart-title').text('Two emails, two workflows, two timelines');
      svg.append('desc').attr('id', 'chart-desc').text('A split-panel illustration: routine case with bullets flowing through a four-step pipeline labeled four minutes, beside a sensitive case wrong workflow with a blank prompt and a fabricated model output labeled five minutes now, documentation crisis later.');

      svg.append('defs').append('marker')
        .attr('id', 'arrow5').attr('viewBox', '0 0 10 10')
        .attr('refX', 9).attr('refY', 5).attr('markerWidth', 7).attr('markerHeight', 7)
        .attr('orient', 'auto-start-reverse')
        .append('path').attr('d', 'M 0 0 L 10 5 L 0 10 z').attr('fill', 'var(--color-secondary)');

      svg.append('text').attr('class', 'ti').attr('x', 32).attr('y', 34).text('Two emails, one afternoon');
      svg.append('text').attr('class', 'sub').attr('x', 32).attr('y', 54).text('Same elapsed time. Different ending.');

      const panelW = (W - 80) / 2;

      svg.append('rect').attr('x', 32).attr('y', 76).attr('width', panelW).attr('height', 24).attr('fill', 'var(--color-secondary)');
      svg.append('text').attr('class', 'panel').attr('x', 48).attr('y', 93).text('ROUTINE CASE');
      svg.append('text').attr('class', 'panelsub').attr('x', 200).attr('y', 93).text('bullets, AI, review');

      svg.append('rect').attr('x', 32).attr('y', 100).attr('width', panelW).attr('height', 340)
        .attr('fill', 'var(--color-white)').attr('stroke', 'var(--color-border)').attr('stroke-width', 1);

      svg.append('text').attr('class', 'stepb').attr('x', 48).attr('y', 120).text('1. Teacher bullets');
      svg.append('rect').attr('x', 48).attr('y', 126).attr('width', 160).attr('height', 84)
        .attr('fill', 'var(--color-white)').attr('stroke', 'var(--color-border)').attr('stroke-width', 1);
      BULLETS.forEach((b, i) => {
        svg.append('text').attr('class', 'bullet').attr('x', 56).attr('y', 142 + i * 14).text(`— ${b}`);
      });

      svg.append('line').attr('x1', 208).attr('y1', 170).attr('x2', 232).attr('y2', 170)
        .attr('stroke', 'var(--color-secondary)').attr('stroke-width', 1.5).attr('marker-end', 'url(#arrow5)');

      svg.append('rect').attr('x', 236).attr('y', 138).attr('width', 92).attr('height', 60).attr('fill', 'var(--color-secondary)');
      svg.append('text').attr('class', 'overlay').attr('x', 282).attr('y', 162).attr('text-anchor', 'middle').text('PROMPT');
      svg.append('text').attr('class', 'overlay').attr('x', 282).attr('y', 178).attr('text-anchor', 'middle').text('TEMPLATE');

      svg.append('line').attr('x1', 188).attr('y1', 210).attr('x2', 188).attr('y2', 232)
        .attr('stroke', 'var(--color-secondary)').attr('stroke-width', 1.5).attr('marker-end', 'url(#arrow5)');

      svg.append('text').attr('class', 'stepb').attr('x', 48).attr('y', 252).text('2. Model renders');
      svg.append('rect').attr('x', 48).attr('y', 258).attr('width', panelW - 32).attr('height', 58)
        .attr('fill', 'var(--color-white)').attr('stroke', 'var(--color-secondary)').attr('stroke-width', 1);
      svg.append('text').attr('class', 'step').attr('x', 56).attr('y', 276).text('Three-to-four sentences, warm but');
      svg.append('text').attr('class', 'step').attr('x', 56).attr('y', 290).text('honest, no jargon. Spanish version');
      svg.append('text').attr('class', 'step').attr('x', 56).attr('y', 304).text('with AI-translation footer.');

      svg.append('line').attr('x1', 188).attr('y1', 316).attr('x2', 188).attr('y2', 338)
        .attr('stroke', 'var(--color-secondary)').attr('stroke-width', 1.5).attr('marker-end', 'url(#arrow5)');

      svg.append('text').attr('class', 'stepb').attr('x', 48).attr('y', 358).text('3. Teacher reviews, round-trips, sends');
      svg.append('rect').attr('x', 48).attr('y', 364).attr('width', panelW - 32).attr('height', 32).attr('fill', 'var(--color-ink)');
      svg.append('text').attr('class', 'timewarn').attr('x', 48 + (panelW - 32) / 2).attr('y', 384).attr('text-anchor', 'middle').text('4 MINUTES — DONE');

      const rightX = 48 + panelW;
      svg.append('rect').attr('x', rightX).attr('y', 76).attr('width', panelW).attr('height', 24).attr('fill', 'var(--color-red)');
      svg.append('text').attr('class', 'panel').attr('x', rightX + 16).attr('y', 93).text('SENSITIVE CASE — WRONG WORKFLOW');

      svg.append('rect').attr('x', rightX).attr('y', 100).attr('width', panelW).attr('height', 340)
        .attr('fill', 'var(--color-white)').attr('stroke', 'var(--color-border)').attr('stroke-width', 1);

      svg.append('text').attr('class', 'stepb').attr('x', rightX + 16).attr('y', 120).text('1. Blank prompt');
      svg.append('rect').attr('x', rightX + 16).attr('y', 126).attr('width', 160).attr('height', 84)
        .attr('fill', 'var(--color-white)').attr('stroke', 'var(--color-border)').attr('stroke-width', 1).attr('stroke-dasharray', '4 3');
      svg.append('text').attr('class', 'blank').attr('x', rightX + 96).attr('y', 170).attr('text-anchor', 'middle').text('"write a behavioral');
      svg.append('text').attr('class', 'blank').attr('x', rightX + 96).attr('y', 186).attr('text-anchor', 'middle').text('incident report"');

      svg.append('line').attr('x1', rightX + 176).attr('y1', 170).attr('x2', rightX + 200).attr('y2', 170)
        .attr('stroke', 'var(--color-secondary)').attr('stroke-width', 1.5).attr('marker-end', 'url(#arrow5)');

      svg.append('rect').attr('x', rightX + 204).attr('y', 138).attr('width', 92).attr('height', 60).attr('fill', 'var(--color-secondary)');
      svg.append('text').attr('class', 'overlay').attr('x', rightX + 250).attr('y', 172).attr('text-anchor', 'middle').text('MODEL');

      svg.append('line').attr('x1', rightX + 156).attr('y1', 210).attr('x2', rightX + 156).attr('y2', 232)
        .attr('stroke', 'var(--color-secondary)').attr('stroke-width', 1.5).attr('marker-end', 'url(#arrow5)');

      svg.append('text').attr('class', 'stepb').attr('x', rightX + 16).attr('y', 252).text('2. Model returns confident narrative');
      svg.append('rect').attr('x', rightX + 16).attr('y', 258).attr('width', panelW - 32).attr('height', 58)
        .attr('fill', 'var(--color-white)').attr('stroke', 'var(--color-red)').attr('stroke-width', 1.5);
      svg.append('text').attr('class', 'step').attr('x', rightX + 24).attr('y', 276).text('Plausible-sounding incident details.');
      svg.append('text').attr('class', 'step').attr('x', rightX + 24).attr('y', 290).text('Some happened. Some did not.');
      svg.append('rect').attr('x', rightX + 24).attr('y', 296).attr('width', 180).attr('height', 14).attr('fill', 'var(--color-red)');
      svg.append('text').attr('class', 'overlay').attr('x', rightX + 28).attr('y', 307).text('FABRICATED SPECIFICS');

      svg.append('line').attr('x1', rightX + 156).attr('y1', 316).attr('x2', rightX + 156).attr('y2', 338)
        .attr('stroke', 'var(--color-secondary)').attr('stroke-width', 1.5).attr('marker-end', 'url(#arrow5)');

      svg.append('text').attr('class', 'stepb').attr('x', rightX + 16).attr('y', 358).text('3. Teacher skims and sends');
      svg.append('rect').attr('x', rightX + 16).attr('y', 364).attr('width', panelW - 32).attr('height', 32).attr('fill', 'var(--color-red)');
      svg.append('text').attr('class', 'timewarn').attr('x', rightX + 16 + (panelW - 32) / 2).attr('y', 384).attr('text-anchor', 'middle').text('5 MIN NOW · CRISIS LATER');

      svg.append('text').attr('class', 'cap').attr('x', W / 2).attr('y', 478)
        .attr('text-anchor', 'middle')
        .text('Figure 7.5 — The two workflows look equally fast in the moment.');
      svg.append('text').attr('class', 'cap').attr('x', W / 2).attr('y', 496)
        .attr('text-anchor', 'middle')
        .text("The difference is invisible until it isn't.");
    }
    draw();
    new ResizeObserver(() => draw()).observe(document.getElementById('chart'));
  </script>
</body>
</html>
