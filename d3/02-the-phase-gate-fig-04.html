<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Figure 2.4 — Bastani conditions: practice gain and exam loss</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=EB+Garamond:wght@400;500;700&family=Inter:wght@400;600;700&family=JetBrains+Mono:wght@400&display=swap" rel="stylesheet">
<style>
  :root { --color-white:#FFFFFF; --color-ink:#121212; --color-red:#C8102E; --color-secondary:#545454; --color-border:#D4D4D4; --color-ochre:#C8860E; }
  @media (prefers-color-scheme: dark) {
    :root { --color-white:#111111; --color-ink:#F0EBE3; --color-red:#E8243A; --color-secondary:#A0978C; --color-border:#2E2E2E; --color-ochre:#D49A30; }
  }
  * { box-sizing: border-box; margin: 0; padding: 0; }
  body { background: var(--color-white); color: var(--color-ink); font-family: 'Inter', sans-serif; padding: 24px; }
  h1 { font-family: 'EB Garamond', Georgia, serif; font-weight: 400; font-size: 28px; margin-bottom: 4px; }
  p.subtitle { color: var(--color-secondary); font-size: 13px; margin-bottom: 24px; }
  #chart { width: 100%; height: 460px; }
  .bar-practice { fill: var(--color-red); transition: opacity 200ms cubic-bezier(0.2,0.8,0.2,1); }
  .bar-exam { fill: var(--color-ink); transition: opacity 200ms cubic-bezier(0.2,0.8,0.2,1); }
  .bar-practice:hover, .bar-exam:hover { opacity: 0.7; cursor: pointer; }
  .axis-tick { font-family: 'JetBrains Mono', monospace; font-size: 11px; fill: var(--color-secondary); }
  .axis-title { font-family: 'Inter', sans-serif; font-size: 12px; fill: var(--color-secondary); }
  .lb { font-family: 'EB Garamond', Georgia, serif; font-size: 13px; fill: var(--color-ink); }
  .val { font-family: 'JetBrains Mono', monospace; font-size: 11px; fill: var(--color-ink); }
  .callout { font-family: 'EB Garamond', Georgia, serif; font-size: 12px; font-style: italic; fill: var(--color-red); }
  .cap { font-family: 'EB Garamond', Georgia, serif; font-size: 12px; font-style: italic; fill: var(--color-secondary); }
  .tooltip { position: absolute; pointer-events: none; opacity: 0; background: var(--color-ink); color: var(--color-white); padding: 6px 10px; font-size: 12px; max-width: 240px; }
  @media (prefers-reduced-motion: reduce) { * { transition: none !important; animation: none !important; } }
</style>
</head>
<body>
<h1>Figure 2.4 — Same model, different gate, opposite outcomes</h1>
<p class="subtitle">Bastani et al. (2025): Turkish high-school math, n ≈ 1,000. Index where Control practice = 100.</p>
<div id="chart" role="img" aria-labelledby="t-bastani d-bastani"></div>
<script src="https://cdnjs.cloudflare.com/ajax/libs/d3/7.9.0/d3.min.js"></script>
<script>
const data = [
  { condition: 'Control (no AI)',       practice: 100, exam: 100, tip: 'No AI in practice. Baseline exam performance.' },
  { condition: 'GPT Base (unscaffolded)', practice: 148, exam: 83,  tip: 'Unscaffolded chatbot during practice: high practice gain, exam below control.' },
  { condition: 'GPT Tutor (scaffolded)',  practice: 227, exam: 102, tip: 'Hints calibrated to curriculum, not direct answers. Highest practice, matches control on exam.' }
];

const tooltip = d3.select('body').append('div').attr('class', 'tooltip');
function showTip(e, html) { tooltip.html(html).style('left', (e.pageX+12)+'px').style('top', (e.pageY-28)+'px').transition().duration(150).style('opacity', 1); }
function moveTip(e) { tooltip.style('left', (e.pageX+12)+'px').style('top', (e.pageY-28)+'px'); }
function hideTip() { tooltip.transition().duration(100).style('opacity', 0); }

function draw() {
  d3.select('#chart').selectAll('*').remove();
  const container = document.getElementById('chart');
  const W = container.clientWidth || 760, H = container.clientHeight || 460;
  const margin = { top: 48, right: 40, bottom: 88, left: 64 };
  const cw = W - margin.left - margin.right;
  const ch = H - margin.top - margin.bottom;

  const svg = d3.select('#chart').append('svg').attr('viewBox', `0 0 ${W} ${H}`).attr('width', W).attr('height', H)
    .attr('role', 'img').attr('aria-labelledby', 't-bastani d-bastani');
  svg.append('title').attr('id', 't-bastani').text('Bastani conditions: practice gain and exam loss');
  svg.append('desc').attr('id', 'd-bastani').text('Grouped bar chart of three conditions with paired bars for practice performance and unaided exam score.');

  const g = svg.append('g').attr('transform', `translate(${margin.left},${margin.top})`);

  const x0 = d3.scaleBand().domain(data.map(d => d.condition)).range([0, cw]).padding(0.2);
  const x1 = d3.scaleBand().domain(['practice', 'exam']).range([0, x0.bandwidth()]).padding(0.08);
  const y = d3.scaleLinear().domain([0, 240]).range([ch, 0]);

  // Gridlines
  g.append('g').selectAll('line').data(y.ticks(6)).join('line')
    .attr('x1', 0).attr('x2', cw).attr('y1', d => y(d)).attr('y2', d => y(d))
    .attr('stroke', 'var(--color-border)').attr('stroke-width', 0.5).attr('aria-hidden', 'true');

  // Bars
  data.forEach(d => {
    const gx = x0(d.condition);
    const pBar = g.append('rect').attr('class', 'bar-practice')
      .attr('x', gx + x1('practice')).attr('y', y(d.practice))
      .attr('width', x1.bandwidth()).attr('height', ch - y(d.practice))
      .attr('tabindex', 0).attr('aria-label', `${d.condition} practice: ${d.practice}`)
      .on('mouseover', (e) => showTip(e, `<strong>${d.condition}</strong><br>Practice: ${d.practice}<br>${d.tip}`))
      .on('mousemove', moveTip).on('mouseout', hideTip);
    g.append('text').attr('x', gx + x1('practice') + x1.bandwidth()/2).attr('y', y(d.practice) - 6)
      .attr('text-anchor', 'middle').attr('class', 'val').text(d.practice);

    const eBar = g.append('rect').attr('class', 'bar-exam')
      .attr('x', gx + x1('exam')).attr('y', y(d.exam))
      .attr('width', x1.bandwidth()).attr('height', ch - y(d.exam))
      .attr('tabindex', 0).attr('aria-label', `${d.condition} exam: ${d.exam}`)
      .on('mouseover', (e) => showTip(e, `<strong>${d.condition}</strong><br>Exam: ${d.exam}<br>${d.tip}`))
      .on('mousemove', moveTip).on('mouseout', hideTip);
    g.append('text').attr('x', gx + x1('exam') + x1.bandwidth()/2).attr('y', y(d.exam) - 6)
      .attr('text-anchor', 'middle').attr('class', 'val').text(d.exam);

    g.append('text').attr('x', gx + x0.bandwidth()/2).attr('y', ch + 22).attr('text-anchor', 'middle').attr('class', 'lb').text(d.condition);
  });

  // Y axis
  g.append('g').selectAll('text').data(y.ticks(6)).join('text')
    .attr('x', -8).attr('y', d => y(d) + 4).attr('text-anchor', 'end').attr('class', 'axis-tick').text(d => d);
  g.append('line').attr('x1', 0).attr('y1', 0).attr('x2', 0).attr('y2', ch).attr('stroke', 'var(--color-ink)');
  g.append('line').attr('x1', 0).attr('y1', ch).attr('x2', cw).attr('y2', ch).attr('stroke', 'var(--color-ink)');
  g.append('text').attr('x', -ch/2).attr('y', -44).attr('text-anchor', 'middle').attr('transform', 'rotate(-90)').attr('class', 'axis-title').text('Performance index (Control practice = 100)');

  // Legend
  g.append('rect').attr('x', cw - 220).attr('y', -32).attr('width', 12).attr('height', 12).attr('fill', 'var(--color-red)');
  g.append('text').attr('x', cw - 204).attr('y', -22).attr('class', 'axis-title').text('Practice');
  g.append('rect').attr('x', cw - 130).attr('y', -32).attr('width', 12).attr('height', 12).attr('fill', 'var(--color-ink)');
  g.append('text').attr('x', cw - 114).attr('y', -22).attr('class', 'axis-title').text('Unaided exam');

  // Callout: GPT Base exam below control
  const baseExamX = x0('GPT Base (unscaffolded)') + x1('exam') + x1.bandwidth()/2;
  g.append('text').attr('x', baseExamX).attr('y', y(83) + 36).attr('text-anchor', 'middle').attr('class', 'callout').text('17 pts below control');

  // Caption
  svg.append('text').attr('x', W/2).attr('y', H - 14).attr('text-anchor', 'middle').attr('class', 'cap')
    .text('Same students, same model. The gate location decides whether the cognitive operation occurred.');
}

draw();
const ro = new ResizeObserver(() => draw());
ro.observe(document.getElementById('chart'));
</script>
</body>
</html>
