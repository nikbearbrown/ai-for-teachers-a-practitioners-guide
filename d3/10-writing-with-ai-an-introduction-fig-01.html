<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Figure 10.1 — Two different jobs</title>
<style>
  :root {
    --color-canvas:    #fdfcfb;
    --color-panel:     #f5f2ee;
    --color-ink:       #2a1a0e;
    --color-secondary: #4a4540;
    --color-muted:     #8a8480;
    --color-border:    #c8c4c0;
  }
  @media (prefers-color-scheme: dark) {
    :root {
      --color-canvas:    #1a120a;
      --color-panel:     #251a10;
      --color-ink:       #f5f2ee;
      --color-secondary: #c8c4c0;
      --color-muted:     #8a8480;
      --color-border:    #4a4540;
    }
  }
  * { box-sizing: border-box; margin: 0; padding: 0; }
  body { background: var(--color-canvas); color: var(--color-ink); font-family: 'EB Garamond', Garamond, Georgia, serif; padding: 16px; }
  #chart { width: 100%; }
  .panel-label { font-size: 18px; }
  .panel-sub   { font-size: 13px; font-style: italic; fill: var(--color-secondary); }
  .node-label  { font-size: 14px; }
  .node-sub    { font-size: 11px; font-style: italic; fill: var(--color-secondary); }
  .caption     { font-size: 12px; font-style: italic; fill: var(--color-secondary); }
  .title       { font-size: 20px; font-style: italic; }
  rect.box     { fill: var(--color-canvas); stroke: var(--color-ink); stroke-width: 1.2; }
  rect.panel   { fill: var(--color-panel); stroke: var(--color-muted); stroke-width: 1; }
  .arrow-line  { stroke: var(--color-ink); stroke-width: 1.4; fill: none; }
  .arrow-muted { stroke: var(--color-muted); stroke-width: 1.2; stroke-dasharray: 4 3; fill: none; }
  @media (prefers-reduced-motion: reduce) { * { transition: none !important; animation: none !important; } }
</style>
</head>
<body>
<div id="chart" role="main"></div>
<script src="https://cdnjs.cloudflare.com/ajax/libs/d3/7.9.0/d3.min.js"></script>
<script>
const data = {
  teacher: {
    title: 'Teacher writing',
    sub: 'Syllabi, rubrics, parent updates',
    actor: { label: "Teacher's judgment", sub: 'substance decided' },
    model: { label: 'Model', sub: 'renders register' },
    artifact: { label: 'Syllabus draft', sub: 'teacher reviews, fixes' },
    summary: ['Cognitive work already happened.', 'Model renders what the teacher knows.'],
    verdict: 'Fit: skilled co-writer.'
  },
  student: {
    title: 'Writing instruction',
    sub: 'Student essays, analytical writing',
    actor: { label: "Student's cognition", sub: 'work not yet done' },
    model: { label: 'Model', sub: 'drafts the essay' },
    artifact: { label: 'Polished essay', sub: 'looks like evidence' },
    summary: ['Drafting is the learning event.', 'Artifact without process is empty.'],
    verdict: 'Fit: ghostwriter (wrong fit).'
  }
};

function draw() {
  d3.select('#chart').selectAll('*').remove();
  const W = document.getElementById('chart').clientWidth || 760;
  const H = Math.max(440, W * 0.6);

  const svg = d3.select('#chart').append('svg')
    .attr('viewBox', `0 0 ${W} ${H}`)
    .attr('role', 'img')
    .attr('aria-labelledby', 'fig01-title fig01-desc');

  svg.append('title').attr('id', 'fig01-title').text('Two different jobs: teacher writing vs writing instruction');
  svg.append('desc').attr('id', 'fig01-desc').text('Two panels: AI as renderer of teacher judgment; AI as bypass of student cognition.');

  const defs = svg.append('defs');
  defs.append('marker').attr('id','arrow').attr('viewBox','0 0 10 10').attr('refX',9).attr('refY',5)
    .attr('markerWidth',8).attr('markerHeight',8).attr('orient','auto-start-reverse')
    .append('path').attr('d','M0,0 L10,5 L0,10 z').attr('fill','var(--color-ink)');
  defs.append('marker').attr('id','arrowMuted').attr('viewBox','0 0 10 10').attr('refX',9).attr('refY',5)
    .attr('markerWidth',8).attr('markerHeight',8).attr('orient','auto-start-reverse')
    .append('path').attr('d','M0,0 L10,5 L0,10 z').attr('fill','var(--color-muted)');

  svg.append('text').attr('class','title').attr('x', W/2).attr('y', 32).attr('text-anchor','middle')
    .attr('fill','var(--color-ink)').text('Same model. Opposite uses.');

  const panelW = (W - 60) / 2;
  const panelH = H - 100;
  const panels = [
    { x: 16, key: 'teacher' },
    { x: 16 + panelW + 28, key: 'student' }
  ];

  panels.forEach(p => {
    const d = data[p.key];
    const cx = p.x + panelW / 2;
    svg.append('rect').attr('class','panel').attr('x', p.x).attr('y', 60).attr('width', panelW).attr('height', panelH);
    svg.append('text').attr('class','panel-label').attr('x', cx).attr('y', 92).attr('text-anchor','middle').attr('fill','var(--color-ink)').text(d.title);
    svg.append('text').attr('class','panel-sub').attr('x', cx).attr('y', 112).attr('text-anchor','middle').text(d.sub);

    const boxW = 120, boxH = 76;
    const leftX  = p.x + (panelW/2 - boxW - 24);
    const rightX = p.x + (panelW/2 + 24);
    const boxY = 138;

    // actor box
    svg.append('rect').attr('class','box').attr('x', leftX).attr('y', boxY).attr('width', boxW).attr('height', boxH);
    svg.append('text').attr('class','node-label').attr('x', leftX + boxW/2).attr('y', boxY + 28).attr('text-anchor','middle').attr('fill','var(--color-ink)').text(d.actor.label.split(' ')[0]);
    svg.append('text').attr('class','node-label').attr('x', leftX + boxW/2).attr('y', boxY + 48).attr('text-anchor','middle').attr('fill','var(--color-ink)').text(d.actor.label.split(' ').slice(1).join(' '));
    svg.append('text').attr('class','node-sub').attr('x', leftX + boxW/2).attr('y', boxY + 66).attr('text-anchor','middle').text(d.actor.sub);

    // model box
    svg.append('rect').attr('class','box').attr('x', rightX).attr('y', boxY).attr('width', boxW).attr('height', boxH);
    svg.append('text').attr('class','node-label').attr('x', rightX + boxW/2).attr('y', boxY + 32).attr('text-anchor','middle').attr('fill','var(--color-ink)').text(d.model.label);
    svg.append('text').attr('class','node-sub').attr('x', rightX + boxW/2).attr('y', boxY + 52).attr('text-anchor','middle').text(d.model.sub);

    // arrow actor -> model
    const arrowCls = p.key === 'student' ? 'arrow-muted' : 'arrow-line';
    svg.append('line').attr('class', arrowCls)
      .attr('x1', leftX + boxW).attr('y1', boxY + boxH/2)
      .attr('x2', rightX).attr('y2', boxY + boxH/2)
      .attr('marker-end', p.key === 'student' ? 'url(#arrowMuted)' : 'url(#arrow)');

    if (p.key === 'student') {
      svg.append('text').attr('class','node-sub').attr('x', cx).attr('y', boxY + 96).attr('text-anchor','middle').text('bypass');
    }

    // artifact
    const artX = p.x + (panelW - 196)/2;
    const artY = 252;
    svg.append('rect').attr('class','box').attr('x', artX).attr('y', artY).attr('width', 196).attr('height', 64);
    svg.append('text').attr('class','node-label').attr('x', artX + 98).attr('y', artY + 30).attr('text-anchor','middle').attr('fill','var(--color-ink)').text(d.artifact.label);
    svg.append('text').attr('class','node-sub').attr('x', artX + 98).attr('y', artY + 50).attr('text-anchor','middle').text(d.artifact.sub);

    svg.append('line').attr('class','arrow-line')
      .attr('x1', rightX + boxW/2).attr('y1', boxY + boxH)
      .attr('x2', artX + 130).attr('y2', artY)
      .attr('marker-end', 'url(#arrow)');

    // summary lines
    svg.append('text').attr('class','caption').attr('x', cx).attr('y', 350).attr('text-anchor','middle').text(d.summary[0]);
    svg.append('text').attr('class','caption').attr('x', cx).attr('y', 370).attr('text-anchor','middle').text(d.summary[1]);
    svg.append('text').attr('x', cx).attr('y', 400).attr('text-anchor','middle').attr('font-size', 14).attr('font-style','italic').attr('fill','var(--color-ink)').text(d.verdict);
  });

  svg.append('text').attr('class','caption').attr('x', W/2).attr('y', H - 14).attr('text-anchor','middle').text('The rules come from the use, not from the tool.');

  // Hover: highlight which arrow runs which direction
  svg.selectAll('.box, .panel')
    .on('mouseover', function() { d3.select(this).style('filter', 'brightness(0.97)'); })
    .on('mouseout',  function() { d3.select(this).style('filter', null); });
}

draw();
new ResizeObserver(() => draw()).observe(document.getElementById('chart'));
</script>
</body>
</html>
