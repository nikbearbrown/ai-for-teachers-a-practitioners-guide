<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Leveling versus scaffolding</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=EB+Garamond:ital,wght@0,400;0,600;0,700;1,400&display=swap" rel="stylesheet">
  <style>
    :root {
      --color-white:     #FFFFFF;
      --color-ink:       #121212;
      --color-red:       #C8102E;
      --color-secondary: #545454;
      --color-border:    #D4D4D4;
      --color-ochre:     #C8860E;
    }
    @media (prefers-color-scheme: dark) {
      :root {
        --color-white:     #111111;
        --color-ink:       #F0EBE3;
        --color-red:       #E8243A;
        --color-secondary: #A0978C;
        --color-border:    #2E2E2E;
        --color-ochre:     #D49A30;
      }
    }
    * { box-sizing: border-box; margin: 0; padding: 0; }
    body {
      background: var(--color-white);
      color: var(--color-ink);
      font-family: 'EB Garamond', Georgia, serif;
      padding: 24px;
    }
    h1 {
      font-family: 'EB Garamond', Georgia, serif;
      font-weight: 700;
      font-size: 26px;
      margin-bottom: 4px;
    }
    .subtitle {
      font-family: 'EB Garamond', Georgia, serif;
      font-size: 14px;
      color: var(--color-secondary);
      margin-bottom: 20px;
      max-width: 80ch;
    }
    #chart { width: 100%; max-width: 980px; }
    .col-header {
      font-family: 'EB Garamond', Georgia, serif;
      font-size: 14px;
      font-weight: 700;
      fill: var(--color-ink);
    }
    .tile-title {
      font-family: 'EB Garamond', Georgia, serif;
      font-size: 13px;
      font-weight: 600;
      fill: var(--color-ink);
      pointer-events: none;
    }
    .tile-sub {
      font-family: 'EB Garamond', Georgia, serif;
      font-size: 12px;
      fill: var(--color-secondary);
      pointer-events: none;
    }
    .load-note {
      font-family: 'EB Garamond', Georgia, serif;
      font-size: 12px;
      fill: var(--color-secondary);
    }
    .load-note-bold {
      font-family: 'EB Garamond', Georgia, serif;
      font-size: 12px;
      font-weight: 700;
      fill: var(--color-ink);
    }
    .chip-label {
      font-family: 'EB Garamond', Georgia, serif;
      font-size: 13px;
      font-weight: 700;
      fill: var(--color-white);
      pointer-events: none;
    }
    .footer-line {
      font-family: 'EB Garamond', Georgia, serif;
      font-style: italic;
      font-size: 12px;
      fill: var(--color-secondary);
    }
    .arrow-path { stroke: var(--color-ink); stroke-width: 1.4; fill: none; }
    .tooltip {
      position: absolute;
      pointer-events: none;
      opacity: 0;
      background: var(--color-ink);
      color: var(--color-white);
      padding: 8px 12px;
      font-size: 13px;
      font-family: 'EB Garamond', Georgia, serif;
      max-width: 280px;
      line-height: 1.4;
      transition: opacity 150ms;
    }
    @media (prefers-reduced-motion: reduce) {
      * { transition: none !important; animation: none !important; }
    }
  </style>
</head>
<body>
  <h1>Two moves that look like &ldquo;differentiation.&rdquo; They are not the same thing.</h1>
  <p class="subtitle">Leveling changes the text. Scaffolding changes what surrounds it.</p>
  <div id="chart" role="img" aria-label="Two parallel columns. Leveling on the left rewrites the original passage and risks losing the concept. Scaffolding on the right surrounds the original with supports and preserves it."></div>
  <script src="https://cdnjs.cloudflare.com/ajax/libs/d3/7.9.0/d3.min.js"></script>
  <script>
    const supports = [
      { label: 'Sentence frame',     tip: 'A partial sentence the student completes — gives the structure of academic argument without lowering the conceptual work.' },
      { label: 'Glossary',           tip: 'Student-friendly definitions for the academic terms in the passage. Lowers linguistic friction, not conceptual friction.' },
      { label: 'Graphic organizer',  tip: 'A visual template — Venn, cause-and-effect, T-chart — that holds the organizational load so the student can work on the idea.' },
      { label: 'Partner read',       tip: 'A read-aloud or paired-read structure that absorbs decoding load. The text and the concept stay intact.' }
    ];

    const tooltip = d3.select('body').append('div').attr('class', 'tooltip');
    function showTip(event, html) {
      tooltip.html(html)
        .style('left', (event.pageX + 14) + 'px')
        .style('top',  (event.pageY - 24) + 'px')
        .transition().duration(150).style('opacity', 1);
    }
    function moveTip(event) {
      tooltip.style('left', (event.pageX + 14) + 'px')
             .style('top',  (event.pageY - 24) + 'px');
    }
    function hideTip() {
      tooltip.transition().duration(100).style('opacity', 0);
    }

    function draw() {
      d3.select('#chart').selectAll('*').remove();
      const container = document.getElementById('chart');
      const totalWidth  = Math.max(640, container.clientWidth || 900);
      const totalHeight = 480;

      const svg = d3.select('#chart').append('svg')
        .attr('width', totalWidth).attr('height', totalHeight)
        .attr('viewBox', `0 0 ${totalWidth} ${totalHeight}`)
        .attr('role', 'img')
        .attr('aria-labelledby', 'fig-title fig-desc');
      svg.append('title').attr('id', 'fig-title').text('Leveling versus scaffolding');
      svg.append('desc').attr('id', 'fig-desc').text('Two columns side by side comparing leveling and scaffolding.');

      const defs = svg.append('defs');
      defs.append('marker')
        .attr('id', 'arrow-ink')
        .attr('markerWidth', 9).attr('markerHeight', 7)
        .attr('refX', 8).attr('refY', 3.5).attr('orient', 'auto')
        .append('polygon').attr('points', '0 0, 9 3.5, 0 7')
        .attr('fill', 'var(--color-ink)');

      // divider
      svg.append('line')
        .attr('x1', totalWidth/2).attr('x2', totalWidth/2)
        .attr('y1', 56).attr('y2', totalHeight - 60)
        .attr('stroke', 'var(--color-border)')
        .attr('stroke-width', 0.8)
        .attr('stroke-dasharray', '4 3')
        .attr('aria-hidden', 'true');

      const leftCx  = totalWidth * 0.25;
      const rightCx = totalWidth * 0.75;
      const tileW   = Math.min(300, totalWidth * 0.4);

      // LEFT — column header
      svg.append('text').attr('class', 'col-header')
        .attr('x', leftCx).attr('y', 60).attr('text-anchor', 'middle')
        .text('Leveling — change the text');

      // LEFT — original tile
      const leftOrigG = svg.append('g').attr('tabindex', 0)
        .attr('aria-label', 'Original 900L passage on the leveling side.')
        .style('cursor', 'pointer');
      leftOrigG.append('rect')
        .attr('x', leftCx - tileW/2).attr('y', 84)
        .attr('width', tileW).attr('height', 46)
        .attr('fill', 'var(--color-white)')
        .attr('stroke', 'var(--color-ink)').attr('stroke-width', 1);
      leftOrigG.append('text').attr('class', 'tile-title')
        .attr('x', leftCx).attr('y', 104).attr('text-anchor', 'middle')
        .text('Original passage (900L)');
      leftOrigG.append('text').attr('class', 'tile-sub')
        .attr('x', leftCx).attr('y', 120).attr('text-anchor', 'middle')
        .text('the document the lesson was designed around');
      leftOrigG.on('mouseover', (event) => showTip(event, '<strong>Original 900L passage</strong><br/>The text the lesson was built around. The conceptual content the unit was designed to teach.'))
               .on('mousemove', moveTip).on('mouseout', hideTip);

      // arrow rewrite
      svg.append('path').attr('class', 'arrow-path')
        .attr('d', `M ${leftCx} 134 L ${leftCx} 160`)
        .attr('marker-end', 'url(#arrow-ink)')
        .attr('aria-hidden', 'true');
      svg.append('text').attr('class', 'tile-sub')
        .attr('x', leftCx + 28).attr('y', 152)
        .attr('font-style', 'italic').text('rewrite');

      // LEFT — rewritten tile
      const leftRewG = svg.append('g').attr('tabindex', 0)
        .attr('aria-label', 'Rewritten 600L passage. A different document.')
        .style('cursor', 'pointer');
      leftRewG.append('rect')
        .attr('x', leftCx - tileW/2).attr('y', 164)
        .attr('width', tileW).attr('height', 46)
        .attr('fill', 'var(--color-border)')
        .attr('fill-opacity', 0.5)
        .attr('stroke', 'var(--color-ink)').attr('stroke-width', 1);
      leftRewG.append('text').attr('class', 'tile-title')
        .attr('x', leftCx).attr('y', 184).attr('text-anchor', 'middle')
        .text('Rewritten passage (600L)');
      leftRewG.append('text').attr('class', 'tile-sub')
        .attr('x', leftCx).attr('y', 200).attr('text-anchor', 'middle')
        .text('a different document — fewer terms, shorter clauses');
      leftRewG.on('mouseover', (event) => showTip(event, '<strong>Rewritten 600L passage</strong><br/>The Lexile number is hit. Whether the mechanism survived depends on the spot-check — not on the number.'))
               .on('mousemove', moveTip).on('mouseout', hideTip);

      // load notes left
      svg.append('text').attr('class', 'load-note')
        .attr('x', leftCx).attr('y', 240).attr('text-anchor', 'middle')
        .text('extraneous load: reduced');
      svg.append('text').attr('class', 'load-note-bold')
        .attr('x', leftCx).attr('y', 260).attr('text-anchor', 'middle')
        .text('germane load: at risk');

      // chip warn
      const chipW = 200;
      svg.append('rect')
        .attr('x', leftCx - chipW/2).attr('y', 280)
        .attr('width', chipW).attr('height', 30)
        .attr('fill', 'var(--color-secondary)');
      svg.append('text').attr('class', 'chip-label')
        .attr('x', leftCx).attr('y', 300).attr('text-anchor', 'middle')
        .text('concept may be lost');

      svg.append('text').attr('class', 'footer-line')
        .attr('x', leftCx).attr('y', 332).attr('text-anchor', 'middle')
        .text('the student is no longer in the same lesson');

      // RIGHT — column header
      svg.append('text').attr('class', 'col-header')
        .attr('x', rightCx).attr('y', 60).attr('text-anchor', 'middle')
        .text('Scaffolding — change what surrounds the text');

      // RIGHT — original tile
      const rightOrigG = svg.append('g').attr('tabindex', 0)
        .attr('aria-label', 'Original 900L passage on the scaffolding side, untouched.')
        .style('cursor', 'pointer');
      rightOrigG.append('rect')
        .attr('x', rightCx - tileW/2).attr('y', 84)
        .attr('width', tileW).attr('height', 46)
        .attr('fill', 'var(--color-white)')
        .attr('stroke', 'var(--color-ink)').attr('stroke-width', 1);
      rightOrigG.append('text').attr('class', 'tile-title')
        .attr('x', rightCx).attr('y', 104).attr('text-anchor', 'middle')
        .text('Original passage (900L)');
      rightOrigG.append('text').attr('class', 'tile-sub')
        .attr('x', rightCx).attr('y', 120).attr('text-anchor', 'middle')
        .text('same document the class is reading');
      rightOrigG.on('mouseover', (event) => showTip(event, '<strong>Original 900L passage — preserved</strong><br/>Untouched. The student reads what the class reads. Supports below absorb extraneous load.'))
                .on('mousemove', moveTip).on('mouseout', hideTip);

      // four supports in 2x2 grid
      const supW = (tileW - 8) / 2;
      const supH = 38;
      supports.forEach((d, i) => {
        const row = Math.floor(i / 2);
        const col = i % 2;
        const x = rightCx - tileW/2 + col * (supW + 8);
        const y = 144 + row * (supH + 6);
        const g = svg.append('g').attr('tabindex', 0)
          .attr('aria-label', `Scaffold: ${d.label}`)
          .style('cursor', 'pointer');
        g.append('rect')
          .attr('x', x).attr('y', y)
          .attr('width', supW).attr('height', supH)
          .attr('fill', 'var(--color-white)')
          .attr('stroke', 'var(--color-secondary)').attr('stroke-width', 0.8);
        g.append('text').attr('class', 'tile-title')
          .attr('x', x + supW/2).attr('y', y + 24).attr('text-anchor', 'middle')
          .text(d.label);
        g.on('mouseover', (event) => showTip(event, `<strong>${d.label}</strong><br/>${d.tip}`))
         .on('mousemove', moveTip).on('mouseout', hideTip);
      });

      // load notes right
      svg.append('text').attr('class', 'load-note')
        .attr('x', rightCx).attr('y', 252).attr('text-anchor', 'middle')
        .text('extraneous load: reduced');
      svg.append('text').attr('class', 'load-note-bold')
        .attr('x', rightCx).attr('y', 272).attr('text-anchor', 'middle')
        .text('germane load: preserved');

      // chip ok
      svg.append('rect')
        .attr('x', rightCx - chipW/2).attr('y', 290)
        .attr('width', chipW).attr('height', 30)
        .attr('fill', 'var(--color-ink)');
      svg.append('text').attr('class', 'chip-label')
        .attr('x', rightCx).attr('y', 310).attr('text-anchor', 'middle')
        .text('same concept as class');

      svg.append('text').attr('class', 'footer-line')
        .attr('x', rightCx).attr('y', 342).attr('text-anchor', 'middle')
        .text('the student is in the same lesson, with help');

      // footer
      svg.append('line')
        .attr('x1', 30).attr('x2', totalWidth - 30)
        .attr('y1', totalHeight - 50).attr('y2', totalHeight - 50)
        .attr('stroke', 'var(--color-border)').attr('stroke-width', 0.8)
        .attr('aria-hidden', 'true');
      svg.append('text').attr('class', 'footer-line')
        .attr('x', totalWidth/2).attr('y', totalHeight - 26).attr('text-anchor', 'middle')
        .text('Both columns look easier from the outside.');
      svg.append('text').attr('class', 'footer-line')
        .attr('x', totalWidth/2).attr('y', totalHeight - 10).attr('text-anchor', 'middle')
        .text('Only the right column preserves what the lesson was for.');
    }

    draw();
    const ro = new ResizeObserver(() => draw());
    ro.observe(document.getElementById('chart'));
  </script>
</body>
</html>
