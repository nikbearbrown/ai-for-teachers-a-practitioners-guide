<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Figure 3.1 — Pointer versus specification</title>
<style>
  :root {
    --color-white:     #FFFFFF;
    --color-ink:       #121212;
    --color-red:       #C8102E;
    --color-secondary: #545454;
    --color-border:    #D4D4D4;
    --color-ochre:     #C8860E;
  }
  @media (prefers-color-scheme: dark) {
    :root {
      --color-white:     #111111;
      --color-ink:       #F0EBE3;
      --color-red:       #E8243A;
      --color-secondary: #A0978C;
      --color-border:    #2E2E2E;
      --color-ochre:     #D49A30;
    }
  }
  * { box-sizing: border-box; margin: 0; padding: 0; }
  body {
    background: var(--color-white);
    color: var(--color-ink);
    font-family: 'EB Garamond', 'Garamond', Georgia, serif;
    padding: 24px;
  }
  #chart { width: 100%; max-width: 900px; }
  .chart-title { font-size: 18px; font-weight: 700; fill: var(--color-ink); }
  .chart-subtitle { font-size: 13px; fill: var(--color-secondary); }
  .panel-label { font-size: 13px; font-weight: 700; fill: var(--color-ink); }
  .panel-rule { stroke: var(--color-border); stroke-width: 1; }
  .node-rect { fill: var(--color-white); stroke: var(--color-ink); stroke-width: 1; }
  .node-title { font-size: 13px; fill: var(--color-ink); }
  .node-sub { font-size: 11px; fill: var(--color-secondary); }
  .badge { font-size: 12px; font-weight: 700; fill: var(--color-red); }
  .annot { font-size: 11px; font-style: italic; fill: var(--color-secondary); }
  .footer { font-size: 12px; font-style: italic; fill: var(--color-secondary); }
  .flow-line { stroke: var(--color-ink); stroke-width: 1; fill: none; }
  .loop-line { stroke: var(--color-red); stroke-width: 1; stroke-dasharray: 3,2; fill: none; }
  @media (prefers-reduced-motion: reduce) { * { transition: none !important; animation: none !important; } }
</style>
</head>
<body>
<div id="chart" role="main"></div>
<script src="https://cdnjs.cloudflare.com/ajax/libs/d3/7.9.0/d3.min.js"></script>
<script>
(function () {
  const FALLBACK_DATA = {
    search: [
      { id: 'sk', title: 'User keywords', sub: '"revolution causes quiz"' },
      { id: 'si', title: 'Index lookup', sub: 'match against stored docs' },
      { id: 'sr', title: 'Ranked list', sub: 'existing documents returned' }
    ],
    generative: [
      { id: 'gp', title: 'Prompt tokens', sub: 'role + context + task' },
      { id: 'gd', title: 'Probability distribution', sub: 'over the next token' },
      { id: 'go', title: 'Token-by-token output', sub: 'built from scratch each time' }
    ]
  };

  function draw() {
    d3.select('#chart').selectAll('*').remove();
    const container = document.getElementById('chart');
    const totalWidth  = Math.max(640, container.clientWidth || 900);
    const totalHeight = 460;
    const margin = { top: 64, right: 32, bottom: 56, left: 32 };

    const svg = d3.select('#chart').append('svg')
      .attr('width', totalWidth)
      .attr('height', totalHeight)
      .attr('viewBox', `0 0 ${totalWidth} ${totalHeight}`)
      .attr('role', 'img')
      .attr('aria-labelledby', 'chart-title chart-desc');

    svg.append('title').attr('id', 'chart-title')
      .text('Pointer versus specification — search versus generative prompt');
    svg.append('desc').attr('id', 'chart-desc')
      .text('Two pipelines compared: a search engine retrieves pre-existing documents from an index, while a generative model conditions on the prompt and samples token by token.');

    // arrowheads
    const defs = svg.append('defs');
    defs.append('marker')
      .attr('id', 'arrow-ink').attr('markerWidth', 8).attr('markerHeight', 6)
      .attr('refX', 7).attr('refY', 3).attr('orient', 'auto')
      .append('polygon').attr('points', '0 0, 8 3, 0 6')
      .attr('fill', 'var(--color-ink)');
    defs.append('marker')
      .attr('id', 'arrow-red').attr('markerWidth', 8).attr('markerHeight', 6)
      .attr('refX', 7).attr('refY', 3).attr('orient', 'auto')
      .append('polygon').attr('points', '0 0, 8 3, 0 6')
      .attr('fill', 'var(--color-red)');

    // Title block
    svg.append('text').attr('class', 'chart-title')
      .attr('x', margin.left).attr('y', 28).text('Pointer versus specification');
    svg.append('text').attr('class', 'chart-subtitle')
      .attr('x', margin.left).attr('y', 48)
      .text('Search returns what already exists. A prompt builds what did not exist until you asked.');

    const innerWidth = totalWidth - margin.left - margin.right;
    const nodeW = Math.min(180, (innerWidth - 48) / 3);
    const gap = (innerWidth - nodeW * 3) / 2;

    function renderRow(yPanel, label, nodes, isGen) {
      // panel label + rule
      svg.append('text').attr('class', 'panel-label')
        .attr('x', margin.left).attr('y', yPanel).text(label);
      svg.append('line').attr('class', 'panel-rule')
        .attr('x1', margin.left).attr('y1', yPanel + 8)
        .attr('x2', totalWidth - margin.right).attr('y2', yPanel + 8);

      const yNode = yPanel + 28;
      const yMid  = yNode + 28;

      const g = svg.append('g').attr('class', isGen ? 'g-row-gen' : 'g-row-search');

      nodes.forEach((n, i) => {
        const x = margin.left + i * (nodeW + gap);
        const node = g.append('g').attr('class', 'g-node').attr('aria-label', `${n.title}: ${n.sub}`);
        node.append('rect').attr('class', 'node-rect')
          .attr('x', x).attr('y', yNode).attr('width', nodeW).attr('height', 56);
        node.append('text').attr('class', 'node-title')
          .attr('x', x + nodeW / 2).attr('y', yNode + 24)
          .attr('text-anchor', 'middle').text(n.title);
        node.append('text').attr('class', 'node-sub')
          .attr('x', x + nodeW / 2).attr('y', yNode + 42)
          .attr('text-anchor', 'middle').text(n.sub);

        if (i < nodes.length - 1) {
          const xNext = margin.left + (i + 1) * (nodeW + gap);
          g.append('line').attr('class', 'flow-line')
            .attr('x1', x + nodeW + 4).attr('y1', yMid)
            .attr('x2', xNext - 4).attr('y2', yMid)
            .attr('marker-end', 'url(#arrow-ink)');
        }
      });

      // annotation row
      const yAnnot = yNode + 76;
      if (!isGen) {
        g.append('text').attr('class', 'badge')
          .attr('x', margin.left + nodeW + gap / 2).attr('y', yAnnot)
          .attr('text-anchor', 'middle').text('retrieval');
        g.append('text').attr('class', 'annot')
          .attr('x', margin.left + 2 * (nodeW + gap) + nodeW / 2).attr('y', yAnnot)
          .attr('text-anchor', 'middle').text('already existed before you typed');
      } else {
        // self-loop on output node
        const xOut = margin.left + 2 * (nodeW + gap) + nodeW / 2;
        g.append('path').attr('class', 'loop-line')
          .attr('d', `M${xOut} ${yNode + 56} C ${xOut + 60} ${yNode + 90}, ${xOut - 60} ${yNode + 90}, ${xOut} ${yNode + 56}`)
          .attr('marker-end', 'url(#arrow-red)');
        g.append('text').attr('class', 'badge')
          .attr('x', xOut).attr('y', yAnnot + 22)
          .attr('text-anchor', 'middle').text('conditioning');
        g.append('text').attr('class', 'annot')
          .attr('x', xOut).attr('y', yAnnot + 36)
          .attr('text-anchor', 'middle').text('prompt is the entire specification');
        g.append('text').attr('class', 'annot')
          .attr('x', margin.left + nodeW + gap / 2).attr('y', yAnnot + 22)
          .attr('text-anchor', 'middle').text('no retrieval — every token sampled fresh');
      }
    }

    renderRow(72, 'Search engine', FALLBACK_DATA.search, false);
    renderRow(232, 'Generative language model', FALLBACK_DATA.generative, true);

    svg.append('text').attr('class', 'footer')
      .attr('x', margin.left).attr('y', totalHeight - 18)
      .text('A search query is a pointer. A prompt is the specification of what gets built.');
  }

  draw();
  const ro = new ResizeObserver(() => draw());
  ro.observe(document.getElementById('chart'));
})();
</script>
</body>
</html>
