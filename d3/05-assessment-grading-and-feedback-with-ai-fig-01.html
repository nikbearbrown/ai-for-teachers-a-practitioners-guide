<!DOCTYPE html><html lang="en"><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width, initial-scale=1.0"><title>Four horizontal rows, each labeled with one sub-task and a brief descriptor:.</title><style>:root{--color-white:#FFFFFF;--color-ink:#2a1a0e;--color-red:#C8102E;--color-secondary:#545454;--color-border:#D4D4D4;--color-ochre:#C8860E;--color-fill:#F5F5F5;}@media (prefers-color-scheme: dark){:root{--color-white:#111111;--color-ink:#F0EBE3;--color-red:#E8243A;--color-secondary:#A0978C;--color-border:#2E2E2E;--color-ochre:#D49A30;--color-fill:#1b1b1b;}}*{box-sizing:border-box;margin:0;padding:0}body{background:var(--color-white);color:var(--color-ink);font-family:'Inter',-apple-system,'Helvetica Neue',sans-serif;}#chart{width:100vw;height:100vh;padding:24px}.tooltip{position:absolute;pointer-events:none;opacity:0;background:var(--color-ink);color:var(--color-white);border:1px solid var(--color-border);padding:8px 10px;font-size:13px}.title{font-family:'EB Garamond','Garamond',Georgia,serif;font-size:18px;fill:var(--color-ink)}.subtitle,.axis text{fill:var(--color-secondary)}.axis text{font-family:'JetBrains Mono','Fira Code','Courier New',monospace;font-size:11px}.axis path,.axis line{stroke:var(--color-border)}.grid line{stroke:var(--color-border);stroke-dasharray:4 3}.bar{cursor:pointer}.label{font-size:12px;fill:var(--color-ink)}@media (prefers-reduced-motion: reduce){*{transition:none!important;animation:none!important}}</style></head><body><div id="chart" role="main"></div><script src="https://cdnjs.cloudflare.com/ajax/libs/d3/7.9.0/d3.min.js"></script><script>const data=[{"label":"Time","value":78,"note":"teacher-controlled check"},{"label":"Quality","value":88,"note":"AI-assisted step"},{"label":"Equity","value":62,"note":"teacher-controlled check"},{"label":"Evidence","value":71,"note":"teacher-controlled check"}];const tooltip=d3.select('body').append('div').attr('class','tooltip');function showTooltip(event,d){tooltip.html('<strong>'+d.label+'</strong><br>'+d.note+': '+d.value).style('left',(event.pageX+12)+'px').style('top',(event.pageY-28)+'px').transition().duration(150).style('opacity',1)}function moveTooltip(event){tooltip.style('left',(event.pageX+12)+'px').style('top',(event.pageY-28)+'px')}function hideTooltip(){tooltip.transition().duration(100).style('opacity',0)}function draw(){d3.select('#chart').selectAll('*').remove();const container=document.getElementById('chart');const totalWidth=container.clientWidth||800,totalHeight=container.clientHeight||500;const margin={top:84,right:40,bottom:64,left:96};const chartWidth=totalWidth-margin.left-margin.right,chartHeight=totalHeight-margin.top-margin.bottom;const svg=d3.select('#chart').append('svg').attr('width',totalWidth).attr('height',totalHeight).attr('role','img').attr('aria-labelledby','chart-title chart-desc');svg.append('title').attr('id','chart-title').text("Four horizontal rows, each labeled with one sub-task and a brief descriptor:.");svg.append('desc').attr('id','chart-desc').text("Four horizontal rows, each labeled with one sub-task and a brief descriptor:.");svg.append('text').attr('class','title').attr('x',24).attr('y',34).text("Four horizontal rows, each labeled with one sub-task and a brief descriptor:.");svg.append('text').attr('class','subtitle').attr('x',24).attr('y',56).text('teacher judgment scaffold');const gChart=svg.append('g').attr('class','g-chart').attr('transform',`translate(${margin.left},${margin.top})`);const xScaleBand=d3.scaleBand().domain(data.map(d=>d.label)).range([0,chartWidth]).padding(0.28);const yScaleLinear=d3.scaleLinear().domain([0,100]).nice().range([chartHeight,0]);gChart.append('rect').attr('width',chartWidth).attr('height',chartHeight).attr('fill','var(--color-fill)').attr('stroke','var(--color-border)').attr('stroke-width',0.75);gChart.append('g').attr('class','grid').call(d3.axisLeft(yScaleLinear).tickSize(-chartWidth).tickFormat('').ticks(5));gChart.append('g').attr('class','axis').call(d3.axisLeft(yScaleLinear).ticks(5));gChart.append('g').attr('class','axis').attr('transform',`translate(0,${chartHeight})`).call(d3.axisBottom(xScaleBand));gChart.selectAll('.bar').data(data,d=>d.label).join('rect').attr('class','bar').attr('x',d=>xScaleBand(d.label)).attr('width',xScaleBand.bandwidth()).attr('y',d=>yScaleLinear(d.value)).attr('height',d=>chartHeight-yScaleLinear(d.value)).attr('fill',(d,i)=>i===1?'var(--color-red)':'var(--color-ink)').attr('opacity',(d,i)=>i===1?1:.78).on('mouseover',(event,d)=>showTooltip(event,d)).on('mousemove',(event,d)=>moveTooltip(event)).on('mouseout',hideTooltip);gChart.selectAll('.label').data(data,d=>d.label).join('text').attr('class','label').attr('x',d=>xScaleBand(d.label)+xScaleBand.bandwidth()/2).attr('y',d=>yScaleLinear(d.value)-8).attr('text-anchor','middle').text(d=>d.value)}draw();const ro=new ResizeObserver(()=>draw());ro.observe(document.getElementById('chart'));</script></body></html>
