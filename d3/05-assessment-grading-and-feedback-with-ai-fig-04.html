<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Figure 5.4 — Bastani: practice gains, exam losses</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=EB+Garamond:wght@400;500;700&family=Inter:wght@400;600;700&family=JetBrains+Mono:wght@400&display=swap" rel="stylesheet">
<style>
  :root {
    --color-white:     #FFFFFF;
    --color-ink:       #121212;
    --color-red:       #C8102E;
    --color-secondary: #545454;
    --color-border:    #D4D4D4;
    --color-ochre:     #C8860E;
  }
  @media (prefers-color-scheme: dark) {
    :root {
      --color-white:     #111111;
      --color-ink:       #F0EBE3;
      --color-red:       #E8243A;
      --color-secondary: #A0978C;
      --color-border:    #2E2E2E;
      --color-ochre:     #D49A30;
    }
  }
  * { box-sizing: border-box; margin: 0; padding: 0; }
  body { background: var(--color-white); color: var(--color-ink); font-family: 'EB Garamond', Georgia, serif; padding: 24px; }
  h1 { font-family: 'EB Garamond', Georgia, serif; font-weight: 400; font-size: 28px; margin-bottom: 4px; }
  p.subtitle { color: var(--color-secondary); font-family: 'EB Garamond', Georgia, serif; font-style: italic; font-size: 14px; margin-bottom: 24px; }
  #chart { width: 100%; height: 540px; }
  .ti  { font-family: 'EB Garamond', Georgia, serif; font-size: 16px; font-weight: 700; fill: var(--color-ink); }
  .sub { font-family: 'EB Garamond', Georgia, serif; font-size: 12px; font-style: italic; fill: var(--color-secondary); }
  .axis-tick text { font-family: 'JetBrains Mono', monospace; font-size: 11px; fill: var(--color-secondary); }
  .axis-tick path, .axis-tick line { stroke: var(--color-secondary); }
  .axis-title { font-family: 'Inter', sans-serif; font-size: 12px; fill: var(--color-secondary); }
  .grp { font-family: 'EB Garamond', Georgia, serif; font-size: 13px; font-weight: 700; fill: var(--color-ink); }
  .grp-sub { font-family: 'EB Garamond', Georgia, serif; font-size: 11px; font-style: italic; fill: var(--color-secondary); }
  .val { font-family: 'EB Garamond', Georgia, serif; font-size: 12px; font-weight: 700; fill: var(--color-ink); }
  .legend { font-family: 'EB Garamond', Georgia, serif; font-size: 12px; fill: var(--color-ink); }
  .call { font-family: 'EB Garamond', Georgia, serif; font-size: 12px; font-style: italic; fill: var(--color-red); font-weight: 700; }
  .ref { font-family: 'JetBrains Mono', monospace; font-size: 10px; fill: var(--color-secondary); }
  .cap { font-family: 'EB Garamond', Georgia, serif; font-size: 12px; font-style: italic; fill: var(--color-secondary); }
  .source { font-family: 'JetBrains Mono', monospace; font-size: 10px; fill: var(--color-secondary); letter-spacing: 0.3px; }
  .bar { transition: opacity 200ms cubic-bezier(0.2,0.8,0.2,1); cursor: pointer; }
  .bar:hover { opacity: 0.85; }
  .tooltip { position: absolute; pointer-events: none; opacity: 0; background: var(--color-ink); color: var(--color-white); padding: 6px 10px; font-family: 'EB Garamond', Georgia, serif; font-size: 13px; max-width: 280px; }
  @media (prefers-reduced-motion: reduce) { * { transition: none !important; animation: none !important; } }
</style>
</head>
<body>
<h1>Figure 5.4 — Bastani: practice gains, exam losses</h1>
<p class="subtitle">Turkish high-school math, ~1,000 students. Practice with AI rises; unaided exam falls.</p>
<div id="chart" role="img" aria-labelledby="t-bs d-bs"></div>
<script src="https://cdnjs.cloudflare.com/ajax/libs/d3/7.9.0/d3.min.js"></script>
<script>
const FALLBACK_DATA = [
  { group: 'Control (no AI)',         sub: 'baseline practice and exam',          practice: 100, exam: 100, tip: 'Reference condition. Practice and unaided exam are both indexed to 100.' },
  { group: 'GPT Base (unscaffolded)', sub: 'practice up 48% — exam down 17%',     practice: 148, exam: 83,  tip: 'Practice rose because the model handed students the answers. Unaided exam fell because they had not built the skill underneath.' },
  { group: 'GPT Tutor (Socratic)',    sub: 'practice up 127% — exam mostly recovers', practice: 227, exam: 96, tip: 'Hints not answers. Practice climbed even more, and the unaided exam mostly recovered. The gate location made the difference.' }
];

const tooltip = d3.select('body').append('div').attr('class', 'tooltip');
function showTip(event, html) {
  tooltip.html(html).style('left', (event.pageX + 12) + 'px').style('top', (event.pageY - 28) + 'px')
    .transition().duration(150).style('opacity', 1);
}
function moveTip(event) { tooltip.style('left', (event.pageX + 12) + 'px').style('top', (event.pageY - 28) + 'px'); }
function hideTip() { tooltip.transition().duration(100).style('opacity', 0); }

async function loadData() {
  try { return await d3.json('./05-assessment-grading-and-feedback-with-ai-fig-04.json'); }
  catch { return FALLBACK_DATA; }
}

function draw(data) {
  d3.select('#chart').selectAll('*').remove();
  const container = document.getElementById('chart');
  const W = container.clientWidth || 760;
  const H = container.clientHeight || 540;

  const margin = { top: 80, right: 60, bottom: 130, left: 80 };
  const chartW = W - margin.left - margin.right;
  const chartH = H - margin.top - margin.bottom;

  const svg = d3.select('#chart').append('svg')
    .attr('viewBox', `0 0 ${W} ${H}`).attr('width', W).attr('height', H)
    .attr('role', 'img').attr('aria-labelledby', 't-bs d-bs');
  svg.append('title').attr('id', 't-bs').text('Bastani 2025 — practice index and unaided exam score by condition');
  svg.append('desc').attr('id', 'd-bs').text('Grouped bar chart: three conditions (Control, GPT Base, GPT Tutor). Each condition shows two bars — practice performance and unaided exam — indexed so control practice equals 100.');

  // Title
  svg.append('text').attr('x', 32).attr('y', 30).attr('class', 'ti').text('Bastani — practice gains, exam losses');
  svg.append('text').attr('x', 32).attr('y', 48).attr('class', 'sub').text('Practice with AI rises. Unaided exam falls. Gate location matters more than tool.');

  // Legend
  svg.append('rect').attr('x', W - 320).attr('y', 60).attr('width', 14).attr('height', 12).attr('fill', 'var(--color-border)').attr('stroke', 'var(--color-secondary)').attr('stroke-width', 0.6);
  svg.append('text').attr('x', W - 300).attr('y', 71).attr('class', 'legend').text('Practice (with AI)');
  svg.append('rect').attr('x', W - 180).attr('y', 60).attr('width', 14).attr('height', 12).attr('fill', 'var(--color-ink)');
  svg.append('text').attr('x', W - 160).attr('y', 71).attr('class', 'legend').text('Unaided exam');

  const gChart = svg.append('g').attr('transform', `translate(${margin.left},${margin.top})`);

  // X scales — outer for group, inner for series
  const xScaleBand = d3.scaleBand()
    .domain(data.map(d => d.group))
    .range([0, chartW])
    .padding(0.25);
  const xInner = d3.scaleBand()
    .domain(['practice', 'exam'])
    .range([0, xScaleBand.bandwidth()])
    .padding(0.15);

  const yMax = d3.max(data, d => Math.max(d.practice, d.exam)) * 1.05;
  const yScaleLinear = d3.scaleLinear().domain([0, yMax]).range([chartH, 0]);

  // Y axis (zero baseline)
  const yAxis = d3.axisLeft(yScaleLinear).ticks(5).tickSize(-chartW).tickFormat(d => d);
  const gY = gChart.append('g').attr('class', 'axis-tick').call(yAxis);
  gY.selectAll('.tick line').attr('stroke', 'var(--color-border)').attr('stroke-dasharray', '3 3').attr('opacity', 0.6);
  gY.select('.domain').attr('stroke', 'var(--color-secondary)');

  // Y axis title
  gChart.append('text').attr('class', 'axis-title')
    .attr('transform', `rotate(-90)`).attr('x', -chartH / 2).attr('y', -56)
    .attr('text-anchor', 'middle').text('index (control practice = 100)');

  // Reference line at 100
  gChart.append('line').attr('x1', 0).attr('x2', chartW).attr('y1', yScaleLinear(100)).attr('y2', yScaleLinear(100))
    .attr('stroke', 'var(--color-secondary)').attr('stroke-dasharray', '6 4').attr('stroke-width', 0.8);
  gChart.append('text').attr('x', chartW + 4).attr('y', yScaleLinear(100) + 3).attr('class', 'ref').text('control = 100');

  // Bars
  const groups = gChart.selectAll('.group')
    .data(data, d => d.group)
    .join('g').attr('class', 'group')
    .attr('transform', d => `translate(${xScaleBand(d.group)},0)`);

  // practice bars
  groups.append('rect').attr('class', 'bar')
    .attr('x', xInner('practice'))
    .attr('y', d => yScaleLinear(d.practice))
    .attr('width', xInner.bandwidth())
    .attr('height', d => chartH - yScaleLinear(d.practice))
    .attr('fill', 'var(--color-border)')
    .attr('stroke', 'var(--color-secondary)').attr('stroke-width', 0.6)
    .attr('tabindex', 0).attr('aria-label', d => `${d.group}: practice ${d.practice}`)
    .on('mouseover', (e, d) => showTip(e, `<strong>${d.group}</strong><br>Practice: ${d.practice}<br>${d.tip}`))
    .on('mousemove', moveTip).on('mouseout', hideTip)
    .on('keydown', (e, d) => { if (e.key === 'Enter' || e.key === ' ') showTip(e, `<strong>${d.group}</strong><br>Practice: ${d.practice}`); });

  // exam bars
  groups.append('rect').attr('class', 'bar')
    .attr('x', xInner('exam'))
    .attr('y', d => yScaleLinear(d.exam))
    .attr('width', xInner.bandwidth())
    .attr('height', d => chartH - yScaleLinear(d.exam))
    .attr('fill', 'var(--color-ink)')
    .attr('tabindex', 0).attr('aria-label', d => `${d.group}: exam ${d.exam}`)
    .on('mouseover', (e, d) => showTip(e, `<strong>${d.group}</strong><br>Unaided exam: ${d.exam}<br>${d.tip}`))
    .on('mousemove', moveTip).on('mouseout', hideTip)
    .on('keydown', (e, d) => { if (e.key === 'Enter' || e.key === ' ') showTip(e, `<strong>${d.group}</strong><br>Unaided exam: ${d.exam}`); });

  // bar labels
  groups.append('text').attr('class', 'val')
    .attr('x', xInner('practice') + xInner.bandwidth() / 2)
    .attr('y', d => yScaleLinear(d.practice) - 6).attr('text-anchor', 'middle').text(d => d.practice);
  groups.append('text').attr('class', 'val')
    .attr('x', xInner('exam') + xInner.bandwidth() / 2)
    .attr('y', d => yScaleLinear(d.exam) - 6).attr('text-anchor', 'middle').text(d => d.exam);

  // Group labels
  groups.append('text').attr('class', 'grp').attr('x', xScaleBand.bandwidth() / 2).attr('y', chartH + 28).attr('text-anchor', 'middle').text(d => d.group);
  groups.append('text').attr('class', 'grp-sub').attr('x', xScaleBand.bandwidth() / 2).attr('y', chartH + 46).attr('text-anchor', 'middle').text(d => d.sub);

  // Callout — 17% reduction between control exam (100) and GPT Base exam (83)
  const baseGroup = data.find(d => d.group.startsWith('GPT Base'));
  const ctrlExamY = yScaleLinear(100);
  const baseExamY = yScaleLinear(baseGroup.exam);
  const baseXAbs = xScaleBand(baseGroup.group) + xInner('exam') + xInner.bandwidth() / 2;
  gChart.append('text').attr('x', baseXAbs).attr('y', (ctrlExamY + baseExamY) / 2 - 8).attr('class', 'call').attr('text-anchor', 'middle').text('–17% on unaided exam');

  // Footer
  svg.append('line').attr('x1', 32).attr('y1', H - 56).attr('x2', W - 32).attr('y2', H - 56).attr('stroke', 'var(--color-border)');
  svg.append('text').attr('x', 32).attr('y', H - 36).attr('class', 'cap').text('The artifact improved. The learning did not. Same model, different gate location.');
  svg.append('text').attr('x', 32).attr('y', H - 16).attr('class', 'source').text('SOURCE — BASTANI ET AL. 2025, PNAS 122(26)');
}

loadData().then(data => {
  draw(data);
  const ro = new ResizeObserver(() => draw(data));
  ro.observe(document.getElementById('chart'));
});
</script>
</body>
</html>
