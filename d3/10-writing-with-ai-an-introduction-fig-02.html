<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Figure 10.2 — Bastani 2025 practice vs exam</title>
<style>
  :root {
    --color-canvas:    #fdfcfb;
    --color-ink:       #2a1a0e;
    --color-secondary: #4a4540;
    --color-muted:     #8a8480;
    --color-light:     #c8c4c0;
    --color-panel:     #f5f2ee;
  }
  @media (prefers-color-scheme: dark) {
    :root {
      --color-canvas:    #1a120a;
      --color-ink:       #f5f2ee;
      --color-secondary: #c8c4c0;
      --color-muted:     #8a8480;
      --color-light:     #4a4540;
      --color-panel:     #251a10;
    }
  }
  * { box-sizing: border-box; margin: 0; padding: 0; }
  body { background: var(--color-canvas); color: var(--color-ink); font-family: 'EB Garamond', Garamond, Georgia, serif; padding: 16px; }
  #chart { width: 100%; }
  .title    { font-size: 20px; fill: var(--color-ink); }
  .subtitle { font-size: 13px; font-style: italic; fill: var(--color-secondary); }
  .axis-tick text { font-size: 11px; fill: var(--color-secondary); font-family: 'EB Garamond', Garamond, Georgia, serif; }
  .axis-title    { font-size: 12px; font-style: italic; fill: var(--color-secondary); }
  .group-label   { font-size: 14px; fill: var(--color-ink); }
  .value-label   { font-size: 11px; fill: var(--color-ink); }
  .annotation    { font-size: 12px; font-style: italic; fill: var(--color-ink); }
  .annotation-sub{ font-size: 11px; font-style: italic; fill: var(--color-secondary); }
  .gridline      { stroke: var(--color-light); stroke-width: 0.8; stroke-dasharray: 2 3; }
  .axis-line     { stroke: var(--color-ink); stroke-width: 1.2; }
  rect.bar-practice { fill: var(--color-light); stroke: var(--color-ink); stroke-width: 1; }
  rect.bar-exam     { fill: var(--color-secondary); stroke: var(--color-ink); stroke-width: 1; }
  .tooltip { position: absolute; pointer-events: none; opacity: 0; background: var(--color-panel); color: var(--color-ink); border: 1px solid var(--color-ink); padding: 6px 10px; font-size: 13px; font-family: 'EB Garamond', Garamond, Georgia, serif; }
  @media (prefers-reduced-motion: reduce) { * { transition: none !important; animation: none !important; } }
</style>
</head>
<body>
<div id="chart" role="main"></div>
<script src="https://cdnjs.cloudflare.com/ajax/libs/d3/7.9.0/d3.min.js"></script>
<script>
const groupData = [
  { group: 'Control',   practice: 50, exam: 50 },
  { group: 'GPT Base',  practice: 75, exam: 35 },
  { group: 'GPT Tutor', practice: 72, exam: 60 }
];

const tooltip = d3.select('body').append('div').attr('class','tooltip');

function draw() {
  d3.select('#chart').selectAll('svg').remove();
  const W = document.getElementById('chart').clientWidth || 760;
  const H = Math.max(440, W * 0.6);
  const margin = { top: 80, right: 60, bottom: 80, left: 100 };
  const cw = W - margin.left - margin.right;
  const ch = H - margin.top - margin.bottom;

  const svg = d3.select('#chart').append('svg')
    .attr('viewBox', `0 0 ${W} ${H}`)
    .attr('role','img').attr('aria-labelledby','t-fig02 d-fig02');
  svg.append('title').attr('id','t-fig02').text('Bastani 2025 — practice vs unaided exam scores');
  svg.append('desc').attr('id','d-fig02').text('GPT Base shows the biggest gap between assisted practice and unaided exam.');

  svg.append('defs').append('marker').attr('id','arrow02d').attr('viewBox','0 0 10 10').attr('refX',9).attr('refY',5)
    .attr('markerWidth',8).attr('markerHeight',8).attr('orient','auto-start-reverse')
    .append('path').attr('d','M0,0 L10,5 L0,10 z').attr('fill','var(--color-ink)');

  svg.append('text').attr('class','title').attr('x', W/2).attr('y', 32).attr('text-anchor','middle').text('Practice score vs. unaided exam score');
  svg.append('text').attr('class','subtitle').attr('x', W/2).attr('y', 54).attr('text-anchor','middle').text('Bastani et al., 2025 (PNAS), ~1,000 Turkish high-school students');

  const g = svg.append('g').attr('transform', `translate(${margin.left},${margin.top})`);

  const x0 = d3.scaleBand().domain(groupData.map(d=>d.group)).range([0, cw]).padding(0.28);
  const x1 = d3.scaleBand().domain(['practice','exam']).range([0, x0.bandwidth()]).padding(0.1);
  const y  = d3.scaleLinear().domain([0, 100]).range([ch, 0]);

  // gridlines
  g.selectAll('.gridline').data(y.ticks(4)).join('line').attr('class','gridline')
    .attr('x1',0).attr('x2',cw).attr('y1',d=>y(d)).attr('y2',d=>y(d))
    .attr('aria-hidden','true');

  g.append('line').attr('class','axis-line').attr('x1',0).attr('y1',ch).attr('x2',cw).attr('y2',ch);
  g.append('line').attr('class','axis-line').attr('x1',0).attr('y1',0).attr('x2',0).attr('y2',ch);

  // y axis labels
  const yTicks = g.append('g').attr('class','axis-tick');
  yTicks.selectAll('text').data(y.ticks(4)).join('text')
    .attr('x',-8).attr('y',d=>y(d)+4).attr('text-anchor','end').text(d=>d);

  // axis title
  svg.append('text').attr('class','axis-title')
    .attr('transform', `translate(${margin.left - 56}, ${margin.top + ch/2}) rotate(-90)`)
    .attr('text-anchor','middle').text('Score (relative units)');

  // bars
  groupData.forEach(d => {
    const gx = x0(d.group);
    g.append('rect').attr('class','bar-practice')
      .attr('x', gx + x1('practice')).attr('y', y(d.practice))
      .attr('width', x1.bandwidth()).attr('height', ch - y(d.practice))
      .attr('tabindex',0).attr('aria-label', `${d.group} practice: ${d.practice}`)
      .on('mouseover', (event) => showTip(event, `<strong>${d.group}</strong><br>Practice (assisted): <strong>${d.practice}</strong>`))
      .on('mousemove', moveTip).on('mouseout', hideTip);
    g.append('rect').attr('class','bar-exam')
      .attr('x', gx + x1('exam')).attr('y', y(d.exam))
      .attr('width', x1.bandwidth()).attr('height', ch - y(d.exam))
      .attr('tabindex',0).attr('aria-label', `${d.group} unaided exam: ${d.exam}`)
      .on('mouseover', (event) => showTip(event, `<strong>${d.group}</strong><br>Unaided exam: <strong>${d.exam}</strong>`))
      .on('mousemove', moveTip).on('mouseout', hideTip);

    g.append('text').attr('class','value-label')
      .attr('x', gx + x1('practice') + x1.bandwidth()/2).attr('y', y(d.practice) - 6).attr('text-anchor','middle').text(d.practice);
    g.append('text').attr('class','value-label')
      .attr('x', gx + x1('exam') + x1.bandwidth()/2).attr('y', y(d.exam) - 6).attr('text-anchor','middle').text(d.exam);
    g.append('text').attr('class','group-label')
      .attr('x', gx + x0.bandwidth()/2).attr('y', ch + 22).attr('text-anchor','middle').text(d.group);
  });

  // annotation arrow for GPT Base gap
  const baseGx = x0('GPT Base');
  const midX = baseGx + x0.bandwidth()/2;
  g.append('line').attr('x1', midX).attr('y1', y(60)).attr('x2', midX + 100).attr('y2', y(60))
    .attr('stroke','var(--color-ink)').attr('stroke-width',1).attr('marker-end','url(#arrow02d)');
  g.append('text').attr('class','annotation').attr('x', midX + 110).attr('y', y(60)+2).text('practice-exam gap');
  g.append('text').attr('class','annotation-sub').attr('x', midX + 110).attr('y', y(60)+18).text('cognitive work outsourced');

  // legend
  const legendY = H - 24;
  const lg = svg.append('g').attr('transform', `translate(${margin.left + 20}, ${legendY})`);
  lg.append('rect').attr('width',16).attr('height',14).attr('class','bar-practice');
  lg.append('text').attr('x',22).attr('y',12).attr('font-size',12).attr('fill','var(--color-ink)').text('Practice (assisted)');
  lg.append('rect').attr('x',180).attr('width',16).attr('height',14).attr('class','bar-exam');
  lg.append('text').attr('x',202).attr('y',12).attr('font-size',12).attr('fill','var(--color-ink)').text('Unaided exam');
}

function showTip(event, html) {
  tooltip.html(html).style('left',(event.pageX+12)+'px').style('top',(event.pageY-28)+'px')
    .transition().duration(150).style('opacity',1);
}
function moveTip(event) { tooltip.style('left',(event.pageX+12)+'px').style('top',(event.pageY-28)+'px'); }
function hideTip() { tooltip.transition().duration(100).style('opacity',0); }

draw();
new ResizeObserver(()=>draw()).observe(document.getElementById('chart'));
</script>
</body>
</html>
