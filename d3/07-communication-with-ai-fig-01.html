<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Figure 7.1 — A teacher's communication week, five categories</title>
  <style>
    :root {
      --color-white:     #FFFFFF;
      --color-ink:       #121212;
      --color-red:       #C8102E;
      --color-secondary: #545454;
      --color-border:    #D4D4D4;
      --color-ochre:     #C8860E;
    }
    @media (prefers-color-scheme: dark) {
      :root {
        --color-white:     #111111;
        --color-ink:       #F0EBE3;
        --color-red:       #E8243A;
        --color-secondary: #A0978C;
        --color-border:    #2E2E2E;
        --color-ochre:     #D49A30;
      }
    }
    * { box-sizing: border-box; margin: 0; padding: 0; }
    body { background: var(--color-white); color: var(--color-ink); font-family: 'EB Garamond', Garamond, Georgia, serif; padding: 16px; }
    #chart { width: 100%; min-height: 520px; }
    .ti { font-family: 'EB Garamond', Garamond, Georgia, serif; font-size: 18px; font-weight: 700; fill: var(--color-ink); }
    .sub { font-family: 'EB Garamond', Garamond, Georgia, serif; font-size: 12px; font-style: italic; fill: var(--color-secondary); }
    .hdr { font-family: 'EB Garamond', Garamond, Georgia, serif; font-size: 10px; font-weight: 700; fill: var(--color-secondary); letter-spacing: 0.6px; }
    .cat { font-family: 'EB Garamond', Garamond, Georgia, serif; font-size: 13px; font-weight: 700; fill: var(--color-ink); }
    .desc { font-family: 'EB Garamond', Garamond, Georgia, serif; font-size: 12px; fill: var(--color-ink); }
    .role-dark { font-family: 'EB Garamond', Garamond, Georgia, serif; font-size: 11px; fill: var(--color-white); }
    .cap { font-family: 'EB Garamond', Garamond, Georgia, serif; font-size: 12px; font-style: italic; fill: var(--color-secondary); }
    .row-cell { stroke: var(--color-border); stroke-width: 1; fill: var(--color-white); }
    .tooltip { position: absolute; pointer-events: none; opacity: 0; background: var(--color-ink); color: var(--color-white); padding: 6px 10px; font-size: 12px; }
    @media (prefers-reduced-motion: reduce) { * { transition: none !important; animation: none !important; } }
  </style>
</head>
<body>
  <div id="chart" role="main"></div>
  <script src="https://cdnjs.cloudflare.com/ajax/libs/d3/7.9.0/d3.min.js"></script>
  <script>
    const FALLBACK = [
      { cat: 'Routine informational', detail: 'field-trip dates, schedules', reads: 'information; was the date right?', role: 'AI drafts, teacher reviews', shade: '#8a8480' },
      { cat: 'Progress and pattern',  detail: 'three-late, work-strong notes', reads: 'information + evidence you know their kid', role: 'bullets, AI, review', shade: '#4a4540' },
      { cat: 'Administrative',        detail: 'IEP notes, incident reports', reads: 'district reads this six months from now', role: 'teacher notes, AI renders', shade: '#4a4540' },
      { cat: 'Sensitive',             detail: 'behavioral, custody, legal',  reads: 'information, evidence, institutional signal', role: 'teacher writes substance', shade: '#2a1a0e' },
      { cat: 'Relational evidence',   detail: '"I noticed Maya today"',      reads: 'you noticed my kid',                        role: 'AI does not draft', shade: 'var(--color-red)' }
    ];

    function draw() {
      d3.select('#chart').selectAll('*').remove();
      const container = document.getElementById('chart');
      const totalWidth  = container.clientWidth || 700;
      const totalHeight = 520;
      const svg = d3.select('#chart').append('svg')
        .attr('width', totalWidth)
        .attr('height', totalHeight)
        .attr('viewBox', `0 0 ${totalWidth} ${totalHeight}`)
        .attr('role', 'img')
        .attr('aria-labelledby', 'chart-title chart-desc');
      svg.append('title').attr('id', 'chart-title').text("A teacher's communication week, five categories");
      svg.append('desc').attr('id', 'chart-desc').text('Five horizontal rows, each one a category of teacher communication, with what the parent reads for and the appropriate AI role.');

      svg.append('text').attr('class', 'ti').attr('x', 32).attr('y', 34).text("A teacher's communication week, sorted before drafting");
      svg.append('text').attr('class', 'sub').attr('x', 32).attr('y', 54).text('Same week. Five different gate positions. The sort decides who drafts.');

      svg.append('text').attr('class', 'hdr').attr('x', 44).attr('y', 92).text('CATEGORY');
      svg.append('text').attr('class', 'hdr').attr('x', 240).attr('y', 92).text('WHAT THE PARENT READS FOR');
      svg.append('text').attr('class', 'hdr').attr('x', 520).attr('y', 92).text('AI ROLE');
      svg.append('line').attr('x1', 32).attr('y1', 100).attr('x2', totalWidth - 32).attr('y2', 100).attr('stroke', 'var(--color-border)').attr('stroke-width', 1).attr('aria-hidden', 'true');

      const tooltip = d3.select('body').append('div').attr('class', 'tooltip');
      function show(event, d) {
        tooltip.html(`<strong>${d.cat}</strong><br>${d.detail}`)
          .style('left', (event.pageX + 12) + 'px')
          .style('top', (event.pageY - 28) + 'px')
          .transition().duration(150).style('opacity', 1);
      }
      function move(event) { tooltip.style('left', (event.pageX + 12) + 'px').style('top', (event.pageY - 28) + 'px'); }
      function hide() { tooltip.transition().duration(100).style('opacity', 0); }

      const rowH = 60;
      const startY = 116;
      const rightX = totalWidth - 202;

      const rows = svg.selectAll('.row-group')
        .data(FALLBACK)
        .join('g')
        .attr('class', 'row-group')
        .attr('tabindex', 0)
        .attr('aria-label', d => `${d.cat}: ${d.role}`)
        .attr('transform', (d, i) => `translate(0, ${startY + i * rowH})`)
        .on('mouseover', show)
        .on('mousemove', move)
        .on('mouseout', hide);

      rows.append('rect').attr('class', 'row-cell').attr('x', 32).attr('y', 0).attr('width', 200).attr('height', 52);
      rows.append('text').attr('class', 'cat').attr('x', 44).attr('y', 22).text(d => d.cat);
      rows.append('text').attr('class', 'desc').attr('x', 44).attr('y', 40).text(d => d.detail);
      rows.append('text').attr('class', 'desc').attr('x', 240).attr('y', 30).text(d => d.reads);

      rows.append('rect')
        .attr('x', rightX).attr('y', 8).attr('width', 170).attr('height', 36)
        .attr('fill', d => d.shade === 'var(--color-red)' ? 'var(--color-red)' : d.shade);
      rows.append('text').attr('class', 'role-dark')
        .attr('x', rightX + 85).attr('y', 31)
        .attr('text-anchor', 'middle')
        .text(d => d.role);

      svg.append('text').attr('class', 'cap')
        .attr('x', totalWidth / 2).attr('y', totalHeight - 24)
        .attr('text-anchor', 'middle')
        .text('Figure 7.1 — Same week, five different gate positions. The sort happens before the draft.');
    }
    draw();
    new ResizeObserver(() => draw()).observe(document.getElementById('chart'));
  </script>
</body>
</html>
