<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Figure 8.5 — Textbook figure versus projection figure</title>
<style>
  :root {
    --color-white:     #FFFFFF;
    --color-ink:       #121212;
    --color-red:       #C8102E;
    --color-secondary: #545454;
    --color-border:    #D4D4D4;
    --color-ochre:     #C8860E;
  }
  @media (prefers-color-scheme: dark) {
    :root {
      --color-white:     #111111;
      --color-ink:       #F0EBE3;
      --color-red:       #E8243A;
      --color-secondary: #A0978C;
      --color-border:    #2E2E2E;
      --color-ochre:     #D49A30;
    }
  }
  * { box-sizing: border-box; margin: 0; padding: 0; }
  body {
    background: var(--color-white); color: var(--color-ink);
    font-family: 'EB Garamond', Garamond, Georgia, serif;
    padding: 24px;
  }
  #chart { width: 100%; height: 520px; }
  .eyebrow { font-family: 'EB Garamond', Georgia, serif; font-size: 11px; letter-spacing: 2px; fill: var(--color-secondary); }
  .panel-title-sm { font-family: 'EB Garamond', Georgia, serif; font-size: 14px; fill: var(--color-ink); }
  .panel-title-lg { font-family: 'EB Garamond', Georgia, serif; font-size: 20px; fill: var(--color-ink); }
  .cap-sm { font-family: 'EB Garamond', Georgia, serif; font-size: 9px; fill: var(--color-secondary); }
  .cap-md { font-family: 'EB Garamond', Georgia, serif; font-size: 12px; fill: var(--color-secondary); }
  .label-lg { font-family: 'EB Garamond', Georgia, serif; font-size: 14px; fill: var(--color-secondary); }
  .footer { font-family: 'EB Garamond', Georgia, serif; font-size: 14px; font-style: italic; fill: var(--color-ink); }
  .tooltip {
    position: absolute; pointer-events: none; opacity: 0;
    background: var(--color-white); color: var(--color-ink);
    border: 1px solid var(--color-border); padding: 6px 10px;
    font-family: 'EB Garamond', Georgia, serif; font-size: 13px;
  }
  @media (prefers-reduced-motion: reduce) { * { transition: none !important; animation: none !important; } }
</style>
</head>
<body>
<div id="chart" role="main"></div>
<script src="https://cdnjs.cloudflare.com/ajax/libs/d3/7.9.0/d3.min.js"></script>
<script>
  const FALLBACK_DATA = {
    print:      { eyebrow: 'PRINT — 14 inches',          title: 'Mitochondrion (composite)',  panels: ['(a)', '(b)', '(c)', '(d)', '(e)'] },
    projection: { eyebrow: 'PROJECTION — 15 to 50 feet', title: 'Cristae fold the membrane.', label: 'inner membrane (cristae)' }
  };

  function draw() {
    d3.select('#chart').selectAll('*').remove();
    const container = document.getElementById('chart');
    const totalWidth  = container.clientWidth  || 700;
    const totalHeight = 520;
    const half = totalWidth / 2;

    const svg = d3.select('#chart').append('svg')
      .attr('width', totalWidth).attr('height', totalHeight)
      .attr('viewBox', `0 0 ${totalWidth} ${totalHeight}`)
      .attr('role', 'img')
      .attr('aria-labelledby', 'f5-t f5-d');
    svg.append('title').attr('id', 'f5-t').text('Textbook figure versus projection figure');
    svg.append('desc').attr('id', 'f5-d').text('The same content drawn for two different reading distances: five-panel print composite at fourteen inches, one-panel rebuild for projection at fifteen to fifty feet.');

    svg.append('text').attr('class', 'eyebrow').attr('x', half * 0.5).attr('y', 34).attr('text-anchor', 'middle').text(FALLBACK_DATA.print.eyebrow);
    svg.append('text').attr('class', 'eyebrow').attr('x', half * 1.5).attr('y', 34).attr('text-anchor', 'middle').text(FALLBACK_DATA.projection.eyebrow);

    const tooltip = d3.select('body').append('div').attr('class', 'tooltip');

    // LEFT — print
    const leftX = 30, leftW = half - 60;
    const gPrint = svg.append('g')
      .attr('class', 'panel-print')
      .attr('tabindex', 0)
      .attr('aria-label', 'Print figure: five small panels with small labels and a caption beneath.');

    gPrint.append('rect').attr('x', leftX).attr('y', 56).attr('width', leftW).attr('height', 280)
      .attr('fill', 'var(--color-white)').attr('stroke', 'var(--color-border)').attr('stroke-width', 1);
    gPrint.append('text').attr('class', 'panel-title-sm').attr('x', leftX + leftW / 2).attr('y', 78).attr('text-anchor', 'middle').text(FALLBACK_DATA.print.title);

    const panelData = [
      { col: 0, row: 0, lbl: '(a)' },
      { col: 1, row: 0, lbl: '(b)' },
      { col: 2, row: 0, lbl: '(c)' },
      { col: 0, row: 1, lbl: '(d)', shiftX: 30 },
      { col: 1, row: 1, lbl: '(e)', shiftX: 30 }
    ];

    gPrint.selectAll('.panel-cell')
      .data(panelData)
      .join('g')
        .attr('class', 'panel-cell')
        .attr('transform', d => `translate(${leftX + 30 + (d.shiftX || 0) + d.col * 60}, ${96 + d.row * 70})`)
        .each(function(d) {
          const g = d3.select(this);
          g.append('rect').attr('width', 55).attr('height', 55).attr('fill', 'var(--color-white)').attr('stroke', 'var(--color-ink)').attr('stroke-width', 0.8);
          g.append('text').attr('class', 'cap-sm').attr('x', 4).attr('y', 12).text(d.lbl);
          g.append('ellipse').attr('cx', 28).attr('cy', 32).attr('rx', 18).attr('ry', 11).attr('fill', 'none').attr('stroke', 'var(--color-ink)').attr('stroke-width', 0.8);
        });

    gPrint.append('line').attr('x1', leftX + 30).attr('y1', 250).attr('x2', leftX + leftW - 30).attr('y2', 250).attr('stroke', 'var(--color-border)');
    gPrint.append('text').attr('class', 'cap-sm').attr('x', leftX + 30).attr('y', 270).text('Fig. 8.5  Mitochondrial structure showing (a) outer');
    gPrint.append('text').attr('class', 'cap-sm').attr('x', leftX + 30).attr('y', 282).text('membrane, (b) intermembrane space, (c) cristae, (d)');
    gPrint.append('text').attr('class', 'cap-sm').attr('x', leftX + 30).attr('y', 294).text('matrix and (e) ETC complexes I–IV plus ATP synthase.');
    gPrint.append('text').attr('class', 'cap-md').attr('x', leftX + 30).attr('y', 320).attr('font-style', 'italic').text('caption directly beneath, page-width');

    // RIGHT — projection
    const rightX = half + 30, rightW = half - 60;
    const gProj = svg.append('g')
      .attr('class', 'panel-projection')
      .attr('tabindex', 0)
      .attr('aria-label', 'Projection figure: one panel, larger type, caption migrated to the notes field.');

    gProj.append('rect').attr('x', rightX).attr('y', 56).attr('width', rightW).attr('height', 280)
      .attr('fill', 'var(--color-white)').attr('stroke', 'var(--color-ink)').attr('stroke-width', 1.5);
    gProj.append('text').attr('class', 'panel-title-lg').attr('x', rightX + 20).attr('y', 90).text(FALLBACK_DATA.projection.title);

    const cx = rightX + rightW / 2;
    gProj.append('ellipse').attr('cx', cx).attr('cy', 200).attr('rx', 100).attr('ry', 62).attr('fill', 'none').attr('stroke', 'var(--color-ink)').attr('stroke-width', 1.6);
    gProj.append('path')
      .attr('d', `M ${cx - 70} 180 Q ${cx - 50} 160 ${cx - 30} 180 Q ${cx - 10} 200 ${cx + 10} 180 Q ${cx + 30} 160 ${cx + 50} 180 Q ${cx + 70} 200 ${cx + 80} 180`)
      .attr('fill', 'none').attr('stroke', 'var(--color-ink)').attr('stroke-width', 1.4);
    gProj.append('text').attr('class', 'label-lg').attr('x', cx).attr('y', 280).attr('text-anchor', 'middle').text(FALLBACK_DATA.projection.label);

    gProj.append('line').attr('x1', rightX + 20).attr('y1', 350).attr('x2', rightX + rightW - 20).attr('y2', 350).attr('stroke', 'var(--color-border)');
    gProj.append('text').attr('class', 'cap-md').attr('x', rightX + 20).attr('y', 370).attr('font-style', 'italic').text('caption moved to notes field — read separately');

    // Footer
    svg.append('text').attr('class', 'footer').attr('x', totalWidth / 2).attr('y', 416).attr('text-anchor', 'middle').text('Different reading distance, different figure.');
    svg.append('text').attr('class', 'cap-md').attr('x', totalWidth / 2).attr('y', 440).attr('text-anchor', 'middle').text('type sized for the back of the room — labels reduced, panels collapsed');
    svg.append('text').attr('class', 'cap-md').attr('x', totalWidth / 2).attr('y', 460).attr('text-anchor', 'middle').text('Bringhurst: hierarchy ratios approach 2:1 at display scale');

    [gPrint, gProj].forEach((g, i) => {
      g.on('mouseover', function(event) {
          d3.select(this).select('rect').transition().duration(120).attr('stroke', 'var(--color-red)').attr('stroke-width', 2);
          tooltip.html(i === 0 ? '<strong>Print</strong><br/>14-inch reading distance — small labels OK' : '<strong>Projection</strong><br/>15–50 ft reading distance — labels resized')
            .style('left', (event.pageX + 12) + 'px').style('top', (event.pageY - 28) + 'px')
            .transition().duration(150).style('opacity', 1);
        })
        .on('mousemove', function(event) {
          tooltip.style('left', (event.pageX + 12) + 'px').style('top', (event.pageY - 28) + 'px');
        })
        .on('mouseout', function() {
          d3.select(this).select('rect').transition().duration(120).attr('stroke', i === 0 ? 'var(--color-border)' : 'var(--color-ink)').attr('stroke-width', i === 0 ? 1 : 1.5);
          tooltip.transition().duration(100).style('opacity', 0);
        });
    });
  }

  draw();
  const ro = new ResizeObserver(() => draw());
  ro.observe(document.getElementById('chart'));
</script>
</body>
</html>
