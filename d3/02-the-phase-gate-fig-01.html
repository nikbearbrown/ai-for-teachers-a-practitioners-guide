<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Figure 2.1 — Failed workflow of the opening case</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=EB+Garamond:wght@400;500;700&family=Inter:wght@400;600;700&family=JetBrains+Mono:wght@400&display=swap" rel="stylesheet">
<style>
  :root {
    --color-white: #FFFFFF;
    --color-ink: #121212;
    --color-red: #C8102E;
    --color-secondary: #545454;
    --color-border: #D4D4D4;
    --color-ochre: #C8860E;
  }
  @media (prefers-color-scheme: dark) {
    :root {
      --color-white: #111111;
      --color-ink: #F0EBE3;
      --color-red: #E8243A;
      --color-secondary: #A0978C;
      --color-border: #2E2E2E;
      --color-ochre: #D49A30;
    }
  }
  * { box-sizing: border-box; margin: 0; padding: 0; }
  body { background: var(--color-white); color: var(--color-ink); font-family: 'Inter', sans-serif; padding: 24px; }
  h1 { font-family: 'EB Garamond', Georgia, serif; font-weight: 400; font-size: 28px; margin-bottom: 4px; }
  p.subtitle { color: var(--color-secondary); font-size: 13px; margin-bottom: 24px; }
  #chart { width: 100%; height: 440px; }
  .step-rect { fill: var(--color-white); stroke: var(--color-ink); stroke-width: 1; transition: stroke 200ms cubic-bezier(0.2,0.8,0.2,1); }
  .step-rect:hover { stroke: var(--color-red); cursor: pointer; }
  .ti { font-family: 'EB Garamond', Georgia, serif; font-size: 16px; font-weight: 700; fill: var(--color-ink); }
  .lb { font-family: 'EB Garamond', Georgia, serif; font-size: 13px; fill: var(--color-ink); }
  .sm { font-family: 'EB Garamond', Georgia, serif; font-size: 11px; fill: var(--color-secondary); }
  .badge { font-family: 'Inter', sans-serif; font-size: 12px; font-weight: 700; fill: var(--color-red); }
  .miss { font-family: 'EB Garamond', Georgia, serif; font-size: 13px; font-style: italic; fill: var(--color-red); }
  .cap { font-family: 'EB Garamond', Georgia, serif; font-size: 12px; font-style: italic; fill: var(--color-secondary); }
  .tooltip { position: absolute; pointer-events: none; opacity: 0; background: var(--color-ink); color: var(--color-white); padding: 6px 10px; font-size: 12px; max-width: 260px; }
  @media (prefers-reduced-motion: reduce) { * { transition: none !important; animation: none !important; } }
</style>
</head>
<body>
<h1>Figure 2.1 — A workflow designed to skip an operation</h1>
<p class="subtitle">Five steps from essay upload to delivered feedback. The click happens. The operation does not.</p>
<div id="chart" role="img" aria-labelledby="t-failed d-failed"></div>
<script src="https://cdnjs.cloudflare.com/ajax/libs/d3/7.9.0/d3.min.js"></script>
<script>
const stepData = [
  { id: 'upload', x: 0.04, label1: 'Essay', label2: 'uploaded', sub: '', tip: 'A student essay reaches the grading platform.' },
  { id: 'score',  x: 0.22, label1: 'AI scores', label2: '', sub: 'against the rubric + paragraph feedback', tip: 'The model produces rubric scores and inline comments. Rubric-accurate, pedagogically blind.' },
  { id: 'dash',   x: 0.42, label1: 'Dashboard', label2: '', sub: '120 essays pending approval', tip: 'The work queues for teacher approval. The dashboard reports completion regardless of what the teacher does next.' },
  { id: 'click',  x: 0.62, label1: 'Teacher clicks', label2: '"approve"', sub: '≈ 3 seconds per essay', tip: 'The click is the workflow event. The cognitive operation is not the click.' },
  { id: 'deliver',x: 0.85, label1: 'Feedback to', label2: 'student', sub: '', tip: 'Feedback reaches the student. The dashboard reports 99.4% approved.' }
];

const tooltip = d3.select('body').append('div').attr('class', 'tooltip');
function showTip(e, html) { tooltip.html(html).style('left', (e.pageX+12)+'px').style('top', (e.pageY-28)+'px').transition().duration(150).style('opacity', 1); }
function moveTip(e) { tooltip.style('left', (e.pageX+12)+'px').style('top', (e.pageY-28)+'px'); }
function hideTip() { tooltip.transition().duration(100).style('opacity', 0); }

function draw() {
  d3.select('#chart').selectAll('*').remove();
  const container = document.getElementById('chart');
  const W = container.clientWidth || 760;
  const H = container.clientHeight || 440;
  const svg = d3.select('#chart').append('svg')
    .attr('viewBox', `0 0 ${W} ${H}`).attr('width', W).attr('height', H)
    .attr('role', 'img').attr('aria-labelledby', 't-failed d-failed');
  svg.append('title').attr('id', 't-failed').text('Failed workflow of the opening case');
  svg.append('desc').attr('id', 'd-failed').text('Five-step pipeline with a missing-operation overlay between the dashboard and the click.');

  // Title
  svg.append('text').attr('x', 24).attr('y', 28).attr('class', 'ti').text('A workflow designed to skip an operation');

  // Arrowheads
  const defs = svg.append('defs');
  defs.append('marker').attr('id', 'arBlk').attr('markerWidth', 8).attr('markerHeight', 6)
    .attr('refX', 7).attr('refY', 3).attr('orient', 'auto')
    .append('polygon').attr('points', '0 0, 8 3, 0 6').attr('fill', 'var(--color-ink)');
  defs.append('marker').attr('id', 'arRed').attr('markerWidth', 8).attr('markerHeight', 6)
    .attr('refX', 7).attr('refY', 3).attr('orient', 'auto')
    .append('polygon').attr('points', '0 0, 8 3, 0 6').attr('fill', 'var(--color-red)');

  const yMid = H * 0.48;
  const boxW = Math.min(116, W*0.14);
  const boxH = 64;

  // Step boxes
  stepData.forEach((s, i) => {
    const x = s.x * W;
    const g = svg.append('g').attr('tabindex', 0).attr('role', 'group').attr('aria-label', `${s.label1} ${s.label2}: ${s.tip}`)
      .on('mouseover', (e) => showTip(e, `<strong>${s.label1} ${s.label2}</strong><br>${s.tip}`))
      .on('mousemove', moveTip).on('mouseout', hideTip)
      .on('keydown', (e) => { if (e.key==='Enter'||e.key===' '){ e.preventDefault(); showTip({pageX:x+60,pageY:yMid}, `<strong>${s.label1} ${s.label2}</strong><br>${s.tip}`); }});
    g.append('rect').attr('class', 'step-rect').attr('x', x).attr('y', yMid - boxH/2).attr('width', boxW).attr('height', boxH);
    g.append('text').attr('x', x + boxW/2).attr('y', yMid - 4).attr('text-anchor', 'middle').attr('class', 'lb').text(s.label1);
    if (s.label2) g.append('text').attr('x', x + boxW/2).attr('y', yMid + 12).attr('text-anchor', 'middle').attr('class', 'lb').text(s.label2);
    if (s.sub) g.append('text').attr('x', x + boxW/2).attr('y', yMid + 28).attr('text-anchor', 'middle').attr('class', 'sm').text(s.sub);

    if (i > 0) {
      const prev = stepData[i-1];
      const x1 = prev.x * W + boxW;
      const x2 = x;
      svg.append('line').attr('x1', x1+4).attr('y1', yMid).attr('x2', x2-2).attr('y2', yMid)
        .attr('stroke', 'var(--color-ink)').attr('stroke-width', 1).attr('marker-end', 'url(#arBlk)');
    }
  });

  // 99.4% badge above click
  const clickX = stepData[3].x * W + boxW/2;
  svg.append('text').attr('x', clickX).attr('y', yMid - 90).attr('text-anchor', 'middle').attr('class', 'badge').text('99.4% approved');
  svg.append('text').attr('x', clickX).attr('y', yMid - 74).attr('text-anchor', 'middle').attr('class', 'sm').text('≈ 3 seconds per essay');
  svg.append('line').attr('x1', clickX).attr('y1', yMid - 68).attr('x2', clickX).attr('y2', yMid - boxH/2 - 4)
    .attr('stroke', 'var(--color-red)').attr('stroke-width', 1).attr('marker-end', 'url(#arRed)');

  // Missing operation overlay
  const ovX = (stepData[2].x * W + boxW/2 + stepData[3].x * W + boxW/2)/2 - 100;
  const ovY = yMid + boxH/2 + 30;
  svg.append('rect').attr('x', ovX).attr('y', ovY).attr('width', 200).attr('height', 70)
    .attr('fill', 'var(--color-white)').attr('stroke', 'var(--color-red)').attr('stroke-width', 1.4).attr('stroke-dasharray', '4 4');
  svg.append('text').attr('x', ovX + 100).attr('y', ovY + 22).attr('text-anchor', 'middle').attr('class', 'miss').text('missing operation');
  svg.append('text').attr('x', ovX + 100).attr('y', ovY + 40).attr('text-anchor', 'middle').attr('class', 'sm').text('"Does this comment fit');
  svg.append('text').attr('x', ovX + 100).attr('y', ovY + 56).attr('text-anchor', 'middle').attr('class', 'sm').text('what I know about this student?"');
  svg.append('path').attr('d', `M ${ovX + 30} ${ovY} L ${ovX + 30} ${yMid + boxH/2 + 4}`)
    .attr('fill', 'none').attr('stroke', 'var(--color-red)').attr('stroke-width', 1).attr('stroke-dasharray', '3 3').attr('marker-end', 'url(#arRed)');

  // Three parent calls
  const delivX = stepData[4].x * W + boxW/2;
  svg.append('text').attr('x', delivX).attr('y', ovY + 8).attr('text-anchor', 'middle').attr('class', 'badge').text('3 parent calls');
  svg.append('text').attr('x', delivX).attr('y', ovY + 24).attr('text-anchor', 'middle').attr('class', 'sm').text('same week');
  svg.append('line').attr('x1', delivX).attr('y1', ovY - 2).attr('x2', delivX).attr('y2', yMid + boxH/2 + 4)
    .attr('stroke', 'var(--color-red)').attr('stroke-width', 1).attr('marker-end', 'url(#arRed)');

  // Caption
  svg.append('text').attr('x', W/2).attr('y', H - 14).attr('text-anchor', 'middle').attr('class', 'cap')
    .text('The dashboard records the click. Nobody can tell, from the dashboard, whether the operation happened.');
}

draw();
const ro = new ResizeObserver(() => draw());
ro.observe(document.getElementById('chart'));
</script>
</body>
</html>
