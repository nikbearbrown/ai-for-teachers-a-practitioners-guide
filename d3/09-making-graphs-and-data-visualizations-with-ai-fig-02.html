<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Figure 9.2 — Cairo&apos;s four failure modes</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=EB+Garamond:wght@400;500&family=Inter:wght@400;600;700&family=JetBrains+Mono:wght@400&display=swap" rel="stylesheet">
<style>
  :root {
    --color-white:     #FFFFFF;
    --color-ink:       #121212;
    --color-red:       #C8102E;
    --color-secondary: #545454;
    --color-border:    #D4D4D4;
    --color-ochre:     #C8860E;
  }
  @media (prefers-color-scheme: dark) {
    :root {
      --color-white:     #111111;
      --color-ink:       #F0EBE3;
      --color-red:       #E8243A;
      --color-secondary: #A0978C;
      --color-border:    #2E2E2E;
      --color-ochre:     #D49A30;
    }
  }
  * { box-sizing: border-box; margin: 0; padding: 0; }
  body { background: var(--color-white); color: var(--color-ink); font-family: 'Inter', sans-serif; padding: 24px; }
  h1 { font-family: 'EB Garamond', Georgia, serif; font-weight: 400; font-size: 28px; margin-bottom: 6px; }
  .subtitle { font-family: 'EB Garamond', Georgia, serif; font-style: italic; color: var(--color-secondary); margin-bottom: 20px; }
  #chart { width: 100%; min-height: 520px; }
  .cell-bg { fill: var(--color-white); stroke: var(--color-border); stroke-width: 1; }
  .cell-bg.active { stroke: var(--color-red); stroke-width: 2; }
  .cell-num { font-family: 'EB Garamond', Georgia, serif; font-size: 18px; fill: var(--color-secondary); }
  .cell-title { font-family: 'Inter', sans-serif; font-size: 14px; font-weight: 700; fill: var(--color-ink); }
  .cell-body { font-family: 'Inter', sans-serif; font-size: 12px; fill: var(--color-secondary); }
  .cell-fix { font-family: 'EB Garamond', Georgia, serif; font-style: italic; font-size: 12px; fill: var(--color-ink); }
  .mini-bar { fill: var(--color-red); }
  .mini-bar.alt { fill: var(--color-secondary); }
  .mini-line { stroke: var(--color-red); stroke-width: 1.5; fill: none; }
  .mini-dot { fill: var(--color-red); }
  .mini-axis { stroke: var(--color-secondary); stroke-width: 1; }
  .arrow-path { stroke: var(--color-secondary); stroke-width: 1.2; fill: none; }
  .tooltip { position: absolute; pointer-events: none; opacity: 0; background: var(--color-ink); color: var(--color-white); padding: 6px 10px; border-radius: 4px; font-size: 13px; }
  @media (prefers-reduced-motion: reduce) { * { transition: none !important; animation: none !important; } }
</style>
</head>
<body>
  <h1>Compared with what?</h1>
  <div class="subtitle">Four ways a chart makes a claim with no basis — and the fix for each. Hover a cell to inspect.</div>
  <div id="chart" role="main"></div>
  <script src="https://cdnjs.cloudflare.com/ajax/libs/d3/7.9.0/d3.min.js"></script>
  <script>
    const failureData = [
      { id: 1, row: 0, col: 0, title: '1 — Absolute counts', fails: '“30 proficient in Ms. A’s class, 22 in Mr. B’s.” Class sizes not shown.', fix: 'Fix: rates per class (30/32 vs 22/24).' },
      { id: 2, row: 0, col: 1, title: '2 — Time series without baseline', fails: '“Scores rose 72 to 78 this year.” Prior trajectory not shown.', fix: 'Fix: show enough prior years to see the slope.' },
      { id: 3, row: 1, col: 0, title: '3 — Cross-section without controls', fails: 'AP vs general-track outcomes. Selection into groups ignored.', fix: 'Fix: matched controls, or do not infer.' },
      { id: 4, row: 1, col: 1, title: '4 — Single-value claim', fails: '“76% proficient.” Good or bad? Reader has nothing to compare against.', fix: 'Fix: anchor to state, peer, target, or prior year.' }
    ];

    const tooltip = d3.select('body').append('div').attr('class', 'tooltip');

    function draw() {
      d3.select('#chart').selectAll('*').remove();
      const container = document.getElementById('chart');
      const totalWidth = container.clientWidth || 800;
      const totalHeight = 520;
      const margin = { top: 24, right: 24, bottom: 24, left: 24 };
      const gridW = totalWidth - margin.left - margin.right;
      const gridH = totalHeight - margin.top - margin.bottom;
      const cellGap = 20;
      const cellW = (gridW - cellGap) / 2;
      const cellH = (gridH - cellGap) / 2;

      const svg = d3.select('#chart').append('svg')
        .attr('width', totalWidth).attr('height', totalHeight)
        .attr('role', 'img').attr('aria-labelledby', 'c-title c-desc');
      svg.append('title').attr('id', 'c-title').text('Cairo’s four failure modes');
      svg.append('desc').attr('id', 'c-desc').text('Four cells naming the four ways a chart fails the compared-with-what reference test.');

      const gGrid = svg.append('g').attr('transform', `translate(${margin.left},${margin.top})`);

      const cells = gGrid.selectAll('.cell-group').data(failureData, d => d.id)
        .join('g')
          .attr('class', 'cell-group')
          .attr('transform', d => `translate(${d.col * (cellW + cellGap)},${d.row * (cellH + cellGap)})`);

      cells.append('rect').attr('class', 'cell-bg')
        .attr('width', cellW).attr('height', cellH)
        .attr('tabindex', 0)
        .attr('aria-label', d => `${d.title}: ${d.fails} ${d.fix}`)
        .on('mouseover', function(event, d) {
          d3.select(this).classed('active', true);
          tooltip.html(`<strong>${d.title}</strong><br>${d.fails}<br><em>${d.fix}</em>`)
            .style('left', (event.pageX + 12) + 'px').style('top', (event.pageY - 28) + 'px')
            .transition().duration(150).style('opacity', 1);
        })
        .on('mousemove', (event) => tooltip.style('left', (event.pageX + 12) + 'px').style('top', (event.pageY - 28) + 'px'))
        .on('mouseout', function() {
          d3.select(this).classed('active', false);
          tooltip.transition().duration(100).style('opacity', 0);
        });

      cells.append('text').attr('class', 'cell-title').attr('x', 16).attr('y', 28).text(d => d.title);

      // wrap the fails text in tspans manually
      cells.each(function(d) {
        const g = d3.select(this);
        const words = d.fails.split(' ');
        const lines = [];
        let line = [];
        const maxChars = Math.max(28, Math.floor(cellW / 7));
        words.forEach(w => {
          if ((line.join(' ') + ' ' + w).length > maxChars) { lines.push(line.join(' ')); line = [w]; }
          else line.push(w);
        });
        if (line.length) lines.push(line.join(' '));
        const t = g.append('text').attr('class', 'cell-body').attr('x', 16).attr('y', 50);
        lines.forEach((ln, i) => t.append('tspan').attr('x', 16).attr('dy', i === 0 ? 0 : 16).text(ln));
        g.append('text').attr('class', 'cell-fix').attr('x', 16).attr('y', cellH - 16).text(d.fix);
      });

      // Mini visuals for each cell
      // Cell 1: paired bars - counts vs rates
      const c1 = cells.filter(d => d.id === 1);
      const v1 = c1.append('g').attr('transform', `translate(${cellW / 2 - 100}, 100)`);
      v1.append('rect').attr('class', 'mini-bar alt').attr('x', 0).attr('y', 20).attr('width', 30).attr('height', 60);
      v1.append('rect').attr('class', 'mini-bar alt').attr('x', 40).attr('y', 36).attr('width', 30).attr('height', 44);
      v1.append('text').attr('class', 'cell-body').attr('x', 35).attr('y', 95).attr('text-anchor', 'middle').text('counts');
      v1.append('path').attr('class', 'arrow-path').attr('d', 'M88,50 L118,50');
      v1.append('rect').attr('class', 'mini-bar').attr('x', 130).attr('y', 8).attr('width', 30).attr('height', 72);
      v1.append('rect').attr('class', 'mini-bar').attr('x', 170).attr('y', 10).attr('width', 30).attr('height', 70);
      v1.append('text').attr('class', 'cell-body').attr('x', 165).attr('y', 95).attr('text-anchor', 'middle').text('rates');

      // Cell 2: two-point line vs full trajectory
      const c2 = cells.filter(d => d.id === 2);
      const v2 = c2.append('g').attr('transform', `translate(${cellW / 2 - 100}, 100)`);
      v2.append('path').attr('class', 'mini-line').attr('d', 'M0,60 L60,30');
      v2.append('circle').attr('class', 'mini-dot').attr('cx', 0).attr('cy', 60).attr('r', 3);
      v2.append('circle').attr('class', 'mini-dot').attr('cx', 60).attr('cy', 30).attr('r', 3);
      v2.append('text').attr('class', 'cell-body').attr('x', 30).attr('y', 90).attr('text-anchor', 'middle').text('2 points');
      v2.append('path').attr('class', 'arrow-path').attr('d', 'M78,45 L108,45');
      v2.append('path').attr('class', 'mini-line').attr('d', 'M120,70 L140,58 L160,46 L180,34 L200,22');
      [70, 58, 46, 34, 22].forEach((y, i) => v2.append('circle').attr('class', 'mini-dot').attr('cx', 120 + i * 20).attr('cy', y).attr('r', 2.5));
      v2.append('text').attr('class', 'cell-body').attr('x', 160).attr('y', 90).attr('text-anchor', 'middle').text('5-year trajectory');

      // Cell 3: AP vs general matched controls
      const c3 = cells.filter(d => d.id === 3);
      const v3 = c3.append('g').attr('transform', `translate(${cellW / 2 - 100}, 100)`);
      v3.append('rect').attr('class', 'mini-bar').attr('x', 0).attr('y', 10).attr('width', 30).attr('height', 70);
      v3.append('rect').attr('class', 'mini-bar alt').attr('x', 40).attr('y', 30).attr('width', 30).attr('height', 50);
      v3.append('text').attr('class', 'cell-body').attr('x', 15).attr('y', 95).attr('text-anchor', 'middle').text('AP');
      v3.append('text').attr('class', 'cell-body').attr('x', 55).attr('y', 95).attr('text-anchor', 'middle').text('Gen');
      v3.append('path').attr('class', 'arrow-path').attr('d', 'M88,45 L118,45');
      ['prior GPA', 'attendance', 'demographics', 'counselor'].forEach((t, i) => {
        v3.append('text').attr('class', 'cell-body').attr('x', 130).attr('y', 14 + i * 18).text('• ' + t);
      });

      // Cell 4: single value vs anchored
      const c4 = cells.filter(d => d.id === 4);
      const v4 = c4.append('g').attr('transform', `translate(${cellW / 2 - 100}, 100)`);
      v4.append('text').attr('x', 30).attr('y', 60).attr('text-anchor', 'middle')
        .style('font-family', 'EB Garamond, Georgia, serif').style('font-size', '36px').style('fill', 'var(--color-ink)').text('76%');
      v4.append('path').attr('class', 'arrow-path').attr('d', 'M78,45 L108,45');
      v4.append('line').attr('class', 'mini-axis').attr('x1', 120).attr('y1', 45).attr('x2', 210).attr('y2', 45);
      v4.append('circle').attr('class', 'mini-dot').attr('cx', 165).attr('cy', 45).attr('r', 4);
      v4.append('text').attr('class', 'cell-body').attr('x', 165).attr('y', 32).attr('text-anchor', 'middle').text('us 76');
      v4.append('circle').attr('cx', 132).attr('cy', 45).attr('r', 3).attr('fill', 'var(--color-secondary)');
      v4.append('text').attr('class', 'cell-body').attr('x', 132).attr('y', 62).attr('text-anchor', 'middle').text('state 65');
      v4.append('circle').attr('cx', 198).attr('cy', 45).attr('r', 3).attr('fill', 'var(--color-secondary)');
      v4.append('text').attr('class', 'cell-body').attr('x', 198).attr('y', 62).attr('text-anchor', 'middle').text('target 80');
    }

    draw();
    const ro = new ResizeObserver(() => draw());
    ro.observe(document.getElementById('chart'));
  </script>
</body>
</html>
