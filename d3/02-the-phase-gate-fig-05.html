<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Figure 2.5 — The jagged technological frontier</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=EB+Garamond:wght@400;500;700&family=Inter:wght@400;600;700&family=JetBrains+Mono:wght@400&display=swap" rel="stylesheet">
<style>
  :root { --color-white:#FFFFFF; --color-ink:#121212; --color-red:#C8102E; --color-secondary:#545454; --color-border:#D4D4D4; --color-ochre:#C8860E; }
  @media (prefers-color-scheme: dark) {
    :root { --color-white:#111111; --color-ink:#F0EBE3; --color-red:#E8243A; --color-secondary:#A0978C; --color-border:#2E2E2E; --color-ochre:#D49A30; }
  }
  * { box-sizing: border-box; margin: 0; padding: 0; }
  body { background: var(--color-white); color: var(--color-ink); font-family: 'Inter', sans-serif; padding: 24px; }
  h1 { font-family: 'EB Garamond', Georgia, serif; font-weight: 400; font-size: 28px; margin-bottom: 4px; }
  p.subtitle { color: var(--color-secondary); font-size: 13px; margin-bottom: 24px; }
  #chart { width: 100%; height: 500px; }
  .dot { fill: var(--color-ink); transition: r 200ms cubic-bezier(0.2,0.8,0.2,1); }
  .dot.ambig { fill: var(--color-secondary); stroke: var(--color-ink); stroke-width: 1; }
  .dot.helps { fill: var(--color-red); }
  .dot:hover { r: 8; cursor: pointer; }
  .frontier { fill: none; stroke: var(--color-ink); stroke-width: 1.6; stroke-dasharray: 6 3; }
  .zone-bg-helps { fill: var(--color-white); }
  .zone-bg-hurts { fill: var(--color-border); opacity: 0.18; }
  .axis-title { font-family: 'Inter', sans-serif; font-size: 12px; fill: var(--color-secondary); }
  .lb { font-family: 'EB Garamond', Georgia, serif; font-size: 12px; fill: var(--color-ink); }
  .zone { font-family: 'EB Garamond', Georgia, serif; font-size: 14px; font-style: italic; fill: var(--color-secondary); }
  .cap { font-family: 'EB Garamond', Georgia, serif; font-size: 12px; font-style: italic; fill: var(--color-secondary); }
  .tooltip { position: absolute; pointer-events: none; opacity: 0; background: var(--color-ink); color: var(--color-white); padding: 6px 10px; font-size: 12px; max-width: 240px; }
  @media (prefers-reduced-motion: reduce) { * { transition: none !important; animation: none !important; } }
</style>
</head>
<body>
<h1>Figure 2.5 — The jagged technological frontier</h1>
<p class="subtitle">Dell'Acqua, Mollick et al. (2023): inside the frontier, AI helps. Outside, AI hurts. The line is irregular.</p>
<div id="chart" role="img" aria-labelledby="t-frontier d-frontier"></div>
<script src="https://cdnjs.cloudflare.com/ajax/libs/d3/7.9.0/d3.min.js"></script>
<script>
const tasks = [
  { x: 0.16, y: 0.20, label: 'Reformat a worksheet',          zone: 'helps',  tip: 'Structured input, structured output. Solidly inside.' },
  { x: 0.38, y: 0.16, label: 'Summarize a paper',             zone: 'helps',  tip: 'Public training data dense in this region.' },
  { x: 0.62, y: 0.22, label: 'Generate practice items',       zone: 'helps',  tip: 'Specifiable output. Inside for routine items, near the line for novel formats.' },
  { x: 0.84, y: 0.32, label: 'Translate parent letter (tone)', zone: 'helps',  tip: 'Tone calibration on already-drafted message. Inside.' },
  { x: 0.20, y: 0.78, label: 'Diagnose this student\'s misreading', zone: 'hurts', tip: 'Requires PCK and student knowledge. Outside.' },
  { x: 0.52, y: 0.84, label: 'Choose analogy for this class', zone: 'hurts',  tip: 'Class-specific misconception state. Outside.' },
  { x: 0.78, y: 0.78, label: 'Author IEP accommodation',      zone: 'hurts',  tip: 'Legal and clinical. Outside.' },
  { x: 0.40, y: 0.86, label: 'Resolve contested grade',       zone: 'hurts',  tip: 'Requires teacher judgment about this student. Outside.' },
  { x: 0.30, y: 0.46, label: 'Draft a lab procedure',         zone: 'ambig',  tip: 'Looks similar to a generation task; can sit on either side depending on grade level and equipment specificity.' },
  { x: 0.66, y: 0.52, label: 'Grade a short-answer set',      zone: 'ambig',  tip: 'Rubric-accurate but pedagogically blind — exactly the failure mode of the opening case.' }
];

const tooltip = d3.select('body').append('div').attr('class', 'tooltip');
function showTip(e, html) { tooltip.html(html).style('left', (e.pageX+12)+'px').style('top', (e.pageY-28)+'px').transition().duration(150).style('opacity', 1); }
function moveTip(e) { tooltip.style('left', (e.pageX+12)+'px').style('top', (e.pageY-28)+'px'); }
function hideTip() { tooltip.transition().duration(100).style('opacity', 0); }

function draw() {
  d3.select('#chart').selectAll('*').remove();
  const container = document.getElementById('chart');
  const W = container.clientWidth || 760, H = container.clientHeight || 500;
  const margin = { top: 48, right: 40, bottom: 80, left: 80 };
  const cw = W - margin.left - margin.right;
  const ch = H - margin.top - margin.bottom;

  const svg = d3.select('#chart').append('svg').attr('viewBox', `0 0 ${W} ${H}`).attr('width', W).attr('height', H)
    .attr('role', 'img').attr('aria-labelledby', 't-frontier d-frontier');
  svg.append('title').attr('id', 't-frontier').text('The jagged technological frontier');
  svg.append('desc').attr('id', 'd-frontier').text('Task space with an irregular boundary line. Tasks plotted as dots, four inside the helps zone, four inside the hurts zone, two ambiguous near the boundary.');

  const g = svg.append('g').attr('transform', `translate(${margin.left},${margin.top})`);

  g.append('rect').attr('class', 'zone-bg-helps').attr('width', cw).attr('height', ch).attr('stroke', 'var(--color-ink)').attr('stroke-width', 0.5);

  // Jagged frontier polyline across the plot
  const frontier = [];
  const segs = 12;
  for (let i = 0; i <= segs; i++) {
    const fx = i / segs;
    const fy = 0.42 + 0.10 * Math.sin(i * 1.7) + 0.05 * Math.cos(i * 0.9);
    frontier.push([fx * cw, fy * ch]);
  }
  // Shade below frontier as hurts
  const hurtsPath = ['M 0,' + ch, ...frontier.map(p => 'L ' + p[0] + ',' + p[1]), 'L ' + cw + ',' + ch, 'Z'].join(' ');
  g.append('path').attr('d', hurtsPath).attr('class', 'zone-bg-hurts');

  g.append('path').attr('class', 'frontier').attr('d', d3.line()(frontier));

  // Zone labels
  g.append('text').attr('x', cw * 0.78).attr('y', ch * 0.10).attr('class', 'zone').text('AI helps');
  g.append('text').attr('x', cw * 0.10).attr('y', ch * 0.96).attr('class', 'zone').text('AI hurts');

  // Plot dots
  tasks.forEach(t => {
    const cx = t.x * cw, cy = t.y * ch;
    const dot = g.append('circle').attr('class', `dot ${t.zone}`).attr('cx', cx).attr('cy', cy).attr('r', 5)
      .attr('tabindex', 0).attr('aria-label', `${t.label}: ${t.zone}`)
      .on('mouseover', (e) => showTip(e, `<strong>${t.label}</strong><br>${t.tip}`))
      .on('mousemove', moveTip).on('mouseout', hideTip);
    g.append('text').attr('x', cx + 10).attr('y', cy + 4).attr('class', 'lb').text(t.label);
  });

  // Axes
  g.append('text').attr('x', cw/2).attr('y', ch + 36).attr('text-anchor', 'middle').attr('class', 'axis-title')
    .text('Task structure → (regularity, training data density, well-specified output)');
  g.append('text').attr('x', -ch/2).attr('y', -50).attr('text-anchor', 'middle').attr('transform', 'rotate(-90)').attr('class', 'axis-title')
    .text('AI capability on this task →');

  svg.append('text').attr('x', W/2).attr('y', H - 14).attr('text-anchor', 'middle').attr('class', 'cap')
    .text('The line is not predictable from the task description alone. Without a gate, you cannot tell which side you are on.');
}

draw();
const ro = new ResizeObserver(() => draw());
ro.observe(document.getElementById('chart'));
</script>
</body>
</html>
