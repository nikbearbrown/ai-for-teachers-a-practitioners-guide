<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Figure 14.6 &mdash; Performance-paradox demonstration</title>
<link href="https://fonts.googleapis.com/css2?family=EB+Garamond:ital,wght@0,400;0,500;1,400&display=swap" rel="stylesheet">
<style>
  :root {
    --color-white: #fdfcfb;
    --color-ink: #2a1a0e;
    --color-secondary: #4a4540;
    --color-muted: #8a8480;
    --color-border: #c8c4c0;
    --color-surface: #f5f2ee;
  }
  @media (prefers-color-scheme: dark) {
    :root {
      --color-white: #1a1410;
      --color-ink: #f5f2ee;
      --color-secondary: #c8c4c0;
      --color-muted: #8a8480;
      --color-border: #4a4540;
      --color-surface: #2a1a0e;
    }
  }
  * { box-sizing: border-box; margin: 0; padding: 0; }
  body { background: var(--color-white); color: var(--color-ink); font-family: 'EB Garamond', Garamond, Georgia, serif; padding: 24px; }
  h1 { font-weight: 400; font-size: 26px; margin-bottom: 4px; }
  p.subtitle { color: var(--color-secondary); font-style: italic; font-size: 15px; margin-bottom: 20px; }
  #chart { width: 100%; min-height: 520px; }
  .phase-box { fill: var(--color-surface); stroke: var(--color-secondary); stroke-width: 1; }
  .phase-box.focus { stroke: var(--color-ink); stroke-width: 1.5; }
  .phase-title { fill: var(--color-ink); font-size: 14px; }
  .phase-time { fill: var(--color-muted); font-style: italic; font-size: 11px; }
  .phase-body { fill: var(--color-ink); font-size: 12px; }
  .phase-note { fill: var(--color-secondary); font-style: italic; font-size: 11px; }
  .timeline { stroke: var(--color-secondary); }
  .dot { fill: var(--color-ink); }
  .arrow { stroke: var(--color-ink); }
  .out-frame { fill: var(--color-white); stroke: var(--color-secondary); stroke-width: 1; }
  .out-title { fill: var(--color-ink); font-style: italic; font-size: 13px; }
  .out-key { fill: var(--color-ink); font-size: 13px; }
  .out-val { fill: var(--color-secondary); font-size: 13px; }
  .caption { font-style: italic; fill: var(--color-muted); font-size: 12px; }
  .tooltip { position: absolute; pointer-events: none; opacity: 0; background: var(--color-ink); color: var(--color-white); padding: 6px 10px; font-size: 13px; font-family: 'EB Garamond', Garamond, Georgia, serif; transition: opacity 150ms; }
  @media (prefers-reduced-motion: reduce) { * { transition: none !important; animation: none !important; } }
</style>
</head>
<body>
<h1>Figure 14.6 &mdash; Run the Bastani study on yourselves.</h1>
<p class="subtitle">One class period. Two problem sets. The numbers do the teaching.</p>
<div id="chart" role="main"></div>
<script src="https://cdnjs.cloudflare.com/ajax/libs/d3/7.9.0/d3.min.js"></script>
<script>
  const phases = [
    { id: 'p1', title: '1. Frame honestly', time: '5 min', body: ['Tell the class', 'the design.'], note: ['No deception. No grade.', 'Students are the subjects.'], focus: false },
    { id: 'p2', title: '2. Set A — AI on', time: '30 min', body: ['6–8 problems.', 'Full AI access.'], note: ['Any tool, any way.', 'Confidence rating after.'], focus: false },
    { id: 'p3', title: '3. Set B — AI off', time: '15 min', body: ['Same concept.', 'Different surface.'], note: ['No AI. No notes.', 'No phones.'], focus: true },
    { id: 'p4', title: '4. Reflect', time: '10 min', body: ['Hand back', 'both scores.'], note: ['What do these', 'three numbers tell you?'], focus: false }
  ];

  const outcomes = [
    { key: 'large gap, high confidence', val: '→ fluency was the AI’s. Borrowing.' },
    { key: 'small gap, matched scores',   val: '→ capability was being built. Building.' },
    { key: 'low scores on both',          val: '→ the concept needs more work, not the AI.' }
  ];

  const tooltip = d3.select('body').append('div').attr('class', 'tooltip');

  function draw() {
    d3.select('#chart').selectAll('*').remove();
    const W = document.getElementById('chart').clientWidth || 700;
    const H = 520;

    const svg = d3.select('#chart').append('svg')
      .attr('viewBox', `0 0 ${W} ${H}`)
      .attr('role', 'img')
      .attr('aria-labelledby', 'ct cd');
    svg.append('title').attr('id', 'ct').text('Performance-paradox demonstration: a single class period');
    svg.append('desc').attr('id', 'cd').text('Four phases laid out on a horizontal timeline, followed by a diagnostic panel that reads the resulting score gap.');

    svg.append('defs').html(`
      <marker id="ar6" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse">
        <path d="M0,0 L10,5 L0,10 z" fill="var(--color-ink)"/>
      </marker>
    `);

    const padX = 50;
    const usable = W - padX * 2;
    const boxW = Math.min(140, usable / 4 - 20);
    const step = (usable - boxW) / (phases.length - 1);

    // timeline
    svg.append('line').attr('class', 'timeline')
      .attr('x1', padX).attr('y1', 90)
      .attr('x2', padX + usable).attr('y2', 90);

    phases.forEach((p, i) => {
      const cx = padX + i * step + boxW / 2;
      const bx = cx - boxW / 2;

      svg.append('circle').attr('class', 'dot').attr('cx', cx).attr('cy', 90).attr('r', 6);
      svg.append('text').attr('class', 'phase-time').attr('x', cx).attr('y', 76).attr('text-anchor', 'middle').text(p.time);
      svg.append('text').attr('class', 'phase-title').attr('x', cx).attr('y', 120).attr('text-anchor', 'middle').text(p.title);

      const grp = svg.append('g').attr('tabindex', 0)
        .attr('aria-label', `${p.title}: ${p.body.join(' ')} ${p.note.join(' ')}`)
        .on('mouseover', (event) => {
          tooltip.html(`<strong>${p.title}</strong><br>${p.time}<br>${p.body.join(' ')}`)
            .style('left', (event.pageX + 12) + 'px').style('top', (event.pageY - 28) + 'px')
            .transition().duration(150).style('opacity', 1);
        })
        .on('mousemove', (event) => tooltip.style('left', (event.pageX + 12) + 'px').style('top', (event.pageY - 28) + 'px'))
        .on('mouseout', () => tooltip.transition().duration(100).style('opacity', 0));

      grp.append('rect').attr('class', p.focus ? 'phase-box focus' : 'phase-box')
        .attr('x', bx).attr('y', 140).attr('width', boxW).attr('height', 140);

      p.body.forEach((ln, k) => {
        grp.append('text').attr('class', 'phase-body')
          .attr('x', cx).attr('y', 162 + k * 16).attr('text-anchor', 'middle').text(ln);
      });
      p.note.forEach((ln, k) => {
        grp.append('text').attr('class', 'phase-note')
          .attr('x', cx).attr('y', 218 + k * 14).attr('text-anchor', 'middle').text(ln);
      });

      if (i < phases.length - 1) {
        const nextCx = padX + (i + 1) * step + boxW / 2;
        svg.append('line').attr('class', 'arrow')
          .attr('x1', bx + boxW + 4).attr('y1', 210)
          .attr('x2', nextCx - boxW / 2 - 8).attr('y2', 210)
          .attr('marker-end', 'url(#ar6)');
      }
    });

    // outcomes
    svg.append('rect').attr('class', 'out-frame')
      .attr('x', padX).attr('y', 320).attr('width', W - padX * 2).attr('height', 150);
    svg.append('text').attr('class', 'out-title').attr('x', padX + 16).attr('y', 344)
      .text('What the gap means — diagnostic, not verdict.');
    svg.append('line').attr('x1', padX).attr('x2', W - padX).attr('y1', 352).attr('y2', 352)
      .attr('stroke', 'var(--color-border)');

    outcomes.forEach((o, i) => {
      const y = 376 + i * 26;
      svg.append('text').attr('class', 'out-key').attr('x', padX + 16).attr('y', y).text(o.key);
      svg.append('text').attr('class', 'out-val').attr('x', padX + 260).attr('y', y).text(o.val);
    });

    svg.append('text').attr('class', 'caption').attr('x', W / 2).attr('y', H - 2).attr('text-anchor', 'middle')
      .text('Figure 14.6 — one period, one concept; produces a personal data point, not a proof.');
  }

  draw();
  const ro = new ResizeObserver(() => draw());
  ro.observe(document.getElementById('chart'));
</script>
</body>
</html>
