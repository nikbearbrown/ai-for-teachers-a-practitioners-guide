<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>What the Lexile formula measures, and what it does not</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=EB+Garamond:ital,wght@0,400;0,600;0,700;1,400&family=Inter:wght@400;600;700&family=JetBrains+Mono:wght@400&display=swap" rel="stylesheet">
  <style>
    :root {
      --color-white:     #FFFFFF;
      --color-ink:       #121212;
      --color-red:       #C8102E;
      --color-secondary: #545454;
      --color-border:    #D4D4D4;
      --color-ochre:     #C8860E;
    }
    @media (prefers-color-scheme: dark) {
      :root {
        --color-white:     #111111;
        --color-ink:       #F0EBE3;
        --color-red:       #E8243A;
        --color-secondary: #A0978C;
        --color-border:    #2E2E2E;
        --color-ochre:     #D49A30;
      }
    }
    * { box-sizing: border-box; margin: 0; padding: 0; }
    body {
      background: var(--color-white);
      color: var(--color-ink);
      font-family: 'EB Garamond', Georgia, serif;
      padding: 24px;
    }
    h1 {
      font-family: 'EB Garamond', Georgia, serif;
      font-weight: 700;
      font-size: 26px;
      margin-bottom: 4px;
    }
    .subtitle {
      font-family: 'EB Garamond', Georgia, serif;
      font-size: 14px;
      color: var(--color-secondary);
      margin-bottom: 20px;
      max-width: 80ch;
    }
    #chart { width: 100%; max-width: 920px; }
    .node-title {
      font-family: 'EB Garamond', Georgia, serif;
      font-size: 14px;
      font-weight: 700;
      fill: var(--color-ink);
      pointer-events: none;
    }
    .node-sub {
      font-family: 'EB Garamond', Georgia, serif;
      font-size: 12px;
      fill: var(--color-secondary);
      pointer-events: none;
    }
    .node-cap {
      font-family: 'EB Garamond', Georgia, serif;
      font-size: 11px;
      font-style: italic;
      fill: var(--color-secondary);
    }
    .formula-label {
      font-family: 'EB Garamond', Georgia, serif;
      font-size: 14px;
      font-weight: 700;
      fill: var(--color-white);
      pointer-events: none;
    }
    .formula-sub {
      font-family: 'EB Garamond', Georgia, serif;
      font-size: 12px;
      fill: var(--color-border);
      pointer-events: none;
    }
    .callout-title {
      font-family: 'EB Garamond', Georgia, serif;
      font-size: 14px;
      font-weight: 700;
      fill: var(--color-ink);
      pointer-events: none;
    }
    .callout-item {
      font-family: 'EB Garamond', Georgia, serif;
      font-size: 13px;
      fill: var(--color-ink);
    }
    .arrow-path { stroke: var(--color-ink); stroke-width: 1.2; fill: none; }
    .footer-line {
      font-family: 'EB Garamond', Georgia, serif;
      font-style: italic;
      font-size: 12px;
      fill: var(--color-secondary);
    }
    .tooltip {
      position: absolute;
      pointer-events: none;
      opacity: 0;
      background: var(--color-ink);
      color: var(--color-white);
      padding: 8px 12px;
      font-size: 13px;
      font-family: 'EB Garamond', Georgia, serif;
      max-width: 280px;
      line-height: 1.4;
      transition: opacity 150ms;
      border: 1px solid var(--color-ink);
    }
    @media (prefers-reduced-motion: reduce) {
      * { transition: none !important; animation: none !important; }
    }
  </style>
</head>
<body>
  <h1>What the Lexile formula measures &amp; what it does not</h1>
  <p class="subtitle">Two surface statistics in. One number out. The judgment lives in the callout.</p>
  <div id="chart" role="img" aria-label="A flow diagram of the Lexile formula and what it does not measure."></div>
  <script src="https://cdnjs.cloudflare.com/ajax/libs/d3/7.9.0/d3.min.js"></script>
  <script>
    const inputs = [
      {
        id: 'sentence',
        title: 'Average sentence length',
        sub: 'words per sentence — longer raises the score',
        tip: 'Counts the average number of words per sentence in the passage. Longer sentences raise the Lexile number, shorter sentences lower it.'
      },
      {
        id: 'word',
        title: 'Average word frequency',
        sub: 'how common the words are — rarer raises the score',
        tip: 'Looks each word up in a frequency table built from a large corpus. Rarer words raise the Lexile, more common words lower it.'
      }
    ];

    const notMeasured = [
      { id: 'inf',  text: 'inferential demand',     tip: 'Whether the reader has to draw a conclusion the text does not state. Invisible to a sentence-length count.' },
      { id: 'prio', text: 'prior knowledge load',   tip: 'How much the reader must already know to make sense of the passage. Vocabulary tables do not capture this.' },
      { id: 'caus', text: 'causal structure',       tip: 'Whether the argument hangs together as cause-and-effect after simplification. The formula does not track this.' },
      { id: 'abs',  text: 'abstractness of ideas',  tip: 'Whether the ideas are concrete or abstract. Two passages with identical word frequency can differ wildly here.' }
    ];

    const tooltip = d3.select('body').append('div').attr('class', 'tooltip');
    function showTip(event, html) {
      tooltip.html(html)
        .style('left', (event.pageX + 14) + 'px')
        .style('top',  (event.pageY - 24) + 'px')
        .transition().duration(150).style('opacity', 1);
    }
    function moveTip(event) {
      tooltip.style('left', (event.pageX + 14) + 'px')
             .style('top',  (event.pageY - 24) + 'px');
    }
    function hideTip() {
      tooltip.transition().duration(100).style('opacity', 0);
    }

    function draw() {
      d3.select('#chart').selectAll('*').remove();
      const container = document.getElementById('chart');
      const totalWidth  = Math.max(600, container.clientWidth || 900);
      const totalHeight = 460;

      const svg = d3.select('#chart').append('svg')
        .attr('width',  totalWidth)
        .attr('height', totalHeight)
        .attr('viewBox', `0 0 ${totalWidth} ${totalHeight}`)
        .attr('role', 'img')
        .attr('aria-labelledby', 'fig-title fig-desc');

      svg.append('title').attr('id', 'fig-title')
         .text('What the Lexile formula measures, and what it does not');
      svg.append('desc').attr('id', 'fig-desc')
         .text('Two input boxes feed into a formula box that outputs a Lexile score; a callout lists what the formula does not measure.');

      // Arrow marker
      const defs = svg.append('defs');
      defs.append('marker')
        .attr('id', 'arrow-ink')
        .attr('markerWidth', 9).attr('markerHeight', 7)
        .attr('refX', 8).attr('refY', 3.5).attr('orient', 'auto')
        .append('polygon').attr('points', '0 0, 9 3.5, 0 7')
        .attr('fill', 'var(--color-ink)');

      const tileW = 200, tileH = 76;
      const inputX = 30;
      const formulaX = totalWidth * 0.46 - 70;
      const formulaY = 150;
      const formulaW = 150, formulaH = 70;
      const calloutX = totalWidth - 240;
      const calloutY = 80;
      const calloutW = 220, calloutH = 230;

      // INPUT TILES
      const inputGroup = svg.append('g').attr('class', 'g-inputs');
      inputs.forEach((d, i) => {
        const y = 100 + i * 110;
        const g = inputGroup.append('g')
          .attr('tabindex', 0)
          .attr('aria-label', `Input: ${d.title}. ${d.sub}`)
          .style('cursor', 'pointer');

        g.append('rect')
          .attr('x', inputX).attr('y', y)
          .attr('width', tileW).attr('height', tileH)
          .attr('fill', 'var(--color-white)')
          .attr('stroke', 'var(--color-ink)')
          .attr('stroke-width', 1);

        g.append('text')
          .attr('class', 'node-title')
          .attr('x', inputX + tileW / 2).attr('y', y + 28)
          .attr('text-anchor', 'middle')
          .text(d.title);

        g.append('text')
          .attr('class', 'node-sub')
          .attr('x', inputX + tileW / 2).attr('y', y + 50)
          .attr('text-anchor', 'middle')
          .text(d.sub);

        g.on('mouseover', (event) => showTip(event, `<strong>${d.title}</strong><br/>${d.tip}`))
         .on('mousemove', moveTip)
         .on('mouseout', hideTip)
         .on('focus', function(event) {
            const r = this.getBoundingClientRect();
            showTip({ pageX: r.right + window.scrollX, pageY: r.top + window.scrollY }, `<strong>${d.title}</strong><br/>${d.tip}`);
         })
         .on('blur', hideTip);

        // arrow to formula
        const startX = inputX + tileW;
        const startY = y + tileH / 2;
        const endX   = formulaX;
        const endY   = formulaY + formulaH / 2;
        svg.append('path')
          .attr('class', 'arrow-path')
          .attr('d', `M ${startX} ${startY} L ${endX} ${endY}`)
          .attr('marker-end', 'url(#arrow-ink)')
          .attr('aria-hidden', 'true');
      });

      // FORMULA BOX
      const formulaG = svg.append('g')
        .attr('tabindex', 0)
        .attr('aria-label', 'Output: Lexile score, a single number.');
      formulaG.append('rect')
        .attr('x', formulaX).attr('y', formulaY)
        .attr('width', formulaW).attr('height', formulaH)
        .attr('fill', 'var(--color-ink)');
      formulaG.append('text')
        .attr('class', 'formula-label')
        .attr('x', formulaX + formulaW / 2).attr('y', formulaY + 30)
        .attr('text-anchor', 'middle')
        .text('Lexile score');
      formulaG.append('text')
        .attr('class', 'formula-sub')
        .attr('x', formulaX + formulaW / 2).attr('y', formulaY + 50)
        .attr('text-anchor', 'middle')
        .text('a single number');

      formulaG.on('mouseover', (event) => showTip(event, '<strong>Lexile score</strong><br/>What the formula returns. A single number, easy to read — and easy to mistake for a measurement of difficulty rather than a regression on two surface statistics.'))
              .on('mousemove', moveTip)
              .on('mouseout', hideTip);

      // arrow formula -> callout
      svg.append('path')
        .attr('class', 'arrow-path')
        .attr('d', `M ${formulaX + formulaW} ${formulaY + formulaH/2} L ${calloutX - 6} ${formulaY + formulaH/2}`)
        .attr('marker-end', 'url(#arrow-ink)')
        .attr('aria-hidden', 'true');

      // CALLOUT
      const callG = svg.append('g').attr('class', 'g-callout');
      callG.append('rect')
        .attr('x', calloutX).attr('y', calloutY)
        .attr('width', calloutW).attr('height', calloutH)
        .attr('fill', 'var(--color-white)')
        .attr('stroke', 'var(--color-ink)')
        .attr('stroke-width', 1.4);
      callG.append('rect')
        .attr('x', calloutX).attr('y', calloutY)
        .attr('width', 4).attr('height', calloutH)
        .attr('fill', 'var(--color-ink)');

      callG.append('text')
        .attr('class', 'callout-title')
        .attr('x', calloutX + 16).attr('y', calloutY + 24)
        .text('Does NOT measure');

      callG.append('line')
        .attr('x1', calloutX + 16).attr('x2', calloutX + calloutW - 16)
        .attr('y1', calloutY + 36).attr('y2', calloutY + 36)
        .attr('stroke', 'var(--color-border)').attr('stroke-width', 0.8);

      notMeasured.forEach((d, i) => {
        const y = calloutY + 64 + i * 32;
        const t = callG.append('text')
          .attr('class', 'callout-item')
          .attr('x', calloutX + 16).attr('y', y)
          .attr('tabindex', 0)
          .attr('aria-label', `Does not measure: ${d.text}`)
          .text('— ' + d.text)
          .style('cursor', 'pointer');
        t.on('mouseover', (event) => showTip(event, `<strong>${d.text}</strong><br/>${d.tip}`))
         .on('mousemove', moveTip)
         .on('mouseout', hideTip);
      });

      // footer
      svg.append('line')
        .attr('x1', 30).attr('x2', totalWidth - 30)
        .attr('y1', totalHeight - 60).attr('y2', totalHeight - 60)
        .attr('stroke', 'var(--color-border)').attr('stroke-width', 0.8)
        .attr('aria-hidden', 'true');

      svg.append('text')
        .attr('class', 'footer-line')
        .attr('x', totalWidth / 2).attr('y', totalHeight - 36)
        .attr('text-anchor', 'middle')
        .text('The formula is what the AI optimizes for.');
      svg.append('text')
        .attr('class', 'footer-line')
        .attr('x', totalWidth / 2).attr('y', totalHeight - 18)
        .attr('text-anchor', 'middle')
        .text('The callout is what stays invisible until you ask.');
    }

    draw();
    const ro = new ResizeObserver(() => draw());
    ro.observe(document.getElementById('chart'));
  </script>
</body>
</html>
