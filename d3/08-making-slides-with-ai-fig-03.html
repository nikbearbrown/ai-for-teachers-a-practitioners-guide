<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Figure 8.3 — The five-question slide diagnostic</title>
<style>
  :root {
    --color-white:     #FFFFFF;
    --color-ink:       #121212;
    --color-red:       #C8102E;
    --color-secondary: #545454;
    --color-border:    #D4D4D4;
    --color-ochre:     #C8860E;
  }
  @media (prefers-color-scheme: dark) {
    :root {
      --color-white:     #111111;
      --color-ink:       #F0EBE3;
      --color-red:       #E8243A;
      --color-secondary: #A0978C;
      --color-border:    #2E2E2E;
      --color-ochre:     #D49A30;
    }
  }
  * { box-sizing: border-box; margin: 0; padding: 0; }
  body {
    background: var(--color-white); color: var(--color-ink);
    font-family: 'EB Garamond', Garamond, Georgia, serif;
    padding: 24px;
  }
  #chart { width: 100%; height: 520px; }
  .eyebrow { font-family: 'EB Garamond', Georgia, serif; font-size: 11px; letter-spacing: 2px; fill: var(--color-secondary); }
  .title   { font-family: 'EB Garamond', Georgia, serif; font-size: 28px; fill: var(--color-ink); }
  .num     { font-family: 'EB Garamond', Georgia, serif; font-size: 14px; fill: var(--color-secondary); }
  .q-text  { font-family: 'EB Garamond', Georgia, serif; font-size: 16px; fill: var(--color-ink); }
  .q-fix   { font-family: 'EB Garamond', Georgia, serif; font-size: 12px; font-style: italic; fill: var(--color-secondary); }
  .footer  { font-family: 'EB Garamond', Georgia, serif; font-size: 12px; fill: var(--color-secondary); }
  .tooltip {
    position: absolute; pointer-events: none; opacity: 0;
    background: var(--color-white); color: var(--color-ink);
    border: 1px solid var(--color-border); padding: 6px 10px;
    font-family: 'EB Garamond', Georgia, serif; font-size: 13px;
  }
  @media (prefers-reduced-motion: reduce) { * { transition: none !important; animation: none !important; } }
</style>
</head>
<body>
<div id="chart" role="main"></div>
<script src="https://cdnjs.cloudflare.com/ajax/libs/d3/7.9.0/d3.min.js"></script>
<script>
  const FALLBACK_DATA = [
    { n: 1, q: 'Is the headline a claim or a topic label?',          fix: 'If label, rewrite as an assertion the evidence supports.' },
    { n: 2, q: 'Would this slide teach without a speaker?',          fix: 'If yes, move prose to the notes field; sparsen the body.' },
    { n: 3, q: 'Is there a sentence you are about to say aloud?',    fix: 'Redundancy collision — move it to the notes field.' },
    { n: 4, q: 'Does the visual form match the content structure?',  fix: 'List, comparison, process, distribution — rebuild if mismatched.' },
    { n: 5, q: 'Is every color encoding something?',                 fix: 'Count categories; count colors. Cut the excess.' }
  ];

  function draw() {
    d3.select('#chart').selectAll('*').remove();
    const container = document.getElementById('chart');
    const totalWidth  = container.clientWidth  || 700;
    const totalHeight = 520;

    const svg = d3.select('#chart').append('svg')
      .attr('width', totalWidth).attr('height', totalHeight)
      .attr('viewBox', `0 0 ${totalWidth} ${totalHeight}`)
      .attr('role', 'img')
      .attr('aria-labelledby', 'f3-t f3-d');
    svg.append('title').attr('id', 'f3-t').text('The five-question slide diagnostic');
    svg.append('desc').attr('id', 'f3-d').text('A printable card listing five numbered questions, each with the corrective action beneath.');

    // Card frame
    svg.append('rect')
      .attr('x', 50).attr('y', 40).attr('width', totalWidth - 100).attr('height', totalHeight - 80)
      .attr('fill', 'var(--color-white)').attr('stroke', 'var(--color-ink)').attr('stroke-width', 1.5);

    svg.append('text').attr('class', 'eyebrow').attr('x', 80).attr('y', 78).text('SLIDE DECK PASS');
    svg.append('text').attr('class', 'title').attr('x', 80).attr('y', 116).text('The five-question diagnostic');
    svg.append('line').attr('x1', 80).attr('y1', 132).attr('x2', 200).attr('y2', 132).attr('stroke', 'var(--color-ink)').attr('stroke-width', 1.5);

    const tooltip = d3.select('body').append('div').attr('class', 'tooltip');

    const gQs = svg.selectAll('.q-row')
      .data(FALLBACK_DATA)
      .join('g')
        .attr('class', 'q-row')
        .attr('transform', (d, i) => `translate(80, ${168 + i * 56})`)
        .attr('tabindex', 0)
        .attr('aria-label', d => `Question ${d.n}: ${d.q}. ${d.fix}`);

    gQs.append('text').attr('class', 'num').attr('x', 0).attr('y', 0).text(d => d.n);
    gQs.append('text').attr('class', 'q-text').attr('x', 26).attr('y', 0).text(d => d.q);
    gQs.append('text').attr('class', 'q-fix').attr('x', 26).attr('y', 20).text(d => d.fix);

    svg.append('line').attr('x1', 80).attr('y1', totalHeight - 84).attr('x2', totalWidth - 80).attr('y2', totalHeight - 84).attr('stroke', 'var(--color-border)');
    svg.append('text').attr('class', 'footer').attr('x', 80).attr('y', totalHeight - 64).text('Thirty seconds per slide. Five minutes for a ten-slide deck.');

    gQs
      .on('mouseover', function(event, d) {
        d3.select(this).select('.q-text').transition().duration(120).attr('fill', 'var(--color-red)');
        tooltip.html(`<strong>Q${d.n}.</strong> ${d.q}<br/><em>${d.fix}</em>`)
          .style('left', (event.pageX + 12) + 'px').style('top', (event.pageY - 28) + 'px')
          .transition().duration(150).style('opacity', 1);
      })
      .on('mousemove', function(event) {
        tooltip.style('left', (event.pageX + 12) + 'px').style('top', (event.pageY - 28) + 'px');
      })
      .on('mouseout', function() {
        d3.select(this).select('.q-text').transition().duration(120).attr('fill', 'var(--color-ink)');
        tooltip.transition().duration(100).style('opacity', 0);
      });
  }

  draw();
  const ro = new ResizeObserver(() => draw());
  ro.observe(document.getElementById('chart'));
</script>
</body>
</html>
