<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Figure 14.2 &mdash; Practice gain vs exam outcome (Bastani 2025)</title>
<link href="https://fonts.googleapis.com/css2?family=EB+Garamond:ital,wght@0,400;0,500;1,400&display=swap" rel="stylesheet">
<style>
  :root {
    --color-white: #fdfcfb;
    --color-ink: #2a1a0e;
    --color-secondary: #4a4540;
    --color-muted: #8a8480;
    --color-border: #c8c4c0;
    --color-surface: #f5f2ee;
  }
  @media (prefers-color-scheme: dark) {
    :root {
      --color-white: #1a1410;
      --color-ink: #f5f2ee;
      --color-secondary: #c8c4c0;
      --color-muted: #8a8480;
      --color-border: #4a4540;
      --color-surface: #2a1a0e;
    }
  }
  * { box-sizing: border-box; margin: 0; padding: 0; }
  body { background: var(--color-white); color: var(--color-ink); font-family: 'EB Garamond', Garamond, Georgia, serif; padding: 24px; }
  h1 { font-weight: 400; font-size: 26px; margin-bottom: 4px; }
  p.subtitle { color: var(--color-secondary); font-style: italic; font-size: 15px; margin-bottom: 20px; }
  #chart { width: 100%; min-height: 500px; }
  .bar-practice { fill: var(--color-secondary); stroke: var(--color-ink); stroke-width: 1; }
  .bar-exam { fill: var(--color-muted); stroke: var(--color-ink); stroke-width: 1; }
  .bar-baseline { fill: var(--color-border); stroke: var(--color-secondary); stroke-width: 1; }
  .axis path, .axis line { stroke: var(--color-secondary); }
  .axis text { font-family: 'EB Garamond', Garamond, Georgia, serif; fill: var(--color-secondary); font-size: 12px; }
  .ref-line { stroke: var(--color-muted); stroke-dasharray: 3 4; }
  .ann { font-style: italic; fill: var(--color-ink); font-size: 13px; }
  .caption { font-style: italic; fill: var(--color-muted); font-size: 12px; }
  .tooltip { position: absolute; pointer-events: none; opacity: 0; background: var(--color-ink); color: var(--color-white); padding: 6px 10px; font-size: 13px; font-family: 'EB Garamond', Garamond, Georgia, serif; transition: opacity 150ms; }
  @media (prefers-reduced-motion: reduce) { * { transition: none !important; animation: none !important; } }
</style>
</head>
<body>
<h1>Figure 14.2 &mdash; Practice scores rose. Exam scores told a different story.</h1>
<p class="subtitle">Bastani et al., PNAS 2025 &mdash; high-school mathematics, three conditions, ~1,000 students.</p>
<div id="chart" role="main"></div>
<script src="https://cdnjs.cloudflare.com/ajax/libs/d3/7.9.0/d3.min.js"></script>
<script>
  const groups = [
    { id: 'no-ai',  label: 'No AI',              note: 'control',        practice: 100, exam: 100 },
    { id: 'uncon',  label: 'Unconstrained AI',   note: 'ask it anything', practice: 135, exam: 83  },
    { id: 'tutor',  label: 'Tutor-prompted AI',  note: 'hints, not answers', practice: 108, exam: 102 }
  ];

  const tooltip = d3.select('body').append('div').attr('class', 'tooltip');

  function draw() {
    d3.select('#chart').selectAll('*').remove();
    const W = document.getElementById('chart').clientWidth || 700;
    const H = 500;
    const margin = { top: 48, right: 60, bottom: 80, left: 80 };
    const cw = W - margin.left - margin.right;
    const ch = H - margin.top - margin.bottom;

    const svg = d3.select('#chart').append('svg')
      .attr('viewBox', `0 0 ${W} ${H}`)
      .attr('role', 'img')
      .attr('aria-labelledby', 'ct cd');
    svg.append('title').attr('id', 'ct').text('Bastani et al. 2025 — practice and exam scores by condition');
    svg.append('desc').attr('id', 'cd').text('Paired bars per condition: unconstrained AI shows large practice gain and large exam drop; tutor-prompted AI lands near the no-AI control on both.');

    svg.append('defs').html(`
      <marker id="ar2" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse">
        <path d="M0,0 L10,5 L0,10 z" fill="var(--color-secondary)"/>
      </marker>
    `);

    const g = svg.append('g').attr('transform', `translate(${margin.left},${margin.top})`);

    const xOuter = d3.scaleBand().domain(groups.map(d => d.id)).range([0, cw]).padding(0.25);
    const xInner = d3.scaleBand().domain(['practice', 'exam']).range([0, xOuter.bandwidth()]).padding(0.15);
    const y = d3.scaleLinear().domain([70, 145]).range([ch, 0]);

    g.append('g').attr('class', 'axis')
      .call(d3.axisLeft(y).ticks(6))
      .append('text').attr('transform', 'rotate(-90)').attr('x', -ch / 2).attr('y', -55)
      .attr('text-anchor', 'middle').attr('fill', 'var(--color-secondary)').style('font-style', 'italic')
      .text('score, control = 100');

    g.append('line').attr('class', 'ref-line')
      .attr('x1', 0).attr('x2', cw).attr('y1', y(100)).attr('y2', y(100));
    g.append('text').attr('class', 'caption')
      .attr('x', cw - 4).attr('y', y(100) - 6).attr('text-anchor', 'end').text('control baseline');

    const gp = g.selectAll('.group').data(groups, d => d.id).join('g')
      .attr('class', 'group')
      .attr('transform', d => `translate(${xOuter(d.id)},0)`);

    function bar(klass, key) {
      gp.append('rect').attr('class', klass)
        .attr('x', xInner(key === 'practice' ? 'practice' : 'exam'))
        .attr('y', d => d[key] >= 100 ? y(d[key]) : y(100))
        .attr('width', xInner.bandwidth())
        .attr('height', d => Math.abs(y(d[key]) - y(100)) || 1)
        .attr('tabindex', 0)
        .attr('aria-label', d => `${d.label}: ${key} ${d[key]}`)
        .on('mouseover', (event, d) => {
          tooltip.html(`<strong>${d.label}</strong><br>${key}: ${d[key]}`)
            .style('left', (event.pageX + 12) + 'px').style('top', (event.pageY - 28) + 'px')
            .transition().duration(150).style('opacity', 1);
        })
        .on('mousemove', (event) => {
          tooltip.style('left', (event.pageX + 12) + 'px').style('top', (event.pageY - 28) + 'px');
        })
        .on('mouseout', () => tooltip.transition().duration(100).style('opacity', 0));
    }
    bar('bar-practice', 'practice');
    bar('bar-exam', 'exam');

    // value labels
    gp.append('text').attr('x', xInner('practice') + xInner.bandwidth() / 2)
      .attr('y', d => (d.practice >= 100 ? y(d.practice) - 6 : y(100) + 14))
      .attr('text-anchor', 'middle').style('font-size', '12px').attr('fill', 'var(--color-ink)')
      .text(d => (d.practice - 100 >= 0 ? '+ ' : '− ') + Math.abs(d.practice - 100));
    gp.append('text').attr('x', xInner('exam') + xInner.bandwidth() / 2)
      .attr('y', d => (d.exam >= 100 ? y(d.exam) - 6 : y(d.exam) + 14))
      .attr('text-anchor', 'middle').style('font-size', '12px')
      .attr('fill', d => d.exam < 100 ? 'var(--color-white)' : 'var(--color-ink)')
      .text(d => (d.exam - 100 === 0 ? '0' : (d.exam - 100 > 0 ? '+ ' : '− ') + Math.abs(d.exam - 100)));

    // group labels
    gp.append('text').attr('x', xOuter.bandwidth() / 2).attr('y', ch + 22)
      .attr('text-anchor', 'middle').style('font-size', '14px').attr('fill', 'var(--color-ink)').text(d => d.label);
    gp.append('text').attr('x', xOuter.bandwidth() / 2).attr('y', ch + 40)
      .attr('text-anchor', 'middle').style('font-size', '12px').style('font-style', 'italic')
      .attr('fill', 'var(--color-secondary)').text(d => d.note);

    // legend
    const leg = svg.append('g').attr('transform', `translate(${margin.left}, ${H - 18})`);
    leg.append('rect').attr('width', 14).attr('height', 14).attr('class', 'bar-practice');
    leg.append('text').attr('x', 20).attr('y', 11).style('font-size', '12px').attr('fill', 'var(--color-ink)').text('practice score (with AI)');
    leg.append('rect').attr('x', 180).attr('width', 14).attr('height', 14).attr('class', 'bar-exam');
    leg.append('text').attr('x', 200).attr('y', 11).style('font-size', '12px').attr('fill', 'var(--color-ink)').text('exam score (no AI)');

    svg.append('text').attr('x', W / 2).attr('y', H - 2).attr('text-anchor', 'middle').attr('class', 'caption')
      .text('Figure 14.2 — illustrative magnitudes; verify against the published paper before citing.');
  }

  draw();
  const ro = new ResizeObserver(() => draw());
  ro.observe(document.getElementById('chart'));
</script>
</body>
</html>
