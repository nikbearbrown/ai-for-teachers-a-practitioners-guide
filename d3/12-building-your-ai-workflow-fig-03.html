<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Figure 12.3 — Rogers and CBAM plateau map</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=EB+Garamond:wght@400;600&family=Inter:wght@400;600;700&family=JetBrains+Mono:wght@400&display=swap" rel="stylesheet">
<style>
  :root {
    --color-white:     #FFFFFF;
    --color-ink:       #2a1a0e;
    --color-red:       #C8102E;
    --color-secondary: #545454;
    --color-border:    #D4D4D4;
    --color-ochre:     #C8860E;
  }
  @media (prefers-color-scheme: dark) {
    :root {
      --color-white:     #111111;
      --color-ink:       #F0EBE3;
      --color-red:       #E8243A;
      --color-secondary: #A0978C;
      --color-border:    #2E2E2E;
      --color-ochre:     #D49A30;
    }
  }
  * { box-sizing: border-box; margin: 0; padding: 0; }
  body { background: var(--color-white); color: var(--color-ink); font-family: 'Inter', sans-serif; padding: 24px; }
  h1 { font-family: 'EB Garamond', Georgia, serif; font-weight: 400; font-size: 28px; margin-bottom: 4px; }
  p.subtitle { color: var(--color-secondary); font-size: 13px; margin-bottom: 24px; }
  #chart { width: 100%; height: 520px; }
  .row-label   { font-family: 'EB Garamond', Georgia, serif; font-size: 16px; font-weight: 600; fill: var(--color-ink); }
  .row-sub     { font-family: 'Inter', sans-serif; font-size: 11px; font-style: italic; fill: var(--color-secondary); }
  .stage-rect  { fill: var(--color-white); stroke: var(--color-ink); stroke-width: 1.2; cursor: pointer; transition: stroke-width 200ms cubic-bezier(0.2,0.8,0.2,1); }
  .stage-rect.stuck { fill: color-mix(in srgb, var(--color-red) 8%, var(--color-white)); stroke: var(--color-red); stroke-width: 1.6; }
  .stage-rect:hover { stroke-width: 2.2; }
  .stage-label { font-family: 'Inter', sans-serif; font-size: 12px; font-weight: 600; fill: var(--color-ink); }
  .stage-sub   { font-family: 'Inter', sans-serif; font-size: 10px; fill: var(--color-secondary); }
  .plateau-flag { fill: var(--color-red); }
  .plateau-text { font-family: 'Inter', sans-serif; font-size: 11px; font-weight: 700; fill: var(--color-white); }
  .plateau-sub  { font-family: 'Inter', sans-serif; font-size: 9px; font-style: italic; fill: var(--color-white); }
  .sweep-label { font-family: 'EB Garamond', Georgia, serif; font-size: 13px; font-weight: 600; fill: var(--color-ochre); }
  .caption { color: var(--color-secondary); font-size: 13px; margin-top: 16px; max-width: 65ch; }
  .tooltip { position: absolute; pointer-events: none; opacity: 0; background: var(--color-ink); color: var(--color-white); padding: 8px 12px; font-family: 'Inter', sans-serif; font-size: 12px; max-width: 280px; }
  @media (prefers-reduced-motion: reduce) { * { transition: none !important; animation: none !important; } }
</style>
</head>
<body>
<h1>Figure 12.3 — Rogers and CBAM plateau map</h1>
<p class="subtitle">Two adoption frameworks. Same plateau. Same structural fix.</p>
<div id="chart" role="img" aria-labelledby="chart-title chart-desc"></div>
<p class="caption">After Rogers (1962/2003) and Hall &amp; Hord (CBAM). The workflow document is the move that crosses both plateaus.</p>
<script src="https://cdnjs.cloudflare.com/ajax/libs/d3/7.9.0/d3.min.js"></script>
<script>
const rogers = [
  { label: 'Knowledge',      sub: '"there is a tool"',          tip: 'Teacher has heard about the tool. No commitment yet.' },
  { label: 'Persuasion',     sub: 'forms an attitude',         tip: 'Teacher forms a favorable or unfavorable attitude toward the tool.' },
  { label: 'Decision',       sub: 'accepts or rejects',         tip: 'Teacher commits to try it or to leave it. The "I will use AI" moment.' },
  { label: 'Implementation', sub: 'tool is being used',         tip: 'Use is happening. Most teachers stop here — ad hoc adoption.', stuck: true },
  { label: 'Confirmation',   sub: 'integrated, evaluated',      tip: 'Integrated into ongoing practice with evidence it is working. The destination.' }
];

const cbam = [
  { label: 'Awareness',    sub: '"what is this?"',             tip: 'No concerns yet. Awareness only.' },
  { label: 'Personal',     sub: '"how does this affect me?"',  tip: 'Teacher worries about implications for self, role, time.' },
  { label: 'Management',   sub: '"do I have time + materials?"', tip: 'Logistics dominate cognition. Most teachers plateau here.', stuck: true },
  { label: 'Consequence',  sub: '"is this affecting students?"', tip: 'Cognition shifts to student impact — the goal of the framework.' },
  { label: 'Collaboration', sub: '"who else should be doing this?"', tip: 'Concerns about coordinating with colleagues.' },
  { label: 'Refocusing',   sub: '"could we use this better?"',  tip: 'Concerns about improving or replacing the innovation.' }
];

const plateauTop    = { x: 3.5, label: 'AD HOC ADOPTION', sub: 'fresh decision every use' };
const plateauBottom = { x: 2.5, label: 'STUCK ON LOGISTICS', sub: 'time + materials still the load' };

const tooltip = d3.select('body').append('div').attr('class', 'tooltip');
function showTip(event, html) {
  tooltip.html(html).style('left', (event.pageX + 12) + 'px').style('top', (event.pageY - 28) + 'px')
    .transition().duration(150).style('opacity', 1);
}
function moveTip(event) { tooltip.style('left', (event.pageX + 12) + 'px').style('top', (event.pageY - 28) + 'px'); }
function hideTip() { tooltip.transition().duration(100).style('opacity', 0); }

function drawRow(svg, data, rowY, totalWidth, padX) {
  const cols = data.length;
  const slot = (totalWidth - padX * 2) / cols;
  const boxW = slot - 12;
  const boxH = 72;

  data.forEach((d, i) => {
    const x = padX + i * slot;
    const g = svg.append('g').attr('tabindex', 0)
      .attr('aria-label', `${d.label}: ${d.sub}`)
      .on('mouseover', (event) => showTip(event, `<strong>${d.label}</strong><br/>${d.tip}`))
      .on('mousemove', moveTip).on('mouseout', hideTip);

    g.append('rect').attr('class', 'stage-rect' + (d.stuck ? ' stuck' : ''))
      .attr('x', x).attr('y', rowY).attr('width', boxW).attr('height', boxH);
    g.append('text').attr('class', 'stage-label')
      .attr('x', x + boxW / 2).attr('y', rowY + 26).attr('text-anchor', 'middle').text(d.label);
    g.append('text').attr('class', 'stage-sub')
      .attr('x', x + boxW / 2).attr('y', rowY + 46).attr('text-anchor', 'middle').text(d.sub);

    if (i > 0) {
      const xPrev = padX + (i - 1) * slot + boxW;
      svg.append('line')
        .attr('x1', xPrev).attr('y1', rowY + boxH / 2)
        .attr('x2', x - 2).attr('y2', rowY + boxH / 2)
        .attr('stroke', 'var(--color-ink)').attr('stroke-width', 1.1)
        .attr('marker-end', 'url(#arInk3)');
    }
  });
  return { slot, boxW, boxH, padX };
}

function drawPlateauFlag(svg, x, rowY, flag) {
  const w = 64, h = 72;
  svg.append('rect').attr('class', 'plateau-flag')
    .attr('x', x - w / 2).attr('y', rowY).attr('width', w).attr('height', h);
  svg.append('text').attr('class', 'plateau-text')
    .attr('x', x).attr('y', rowY + 22).attr('text-anchor', 'middle').text(flag.label.split(' ')[0]);
  svg.append('text').attr('class', 'plateau-text')
    .attr('x', x).attr('y', rowY + 36).attr('text-anchor', 'middle').text(flag.label.split(' ').slice(1).join(' '));
  svg.append('text').attr('class', 'plateau-sub')
    .attr('x', x).attr('y', rowY + 56).attr('text-anchor', 'middle').text(flag.sub);
}

function draw() {
  const container = document.getElementById('chart');
  d3.select('#chart').selectAll('*').remove();
  const totalWidth  = container.clientWidth  || 900;
  const totalHeight = container.clientHeight || 520;

  const svg = d3.select('#chart').append('svg')
    .attr('width', totalWidth).attr('height', totalHeight)
    .attr('role', 'img').attr('aria-labelledby', 'chart-title chart-desc');
  svg.append('title').attr('id', 'chart-title').text('Rogers and CBAM plateau map');
  svg.append('desc').attr('id', 'chart-desc').text('Two-row stage map showing where teacher AI adoption stalls in each framework and the workflow move that crosses both plateaus.');

  const defs = svg.append('defs');
  defs.append('marker').attr('id', 'arInk3').attr('markerWidth', 9).attr('markerHeight', 7).attr('refX', 8).attr('refY', 3.5).attr('orient', 'auto')
    .append('polygon').attr('points', '0 0, 9 3.5, 0 7').attr('fill', 'var(--color-ink)');
  defs.append('marker').attr('id', 'arOchre3').attr('markerWidth', 10).attr('markerHeight', 8).attr('refX', 9).attr('refY', 4).attr('orient', 'auto')
    .append('polygon').attr('points', '0 0, 10 4, 0 8').attr('fill', 'var(--color-ochre)');

  const padX = 32;

  // ROW 1: Rogers
  svg.append('text').attr('class', 'row-label').attr('x', padX).attr('y', 50)
    .text('Rogers (1962/2003) — Diffusion of Innovations');
  svg.append('text').attr('class', 'row-sub').attr('x', padX).attr('y', 66)
    .text('five sequential stages of individual adoption');
  const r1 = drawRow(svg, rogers, 86, totalWidth, padX);

  // Plateau flag for Rogers — between Implementation (i=3) and Confirmation (i=4)
  const fx1 = padX + 3 * r1.slot + r1.boxW + (r1.slot - r1.boxW) / 2;
  drawPlateauFlag(svg, fx1, 86, plateauTop);

  // ROW 2: CBAM
  svg.append('text').attr('class', 'row-label').attr('x', padX).attr('y', 230)
    .text('Hall & Hord — Concerns-Based Adoption Model (CBAM)');
  svg.append('text').attr('class', 'row-sub').attr('x', padX).attr('y', 246)
    .text('six condensed stages of concern');
  const r2 = drawRow(svg, cbam, 266, totalWidth, padX);

  // Plateau flag for CBAM — between Management (i=2) and Consequence (i=3)
  const fx2 = padX + 2 * r2.slot + r2.boxW + (r2.slot - r2.boxW) / 2;
  drawPlateauFlag(svg, fx2, 266, plateauBottom);

  // Sweep arrows beneath each row showing workflow.md
  const sweepY = 200;
  const sweepStart = padX + 3 * r1.slot + r1.boxW / 2;
  const sweepEnd   = padX + 4 * r1.slot + r1.boxW / 2;
  svg.append('path')
    .attr('d', `M ${sweepStart} ${sweepY} Q ${(sweepStart + sweepEnd) / 2} ${sweepY + 14} ${sweepEnd} ${sweepY}`)
    .attr('fill', 'none').attr('stroke', 'var(--color-ochre)').attr('stroke-width', 1.8)
    .attr('marker-end', 'url(#arOchre3)');

  const sweepY2 = 376;
  const sweep2Start = padX + 2 * r2.slot + r2.boxW / 2;
  const sweep2End   = padX + 3 * r2.slot + r2.boxW / 2;
  svg.append('path')
    .attr('d', `M ${sweep2Start} ${sweepY2} Q ${(sweep2Start + sweep2End) / 2} ${sweepY2 + 14} ${sweep2End} ${sweepY2}`)
    .attr('fill', 'none').attr('stroke', 'var(--color-ochre)').attr('stroke-width', 1.8)
    .attr('marker-end', 'url(#arOchre3)');

  svg.append('text').attr('class', 'sweep-label')
    .attr('x', totalWidth / 2).attr('y', 432).attr('text-anchor', 'middle')
    .text('workflow.md moves you past both plateaus');
  svg.append('text').attr('class', 'row-sub')
    .attr('x', totalWidth / 2).attr('y', 452).attr('text-anchor', 'middle')
    .text('the captured library answers the management question once; the schedule answers it weekly');
}

draw();
const ro = new ResizeObserver(() => draw());
ro.observe(document.getElementById('chart'));
</script>
</body>
</html>
