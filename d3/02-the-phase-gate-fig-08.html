<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Figure 2.8 — The surgical timeout and the teacher at a laptop</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=EB+Garamond:wght@400;500;700&family=Inter:wght@400;600;700&family=JetBrains+Mono:wght@400&display=swap" rel="stylesheet">
<style>
  :root { --color-white:#FFFFFF; --color-ink:#121212; --color-red:#C8102E; --color-secondary:#545454; --color-border:#D4D4D4; --color-ochre:#C8860E; }
  @media (prefers-color-scheme: dark) {
    :root { --color-white:#111111; --color-ink:#F0EBE3; --color-red:#E8243A; --color-secondary:#A0978C; --color-border:#2E2E2E; --color-ochre:#D49A30; }
  }
  * { box-sizing: border-box; margin: 0; padding: 0; }
  body { background: var(--color-white); color: var(--color-ink); font-family: 'Inter', sans-serif; padding: 24px; }
  h1 { font-family: 'EB Garamond', Georgia, serif; font-weight: 400; font-size: 28px; margin-bottom: 4px; }
  p.subtitle { color: var(--color-secondary); font-size: 13px; margin-bottom: 24px; }
  #chart { width: 100%; height: 460px; }
  .panel-frame { fill: var(--color-white); stroke: var(--color-border); stroke-width: 1; }
  .figure { fill: none; stroke: var(--color-ink); stroke-width: 1.4; transition: stroke 200ms cubic-bezier(0.2,0.8,0.2,1); }
  .panel-rect:hover .figure { stroke: var(--color-red); }
  .table-fill { fill: var(--color-border); }
  .checklist-bg { fill: var(--color-white); stroke: var(--color-ink); stroke-width: 1; }
  .head { font-family: 'EB Garamond', Georgia, serif; font-size: 14px; font-weight: 700; fill: var(--color-ink); }
  .lb { font-family: 'EB Garamond', Georgia, serif; font-size: 12px; fill: var(--color-ink); }
  .sm { font-family: 'EB Garamond', Georgia, serif; font-size: 11px; fill: var(--color-secondary); }
  .badge { font-family: 'Inter', sans-serif; font-size: 14px; font-weight: 700; fill: var(--color-red); }
  .it { font-family: 'EB Garamond', Georgia, serif; font-size: 12px; font-style: italic; fill: var(--color-secondary); }
  .cap { font-family: 'EB Garamond', Georgia, serif; font-size: 12px; font-style: italic; fill: var(--color-secondary); }
  .tooltip { position: absolute; pointer-events: none; opacity: 0; background: var(--color-ink); color: var(--color-white); padding: 6px 10px; font-size: 12px; max-width: 260px; }
  @media (prefers-reduced-motion: reduce) { * { transition: none !important; animation: none !important; } }
</style>
</head>
<body>
<h1>Figure 2.8 — A structural pause vs. the lone laptop</h1>
<p class="subtitle">The timeout is a team-enforced cognitive operation. The dashboard is a click.</p>
<div id="chart" role="img" aria-labelledby="t-time d-time"></div>
<script src="https://cdnjs.cloudflare.com/ajax/libs/d3/7.9.0/d3.min.js"></script>
<script>
const tooltip = d3.select('body').append('div').attr('class', 'tooltip');
function showTip(e, html) { tooltip.html(html).style('left', (e.pageX+12)+'px').style('top', (e.pageY-28)+'px').transition().duration(150).style('opacity', 1); }
function moveTip(e) { tooltip.style('left', (e.pageX+12)+'px').style('top', (e.pageY-28)+'px'); }
function hideTip() { tooltip.transition().duration(100).style('opacity', 0); }

function drawFigure(g, cx, cy, label) {
  g.append('circle').attr('class', 'figure').attr('cx', cx).attr('cy', cy).attr('r', 10);
  g.append('path').attr('class', 'figure').attr('d', `M ${cx-14} ${cy+10} Q ${cx} ${cy+18} ${cx+14} ${cy+10}`);
  if (label) g.append('text').attr('x', cx).attr('y', cy + 36).attr('text-anchor', 'middle').attr('class', 'sm').text(label);
}

function draw() {
  d3.select('#chart').selectAll('*').remove();
  const container = document.getElementById('chart');
  const W = container.clientWidth || 760, H = container.clientHeight || 460;
  const svg = d3.select('#chart').append('svg').attr('viewBox', `0 0 ${W} ${H}`).attr('width', W).attr('height', H)
    .attr('role', 'img').attr('aria-labelledby', 't-time d-time');
  svg.append('title').attr('id', 't-time').text('The surgical timeout and the teacher at a laptop');
  svg.append('desc').attr('id', 'd-time').text('Two-panel comparison: left, a four-person surgical team pauses around a table with a visible checklist; right, a teacher alone at a laptop displaying a 99.4% approved dashboard.');

  svg.append('line').attr('x1', W/2).attr('y1', 40).attr('x2', W/2).attr('y2', H - 40).attr('stroke', 'var(--color-border)');

  // LEFT: surgical timeout
  const left = svg.append('g').attr('class', 'panel-rect').attr('tabindex', 0).attr('role', 'group').attr('aria-label', 'Surgical timeout: team-enforced cognitive operation')
    .on('mouseover', (e) => showTip(e, '<strong>Surgical timeout</strong><br>A structural pause before incision. Every member listens. Performed in front of witnesses.'))
    .on('mousemove', moveTip).on('mouseout', hideTip);
  left.append('text').attr('x', W * 0.25).attr('y', 56).attr('text-anchor', 'middle').attr('class', 'head').text('Surgical timeout');

  // Table
  const tx = W * 0.10, tw = W * 0.30, ty = H * 0.50, th = 18;
  left.append('rect').attr('class', 'table-fill').attr('x', tx).attr('y', ty).attr('width', tw).attr('height', th);
  left.append('rect').attr('class', 'panel-frame').attr('x', tx + tw*0.10).attr('y', ty+2).attr('width', tw*0.80).attr('height', th-4);

  // Four figures
  drawFigure(left, tx + tw + 30, ty + 4, 'surgeon');
  drawFigure(left, tx - 30, ty + 4, 'scrub');
  drawFigure(left, tx + tw * 0.30, ty - 30, 'anesthesiologist');
  drawFigure(left, tx + tw * 0.70, ty - 30, 'nurse');

  // Checklist
  const cly = H * 0.70;
  left.append('rect').attr('class', 'checklist-bg').attr('x', tx).attr('y', cly).attr('width', tw).attr('height', 60);
  left.append('text').attr('x', tx + 10).attr('y', cly + 18).attr('class', 'lb').text('Patient. Procedure. Side.');
  left.append('text').attr('x', tx + 10).attr('y', cly + 36).attr('class', 'lb').text('Allergies. Antibiotic timing.');
  left.append('text').attr('x', tx + 10).attr('y', cly + 52).attr('class', 'it').text('Every member listens.');

  // RIGHT: teacher at laptop
  const right = svg.append('g').attr('class', 'panel-rect').attr('tabindex', 0).attr('role', 'group').attr('aria-label', 'Teacher at laptop: alone with the dashboard')
    .on('mouseover', (e) => showTip(e, '<strong>Teacher at laptop</strong><br>Sunday evening. No witnesses. The dashboard reports completion regardless of what the teacher does.'))
    .on('mousemove', moveTip).on('mouseout', hideTip);
  right.append('text').attr('x', W * 0.75).attr('y', 56).attr('text-anchor', 'middle').attr('class', 'head').text('Teacher at a laptop, Sunday');

  // Window
  const wx = W * 0.56, wy = H * 0.22;
  right.append('rect').attr('class', 'panel-frame').attr('x', wx).attr('y', wy).attr('width', 60).attr('height', 60);
  right.append('line').attr('x1', wx + 30).attr('y1', wy).attr('x2', wx + 30).attr('y2', wy + 60).attr('stroke', 'var(--color-secondary)').attr('stroke-width', 0.6);
  right.append('line').attr('x1', wx).attr('y1', wy + 30).attr('x2', wx + 60).attr('y2', wy + 30).attr('stroke', 'var(--color-secondary)').attr('stroke-width', 0.6);
  right.append('text').attr('x', wx).attr('y', wy + 76).attr('class', 'sm').text('evening light');

  // Teacher figure
  drawFigure(right, W * 0.75, H * 0.42, 'teacher (alone)');

  // Laptop
  const lx = W * 0.62, ly = H * 0.56, lw = 220, lh = 84;
  right.append('rect').attr('class', 'panel-frame').attr('x', lx).attr('y', ly).attr('width', lw).attr('height', lh);
  right.append('rect').attr('class', 'table-fill').attr('x', lx - 4).attr('y', ly + lh).attr('width', lw + 8).attr('height', 6);
  right.append('text').attr('x', lx + lw/2).attr('y', ly + 24).attr('text-anchor', 'middle').attr('class', 'lb').text('Dashboard');
  right.append('text').attr('x', lx + lw/2).attr('y', ly + 50).attr('text-anchor', 'middle').attr('class', 'badge').text('99.4% approved');
  right.append('text').attr('x', lx + lw/2).attr('y', ly + 72).attr('text-anchor', 'middle').attr('class', 'sm').text('120 of 121 essays');

  right.append('text').attr('x', W * 0.75).attr('y', H * 0.85).attr('text-anchor', 'middle').attr('class', 'it').text('No witnesses. Workflow reports completion.');

  svg.append('text').attr('x', W/2).attr('y', H - 14).attr('text-anchor', 'middle').attr('class', 'cap')
    .text('The gate has to be structural. Willpower is not a reliable structural element.');
}

draw();
const ro = new ResizeObserver(() => draw());
ro.observe(document.getElementById('chart'));
</script>
</body>
</html>
