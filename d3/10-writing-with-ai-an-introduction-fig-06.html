<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Figure 10.6 — Three instructional uses of AI in writing</title>
<style>
  :root {
    --color-canvas:    #fdfcfb;
    --color-ink:       #2a1a0e;
    --color-secondary: #4a4540;
    --color-muted:     #8a8480;
    --color-light:     #c8c4c0;
    --color-panel:     #f5f2ee;
  }
  @media (prefers-color-scheme: dark) {
    :root {
      --color-canvas:    #1a120a;
      --color-ink:       #f5f2ee;
      --color-secondary: #c8c4c0;
      --color-muted:     #8a8480;
      --color-light:     #4a4540;
      --color-panel:     #251a10;
    }
  }
  * { box-sizing: border-box; margin: 0; padding: 0; }
  body { background: var(--color-canvas); color: var(--color-ink); font-family: 'EB Garamond', Garamond, Georgia, serif; padding: 16px; }
  #chart { width: 100%; }
  .title    { font-size: 20px; fill: var(--color-ink); }
  .subtitle { font-size: 13px; font-style: italic; fill: var(--color-secondary); }
  .col-head { font-size: 16px; fill: var(--color-ink); }
  .row-head { font-size: 13px; fill: var(--color-ink); }
  .row-sub  { font-size: 11px; font-style: italic; fill: var(--color-muted); }
  .cell     { font-size: 13px; fill: var(--color-ink); }
  .cell-sub { font-size: 11px; font-style: italic; fill: var(--color-secondary); }
  .caption  { font-size: 12px; font-style: italic; fill: var(--color-secondary); }
  .closing  { font-size: 13px; font-style: italic; fill: var(--color-ink); }
  rect.header { fill: var(--color-panel); stroke: var(--color-muted); stroke-width: 1; }
  rect.border { fill: none; stroke: var(--color-ink); stroke-width: 1.2; }
  .divider  { stroke: var(--color-muted); stroke-width: 1; }
  rect.cell-hover { fill: var(--color-canvas); cursor: pointer; opacity: 0; }
  rect.cell-hover:hover { opacity: 1; fill: var(--color-panel); }
  .tooltip { position: absolute; pointer-events: none; opacity: 0; background: var(--color-panel); color: var(--color-ink); border: 1px solid var(--color-ink); padding: 6px 10px; font-size: 13px; font-family: 'EB Garamond', Garamond, Georgia, serif; max-width: 280px; }
  @media (prefers-reduced-motion: reduce) { * { transition: none !important; animation: none !important; } }
</style>
</head>
<body>
<div id="chart" role="main"></div>
<script src="https://cdnjs.cloudflare.com/ajax/libs/d3/7.9.0/d3.min.js"></script>
<script>
const columns = ['Socratic AI', 'Feedback AI', 'Elaboration AI'];

const rows = [
  { dim: 'Student supplies', sub: 'input to model',
    cells: [
      { main: 'a working thesis', sub: '"I\'m arguing that X"' },
      { main: 'a drafted paragraph', sub: 'already written' },
      { main: 'an underdeveloped idea', sub: 'gestured at, not made' }
    ] },
  { dim: 'Model behavior', sub: 'what it does',
    cells: [
      { main: 'asks, never answers', sub: 'three hostile-reader questions' },
      { main: 'marks the moves', sub: 'analysis vs. restatement vs. decoration' },
      { main: 'names what is missing', sub: '"the next sentence must..."' }
    ] },
  { dim: 'Residual cognition', sub: 'what stays with student',
    cells: [
      { main: 'formulate the defense', sub: 'Flower-Hayes planning move' },
      { main: 'decide what to revise', sub: 'Sommers 1982 at scale' },
      { main: 'write the missing sentence', sub: 'argument-completion' }
    ] },
  { dim: 'Failure mode', sub: 'how it breaks',
    cells: [
      { main: 're-prompted as drafter', sub: '"never mind the Socratic thing"' },
      { main: 'slides into rewriting', sub: 'model offers replacement prose' },
      { main: 'writes the sentence for them', sub: 'prompt drift to ghostwriting' }
    ] }
];

const tooltip = d3.select('body').append('div').attr('class','tooltip');

function draw() {
  d3.select('#chart').selectAll('svg').remove();
  const W = document.getElementById('chart').clientWidth || 760;
  const H = Math.max(480, W * 0.63);

  const svg = d3.select('#chart').append('svg')
    .attr('viewBox', `0 0 ${W} ${H}`)
    .attr('role','img').attr('aria-labelledby','t-fig06 d-fig06');
  svg.append('title').attr('id','t-fig06').text('Three instructional uses of AI in writing');
  svg.append('desc').attr('id','d-fig06').text('Three-column table contrasting Socratic, Feedback, and Elaboration AI by student input, model behavior, residual cognition, and failure mode.');

  svg.append('text').attr('class','title').attr('x', W/2).attr('y', 32).attr('text-anchor','middle').text('AI in the process, not in the product');
  svg.append('text').attr('class','subtitle').attr('x', W/2).attr('y', 54).attr('text-anchor','middle').text('Three prompt patterns that keep the cognitive work with the student');

  const margin = { left: 40, right: 40, top: 84, bottom: 60 };
  const innerW = W - margin.left - margin.right;
  const innerH = H - margin.top - margin.bottom - 40;
  const dimW = innerW * 0.22;
  const colW = (innerW - dimW) / columns.length;
  const headerH = 44;
  const rowH = (innerH - headerH) / rows.length;

  const g = svg.append('g').attr('transform', `translate(${margin.left},${margin.top})`);

  // outer border
  g.append('rect').attr('class','border').attr('x',0).attr('y',0).attr('width',innerW).attr('height',innerH);

  // header bar
  g.append('rect').attr('class','header').attr('x',0).attr('y',0).attr('width',innerW).attr('height',headerH);

  // column dividers
  g.append('line').attr('class','divider').attr('x1', dimW).attr('y1', 0).attr('x2', dimW).attr('y2', innerH);
  columns.forEach((c,i) => {
    const x = dimW + (i+1)*colW;
    if (i < columns.length - 1) {
      g.append('line').attr('class','divider').attr('x1', x).attr('y1', 0).attr('x2', x).attr('y2', innerH);
    }
    g.append('text').attr('class','col-head').attr('x', dimW + i*colW + colW/2).attr('y', 28).attr('text-anchor','middle').text(c);
  });
  g.append('text').attr('class','row-sub').attr('x', dimW/2).attr('y', 28).attr('text-anchor','middle').text('Dimension');

  // rows
  rows.forEach((r, ri) => {
    const y0 = headerH + ri * rowH;
    g.append('line').attr('class','divider').attr('x1',0).attr('y1', y0).attr('x2', innerW).attr('y2', y0);

    g.append('text').attr('class','row-head').attr('x', dimW/2).attr('y', y0 + rowH/2 - 6).attr('text-anchor','middle').text(r.dim);
    g.append('text').attr('class','row-sub').attr('x', dimW/2).attr('y', y0 + rowH/2 + 12).attr('text-anchor','middle').text(r.sub);

    r.cells.forEach((cell, ci) => {
      const cx = dimW + ci*colW + colW/2;
      g.append('text').attr('class','cell').attr('x', cx).attr('y', y0 + rowH/2 - 6).attr('text-anchor','middle').text(cell.main);
      g.append('text').attr('class','cell-sub').attr('x', cx).attr('y', y0 + rowH/2 + 14).attr('text-anchor','middle').text(cell.sub);

      // invisible hover overlay
      g.append('rect').attr('class','cell-hover')
        .attr('x', dimW + ci*colW + 4).attr('y', y0 + 2).attr('width', colW - 8).attr('height', rowH - 4)
        .attr('tabindex',0).attr('aria-label', `${columns[ci]} — ${r.dim}: ${cell.main}`)
        .on('mouseover', (event)=>showTip(event, `<strong>${columns[ci]}</strong> · ${r.dim}<br>${cell.main}<br><em>${cell.sub}</em>`))
        .on('mousemove', moveTip).on('mouseout', hideTip);
    });
  });

  svg.append('text').attr('class','closing').attr('x', W/2).attr('y', H - 38).attr('text-anchor','middle').text("In all three patterns, the artifact the student turns in is still the student's draft.");
  svg.append('text').attr('class','caption').attr('x', W/2).attr('y', H - 16).attr('text-anchor','middle').text("Don't police prompts. Make the underlying assignment AI-survivable.");
}

function showTip(event, html) {
  tooltip.html(html).style('left',(event.pageX+12)+'px').style('top',(event.pageY-28)+'px')
    .transition().duration(150).style('opacity',1);
}
function moveTip(event) { tooltip.style('left',(event.pageX+12)+'px').style('top',(event.pageY-28)+'px'); }
function hideTip() { tooltip.transition().duration(100).style('opacity',0); }

draw();
new ResizeObserver(()=>draw()).observe(document.getElementById('chart'));
</script>
</body>
</html>
