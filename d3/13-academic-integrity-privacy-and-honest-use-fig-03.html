<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Figure 13.3 — Five-question diagnostic decision tree</title>
  <style>
    :root {
      --color-white:     #FFFFFF;
      --color-ink:       #121212;
      --color-red:       #C8102E;
      --color-secondary: #545454;
      --color-border:    #D4D4D4;
      --color-ochre:     #C8860E;
    }
    @media (prefers-color-scheme: dark) {
      :root {
        --color-white:     #111111;
        --color-ink:       #F0EBE3;
        --color-red:       #E8243A;
        --color-secondary: #A0978C;
        --color-border:    #2E2E2E;
        --color-ochre:     #D49A30;
      }
    }
    * { box-sizing: border-box; margin: 0; padding: 0; }
    body {
      background: var(--color-white);
      color: var(--color-ink);
      font-family: 'EB Garamond', Georgia, serif;
      padding: 32px;
    }
    h1 { font-size: 20px; font-weight: 400; margin-bottom: 4px; }
    .subtitle { font-size: 13px; color: var(--color-secondary); font-style: italic; margin-bottom: 24px; }
    #chart { width: 100%; }
    .node-rect { fill: var(--color-white); stroke: var(--color-ink); stroke-width: 1; }
    .node-title { font-family: 'Inter', sans-serif; font-size: 13px; fill: var(--color-ink); text-anchor: middle; }
    .node-note { font-family: 'Inter', sans-serif; font-size: 11px; font-style: italic; fill: var(--color-secondary); text-anchor: middle; }
    .yes-label { font-family: 'Inter', sans-serif; font-size: 11px; fill: var(--color-secondary); }
    .no-label { font-family: 'Inter', sans-serif; font-size: 11px; fill: var(--color-secondary); }
    .yes-line { stroke: var(--color-ink); }
    .no-line { stroke: var(--color-secondary); stroke-dasharray: 3 3; }
    .terminal-survivable { fill: var(--color-red); }
    .terminal-survivable-text { fill: var(--color-white); font-family: 'Inter', sans-serif; font-size: 15px; font-weight: 700; text-anchor: middle; }
    .terminal-redesign { fill: var(--color-white); stroke: var(--color-ochre); stroke-width: 3; }
    .terminal-redesign-text { fill: var(--color-ink); font-family: 'Inter', sans-serif; font-size: 14px; font-weight: 700; text-anchor: middle; }
    .terminal-redesign-note { fill: var(--color-secondary); font-family: 'Inter', sans-serif; font-size: 11px; font-style: italic; text-anchor: middle; }
    .tooltip {
      position: absolute;
      pointer-events: none;
      opacity: 0;
      background: var(--color-ink);
      color: var(--color-white);
      padding: 8px 12px;
      font-size: 13px;
      font-family: 'Inter', sans-serif;
      border-radius: 4px;
      max-width: 300px;
    }
    @media (prefers-reduced-motion: reduce) { * { transition: none !important; animation: none !important; } }
  </style>
</head>
<body>
  <h1>Five-question diagnostic — one assignment at a time</h1>
  <div class="subtitle">Find the smallest move that converts a "no" into a "yes."</div>
  <div id="chart" role="main"></div>
  <script src="https://cdnjs.cloudflare.com/ajax/libs/d3/7.9.0/d3.min.js"></script>
  <script>
    const nodes = [
      { id: 1, title: '1. Defense in conversation required?', note: 'Smallest move: a 10-minute oral conference.', tooltip: 'AI cannot defend a paper in real-time conversation. Even a brief defense surfaces whether the mental model is present.' },
      { id: 2, title: '2. Novel application beyond training cutoff?', note: 'Smallest move: link to the last 12 months.', tooltip: 'Material absent from training data must be at minimum described; the cognitive work of analogy is the assessable work.' },
      { id: 3, title: '3. Process trail required?', note: 'Smallest move: dated drafts + reflection memo.', tooltip: 'The artifact is no longer proof of the process. Make the process its own proof — drafts, annotations, decisions.' },
      { id: 4, title: '4. Real-time unassisted performance?', note: 'Smallest move: one in-class artifact.', tooltip: 'In-class writing, whiteboard work, oral defense. Highest friction; most legally defensible; trades off against test anxiety.' },
      { id: 5, title: '5. Would artifact alone reveal learning?', note: 'Smallest move: portfolio + defense.', tooltip: 'The diagnostic question. If a student used AI freely and the artifact looks good, would you know whether they learned anything?' }
    ];

    function draw() {
      d3.select('#chart').selectAll('*').remove();

      const totalWidth = document.getElementById('chart').clientWidth || 800;
      const totalHeight = 640;

      const svg = d3.select('#chart').append('svg')
        .attr('width', totalWidth)
        .attr('height', totalHeight)
        .attr('role', 'img')
        .attr('aria-labelledby', 'chart-title chart-desc');
      svg.append('title').attr('id', 'chart-title').text('Five-question diagnostic decision tree.');
      svg.append('desc').attr('id', 'chart-desc').text('Five yes-or-no questions. Each "yes" continues downward; any "no" peels off to a redesign target. Five "yes" answers converge on AI-survivable.');

      // Geometry
      const nodeWidth = Math.min(320, totalWidth - 280);
      const colYesX = (totalWidth - 240 - nodeWidth) / 2;
      const colNoX = colYesX + nodeWidth + 80;
      const nodeHeight = 58;
      const nodeStep = 98;
      const topY = 40;

      // No-target terminal
      svg.append('rect').attr('class', 'terminal-redesign')
        .attr('x', colNoX).attr('y', topY + 2 * nodeStep + 20)
        .attr('width', 200).attr('height', 120);
      svg.append('text').attr('class', 'terminal-redesign-text')
        .attr('x', colNoX + 100).attr('y', topY + 2 * nodeStep + 60).text('Redesign target');
      svg.append('text').attr('class', 'terminal-redesign-note')
        .attr('x', colNoX + 100).attr('y', topY + 2 * nodeStep + 84).text('Find the smallest move');
      svg.append('text').attr('class', 'terminal-redesign-note')
        .attr('x', colNoX + 100).attr('y', topY + 2 * nodeStep + 100).text('that turns this "no"');
      svg.append('text').attr('class', 'terminal-redesign-note')
        .attr('x', colNoX + 100).attr('y', topY + 2 * nodeStep + 116).text('into a "yes."');

      // Nodes
      const nodeG = svg.selectAll('.node')
        .data(nodes)
        .join('g')
          .attr('class', 'node')
          .attr('transform', (d, i) => `translate(${colYesX}, ${topY + i * nodeStep})`)
          .attr('tabindex', 0)
          .attr('aria-label', d => `${d.title}. ${d.note}`);

      nodeG.append('rect').attr('class', 'node-rect')
        .attr('width', nodeWidth).attr('height', nodeHeight);
      nodeG.append('text').attr('class', 'node-title')
        .attr('x', nodeWidth / 2).attr('y', 24).text(d => d.title);
      nodeG.append('text').attr('class', 'node-note')
        .attr('x', nodeWidth / 2).attr('y', 44).text(d => d.note);

      // Yes-arrows downward and No-arrows rightward
      defsArrows(svg);
      nodes.forEach((d, i) => {
        const yTop = topY + i * nodeStep;
        const yBottom = yTop + nodeHeight;
        if (i < nodes.length - 1) {
          svg.append('line').attr('class', 'yes-line')
            .attr('x1', colYesX + nodeWidth / 2).attr('x2', colYesX + nodeWidth / 2)
            .attr('y1', yBottom).attr('y2', yTop + nodeStep - 4)
            .attr('marker-end', 'url(#arrow-ink)');
          svg.append('text').attr('class', 'yes-label')
            .attr('x', colYesX + nodeWidth / 2 + 8).attr('y', yBottom + (nodeStep - nodeHeight) / 2 + 4)
            .text('yes');
        }
        // No path to redesign-target
        const nodeMidY = yTop + nodeHeight / 2;
        svg.append('path')
          .attr('class', 'no-line')
          .attr('fill', 'none')
          .attr('d', `M ${colYesX + nodeWidth} ${nodeMidY} L ${colNoX - 6} ${nodeMidY}`)
          .attr('marker-end', 'url(#arrow-secondary)');
        svg.append('text').attr('class', 'no-label')
          .attr('x', colYesX + nodeWidth + 12).attr('y', nodeMidY - 6).text('no');
      });

      // Final yes-arrow into AI-survivable terminal
      const lastY = topY + (nodes.length - 1) * nodeStep + nodeHeight;
      svg.append('line').attr('class', 'yes-line')
        .attr('x1', colYesX + nodeWidth / 2).attr('x2', colYesX + nodeWidth / 2)
        .attr('y1', lastY).attr('y2', lastY + 30)
        .attr('marker-end', 'url(#arrow-ink)');

      // AI-survivable terminal
      const termY = lastY + 36;
      svg.append('rect').attr('class', 'terminal-survivable')
        .attr('x', colYesX).attr('y', termY)
        .attr('width', nodeWidth).attr('height', 40);
      svg.append('text').attr('class', 'terminal-survivable-text')
        .attr('x', colYesX + nodeWidth / 2).attr('y', termY + 26)
        .text('AI-survivable');

      // Tooltip
      const tooltip = d3.select('body').append('div').attr('class', 'tooltip');
      nodeG
        .on('mouseover', (event, d) => {
          tooltip.html(`<strong>${d.title}</strong><br>${d.tooltip}`)
            .style('left', (event.pageX + 12) + 'px').style('top', (event.pageY - 28) + 'px')
            .transition().duration(150).style('opacity', 1);
        })
        .on('mousemove', (event) => {
          tooltip.style('left', (event.pageX + 12) + 'px').style('top', (event.pageY - 28) + 'px');
        })
        .on('mouseout', () => tooltip.transition().duration(100).style('opacity', 0));
    }

    function defsArrows(svg) {
      const defs = svg.append('defs');
      defs.append('marker')
        .attr('id', 'arrow-ink')
        .attr('viewBox', '0 0 10 10').attr('refX', 9).attr('refY', 5)
        .attr('markerWidth', 6).attr('markerHeight', 6).attr('orient', 'auto-start-reverse')
        .append('path').attr('d', 'M0,0 L10,5 L0,10 z').attr('fill', 'var(--color-ink)');
      defs.append('marker')
        .attr('id', 'arrow-secondary')
        .attr('viewBox', '0 0 10 10').attr('refX', 9).attr('refY', 5)
        .attr('markerWidth', 6).attr('markerHeight', 6).attr('orient', 'auto-start-reverse')
        .append('path').attr('d', 'M0,0 L10,5 L0,10 z').attr('fill', 'var(--color-secondary)');
    }

    draw();
    const ro = new ResizeObserver(() => draw());
    ro.observe(document.getElementById('chart'));
  </script>
</body>
</html>
