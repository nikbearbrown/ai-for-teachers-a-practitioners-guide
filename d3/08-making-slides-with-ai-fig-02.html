<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Figure 8.2 — Content-type to visual-form matching guide</title>
<style>
  :root {
    --color-white:     #FFFFFF;
    --color-ink:       #121212;
    --color-red:       #C8102E;
    --color-secondary: #545454;
    --color-border:    #D4D4D4;
    --color-ochre:     #C8860E;
  }
  @media (prefers-color-scheme: dark) {
    :root {
      --color-white:     #111111;
      --color-ink:       #F0EBE3;
      --color-red:       #E8243A;
      --color-secondary: #A0978C;
      --color-border:    #2E2E2E;
      --color-ochre:     #D49A30;
    }
  }
  * { box-sizing: border-box; margin: 0; padding: 0; }
  body {
    background: var(--color-white); color: var(--color-ink);
    font-family: 'EB Garamond', Garamond, Georgia, serif;
    padding: 24px;
  }
  #chart { width: 100%; height: 520px; }
  .row-label { font-family: 'EB Garamond', Georgia, serif; font-size: 17px; fill: var(--color-ink); }
  .row-sub   { font-family: 'EB Garamond', Georgia, serif; font-size: 12px; font-style: italic; fill: var(--color-secondary); }
  .col-head  { font-family: 'EB Garamond', Georgia, serif; font-size: 13px; fill: var(--color-secondary); }
  .form-cap  { font-family: 'EB Garamond', Georgia, serif; font-size: 12px; fill: var(--color-secondary); }
  .title     { font-family: 'EB Garamond', Georgia, serif; font-size: 22px; font-style: italic; fill: var(--color-ink); }
  .tooltip {
    position: absolute; pointer-events: none; opacity: 0;
    background: var(--color-white); color: var(--color-ink);
    border: 1px solid var(--color-border); padding: 6px 10px;
    font-family: 'EB Garamond', Georgia, serif; font-size: 13px;
  }
  @media (prefers-reduced-motion: reduce) { * { transition: none !important; animation: none !important; } }
</style>
</head>
<body>
<div id="chart" role="main"></div>
<script src="https://cdnjs.cloudflare.com/ajax/libs/d3/7.9.0/d3.min.js"></script>
<script>
  const FALLBACK_DATA = [
    { id: 'list',    label: 'List',           sub: 'co-membership only',          form: 'bullet list' },
    { id: 'compare', label: 'Comparison',     sub: 'two axes against each other', form: '2×2 matrix or table' },
    { id: 'process', label: 'Process',        sub: 'temporal or causal flow',     form: 'directed diagram' },
    { id: 'dist',    label: 'Distribution',   sub: 'quantities across categories', form: 'bar or column chart' },
    { id: 'single',  label: 'Single quantity', sub: 'one number worth seeing',     form: 'number set large' }
  ];

  function draw() {
    d3.select('#chart').selectAll('*').remove();
    const container = document.getElementById('chart');
    const totalWidth  = container.clientWidth  || 700;
    const totalHeight = 520;

    const svg = d3.select('#chart').append('svg')
      .attr('width', totalWidth).attr('height', totalHeight)
      .attr('viewBox', `0 0 ${totalWidth} ${totalHeight}`)
      .attr('role', 'img')
      .attr('aria-labelledby', 'f2-t f2-d');
    svg.append('title').attr('id', 'f2-t').text('Content-type to visual-form matching guide');
    svg.append('desc').attr('id', 'f2-d').text('Five rows pairing a content structure with the visual form that fits it: list, comparison, process, distribution, single quantity.');

    svg.append('defs').append('marker')
      .attr('id', 'f2arrow').attr('viewBox', '0 0 10 10')
      .attr('refX', 9).attr('refY', 5).attr('markerWidth', 7).attr('markerHeight', 7)
      .attr('orient', 'auto-start-reverse')
      .append('path').attr('d', 'M0,0 L10,5 L0,10 z').attr('fill', 'var(--color-ink)');

    svg.append('text').attr('class', 'title').attr('x', 30).attr('y', 36).text('Match the form to the structure.');

    const margin = { top: 60, left: 30, right: 30, bottom: 20 };
    const innerW = totalWidth - margin.left - margin.right;
    const rowH = (totalHeight - margin.top - margin.bottom) / FALLBACK_DATA.length;
    const colSplit = innerW * 0.42;

    const gChart = svg.append('g').attr('transform', `translate(${margin.left},${margin.top})`);

    gChart.append('text').attr('class', 'col-head').attr('x', colSplit / 2).attr('y', 14).attr('text-anchor', 'middle').text('content structure');
    gChart.append('text').attr('class', 'col-head').attr('x', colSplit + (innerW - colSplit) / 2).attr('y', 14).attr('text-anchor', 'middle').text('visual form');
    gChart.append('line').attr('x1', 0).attr('y1', 22).attr('x2', innerW).attr('y2', 22).attr('stroke', 'var(--color-border)');

    const tooltip = d3.select('body').append('div').attr('class', 'tooltip');

    const gRows = gChart.selectAll('.row')
      .data(FALLBACK_DATA)
      .join('g')
        .attr('class', 'row')
        .attr('transform', (d, i) => `translate(0, ${30 + i * rowH})`)
        .attr('tabindex', 0)
        .attr('aria-label', d => `${d.label}: ${d.form}`);

    gRows.append('rect')
      .attr('x', 0).attr('y', 0).attr('width', innerW).attr('height', rowH - 6)
      .attr('fill', 'var(--color-white)').attr('stroke', 'none');

    gRows.append('line')
      .attr('x1', 0).attr('y1', rowH - 6).attr('x2', innerW).attr('y2', rowH - 6)
      .attr('stroke', 'var(--color-border)').attr('stroke-width', 0.6);

    gRows.append('text').attr('class', 'row-label').attr('x', 20).attr('y', 28).text(d => d.label);
    gRows.append('text').attr('class', 'row-sub').attr('x', 20).attr('y', 48).text(d => d.sub);

    // Visual form glyphs
    gRows.each(function(d, i) {
      const g = d3.select(this).append('g').attr('transform', `translate(${colSplit + 20}, 16)`);
      if (d.id === 'list') {
        [0, 16, 32].forEach((y, idx) => {
          g.append('circle').attr('cx', 6).attr('cy', y + 10).attr('r', 2.5).attr('fill', 'var(--color-ink)');
          g.append('line').attr('x1', 16).attr('y1', y + 10).attr('x2', 170 - idx * 10).attr('y2', y + 10).attr('stroke', 'var(--color-ink)').attr('stroke-width', 0.8);
        });
      } else if (d.id === 'compare') {
        const cells = [[0,0,'#F0EBE3'], [60,0,'#D4D4D4'], [0,30,'#D4D4D4'], [60,30,'#787878']];
        cells.forEach(([x, y, fill]) => {
          g.append('rect').attr('x', x).attr('y', y).attr('width', 60).attr('height', 30).attr('fill', fill).attr('stroke', 'var(--color-ink)');
        });
        g.append('text').attr('class', 'form-cap').attr('x', 140).attr('y', 22).text('2×2 matrix');
        g.append('text').attr('class', 'form-cap').attr('x', 140).attr('y', 38).text('or table');
      } else if (d.id === 'process') {
        ['A', 'B', 'C'].forEach((lbl, idx) => {
          g.append('rect').attr('x', idx * 74).attr('y', 6).attr('width', 38).attr('height', 22).attr('fill', 'var(--color-white)').attr('stroke', 'var(--color-ink)');
          g.append('text').attr('x', idx * 74 + 19).attr('y', 22).attr('text-anchor', 'middle').attr('class', 'form-cap').text(lbl);
          if (idx < 2) g.append('line').attr('x1', idx * 74 + 38).attr('y1', 17).attr('x2', idx * 74 + 68).attr('y2', 17).attr('stroke', 'var(--color-ink)').attr('marker-end', 'url(#f2arrow)');
        });
        g.append('text').attr('class', 'form-cap').attr('x', 240).attr('y', 22).text('directed diagram');
      } else if (d.id === 'dist') {
        const bars = [22, 6, 14, 28];
        bars.forEach((h, idx) => {
          g.append('rect').attr('x', idx * 26).attr('y', h).attr('width', 20).attr('height', 44 - h).attr('fill', 'var(--color-ink)');
        });
        g.append('line').attr('x1', 0).attr('y1', 44).attr('x2', 104).attr('y2', 44).attr('stroke', 'var(--color-ink)');
        g.append('text').attr('class', 'form-cap').attr('x', 124).attr('y', 32).text('bar or column chart');
      } else if (d.id === 'single') {
        g.append('text').attr('x', 0).attr('y', 44).attr('font-size', 46).attr('font-family', "'EB Garamond', Georgia, serif").attr('fill', 'var(--color-ink)').text('32');
        g.append('text').attr('class', 'form-cap').attr('x', 74).attr('y', 36).text('ATP / glucose');
        g.append('text').attr('class', 'form-cap').attr('x', 74).attr('y', 52).attr('font-style', 'italic').text('number set large');
      }
    });

    gRows
      .on('mouseover', function(event, d) {
        d3.select(this).select('rect').transition().duration(120).attr('fill', 'var(--color-border)').attr('opacity', 0.18);
        tooltip.html(`<strong>${d.label}</strong><br/>${d.sub} &rarr; ${d.form}`)
          .style('left', (event.pageX + 12) + 'px').style('top', (event.pageY - 28) + 'px')
          .transition().duration(150).style('opacity', 1);
      })
      .on('mousemove', function(event) {
        tooltip.style('left', (event.pageX + 12) + 'px').style('top', (event.pageY - 28) + 'px');
      })
      .on('mouseout', function() {
        d3.select(this).select('rect').transition().duration(120).attr('opacity', 0);
        tooltip.transition().duration(100).style('opacity', 0);
      });
  }

  draw();
  const ro = new ResizeObserver(() => draw());
  ro.observe(document.getElementById('chart'));
</script>
</body>
</html>
