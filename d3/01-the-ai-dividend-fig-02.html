<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Figure 1.2 — Three-zone task taxonomy</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=EB+Garamond:wght@400;500;700&family=Inter:wght@400;600;700&family=JetBrains+Mono:wght@400&display=swap" rel="stylesheet">
<style>
  :root {
    --color-white:     #FFFFFF;
    --color-ink:       #121212;
    --color-red:       #C8102E;
    --color-secondary: #545454;
    --color-border:    #D4D4D4;
    --color-ochre:     #C8860E;
  }
  @media (prefers-color-scheme: dark) {
    :root {
      --color-white:     #111111;
      --color-ink:       #F0EBE3;
      --color-red:       #E8243A;
      --color-secondary: #A0978C;
      --color-border:    #2E2E2E;
      --color-ochre:     #D49A30;
    }
  }
  * { box-sizing: border-box; margin: 0; padding: 0; }
  body { background: var(--color-white); color: var(--color-ink); font-family: 'Inter', sans-serif; padding: 24px; }
  h1 { font-family: 'EB Garamond', Georgia, serif; font-weight: 400; font-size: 28px; margin-bottom: 4px; }
  p.subtitle { color: var(--color-secondary); font-size: 13px; margin-bottom: 24px; }
  #chart { width: 100%; height: 480px; position: relative; }
  .eyebrow { font-family: 'Inter', sans-serif; font-size: 11px; letter-spacing: 2px; fill: var(--color-secondary); }
  .zone-tag { font-family: 'Inter', sans-serif; font-size: 11px; letter-spacing: 1.5px; fill: var(--color-secondary); }
  .zone-title { font-family: 'EB Garamond', Georgia, serif; font-size: 22px; font-weight: 700; fill: var(--color-ink); }
  .zone-def { font-family: 'EB Garamond', Georgia, serif; font-size: 13px; font-style: italic; fill: var(--color-secondary); }
  .zone-item { font-family: 'EB Garamond', Georgia, serif; font-size: 13px; fill: var(--color-ink); }
  .zone-rule { stroke: var(--color-border); stroke-width: 1; }
  .zone-card { fill: var(--color-white); stroke: var(--color-border); stroke-width: 1; transition: stroke 200ms cubic-bezier(0.2,0.8,0.2,1); cursor: pointer; }
  .zone-card.danger { stroke: var(--color-red); stroke-width: 2; }
  .zone-card:hover { stroke: var(--color-ink); }
  .zone-card:focus { outline: 2px solid var(--color-red); outline-offset: 2px; }
  .test-tag { font-family: 'Inter', sans-serif; font-size: 11px; letter-spacing: 1px; fill: var(--color-ochre); }
  .test-body { font-family: 'EB Garamond', Georgia, serif; font-size: 12px; font-style: italic; fill: var(--color-secondary); }
  .arrow { stroke: var(--color-secondary); stroke-width: 1.2; fill: none; }
  .tooltip { position: absolute; pointer-events: none; opacity: 0; background: var(--color-ink); color: var(--color-white); padding: 8px 12px; font-family: 'Inter', sans-serif; font-size: 12px; max-width: 280px; transition: opacity 150ms cubic-bezier(0.2,0.8,0.2,1); }
  @media (prefers-reduced-motion: reduce) { * { transition: none !important; animation: none !important; } }
</style>
</head>
<body>
<h1>Three zones, two tests</h1>
<p class="subtitle">Sort each recurring task by where the cognitive load actually lives — then decide what to delegate.</p>
<div id="chart" role="main"></div>
<script src="https://cdnjs.cloudflare.com/ajax/libs/d3/7.9.0/d3.min.js"></script>
<script>
  const FALLBACK_DATA = {
    zones: [
      {
        id: 'ai',
        tag: 'ZONE 1',
        title: 'AI-Appropriate',
        def: 'Production work. The human selects and edits.',
        items: ['Worksheet first draft', 'Six problem variants', 'Article summary', 'Bullets to newsletter'],
        danger: false,
        tooltip: 'Tasks where cognitive load is in production, not judgment. AI drafts; teacher edits. The dividend lands cleanly here.'
      },
      {
        id: 'hybrid',
        tag: 'ZONE 2',
        title: 'Hybrid',
        def: 'AI drafts. Teacher reviews at a phase gate.',
        items: ['Feedback on essays', 'IEP language draft', 'Lesson sequencing', 'Parent email draft'],
        danger: false,
        tooltip: 'Largest single chunk of recoverable time — but only with a phase gate between the draft and what reaches a student or parent.'
      },
      {
        id: 'human',
        tag: 'ZONE 3',
        title: 'Human-Required',
        def: "Non-delegable. The teacher's cognition is the work.",
        items: ['Live response in class', 'Misconception spotting', 'Relationship repair', 'Modelling not-knowing'],
        danger: true,
        tooltip: 'Removing the teacher removes something the student needed. Efficiency is not the criterion here — pedagogical function is.'
      }
    ],
    tests: [
      { tag: 'TEST 1', body: 'Will the output reach a student or parent without review?' },
      { tag: 'TEST 2', body: 'Would removing my cognition remove something the student needed?' }
    ]
  };

  async function loadData() {
    try { return await d3.json('./01-the-ai-dividend-fig-02.json'); }
    catch { return FALLBACK_DATA; }
  }

  function draw(data) {
    d3.select('#chart').selectAll('*').remove();
    const container = document.getElementById('chart');
    const totalWidth  = container.clientWidth  || 900;
    const totalHeight = 480;

    const svg = d3.select('#chart')
      .append('svg')
        .attr('width',  totalWidth)
        .attr('height', totalHeight)
        .attr('viewBox', `0 0 ${totalWidth} ${totalHeight}`)
        .attr('role', 'img')
        .attr('aria-labelledby', 'chart-title chart-desc');

    svg.append('title').attr('id', 'chart-title').text('Three-zone task taxonomy');
    svg.append('desc').attr('id', 'chart-desc').text('Three labelled cards — AI-Appropriate, Hybrid, Human-Required — arranged left to right, with two decision tests printed between adjacent cards.');

    // arrowhead defined once
    const defs = svg.append('defs');
    defs.append('marker')
      .attr('id', 'arrow-end')
      .attr('viewBox', '0 0 10 10')
      .attr('refX', 9).attr('refY', 5)
      .attr('markerWidth', 8).attr('markerHeight', 8)
      .attr('orient', 'auto')
      .append('path').attr('d', 'M0,0 L10,5 L0,10 z').attr('fill', 'var(--color-secondary)');

    // Layout
    const margin = { top: 56, right: 24, bottom: 16, left: 24 };
    const gap = 56;
    const innerWidth = totalWidth - margin.left - margin.right;
    const cardW = (innerWidth - gap * 2) / 3;
    const cardH = 250;
    const cardY = margin.top + 24;

    const zoneX = i => margin.left + i * (cardW + gap);

    // Tooltip
    const tooltip = d3.select('body').selectAll('.tooltip-fig2').data([0]).join('div')
      .attr('class', 'tooltip tooltip-fig2');

    // Zones
    data.zones.forEach((z, i) => {
      const x = zoneX(i);
      const card = svg.append('rect')
        .attr('class', `zone-card${z.danger ? ' danger' : ''}`)
        .attr('x', x).attr('y', cardY).attr('width', cardW).attr('height', cardH)
        .attr('tabindex', 0)
        .attr('role', 'button')
        .attr('aria-label', `${z.title}. ${z.def} Examples: ${z.items.join(', ')}.`)
        .on('mouseover', (event) => tooltip.html(`<strong>${z.title}</strong><br>${z.tooltip}`).style('opacity', 1))
        .on('mousemove', (event) => tooltip.style('left', (event.pageX + 14) + 'px').style('top', (event.pageY - 12) + 'px'))
        .on('mouseout', () => tooltip.style('opacity', 0))
        .on('focus', (event) => {
          const r = event.currentTarget.getBoundingClientRect();
          tooltip.html(`<strong>${z.title}</strong><br>${z.tooltip}`)
            .style('left', (window.scrollX + r.left + 14) + 'px')
            .style('top', (window.scrollY + r.top + 16) + 'px')
            .style('opacity', 1);
        })
        .on('blur', () => tooltip.style('opacity', 0));

      const cx = x + cardW / 2;
      svg.append('text').attr('class', 'zone-tag')
        .attr('x', cx).attr('y', cardY + 24).attr('text-anchor', 'middle').text(z.tag);
      svg.append('text').attr('class', 'zone-title')
        .attr('x', cx).attr('y', cardY + 50).attr('text-anchor', 'middle').text(z.title);

      // Definition (wrap up to 2 lines)
      const defWords = z.def.split(' ');
      const defLines = [];
      let dl = '';
      defWords.forEach(w => {
        if ((dl + ' ' + w).trim().length > 32) { defLines.push(dl.trim()); dl = w; }
        else { dl += ' ' + w; }
      });
      if (dl.trim()) defLines.push(dl.trim());
      defLines.forEach((ln, j) => {
        svg.append('text').attr('class', 'zone-def')
          .attr('x', cx).attr('y', cardY + 72 + j * 18).attr('text-anchor', 'middle').text(ln);
      });

      // Divider
      svg.append('line').attr('class', 'zone-rule')
        .attr('x1', x + 16).attr('x2', x + cardW - 16)
        .attr('y1', cardY + 116).attr('y2', cardY + 116);

      // Items
      z.items.forEach((item, j) => {
        svg.append('text').attr('class', 'zone-item')
          .attr('x', x + 20).attr('y', cardY + 140 + j * 26).text(`— ${item}`);
      });
    });

    // Tests between zones
    data.tests.forEach((t, i) => {
      const xMid = zoneX(i) + cardW + gap / 2;
      // Arrow across the gap
      svg.append('line').attr('class', 'arrow')
        .attr('x1', zoneX(i) + cardW + 6).attr('x2', zoneX(i + 1) - 6)
        .attr('y1', cardY + cardH / 2).attr('y2', cardY + cardH / 2)
        .attr('marker-end', 'url(#arrow-end)');

      // Tag + body below
      svg.append('text').attr('class', 'test-tag')
        .attr('x', xMid).attr('y', cardY + cardH + 28).attr('text-anchor', 'middle').text(t.tag);

      const words = t.body.split(' ');
      const lines = [];
      let line = '';
      words.forEach(w => {
        if ((line + ' ' + w).trim().length > 22) { lines.push(line.trim()); line = w; }
        else { line += ' ' + w; }
      });
      if (line.trim()) lines.push(line.trim());
      lines.forEach((ln, j) => {
        svg.append('text').attr('class', 'test-body')
          .attr('x', xMid).attr('y', cardY + cardH + 48 + j * 16).attr('text-anchor', 'middle').text(ln);
      });
    });

    // Eyebrow at top
    svg.append('text').attr('class', 'eyebrow')
      .attr('x', totalWidth / 2).attr('y', margin.top - 12).attr('text-anchor', 'middle').text('SORTING YOUR WEEK');
  }

  loadData().then(data => {
    draw(data);
    const ro = new ResizeObserver(() => draw(data));
    ro.observe(document.getElementById('chart'));
  });
</script>
</body>
</html>
