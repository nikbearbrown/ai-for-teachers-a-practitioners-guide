<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Figure 14.1 &mdash; Capability-borrowing vs capability-building</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=EB+Garamond:ital,wght@0,400;0,500;1,400&display=swap" rel="stylesheet">
<style>
  :root {
    --color-white: #fdfcfb;
    --color-ink: #2a1a0e;
    --color-secondary: #4a4540;
    --color-muted: #8a8480;
    --color-border: #c8c4c0;
    --color-surface: #f5f2ee;
  }
  @media (prefers-color-scheme: dark) {
    :root {
      --color-white: #1a1410;
      --color-ink: #f5f2ee;
      --color-secondary: #c8c4c0;
      --color-muted: #8a8480;
      --color-border: #4a4540;
      --color-surface: #2a1a0e;
    }
  }
  * { box-sizing: border-box; margin: 0; padding: 0; }
  body { background: var(--color-white); color: var(--color-ink); font-family: 'EB Garamond', Garamond, Georgia, serif; padding: 24px; }
  h1 { font-weight: 400; font-size: 26px; margin-bottom: 4px; }
  p.subtitle { color: var(--color-secondary); font-style: italic; font-size: 15px; margin-bottom: 20px; }
  #chart { width: 100%; min-height: 520px; }
  .node-rect { fill: var(--color-surface); stroke: var(--color-secondary); stroke-width: 1; }
  .node-rect.build { stroke: var(--color-ink); stroke-width: 1.5; }
  .node-text { font-family: 'EB Garamond', Garamond, Georgia, serif; font-size: 14px; fill: var(--color-ink); }
  .heading { font-family: 'EB Garamond', Garamond, Georgia, serif; font-size: 16px; font-style: italic; }
  .heading.borrow { fill: var(--color-secondary); }
  .heading.build { fill: var(--color-ink); }
  .arrow { fill: none; stroke-width: 1.2; }
  .arrow.borrow { stroke: var(--color-secondary); }
  .arrow.build { stroke: var(--color-ink); stroke-width: 1.5; }
  .caption { font-family: 'EB Garamond', Garamond, Georgia, serif; font-style: italic; fill: var(--color-muted); font-size: 12px; }
  .tooltip { position: absolute; pointer-events: none; opacity: 0; background: var(--color-ink); color: var(--color-white); padding: 6px 10px; font-size: 13px; font-family: 'EB Garamond', Garamond, Georgia, serif; transition: opacity 150ms; }
  @media (prefers-reduced-motion: reduce) { * { transition: none !important; animation: none !important; } }
</style>
</head>
<body>
<h1>Figure 14.1 &mdash; Capability-borrowing vs capability-building</h1>
<p class="subtitle">Same tool. Same session. Where the cognitive operation lands decides whether a capability builds.</p>
<div id="chart" role="main"></div>
<script src="https://cdnjs.cloudflare.com/ajax/libs/d3/7.9.0/d3.min.js"></script>
<script>
  const borrow = [
    { id: 'b1', label: 'student prompts the AI' },
    { id: 'b2', label: 'AI produces the artifact' },
    { id: 'b3', label: 'student submits or reads it' },
    { id: 'b4', label: 'artifact exists; capability does not' }
  ];
  const build = [
    { id: 'k1', label: 'student states reasoning' },
    { id: 'k2', label: 'AI asks, probes, points to gaps' },
    { id: 'k3', label: 'student retrieves and revises' },
    { id: 'k4', label: 'artifact sometimes nothing; capability is real' }
  ];

  const tooltip = d3.select('body').append('div').attr('class', 'tooltip');

  function draw() {
    d3.select('#chart').selectAll('*').remove();
    const W = document.getElementById('chart').clientWidth || 700;
    const H = 520;
    const svg = d3.select('#chart').append('svg')
      .attr('viewBox', `0 0 ${W} ${H}`)
      .attr('role', 'img')
      .attr('aria-labelledby', 'ct cd');
    svg.append('title').attr('id', 'ct').text('Capability-borrowing versus capability-building');
    svg.append('desc').attr('id', 'cd').text('Two parallel cognitive flows beginning with the same prompt; only the right column moves cognitive work into the student.');

    svg.append('defs').html(`
      <marker id="ar-b" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
        <path d="M0,0 L10,5 L0,10 z" fill="var(--color-secondary)"/>
      </marker>
      <marker id="ar-k" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
        <path d="M0,0 L10,5 L0,10 z" fill="var(--color-ink)"/>
      </marker>
    `);

    svg.append('text').attr('x', W / 2).attr('y', 28).attr('text-anchor', 'middle')
      .style('font-size', '20px').attr('fill', 'var(--color-ink)')
      .text('Same tool. Same session. Different arrow.');

    svg.append('line').attr('x1', W / 2).attr('y1', 50).attr('x2', W / 2).attr('y2', 470)
      .attr('stroke', 'var(--color-border)').attr('stroke-width', 1).attr('aria-hidden', 'true');

    const colW = (W / 2) - 40;
    const stepY = [80, 150, 220, 290];

    function column(side, data, klass) {
      const cx = side === 'left' ? W / 4 : (3 * W) / 4;
      svg.append('text').attr('x', cx).attr('y', 80).attr('text-anchor', 'middle')
        .attr('class', `heading ${klass}`).text(klass === 'borrow' ? 'Capability-borrowing' : 'Capability-building');

      const g = svg.append('g').attr('class', `g-col g-${klass}`);
      const nodes = g.selectAll('.node-g').data(data, d => d.id).join('g').attr('class', 'node-g');
      nodes.append('rect')
        .attr('class', `node-rect ${klass === 'build' ? 'build' : ''}`)
        .attr('x', cx - colW / 2).attr('y', (d, i) => 110 + i * 70)
        .attr('width', colW).attr('height', 50)
        .attr('tabindex', 0)
        .attr('aria-label', d => d.label)
        .on('mouseover', (event, d) => {
          tooltip.html(`<strong>${klass === 'borrow' ? 'Borrowing' : 'Building'}</strong>: ${d.label}`)
            .style('left', (event.pageX + 12) + 'px').style('top', (event.pageY - 28) + 'px')
            .transition().duration(150).style('opacity', 1);
        })
        .on('mousemove', (event) => {
          tooltip.style('left', (event.pageX + 12) + 'px').style('top', (event.pageY - 28) + 'px');
        })
        .on('mouseout', () => tooltip.transition().duration(100).style('opacity', 0));

      nodes.append('text').attr('class', 'node-text')
        .attr('x', cx).attr('y', (d, i) => 110 + i * 70 + 30)
        .attr('text-anchor', 'middle').text(d => d.label);

      for (let i = 0; i < data.length - 1; i++) {
        svg.append('line').attr('class', `arrow ${klass}`)
          .attr('x1', cx).attr('y1', 110 + i * 70 + 50)
          .attr('x2', cx).attr('y2', 110 + (i + 1) * 70)
          .attr('stroke', klass === 'build' ? 'var(--color-ink)' : 'var(--color-secondary)')
          .attr('marker-end', `url(#ar-${klass === 'build' ? 'k' : 'b'})`);
      }
    }

    column('left', borrow, 'borrow');
    column('right', build, 'build');

    svg.append('text').attr('x', W / 4).attr('y', 470).attr('text-anchor', 'middle')
      .attr('class', 'caption').text('brain state at the end: unchanged');
    svg.append('text').attr('x', (3 * W) / 4).attr('y', 470).attr('text-anchor', 'middle')
      .attr('class', 'caption').attr('fill', 'var(--color-ink)').text('brain state at the end: rewired');

    svg.append('text').attr('x', W / 2).attr('y', 500).attr('text-anchor', 'middle')
      .attr('class', 'caption')
      .text('Figure 14.1 — the cognitive operation, not the tool, determines what the brain takes home.');
  }

  draw();
  const ro = new ResizeObserver(() => draw());
  ro.observe(document.getElementById('chart'));
</script>
</body>
</html>
