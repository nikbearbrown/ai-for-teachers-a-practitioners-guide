<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Figure 14.4 &mdash; Annotated Feynman test conversation</title>
<link href="https://fonts.googleapis.com/css2?family=EB+Garamond:ital,wght@0,400;0,500;1,400&display=swap" rel="stylesheet">
<style>
  :root {
    --color-white: #fdfcfb;
    --color-ink: #2a1a0e;
    --color-secondary: #4a4540;
    --color-muted: #8a8480;
    --color-border: #c8c4c0;
    --color-surface: #f5f2ee;
  }
  @media (prefers-color-scheme: dark) {
    :root {
      --color-white: #1a1410;
      --color-ink: #f5f2ee;
      --color-secondary: #c8c4c0;
      --color-muted: #8a8480;
      --color-border: #4a4540;
      --color-surface: #2a1a0e;
    }
  }
  * { box-sizing: border-box; margin: 0; padding: 0; }
  body { background: var(--color-white); color: var(--color-ink); font-family: 'EB Garamond', Garamond, Georgia, serif; padding: 24px; }
  h1 { font-weight: 400; font-size: 26px; margin-bottom: 4px; }
  p.subtitle { color: var(--color-secondary); font-style: italic; font-size: 15px; margin-bottom: 20px; }
  #chart { width: 100%; min-height: 540px; }
  .frame { fill: var(--color-surface); stroke: var(--color-secondary); stroke-width: 1; }
  .turn-student { fill: var(--color-white); stroke: var(--color-muted); stroke-width: 1; }
  .turn-ai { fill: var(--color-white); stroke: var(--color-secondary); stroke-width: 1; }
  .role { font-style: italic; fill: var(--color-muted); font-size: 11px; }
  .turn-text { fill: var(--color-ink); font-size: 14px; }
  .ann-title { font-style: italic; fill: var(--color-ink); font-size: 13px; }
  .ann-body { fill: var(--color-secondary); font-size: 12px; }
  .caption { font-style: italic; fill: var(--color-muted); font-size: 12px; }
  .tooltip { position: absolute; pointer-events: none; opacity: 0; background: var(--color-ink); color: var(--color-white); padding: 6px 10px; font-size: 13px; font-family: 'EB Garamond', Garamond, Georgia, serif; transition: opacity 150ms; }
  @media (prefers-reduced-motion: reduce) { * { transition: none !important; animation: none !important; } }
</style>
</head>
<body>
<h1>Figure 14.4 &mdash; Student explains. AI probes. Gaps appear.</h1>
<p class="subtitle">A Feynman-test session with the AI cast as audience, not author.</p>
<div id="chart" role="main"></div>
<script src="https://cdnjs.cloudflare.com/ajax/libs/d3/7.9.0/d3.min.js"></script>
<script>
  const turns = [
    { id: 't1', role: 'student',              lines: ['"Plants take in sunlight and CO₂,', 'turn them into sugar and oxygen."'],
      annTitle: 'student does the load-bearing work:', annBody: 'retrieves from memory, picks the words.' },
    { id: 't2', role: 'AI — probing',         lines: ['"What does \'turn them into\' mean', 'at the level of the molecules?"'],
      annTitle: 'AI does adjacent work:', annBody: 'forces specificity, refuses to fill gaps.' },
    { id: 't3', role: 'student — retrieving', lines: ['"Uh — the bonds in CO₂ break, the', 'carbon ends up in … glucose? I think?"'],
      annTitle: 'retrieval attempt — desirable difficulty', annBody: 'storage strength builds on the struggle.' },
    { id: 't4', role: 'AI — pointing to gap', lines: ['"What provides the energy to break', 'those bonds? Where does the oxygen', 'in O₂ actually come from?"'],
      annTitle: 'gap surfaced — go study the gap.', annBody: 'the lesson is what you got stuck on.' }
  ];

  const tooltip = d3.select('body').append('div').attr('class', 'tooltip');

  function draw() {
    d3.select('#chart').selectAll('*').remove();
    const W = document.getElementById('chart').clientWidth || 700;
    const H = 540;

    const svg = d3.select('#chart').append('svg')
      .attr('viewBox', `0 0 ${W} ${H}`)
      .attr('role', 'img')
      .attr('aria-labelledby', 'ct cd');
    svg.append('title').attr('id', 'ct').text('Annotated Feynman test conversation');
    svg.append('desc').attr('id', 'cd').text('Four mocked chat turns labelled with their cognitive operations; student retrieves while AI probes.');

    const chatW = Math.min(440, W * 0.6);
    const chatX = 40;
    const annX = chatX + chatW + 30;

    svg.append('rect').attr('class', 'frame')
      .attr('x', chatX).attr('y', 80).attr('width', chatW).attr('height', H - 130);
    svg.append('text').attr('x', chatX + 14).attr('y', 100).attr('class', 'role')
      .text('topic: photosynthesis — explain it to me');

    const startY = 120;
    const rowH = 80;
    turns.forEach((t, i) => {
      const isStudent = t.role.startsWith('student');
      const xOff = isStudent ? 0 : 40;
      const y = startY + i * (rowH + 10);

      const grp = svg.append('g').attr('tabindex', 0)
        .attr('aria-label', `${t.role}: ${t.lines.join(' ')}`)
        .on('mouseover', (event) => {
          tooltip.html(`<strong>${t.role}</strong><br>${t.annTitle}`)
            .style('left', (event.pageX + 12) + 'px').style('top', (event.pageY - 28) + 'px')
            .transition().duration(150).style('opacity', 1);
        })
        .on('mousemove', (event) => tooltip.style('left', (event.pageX + 12) + 'px').style('top', (event.pageY - 28) + 'px'))
        .on('mouseout', () => tooltip.transition().duration(100).style('opacity', 0));

      grp.append('rect').attr('class', isStudent ? 'turn-student' : 'turn-ai')
        .attr('x', chatX + 16 + xOff).attr('y', y).attr('width', chatW - 60).attr('height', rowH - 6);
      grp.append('text').attr('class', 'role')
        .attr('x', chatX + 24 + xOff).attr('y', y + 16).text(t.role);
      t.lines.forEach((ln, k) => {
        grp.append('text').attr('class', 'turn-text')
          .attr('x', chatX + 24 + xOff).attr('y', y + 34 + k * 16).text(ln);
      });

      // annotation
      svg.append('line').attr('x1', chatX + chatW + 6).attr('y1', y + 26)
        .attr('x2', annX - 10).attr('y2', y + 26).attr('stroke', 'var(--color-secondary)');
      svg.append('text').attr('class', 'ann-title').attr('x', annX).attr('y', y + 22).text(t.annTitle);
      svg.append('text').attr('class', 'ann-body').attr('x', annX).attr('y', y + 42).text(t.annBody);
    });

    svg.append('text').attr('class', 'caption').attr('x', chatX + 16).attr('y', H - 32)
      .text('after — the AI lists every place I got stuck.');
    svg.append('text').attr('class', 'caption').attr('x', chatX + 16).attr('y', H - 16)
      .text('go work on those. that is the lesson.');

    svg.append('text').attr('class', 'caption').attr('x', W / 2).attr('y', H - 2).attr('text-anchor', 'middle')
      .text('Figure 14.4 — mocked conversation; cognitive roles labelled at each turn.');
  }

  draw();
  const ro = new ResizeObserver(() => draw());
  ro.observe(document.getElementById('chart'));
</script>
</body>
</html>
