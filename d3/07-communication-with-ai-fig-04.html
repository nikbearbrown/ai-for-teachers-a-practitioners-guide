<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Figure 7.4 — Three failure modes</title>
  <style>
    :root {
      --color-white:     #FFFFFF;
      --color-ink:       #121212;
      --color-red:       #C8102E;
      --color-secondary: #545454;
      --color-border:    #D4D4D4;
      --color-ochre:     #C8860E;
    }
    @media (prefers-color-scheme: dark) {
      :root {
        --color-white:     #111111;
        --color-ink:       #F0EBE3;
        --color-red:       #E8243A;
        --color-secondary: #A0978C;
        --color-border:    #2E2E2E;
        --color-ochre:     #D49A30;
      }
    }
    * { box-sizing: border-box; margin: 0; padding: 0; }
    body { background: var(--color-white); color: var(--color-ink); font-family: 'EB Garamond', Garamond, Georgia, serif; padding: 16px; }
    #chart { width: 100%; min-height: 580px; }
    .ti { font-family: 'EB Garamond', Garamond, Georgia, serif; font-size: 18px; font-weight: 700; fill: var(--color-ink); }
    .sub { font-family: 'EB Garamond', Garamond, Georgia, serif; font-size: 12px; font-style: italic; fill: var(--color-secondary); }
    .panel { font-family: 'EB Garamond', Garamond, Georgia, serif; font-size: 14px; font-weight: 700; fill: var(--color-white); letter-spacing: 0.4px; }
    .panellbl { font-family: 'EB Garamond', Garamond, Georgia, serif; font-size: 10px; font-weight: 700; fill: var(--color-border); letter-spacing: 0.6px; }
    .rowlbl { font-family: 'EB Garamond', Garamond, Georgia, serif; font-size: 10px; font-weight: 700; fill: var(--color-secondary); letter-spacing: 0.6px; }
    .rowtxt { font-family: 'EB Garamond', Garamond, Georgia, serif; font-size: 12px; fill: var(--color-ink); }
    .footer { font-family: 'EB Garamond', Garamond, Georgia, serif; font-size: 13px; font-style: italic; fill: var(--color-white); }
    .footerlbl { font-family: 'EB Garamond', Garamond, Georgia, serif; font-size: 10px; font-weight: 700; fill: var(--color-white); letter-spacing: 0.6px; }
    .cap { font-family: 'EB Garamond', Garamond, Georgia, serif; font-size: 12px; font-style: italic; fill: var(--color-secondary); }
    .tooltip { position: absolute; pointer-events: none; opacity: 0; background: var(--color-ink); color: var(--color-white); padding: 6px 10px; font-size: 12px; }
    @media (prefers-reduced-motion: reduce) { * { transition: none !important; animation: none !important; } }
  </style>
</head>
<body>
  <div id="chart" role="main"></div>
  <script src="https://cdnjs.cloudflare.com/ajax/libs/d3/7.9.0/d3.min.js"></script>
  <script>
    const PANELS = [
      { n: 1, title1: 'Fabricated', title2: 'specificity',
        cause: 'Thin prompt; no bullets. Model pattern-matches what such notes usually say.',
        parent: 'Confident details the student correctly denies.',
        record: 'Claims the teacher cannot substantiate, now in writing, now in the file.' },
      { n: 2, title1: 'Smoothed-over', title2: 'substance',
        cause: 'Model defaults to professional warmth. Concern is rendered as reassurance.',
        parent: 'Friendly note. The seriousness never lands.',
        record: 'No evidence the concern was conveyed. Six weeks later, the parent agrees.' },
      { n: 3, title1: 'Legal', title2: 'drift',
        cause: 'Model adds institutional phrasings — "out of an abundance of caution."',
        parent: 'Implications the teacher did not intend; the district did not authorize.',
        record: 'Publisher liability runs to the signer, not the composer.' }
    ];

    function draw() {
      d3.select('#chart').selectAll('*').remove();
      const container = document.getElementById('chart');
      const W = container.clientWidth || 700;
      const H = 600;

      const svg = d3.select('#chart').append('svg')
        .attr('width', W).attr('height', H)
        .attr('viewBox', `0 0 ${W} ${H}`)
        .attr('role', 'img')
        .attr('aria-labelledby', 'chart-title chart-desc');
      svg.append('title').attr('id', 'chart-title').text('Three failure modes of AI-drafted sensitive communication');
      svg.append('desc').attr('id', 'chart-desc').text('Three stacked panels: fabricated specificity, smoothed-over substance, legal drift. Each panel has cause, what the parent reads, and what the record shows. A shared footer chip names the cause: the model was asked to invent substance.');

      svg.append('text').attr('class', 'ti').attr('x', 32).attr('y', 34).text('Three failures, one shared cause');
      svg.append('text').attr('class', 'sub').attr('x', 32).attr('y', 54).text('The model was asked to invent substance.');

      const panelW = W - 64;
      const panelH = 120;
      const startY = 80;

      const tooltip = d3.select('body').append('div').attr('class', 'tooltip');
      function show(event, d) {
        tooltip.html(`<strong>${d.title1} ${d.title2}</strong><br>${d.cause}`)
          .style('left', (event.pageX + 12) + 'px').style('top', (event.pageY - 28) + 'px')
          .transition().duration(150).style('opacity', 1);
      }
      function move(event) { tooltip.style('left', (event.pageX + 12) + 'px').style('top', (event.pageY - 28) + 'px'); }
      function hide() { tooltip.transition().duration(100).style('opacity', 0); }

      const groups = svg.selectAll('.panel-g').data(PANELS).join('g')
        .attr('class', 'panel-g')
        .attr('tabindex', 0)
        .attr('aria-label', d => `Panel ${d.n}: ${d.title1} ${d.title2}`)
        .attr('transform', (d, i) => `translate(32, ${startY + i * (panelH + 12)})`)
        .on('mouseover', show).on('mousemove', move).on('mouseout', hide);

      groups.append('rect').attr('x', 0).attr('y', 0).attr('width', panelW).attr('height', panelH)
        .attr('fill', 'var(--color-white)').attr('stroke', 'var(--color-border)').attr('stroke-width', 1);
      groups.append('rect').attr('x', 0).attr('y', 0).attr('width', 160).attr('height', panelH)
        .attr('fill', 'var(--color-red)');
      groups.append('text').attr('class', 'panel').attr('x', 16).attr('y', 28).text(d => d.title1);
      groups.append('text').attr('class', 'panel').attr('x', 16).attr('y', 46).text(d => d.title2);
      groups.append('text').attr('class', 'panellbl').attr('x', 16).attr('y', 70).text(d => `PANEL ${d.n}`);

      groups.append('text').attr('class', 'rowlbl').attr('x', 176).attr('y', 22).text('CAUSE');
      groups.append('text').attr('class', 'rowtxt').attr('x', 176).attr('y', 40).text(d => d.cause);
      groups.append('text').attr('class', 'rowlbl').attr('x', 176).attr('y', 62).text('PARENT READS');
      groups.append('text').attr('class', 'rowtxt').attr('x', 176).attr('y', 80).text(d => d.parent);
      groups.append('text').attr('class', 'rowlbl').attr('x', 176).attr('y', 102).text('RECORD SHOWS');
      groups.append('text').attr('class', 'rowtxt').attr('x', 176).attr('y', 118).text(d => d.record);

      const footerY = startY + 3 * (panelH + 12);
      svg.append('rect').attr('x', 32).attr('y', footerY).attr('width', panelW).attr('height', 40).attr('fill', 'var(--color-ink)');
      svg.append('text').attr('class', 'footerlbl').attr('x', 48).attr('y', footerY + 14).text('SHARED CAUSE');
      svg.append('text').attr('class', 'footer').attr('x', 48).attr('y', footerY + 32).text('The model was asked to invent substance.');

      svg.append('text').attr('class', 'cap').attr('x', W / 2).attr('y', H - 14)
        .attr('text-anchor', 'middle')
        .text('Figure 7.4 — Three different failures, one shared cause.');
    }
    draw();
    new ResizeObserver(() => draw()).observe(document.getElementById('chart'));
  </script>
</body>
</html>
