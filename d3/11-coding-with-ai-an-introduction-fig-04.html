<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Figure 11.4 — Bad spec vs good spec</title>
<style>
  :root {
    --color-white:     #FFFFFF;
    --color-ink:       #121212;
    --color-red:       #C8102E;
    --color-secondary: #545454;
    --color-border:    #D4D4D4;
    --color-ochre:     #C8860E;
  }
  @media (prefers-color-scheme: dark) {
    :root {
      --color-white:     #111111;
      --color-ink:       #F0EBE3;
      --color-red:       #E8243A;
      --color-secondary: #A0978C;
      --color-border:    #2E2E2E;
      --color-ochre:     #D49A30;
    }
  }
  * { box-sizing: border-box; margin: 0; padding: 0; }
  body { background: var(--color-white); color: var(--color-ink);
         font-family: 'EB Garamond', Georgia, serif; padding: 24px; }
  #chart { width: 100%; min-height: 520px; }
  .title-text   { font-family: 'EB Garamond', Georgia, serif; font-size: 22px; fill: var(--color-ink); }
  .subtitle-text{ font-family: 'EB Garamond', Georgia, serif; font-size: 13px; font-style: italic; fill: var(--color-secondary); }
  .panel-label  { font-family: 'EB Garamond', Georgia, serif; font-size: 15px; fill: var(--color-secondary); }
  .spec-rect    { fill: var(--color-white); stroke: var(--color-secondary); stroke-width: 1; }
  .spec-rect.output { fill: var(--color-border); stroke: var(--color-ink); stroke-width: 2; }
  .bad-quote    { font-family: 'EB Garamond', Georgia, serif; font-style: italic; font-size: 14px; fill: var(--color-ink); text-anchor: middle; }
  .guess-label  { font-family: 'Inter', sans-serif; font-size: 12px; fill: var(--color-secondary); }
  .guess-text   { font-family: 'EB Garamond', Georgia, serif; font-size: 13px; fill: var(--color-ink); }
  .clause-title { font-family: 'EB Garamond', Georgia, serif; font-size: 13px; fill: var(--color-ink); }
  .clause-text  { font-family: 'Inter', sans-serif; font-size: 11px; fill: var(--color-secondary); }
  .verdict-bad  { font-family: 'EB Garamond', Georgia, serif; font-style: italic; font-size: 12px; fill: var(--color-red); }
  .verdict-good { font-family: 'EB Garamond', Georgia, serif; font-style: italic; font-size: 12px; fill: var(--color-ink); }
  .divider      { stroke: var(--color-border); stroke-dasharray: 4 4; }
  @media (prefers-reduced-motion: reduce) { * { transition: none !important; animation: none !important; } }
</style>
</head>
<body>
  <div id="chart" role="main"></div>
  <script src="https://cdnjs.cloudflare.com/ajax/libs/d3/7.9.0/d3.min.js"></script>
  <script>
    const GUESSES = [
      'which columns the CSV has',
      'what counts as "missing"',
      'tone of the email body',
      'who sends it, from what address',
      'what to do with blank contacts',
      "how to handle names with apostrophes"
    ];

    const CLAUSES = [
      { title: 'INTENT',           text: 'per-student draft email, not sent',          output: false },
      { title: 'CONSTRAINTS',      text: 'no network, std lib only, skip <3 days',     output: false },
      { title: 'SUCCESS CRITERIA', text: '5-row test file, 3 blocks, 1 logged',         output: false },
      { title: 'EXCLUSIONS',       text: 'no real names, no grades, no API calls',     output: false },
      { title: 'OUTPUT FORMAT',    text: 'drafts.txt, one block per student',          output: true  }
    ];

    function draw() {
      d3.select('#chart').selectAll('*').remove();
      const container = document.getElementById('chart');
      const totalWidth  = container.clientWidth || 800;
      const totalHeight = 520;

      const svg = d3.select('#chart').append('svg')
        .attr('width', totalWidth).attr('height', totalHeight)
        .attr('role', 'img').attr('aria-labelledby', 'chart-title chart-desc');
      svg.append('title').attr('id', 'chart-title').text('Bad spec vs good spec');
      svg.append('desc').attr('id', 'chart-desc').text('Side-by-side comparison: a one-line bad specification and the same task as a five-clause specification.');

      svg.append('text').attr('class', 'title-text').attr('x', totalWidth/2).attr('y', 36).attr('text-anchor', 'middle').text('Bad spec vs good spec');
      svg.append('text').attr('class', 'subtitle-text').attr('x', totalWidth/2).attr('y', 58).attr('text-anchor', 'middle').text('The same task. The difference is what gets left to the model to guess.');

      const colGap = 24;
      const colW = (totalWidth - 48 - colGap) / 2;
      const leftX = 24, rightX = 24 + colW + colGap;
      const topY = 84;

      // LEFT panel
      svg.append('text').attr('class', 'panel-label').attr('x', leftX).attr('y', topY).text('Bad specification');
      svg.append('rect').attr('class', 'spec-rect')
        .attr('x', leftX).attr('y', topY + 18).attr('width', colW).attr('height', 56);
      svg.append('text').attr('class', 'bad-quote').attr('x', leftX + colW/2).attr('y', topY + 42)
        .text('"Make me a script that emails');
      svg.append('text').attr('class', 'bad-quote').attr('x', leftX + colW/2).attr('y', topY + 62)
        .text('parents about missing assignments."');

      svg.append('text').attr('class', 'guess-label').attr('x', leftX).attr('y', topY + 110)
        .text('Silent guesses the model now makes:');

      svg.selectAll('text.guess').data(GUESSES).join('text')
        .attr('class', 'guess-text guess')
        .attr('x', leftX + 14).attr('y', (d,i) => topY + 134 + i * 22)
        .text(d => '— ' + d);

      svg.append('rect').attr('class', 'spec-rect')
        .attr('x', leftX).attr('y', topY + 282).attr('width', colW).attr('height', 40)
        .attr('fill', 'none').attr('stroke', 'var(--color-ink)').attr('stroke-width', 1.4);
      svg.append('text').attr('class', 'verdict-bad')
        .attr('x', leftX + colW/2).attr('y', topY + 306).attr('text-anchor', 'middle')
        .text("Compiles. Runs. Wrong in ways you won't see.");

      // Divider
      const divX = leftX + colW + colGap/2;
      svg.append('line').attr('class', 'divider')
        .attr('x1', divX).attr('y1', topY - 8).attr('x2', divX).attr('y2', topY + 340);

      // RIGHT panel
      svg.append('text').attr('class', 'panel-label').attr('x', rightX).attr('y', topY).text('Good specification');

      const clauseH = 42, clauseGap = 6;
      svg.selectAll('g.clause').data(CLAUSES).join('g')
        .attr('class', 'clause')
        .attr('transform', (d,i) => `translate(${rightX}, ${topY + 18 + i*(clauseH + clauseGap)})`)
        .attr('tabindex', 0)
        .attr('aria-label', d => `${d.title}: ${d.text}`)
        .each(function(d) {
          const g = d3.select(this);
          g.append('rect').attr('class', 'spec-rect' + (d.output ? ' output' : ''))
            .attr('width', colW).attr('height', clauseH);
          g.append('text').attr('class', 'clause-title')
            .attr('x', 12).attr('y', 18).text(d.title);
          g.append('text').attr('class', 'clause-text')
            .attr('x', 12).attr('y', 34).text(d.text);
        });

      const verdictY = topY + 18 + CLAUSES.length * (clauseH + clauseGap) + 8;
      svg.append('rect').attr('class', 'spec-rect')
        .attr('x', rightX).attr('y', verdictY).attr('width', colW).attr('height', 40)
        .attr('fill', 'none').attr('stroke', 'var(--color-ink)').attr('stroke-width', 1.4);
      svg.append('text').attr('class', 'verdict-good')
        .attr('x', rightX + colW/2).attr('y', verdictY + 24).attr('text-anchor', 'middle')
        .text('All five components. Nothing left to guess.');
    }

    draw();
    const ro = new ResizeObserver(() => draw());
    ro.observe(document.getElementById('chart'));
  </script>
</body>
</html>
