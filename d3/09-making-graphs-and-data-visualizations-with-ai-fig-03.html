<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Figure 9.3 — Same mean, three different classes</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=EB+Garamond:wght@400;500&family=Inter:wght@400;600;700&family=JetBrains+Mono:wght@400&display=swap" rel="stylesheet">
<style>
  :root {
    --color-white:     #FFFFFF;
    --color-ink:       #121212;
    --color-red:       #C8102E;
    --color-secondary: #545454;
    --color-border:    #D4D4D4;
    --color-ochre:     #C8860E;
  }
  @media (prefers-color-scheme: dark) {
    :root {
      --color-white:     #111111;
      --color-ink:       #F0EBE3;
      --color-red:       #E8243A;
      --color-secondary: #A0978C;
      --color-border:    #2E2E2E;
      --color-ochre:     #D49A30;
    }
  }
  * { box-sizing: border-box; margin: 0; padding: 0; }
  body { background: var(--color-white); color: var(--color-ink); font-family: 'Inter', sans-serif; padding: 24px; }
  h1 { font-family: 'EB Garamond', Georgia, serif; font-weight: 400; font-size: 28px; margin-bottom: 6px; }
  .subtitle { font-family: 'EB Garamond', Georgia, serif; font-style: italic; color: var(--color-secondary); margin-bottom: 20px; }
  #chart { width: 100%; min-height: 540px; }
  .panel-label { font-family: 'Inter', sans-serif; font-size: 13px; font-weight: 600; fill: var(--color-ink); }
  .row-label { font-family: 'Inter', sans-serif; font-size: 13px; font-weight: 700; fill: var(--color-ink); }
  .axis text { font-family: 'JetBrains Mono', monospace; font-size: 11px; fill: var(--color-secondary); }
  .axis path, .axis line { stroke: var(--color-secondary); }
  .bar-rect { fill: var(--color-red); }
  .strip-point { fill: var(--color-red); fill-opacity: 0.7; transition: fill-opacity 120ms cubic-bezier(0.2,0.8,0.2,1); }
  .strip-point:hover { fill-opacity: 1; }
  .mean-line { stroke: var(--color-ink); stroke-width: 1.5; stroke-dasharray: 3 3; }
  .mean-label { font-family: 'JetBrains Mono', monospace; font-size: 11px; fill: var(--color-ink); }
  .caption { font-family: 'EB Garamond', Georgia, serif; font-style: italic; font-size: 12px; fill: var(--color-secondary); }
  .tooltip { position: absolute; pointer-events: none; opacity: 0; background: var(--color-ink); color: var(--color-white); padding: 6px 10px; border-radius: 4px; font-size: 13px; }
  @media (prefers-reduced-motion: reduce) { * { transition: none !important; animation: none !important; } }
</style>
</head>
<body>
  <h1>Same mean, three different classes</h1>
  <div class="subtitle">A bar of means hides the answer. Distribution charts reveal it.</div>
  <div id="chart" role="main"></div>
  <script src="https://cdnjs.cloudflare.com/ajax/libs/d3/7.9.0/d3.min.js"></script>
  <script>
    // Generate three illustrative distributions, each with mean ~72
    function makeTight() {
      const xs = [];
      for (let v = 70; v <= 74; v++) {
        const n = v === 72 ? 4 : (v === 71 || v === 73 ? 3 : 2);
        for (let i = 0; i < n; i++) xs.push(v);
      }
      return xs;
    }
    function makeBimodal() {
      const xs = [];
      [58, 60, 62].forEach(v => { const n = v === 60 ? 4 : 2; for (let i = 0; i < n; i++) xs.push(v); });
      [82, 84, 86].forEach(v => { const n = v === 84 ? 4 : 2; for (let i = 0; i < n; i++) xs.push(v); });
      return xs;
    }
    function makeLongTail() {
      const xs = [];
      [45, 47, 50, 52, 55].forEach(v => xs.push(v));
      [45, 47, 50].forEach(v => xs.push(v));
      [75, 76, 77, 78].forEach(v => { for (let i = 0; i < 3; i++) xs.push(v); });
      return xs;
    }
    const classData = [
      { id: 'A', label: 'A: tight cluster', caption: 'curriculum is working', values: makeTight() },
      { id: 'B', label: 'B: bimodal',       caption: 'two groups need different things', values: makeBimodal() },
      { id: 'C', label: 'C: long lower tail', caption: 'eight students need intervention', values: makeLongTail() }
    ];

    const tooltip = d3.select('body').append('div').attr('class', 'tooltip');

    function draw() {
      d3.select('#chart').selectAll('*').remove();
      const container = document.getElementById('chart');
      const totalWidth = container.clientWidth || 800;
      const totalHeight = 540;
      const svg = d3.select('#chart').append('svg')
        .attr('width', totalWidth).attr('height', totalHeight)
        .attr('role', 'img').attr('aria-labelledby', 'c-title c-desc');
      svg.append('title').attr('id', 'c-title').text('Three distributions, one mean of 72');
      svg.append('desc').attr('id', 'c-desc').text('Top row: three identical bar charts each labeled mean 72. Bottom row: strip plots of underlying data showing tight cluster, bimodal, and long-lower-tail distributions.');

      const margin = { top: 40, right: 24, bottom: 24, left: 60 };
      const innerW = totalWidth - margin.left - margin.right;
      const innerH = totalHeight - margin.top - margin.bottom;
      const panelGap = 24;
      const panelW = (innerW - 2 * panelGap) / 3;
      const rowH = (innerH - 40) / 2;

      const root = svg.append('g').attr('transform', `translate(${margin.left},${margin.top})`);

      // Row labels
      root.append('text').attr('class', 'row-label').attr('x', -50).attr('y', 16).text('Bar of means');
      root.append('text').attr('class', 'row-label').attr('x', -50).attr('y', rowH + 60).text('Strip plot');

      // TOP ROW: identical bar charts
      classData.forEach((cls, i) => {
        const g = root.append('g').attr('transform', `translate(${i * (panelW + panelGap)}, 0)`);
        g.append('text').attr('class', 'panel-label').attr('x', panelW / 2).attr('y', -6).attr('text-anchor', 'middle').text(`Class ${cls.id} — mean = 72`);
        const yScaleLinear = d3.scaleLinear().domain([0, 100]).range([rowH - 20, 0]);
        const xScaleBand = d3.scaleBand().domain(['mean']).range([panelW / 2 - 40, panelW / 2 + 40]).padding(0.25);
        g.append('g').attr('class', 'axis').attr('transform', `translate(0,${rowH - 20})`).call(d3.axisBottom(xScaleBand).tickFormat(() => ''));
        g.append('g').attr('class', 'axis').call(d3.axisLeft(yScaleLinear).ticks(5));
        g.append('rect').attr('class', 'bar-rect')
          .attr('x', xScaleBand('mean')).attr('y', yScaleLinear(72))
          .attr('width', xScaleBand.bandwidth()).attr('height', (rowH - 20) - yScaleLinear(72))
          .attr('tabindex', 0).attr('aria-label', `Class ${cls.id}: mean 72`);
      });

      // Caption between rows
      root.append('text').attr('class', 'caption').attr('x', innerW / 2).attr('y', rowH + 14).attr('text-anchor', 'middle')
        .text('Three identical bars. Three completely different classes underneath.');

      // BOTTOM ROW: strip plots
      classData.forEach((cls, i) => {
        const g = root.append('g').attr('transform', `translate(${i * (panelW + panelGap)}, ${rowH + 40})`);
        g.append('text').attr('class', 'panel-label').attr('x', panelW / 2).attr('y', -6).attr('text-anchor', 'middle').text(cls.label);

        const xScaleLinear = d3.scaleLinear().domain([40, 100]).range([10, panelW - 10]);
        const stripY = (rowH - 40) / 2;
        // axis
        g.append('g').attr('class', 'axis').attr('transform', `translate(0, ${stripY + 20})`)
          .call(d3.axisBottom(xScaleLinear).ticks(4));

        // jittered dots
        const points = cls.values.map((v, idx) => ({ v, jitter: ((idx * 7) % 13 - 6) * 1.6 }));
        g.append('g').attr('class', 'g-strip').selectAll('.strip-point')
          .data(points, (d, idx) => idx)
          .join('circle')
            .attr('class', 'strip-point')
            .attr('cx', d => xScaleLinear(d.v))
            .attr('cy', d => stripY + d.jitter)
            .attr('r', 3.2)
            .attr('tabindex', 0)
            .attr('aria-label', d => `score ${d.v}`)
            .on('mouseover', (event, d) => {
              tooltip.html(`Class ${cls.id}: <strong>${d.v}</strong>`)
                .style('left', (event.pageX + 12) + 'px').style('top', (event.pageY - 28) + 'px')
                .transition().duration(150).style('opacity', 1);
            })
            .on('mousemove', (event) => tooltip.style('left', (event.pageX + 12) + 'px').style('top', (event.pageY - 28) + 'px'))
            .on('mouseout', () => tooltip.transition().duration(100).style('opacity', 0));

        // mean line at 72
        g.append('line').attr('class', 'mean-line')
          .attr('x1', xScaleLinear(72)).attr('x2', xScaleLinear(72))
          .attr('y1', stripY - 26).attr('y2', stripY + 24);
        g.append('text').attr('class', 'mean-label')
          .attr('x', xScaleLinear(72)).attr('y', stripY - 30).attr('text-anchor', 'middle').text('mean 72');

        g.append('text').attr('class', 'caption').attr('x', panelW / 2).attr('y', stripY + 56).attr('text-anchor', 'middle').text(cls.caption);
      });
    }

    draw();
    const ro = new ResizeObserver(() => draw());
    ro.observe(document.getElementById('chart'));
  </script>
</body>
</html>
