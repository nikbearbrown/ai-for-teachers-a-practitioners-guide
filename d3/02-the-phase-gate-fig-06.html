<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Figure 2.6 — Pedagogical content knowledge (Shulman 1986)</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=EB+Garamond:wght@400;500;700&family=Inter:wght@400;600;700&family=JetBrains+Mono:wght@400&display=swap" rel="stylesheet">
<style>
  :root { --color-white:#FFFFFF; --color-ink:#121212; --color-red:#C8102E; --color-secondary:#545454; --color-border:#D4D4D4; --color-ochre:#C8860E; }
  @media (prefers-color-scheme: dark) {
    :root { --color-white:#111111; --color-ink:#F0EBE3; --color-red:#E8243A; --color-secondary:#A0978C; --color-border:#2E2E2E; --color-ochre:#D49A30; }
  }
  * { box-sizing: border-box; margin: 0; padding: 0; }
  body { background: var(--color-white); color: var(--color-ink); font-family: 'Inter', sans-serif; padding: 24px; }
  h1 { font-family: 'EB Garamond', Georgia, serif; font-weight: 400; font-size: 28px; margin-bottom: 4px; }
  p.subtitle { color: var(--color-secondary); font-size: 13px; margin-bottom: 24px; }
  #chart { width: 100%; height: 500px; }
  .circle { fill: none; stroke: var(--color-ink); stroke-width: 1.6; transition: stroke 200ms cubic-bezier(0.2,0.8,0.2,1); }
  .circle:hover { stroke: var(--color-red); cursor: pointer; }
  .ai-reach { fill: var(--color-border); fill-opacity: 0.2; stroke: var(--color-secondary); stroke-width: 1.2; stroke-dasharray: 6 3; }
  .pck-label { font-family: 'EB Garamond', Georgia, serif; font-size: 16px; font-style: italic; font-weight: 700; fill: var(--color-red); }
  .head { font-family: 'EB Garamond', Georgia, serif; font-size: 14px; font-weight: 700; fill: var(--color-ink); }
  .lb { font-family: 'EB Garamond', Georgia, serif; font-size: 11px; fill: var(--color-ink); }
  .sm { font-family: 'EB Garamond', Georgia, serif; font-size: 11px; fill: var(--color-secondary); }
  .ai { font-family: 'EB Garamond', Georgia, serif; font-size: 12px; font-style: italic; fill: var(--color-secondary); }
  .cap { font-family: 'EB Garamond', Georgia, serif; font-size: 12px; font-style: italic; fill: var(--color-secondary); }
  .tooltip { position: absolute; pointer-events: none; opacity: 0; background: var(--color-ink); color: var(--color-white); padding: 6px 10px; font-size: 12px; max-width: 280px; }
  @media (prefers-reduced-motion: reduce) { * { transition: none !important; animation: none !important; } }
</style>
</head>
<body>
<h1>Figure 2.6 — What AI can reach, what it cannot</h1>
<p class="subtitle">Shulman's pedagogical content knowledge sits in the overlap. AI has zero PCK for the class in front of you.</p>
<div id="chart" role="img" aria-labelledby="t-pck d-pck"></div>
<script src="https://cdnjs.cloudflare.com/ajax/libs/d3/7.9.0/d3.min.js"></script>
<script>
const regions = [
  { id: 'subj', label: 'Subject matter', items: ['Content, facts, procedures', 'Encyclopedias, textbooks', 'Worked solutions'], tip: 'Encyclopedic content knowledge. AI is strong here.' },
  { id: 'ped',  label: 'Pedagogy',       items: ['Generic teaching moves', 'Assessment design', 'Classroom management'], tip: 'Generic pedagogical knowledge, separable from any specific subject.' },
  { id: 'pck',  label: 'PCK',            items: ['Which mistakes this class makes first', 'Which analogy lands here', 'What to reach for when standard fails'], tip: 'Pedagogical content knowledge. Built by repeated direct contact with learners struggling with exactly this material.' }
];

const tooltip = d3.select('body').append('div').attr('class', 'tooltip');
function showTip(e, html) { tooltip.html(html).style('left', (e.pageX+12)+'px').style('top', (e.pageY-28)+'px').transition().duration(150).style('opacity', 1); }
function moveTip(e) { tooltip.style('left', (e.pageX+12)+'px').style('top', (e.pageY-28)+'px'); }
function hideTip() { tooltip.transition().duration(100).style('opacity', 0); }

function draw() {
  d3.select('#chart').selectAll('*').remove();
  const container = document.getElementById('chart');
  const W = container.clientWidth || 760, H = container.clientHeight || 500;
  const svg = d3.select('#chart').append('svg').attr('viewBox', `0 0 ${W} ${H}`).attr('width', W).attr('height', H)
    .attr('role', 'img').attr('aria-labelledby', 't-pck d-pck');
  svg.append('title').attr('id', 't-pck').text('Pedagogical content knowledge — Shulman 1986');
  svg.append('desc').attr('id', 'd-pck').text('Two overlapping circles with a PCK label in the intersection. A dashed AI-reach boundary covers most of the subject-matter circle but stops before the overlap.');

  const cx = W/2, cy = H/2 - 10, r = Math.min(W * 0.22, H * 0.32);
  const offset = r * 0.66;

  // AI reach: covers left circle only, ends before overlap center
  svg.append('ellipse').attr('class', 'ai-reach').attr('cx', cx - offset - r*0.15).attr('cy', cy).attr('rx', r * 1.05).attr('ry', r * 1.05);
  svg.append('text').attr('x', cx - offset - r * 0.9).attr('y', cy - r * 0.95).attr('class', 'ai').text('AI reach');

  // Subject-matter circle (left)
  const subj = svg.append('g').attr('tabindex', 0).attr('role', 'group').attr('aria-label', 'Subject matter knowledge')
    .on('mouseover', (e) => showTip(e, `<strong>Subject matter</strong><br>${regions[0].tip}`))
    .on('mousemove', moveTip).on('mouseout', hideTip);
  subj.append('circle').attr('class', 'circle').attr('cx', cx - offset).attr('cy', cy).attr('r', r);
  subj.append('text').attr('x', cx - offset - r * 0.7).attr('y', cy - r * 0.4).attr('class', 'head').text('Subject matter');
  regions[0].items.forEach((t, i) => {
    subj.append('text').attr('x', cx - offset - r * 0.7).attr('y', cy - r * 0.4 + 22 + i * 16).attr('class', 'sm').text(t);
  });

  // Pedagogy circle (right)
  const ped = svg.append('g').attr('tabindex', 0).attr('role', 'group').attr('aria-label', 'Pedagogical knowledge')
    .on('mouseover', (e) => showTip(e, `<strong>Pedagogy</strong><br>${regions[1].tip}`))
    .on('mousemove', moveTip).on('mouseout', hideTip);
  ped.append('circle').attr('class', 'circle').attr('cx', cx + offset).attr('cy', cy).attr('r', r);
  ped.append('text').attr('x', cx + offset + r * 0.15).attr('y', cy - r * 0.4).attr('class', 'head').text('Pedagogy');
  regions[1].items.forEach((t, i) => {
    ped.append('text').attr('x', cx + offset + r * 0.15).attr('y', cy - r * 0.4 + 22 + i * 16).attr('class', 'sm').text(t);
  });

  // PCK overlap
  const pck = svg.append('g').attr('tabindex', 0).attr('role', 'group').attr('aria-label', 'Pedagogical content knowledge')
    .on('mouseover', (e) => showTip(e, `<strong>PCK</strong><br>${regions[2].tip}`))
    .on('mousemove', moveTip).on('mouseout', hideTip);
  pck.append('text').attr('x', cx).attr('y', cy - r * 0.18).attr('text-anchor', 'middle').attr('class', 'pck-label').text('PCK');
  regions[2].items.forEach((t, i) => {
    pck.append('text').attr('x', cx).attr('y', cy + 4 + i * 16).attr('text-anchor', 'middle').attr('class', 'sm').text(t);
  });

  // AI ends here pointer
  svg.append('line').attr('x1', cx - r * 0.2).attr('y1', cy + r * 0.9).attr('x2', cx - r * 0.4).attr('y2', cy + r * 0.9)
    .attr('stroke', 'var(--color-secondary)').attr('stroke-width', 1).attr('stroke-dasharray', '3 3');
  svg.append('text').attr('x', cx - r * 0.6).attr('y', cy + r * 0.95).attr('text-anchor', 'end').attr('class', 'ai').text('AI ends here');

  svg.append('text').attr('x', W/2).attr('y', H - 14).attr('text-anchor', 'middle').attr('class', 'cap')
    .text('PCK is built by repeated direct contact with learners struggling with exactly this material.');
}

draw();
const ro = new ResizeObserver(() => draw());
ro.observe(document.getElementById('chart'));
</script>
</body>
</html>
