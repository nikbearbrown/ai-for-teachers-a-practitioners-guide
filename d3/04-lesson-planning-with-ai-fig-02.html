<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Figure 4.2 — Backward design and where AI prompts collapse it</title>
  <style>
    :root {
      --color-white:     #FFFFFF;
      --color-ink:       #121212;
      --color-red:       #C8102E;
      --color-secondary: #545454;
      --color-border:    #D4D4D4;
      --color-ochre:     #C8860E;
      --color-stage-fill: #F5F2EE;
      --color-stage-3-fill: #E8E2DA;
    }
    @media (prefers-color-scheme: dark) {
      :root {
        --color-white:     #111111;
        --color-ink:       #F0EBE3;
        --color-red:       #E8243A;
        --color-secondary: #A0978C;
        --color-border:    #2E2E2E;
        --color-ochre:     #D49A30;
        --color-stage-fill: #1A1A1A;
        --color-stage-3-fill: #242020;
      }
    }
    * { box-sizing: border-box; margin: 0; padding: 0; }
    body {
      background: var(--color-white);
      color: var(--color-ink);
      font-family: 'EB Garamond', Georgia, 'Times New Roman', serif;
      padding: 24px;
    }
    #chart { width: 100%; }
    .title-text { font-family: 'EB Garamond', Georgia, serif; font-size: 18px; font-weight: bold; fill: var(--color-ink); }
    .subtitle-text { font-family: 'EB Garamond', Georgia, serif; font-size: 13px; font-style: italic; fill: var(--color-secondary); }
    .stage-name { font-family: 'EB Garamond', Georgia, serif; font-size: 15px; font-weight: bold; fill: var(--color-ink); }
    .stage-q { font-family: 'EB Garamond', Georgia, serif; font-size: 12px; fill: var(--color-secondary); }
    .stage-rect { stroke: var(--color-ink); stroke-width: 1.2; cursor: pointer; transition: opacity 120ms cubic-bezier(0.2, 0.8, 0.2, 1); }
    .stage-rect:hover { opacity: 0.85; }
    .verdict { font-family: 'EB Garamond', Georgia, serif; font-size: 12px; font-style: italic; fill: var(--color-ink); }
    .mark-x { font-family: 'EB Garamond', Georgia, serif; font-size: 24px; font-weight: bold; fill: var(--color-secondary); }
    .mark-check { font-family: 'EB Garamond', Georgia, serif; font-size: 22px; font-weight: bold; fill: var(--color-ink); }
    .caption-text { font-family: 'EB Garamond', Georgia, serif; font-size: 13px; font-style: italic; fill: var(--color-ink); }
    .tooltip {
      position: absolute; pointer-events: none; opacity: 0;
      background: var(--color-white); color: var(--color-ink);
      border: 1px solid var(--color-border); padding: 8px 10px;
      font-family: 'EB Garamond', Georgia, serif; font-size: 13px;
      max-width: 280px; line-height: 1.4;
    }
    @media (prefers-reduced-motion: reduce) {
      * { transition: none !important; animation: none !important; }
    }
  </style>
</head>
<body>
  <div id="chart" role="main"></div>
  <script src="https://cdnjs.cloudflare.com/ajax/libs/d3/7.9.0/d3.min.js"></script>
  <script>
    const stages = [
      { id: 1, name: 'Stage 1', q: 'What should students understand?',
        why: 'The target the entire plan exists to serve. Write it as one sentence before opening the model.' },
      { id: 2, name: 'Stage 2', q: 'What evidence shows they understand it?',
        why: 'The assessment that would confirm Stage 1. Write it as one sentence before opening the model.' },
      { id: 3, name: 'Stage 3', q: 'What activities produce that evidence?',
        why: 'The activities, materials, and timing. This is where the AI is most useful — once Stages 1 and 2 are set.' }
    ];

    const tooltip = d3.select('body').append('div').attr('class', 'tooltip');
    function showTooltip(event, html) {
      tooltip.html(html)
        .style('left', (event.pageX + 12) + 'px')
        .style('top',  (event.pageY - 12) + 'px')
        .transition().duration(150).style('opacity', 1);
    }
    function moveTooltip(event) {
      tooltip.style('left', (event.pageX + 12) + 'px').style('top', (event.pageY - 12) + 'px');
    }
    function hideTooltip() { tooltip.transition().duration(100).style('opacity', 0); }

    function draw() {
      d3.select('#chart').selectAll('*').remove();

      const container = document.getElementById('chart');
      const totalWidth  = container.clientWidth  || 900;
      const totalHeight = 520;

      const svg = d3.select('#chart').append('svg')
        .attr('width', totalWidth).attr('height', totalHeight)
        .attr('role', 'img')
        .attr('aria-labelledby', 'chart-title chart-desc');

      svg.append('title').attr('id', 'chart-title').text('Backward design and where AI prompts collapse it');
      svg.append('desc').attr('id', 'chart-desc')
        .text('A default AI prompt skips Stages 1 and 2 and runs straight to Stage 3; a two-sentence sticky note feeds Stages 1, 2, and a corrected Stage 3 prompt.');

      // Arrow marker
      svg.append('defs').selectAll('marker').data(['arr-ink', 'arr-mute']).join('marker')
        .attr('id', d => d)
        .attr('markerWidth', 9).attr('markerHeight', 7)
        .attr('refX', 8).attr('refY', 3.5).attr('orient', 'auto')
        .append('polygon')
          .attr('points', '0 0, 9 3.5, 0 7')
          .attr('fill', d => d === 'arr-ink' ? 'var(--color-ink)' : 'var(--color-secondary)');

      svg.append('text').attr('class', 'title-text').attr('x', totalWidth / 2).attr('y', 28).attr('text-anchor', 'middle')
        .text('Backward design, and where the default AI prompt collapses it.');
      svg.append('text').attr('class', 'subtitle-text').attr('x', totalWidth / 2).attr('y', 52).attr('text-anchor', 'middle')
        .text('Ninety seconds of Stage 1 + Stage 2 turn a generic draft into one aimed at your room.');

      const margin = { top: 90, right: 40, bottom: 40, left: 40 };
      const innerW = totalWidth - margin.left - margin.right;

      // Three stage box positions
      const stageW = (innerW - 2 * 40) / 3;
      const stageH = 86;
      const stageY = 230;

      const stagePositions = stages.map((s, i) => ({
        ...s,
        x: margin.left + i * (stageW + 40),
        y: stageY,
        w: stageW,
        h: stageH
      }));

      // Top path: default prompt skipping to Stage 3
      const defaultPromptX = margin.left;
      const defaultPromptY = 100;
      const defaultPromptW = 200;
      const defaultPromptH = 50;

      svg.append('rect').attr('class', 'stage-rect')
        .attr('x', defaultPromptX).attr('y', defaultPromptY)
        .attr('width', defaultPromptW).attr('height', defaultPromptH)
        .attr('fill', 'var(--color-stage-fill)')
        .attr('stroke', 'var(--color-secondary)')
        .attr('tabindex', 0)
        .attr('aria-label', 'Default AI prompt')
        .on('mouseover', (event) => showTooltip(event, '<strong>Default AI prompt</strong><br>"Write a 50-minute lesson on X." Skips Stages 1 and 2; lands at Stage 3 with no target.'))
        .on('mousemove', moveTooltip)
        .on('mouseout', hideTooltip)
        .on('focus', (event) => showTooltip(event, '<strong>Default AI prompt</strong><br>"Write a 50-minute lesson on X." Skips Stages 1 and 2; lands at Stage 3 with no target.'))
        .on('blur', hideTooltip);

      svg.append('text').attr('class', 'stage-q').attr('text-anchor', 'middle')
        .attr('x', defaultPromptX + defaultPromptW / 2).attr('y', defaultPromptY + 22)
        .text('Default AI prompt');
      svg.append('text').attr('class', 'stage-q').attr('text-anchor', 'middle')
        .attr('x', defaultPromptX + defaultPromptW / 2).attr('y', defaultPromptY + 40)
        .text('"write a 50-minute lesson on X"');

      // Curved arrow jumping over Stages 1 + 2 to Stage 3
      const stage3 = stagePositions[2];
      const skipPathStartX = defaultPromptX + defaultPromptW;
      const skipPathStartY = defaultPromptY + defaultPromptH / 2;
      const skipPathEndX = stage3.x + stage3.w / 2;
      const skipPathEndY = stage3.y;
      const skipMidX = (skipPathStartX + skipPathEndX) / 2;
      const skipMidY = 70;

      svg.append('path')
        .attr('d', `M ${skipPathStartX} ${skipPathStartY} Q ${skipMidX} ${skipMidY} ${skipPathEndX} ${skipPathEndY}`)
        .attr('fill', 'none')
        .attr('stroke', 'var(--color-secondary)')
        .attr('stroke-width', 1.4)
        .attr('stroke-dasharray', '4 3')
        .attr('marker-end', 'url(#arr-mute)');

      svg.append('text').attr('class', 'verdict').attr('text-anchor', 'middle')
        .attr('x', skipMidX).attr('y', skipMidY + 4)
        .text('skips Stages 1 and 2');
      svg.append('text').attr('class', 'mark-x').attr('text-anchor', 'middle')
        .attr('x', skipMidX).attr('y', skipMidY + 30)
        .text('×');

      // Stage boxes
      const gStages = svg.append('g').attr('class', 'g-stages');
      gStages.selectAll('.stage')
        .data(stagePositions)
        .join('rect')
          .attr('class', 'stage-rect stage')
          .attr('x', d => d.x)
          .attr('y', d => d.y)
          .attr('width', d => d.w)
          .attr('height', d => d.h)
          .attr('fill', d => d.id === 3 ? 'var(--color-stage-3-fill)' : 'var(--color-stage-fill)')
          .attr('tabindex', 0)
          .attr('aria-label', d => d.name + ': ' + d.q)
          .on('mouseover', (event, d) => showTooltip(event, '<strong>' + d.name + '</strong><br>' + d.q + '<br><em>' + d.why + '</em>'))
          .on('mousemove', moveTooltip)
          .on('mouseout', hideTooltip)
          .on('focus', (event, d) => showTooltip(event, '<strong>' + d.name + '</strong><br>' + d.q + '<br><em>' + d.why + '</em>'))
          .on('blur', hideTooltip);

      gStages.selectAll('.stage-name-text')
        .data(stagePositions)
        .join('text')
          .attr('class', 'stage-name stage-name-text')
          .attr('text-anchor', 'middle')
          .attr('x', d => d.x + d.w / 2)
          .attr('y', d => d.y + 26)
          .text(d => d.name);

      gStages.selectAll('.stage-q-text')
        .data(stagePositions)
        .join('text')
          .attr('class', 'stage-q stage-q-text')
          .attr('text-anchor', 'middle')
          .attr('x', d => d.x + d.w / 2)
          .attr('y', d => d.y + 56)
          .text(d => d.q);

      // Arrows between stages
      for (let i = 0; i < stagePositions.length - 1; i++) {
        const a = stagePositions[i], b = stagePositions[i + 1];
        svg.append('line')
          .attr('x1', a.x + a.w).attr('y1', a.y + a.h / 2)
          .attr('x2', b.x).attr('y2', b.y + b.h / 2)
          .attr('stroke', 'var(--color-ink)')
          .attr('stroke-width', 1.4)
          .attr('marker-end', 'url(#arr-ink)');
      }

      // Bottom path: sticky note feeding Stage 1, Stage 2, then Stage 3 prompt
      const noteX = margin.left;
      const noteY = 360;
      const noteW = 200;
      const noteH = 60;

      svg.append('rect').attr('class', 'stage-rect')
        .attr('x', noteX).attr('y', noteY).attr('width', noteW).attr('height', noteH)
        .attr('fill', 'var(--color-white)').attr('stroke', 'var(--color-ink)')
        .attr('tabindex', 0)
        .attr('aria-label', 'Two-sentence sticky note feeding Stage 1 and Stage 2')
        .on('mouseover', (event) => showTooltip(event, '<strong>Two-sentence sticky note</strong><br>Write Stage 1 and Stage 2 in 90 seconds before opening the AI tool. Feeds the prompt with a target and an evidence claim.'))
        .on('mousemove', moveTooltip)
        .on('mouseout', hideTooltip)
        .on('focus', (event) => showTooltip(event, '<strong>Two-sentence sticky note</strong><br>Write Stage 1 and Stage 2 in 90 seconds before opening the AI tool. Feeds the prompt with a target and an evidence claim.'))
        .on('blur', hideTooltip);

      svg.append('text').attr('class', 'stage-q').attr('text-anchor', 'middle')
        .attr('x', noteX + noteW / 2).attr('y', noteY + 22)
        .text('Two-sentence sticky note');
      svg.append('text').attr('class', 'stage-q').attr('text-anchor', 'middle')
        .attr('x', noteX + noteW / 2).attr('y', noteY + 40)
        .text('Stage 1 + Stage 2 in 90 seconds');
      svg.append('text').attr('class', 'stage-q').attr('text-anchor', 'middle')
        .attr('x', noteX + noteW / 2).attr('y', noteY + 55)
        .text('written by the teacher');

      // Curved arrows from sticky note to Stage 1 and Stage 2
      const stage1 = stagePositions[0];
      const stage2 = stagePositions[1];

      svg.append('path')
        .attr('d', `M ${noteX + noteW / 2} ${noteY} Q ${stage1.x + stage1.w / 2} ${noteY - 40} ${stage1.x + stage1.w / 2} ${stage1.y + stage1.h}`)
        .attr('fill', 'none').attr('stroke', 'var(--color-ink)').attr('stroke-width', 1.4)
        .attr('marker-end', 'url(#arr-ink)');

      svg.append('path')
        .attr('d', `M ${noteX + noteW} ${noteY + 20} Q ${stage2.x + stage2.w / 2} ${noteY + 40} ${stage2.x + stage2.w / 2} ${stage2.y + stage2.h}`)
        .attr('fill', 'none').attr('stroke', 'var(--color-ink)').attr('stroke-width', 1.4)
        .attr('marker-end', 'url(#arr-ink)');

      // Stage 3 prompt rectangle below Stage 3
      const promptX = stage3.x;
      const promptY = stage3.y + stage3.h + 40;
      const promptW = stage3.w;
      const promptH = 60;

      svg.append('rect').attr('class', 'stage-rect')
        .attr('x', promptX).attr('y', promptY).attr('width', promptW).attr('height', promptH)
        .attr('fill', 'var(--color-white)').attr('stroke', 'var(--color-ink)')
        .attr('tabindex', 0)
        .attr('aria-label', 'Stage 3 AI prompt with targets specified')
        .on('mouseover', (event) => showTooltip(event, '<strong>Stage 3 AI prompt</strong><br>"Given these targets and this evidence, propose activities." The model proposes structure for a purpose you have already specified.'))
        .on('mousemove', moveTooltip)
        .on('mouseout', hideTooltip)
        .on('focus', (event) => showTooltip(event, '<strong>Stage 3 AI prompt</strong><br>"Given these targets and this evidence, propose activities." The model proposes structure for a purpose you have already specified.'))
        .on('blur', hideTooltip);

      svg.append('text').attr('class', 'stage-q').attr('text-anchor', 'middle')
        .attr('x', promptX + promptW / 2).attr('y', promptY + 22)
        .text('Stage 3 AI prompt');
      svg.append('text').attr('class', 'stage-q').attr('text-anchor', 'middle')
        .attr('x', promptX + promptW / 2).attr('y', promptY + 40)
        .text('given the targets + evidence,');
      svg.append('text').attr('class', 'stage-q').attr('text-anchor', 'middle')
        .attr('x', promptX + promptW / 2).attr('y', promptY + 55)
        .text('propose activities');

      // Arrow from Stage 3 down to AI prompt
      svg.append('line')
        .attr('x1', stage3.x + stage3.w / 2).attr('y1', stage3.y + stage3.h)
        .attr('x2', promptX + promptW / 2).attr('y2', promptY)
        .attr('stroke', 'var(--color-ink)').attr('stroke-width', 1.4)
        .attr('marker-end', 'url(#arr-ink)');

      // Check mark + verdict
      svg.append('text').attr('class', 'mark-check').attr('text-anchor', 'middle')
        .attr('x', promptX + promptW / 2).attr('y', promptY + promptH + 24)
        .text('✓');

      svg.append('text').attr('class', 'caption-text').attr('text-anchor', 'middle')
        .attr('x', totalWidth / 2).attr('y', totalHeight - 16)
        .text('The ninety seconds before the prompt are the most important ninety seconds in the workflow.');
    }

    draw();
    const ro = new ResizeObserver(() => draw());
    ro.observe(document.getElementById('chart'));
  </script>
</body>
</html>
