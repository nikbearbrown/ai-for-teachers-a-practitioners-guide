<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Figure 12.1 — Tacit-to-explicit knowledge conversion</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=EB+Garamond:wght@400;600&family=Inter:wght@400;600;700&family=JetBrains+Mono:wght@400&display=swap" rel="stylesheet">
<style>
  :root {
    --color-white:     #FFFFFF;
    --color-ink:       #2a1a0e;
    --color-red:       #C8102E;
    --color-secondary: #545454;
    --color-border:    #D4D4D4;
    --color-ochre:     #C8860E;
  }
  @media (prefers-color-scheme: dark) {
    :root {
      --color-white:     #111111;
      --color-ink:       #F0EBE3;
      --color-red:       #E8243A;
      --color-secondary: #A0978C;
      --color-border:    #2E2E2E;
      --color-ochre:     #D49A30;
    }
  }
  * { box-sizing: border-box; margin: 0; padding: 0; }
  body { background: var(--color-white); color: var(--color-ink); font-family: 'Inter', sans-serif; padding: 24px; }
  h1 { font-family: 'EB Garamond', Georgia, serif; font-weight: 400; font-size: 28px; margin-bottom: 4px; }
  p.subtitle { color: var(--color-secondary); font-size: 13px; margin-bottom: 24px; }
  #chart { width: 100%; height: 440px; }
  .node-rect { fill: var(--color-white); stroke: var(--color-ink); stroke-width: 1.2; cursor: pointer; transition: stroke-width 200ms cubic-bezier(0.2,0.8,0.2,1); }
  .node-rect:hover { stroke-width: 2.2; }
  .node-rect.decay { fill: var(--color-white); stroke: var(--color-red); stroke-dasharray: 5 4; }
  .node-rect.explicit { fill: color-mix(in srgb, var(--color-ochre) 8%, var(--color-white)); }
  .node-title { font-family: 'EB Garamond', Georgia, serif; font-size: 16px; font-weight: 600; fill: var(--color-ink); }
  .node-line { font-family: 'Inter', sans-serif; font-size: 12px; fill: var(--color-secondary); }
  .arrow-label { font-family: 'Inter', sans-serif; font-size: 11px; font-style: italic; fill: var(--color-ink); }
  .arrow-label.decay { fill: var(--color-red); }
  .caption { color: var(--color-secondary); font-size: 13px; margin-top: 16px; max-width: 65ch; }
  .tooltip { position: absolute; pointer-events: none; opacity: 0; background: var(--color-ink); color: var(--color-white); padding: 8px 12px; font-family: 'Inter', sans-serif; font-size: 12px; max-width: 280px; }
  @media (prefers-reduced-motion: reduce) { * { transition: none !important; animation: none !important; } }
</style>
</head>
<body>
<h1>Figure 12.1 — Tacit-to-explicit knowledge conversion</h1>
<p class="subtitle">The capture event is the difference between a library that compounds and a tab that closes.</p>
<div id="chart" role="img" aria-labelledby="chart-title chart-desc"></div>
<p class="caption">After Davenport &amp; Prusak (1998). Knowledge converts only when the structure forces the capture event.</p>
<script src="https://cdnjs.cloudflare.com/ajax/libs/d3/7.9.0/d3.min.js"></script>
<script>
const nodeData = [
  {
    id: 'tacit',
    title: 'Tacit knowledge',
    lines: ['prompt patterns', 'trust judgments', 'phase-gate habits', 'lives in your head'],
    tip: 'What you have learned by trial and error. Real, hard-won, professionally valuable — and invisible to anyone but you.'
  },
  {
    id: 'explicit',
    title: 'Explicit knowledge',
    lines: ['parameterized', 'labeled', 'maintained', 'reusable'],
    tip: 'workflow.md — the captured library. Organized, named, parameterized, and refreshed twice a year.',
    klass: 'explicit'
  },
  {
    id: 'closed',
    title: 'Closed tab',
    lines: ['no save', 'reinvented next Tuesday', 'slightly worse each time'],
    tip: 'The natural state when no structure forces the capture event. Same teacher, same talent, no asset.',
    klass: 'decay'
  }
];

const tooltip = d3.select('body').append('div').attr('class', 'tooltip');
function showTip(event, html) {
  tooltip.html(html).style('left', (event.pageX + 12) + 'px').style('top', (event.pageY - 28) + 'px')
    .transition().duration(150).style('opacity', 1);
}
function moveTip(event) { tooltip.style('left', (event.pageX + 12) + 'px').style('top', (event.pageY - 28) + 'px'); }
function hideTip() { tooltip.transition().duration(100).style('opacity', 0); }

function draw() {
  const container = document.getElementById('chart');
  d3.select('#chart').selectAll('*').remove();
  const totalWidth  = container.clientWidth  || 800;
  const totalHeight = container.clientHeight || 440;

  const svg = d3.select('#chart').append('svg')
    .attr('width', totalWidth).attr('height', totalHeight)
    .attr('role', 'img').attr('aria-labelledby', 'chart-title chart-desc');
  svg.append('title').attr('id', 'chart-title').text('Tacit-to-explicit conversion and the decay path');
  svg.append('desc').attr('id', 'chart-desc').text('Tacit knowledge converts to an explicit library when a capture event fires; otherwise it decays to a closed-tab loop.');

  // arrow markers
  const defs = svg.append('defs');
  defs.append('marker').attr('id', 'arInk').attr('markerWidth', 9).attr('markerHeight', 7).attr('refX', 8).attr('refY', 3.5).attr('orient', 'auto')
    .append('polygon').attr('points', '0 0, 9 3.5, 0 7').attr('fill', 'var(--color-ink)');
  defs.append('marker').attr('id', 'arRed').attr('markerWidth', 9).attr('markerHeight', 7).attr('refX', 8).attr('refY', 3.5).attr('orient', 'auto')
    .append('polygon').attr('points', '0 0, 9 3.5, 0 7').attr('fill', 'var(--color-red)');

  // layout
  const boxW = Math.min(220, (totalWidth - 96) / 3.4);
  const boxH = 168;
  const yTop = 76;
  const gap  = Math.max(40, (totalWidth - boxW * 3) / 4);

  const xs = [gap, gap * 2 + boxW, gap * 3 + boxW * 2];

  nodeData.forEach((n, i) => {
    const g = svg.append('g').attr('transform', `translate(${xs[i]},${yTop})`)
      .attr('tabindex', 0).attr('aria-label', `${n.title}: ${n.lines.join(', ')}`)
      .on('mouseover', (event) => showTip(event, `<strong>${n.title}</strong><br/>${n.tip}`))
      .on('mousemove', moveTip)
      .on('mouseout', hideTip);

    g.append('rect')
      .attr('class', 'node-rect' + (n.klass ? ' ' + n.klass : ''))
      .attr('width', boxW).attr('height', boxH);

    g.append('text').attr('class', 'node-title')
      .attr('x', 16).attr('y', 30).text(n.title);

    n.lines.forEach((ln, j) => {
      g.append('text').attr('class', 'node-line')
        .attr('x', 16).attr('y', 60 + j * 22).text('— ' + ln);
    });
  });

  // Arrow A -> B
  const a1y = yTop + boxH / 2;
  svg.append('line')
    .attr('x1', xs[0] + boxW).attr('y1', a1y)
    .attr('x2', xs[1] - 8).attr('y2', a1y)
    .attr('stroke', 'var(--color-ink)').attr('stroke-width', 1.6)
    .attr('marker-end', 'url(#arInk)');
  svg.append('text').attr('class', 'arrow-label')
    .attr('x', (xs[0] + boxW + xs[1]) / 2).attr('y', a1y - 10).attr('text-anchor', 'middle')
    .text('capture event');
  svg.append('text').attr('class', 'arrow-label')
    .attr('x', (xs[0] + boxW + xs[1]) / 2).attr('y', a1y + 18).attr('text-anchor', 'middle')
    .style('font-style', 'italic').style('fill', 'var(--color-secondary)')
    .text('"the prompt worked — save to workflow.md"');

  // Decay arc B -> C (or A -> C visually as a loop above)
  const arcStartX = xs[0] + boxW / 2;
  const arcStartY = yTop;
  const arcEndX   = xs[2] + boxW / 2;
  const arcEndY   = yTop;
  const arcPath = `M ${arcStartX} ${arcStartY}
                   C ${arcStartX} ${yTop - 60}, ${arcEndX} ${yTop - 60}, ${arcEndX} ${arcEndY}`;
  svg.append('path')
    .attr('d', arcPath).attr('fill', 'none')
    .attr('stroke', 'var(--color-red)').attr('stroke-width', 1.4).attr('stroke-dasharray', '5 4')
    .attr('marker-end', 'url(#arRed)');
  svg.append('text').attr('class', 'arrow-label decay')
    .attr('x', (arcStartX + arcEndX) / 2).attr('y', yTop - 48).attr('text-anchor', 'middle')
    .text('no capture — knowledge evaporates');
}

draw();
const ro = new ResizeObserver(() => draw());
ro.observe(document.getElementById('chart'));
</script>
</body>
</html>
