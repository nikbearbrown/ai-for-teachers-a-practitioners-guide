<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Figure 5.3 — The re-run is fifteen minutes; the drift is a semester</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=EB+Garamond:wght@400;500;700&family=Inter:wght@400;600;700&family=JetBrains+Mono:wght@400&display=swap" rel="stylesheet">
<style>
  :root {
    --color-white:     #FFFFFF;
    --color-ink:       #121212;
    --color-red:       #C8102E;
    --color-secondary: #545454;
    --color-border:    #D4D4D4;
    --color-ochre:     #C8860E;
  }
  @media (prefers-color-scheme: dark) {
    :root {
      --color-white:     #111111;
      --color-ink:       #F0EBE3;
      --color-red:       #E8243A;
      --color-secondary: #A0978C;
      --color-border:    #2E2E2E;
      --color-ochre:     #D49A30;
    }
  }
  * { box-sizing: border-box; margin: 0; padding: 0; }
  body { background: var(--color-white); color: var(--color-ink); font-family: 'EB Garamond', Georgia, serif; padding: 24px; }
  h1 { font-family: 'EB Garamond', Georgia, serif; font-weight: 400; font-size: 28px; margin-bottom: 4px; }
  p.subtitle { color: var(--color-secondary); font-family: 'EB Garamond', Georgia, serif; font-style: italic; font-size: 14px; margin-bottom: 24px; }
  #chart { width: 100%; height: 540px; }
  .ti  { font-family: 'EB Garamond', Georgia, serif; font-size: 16px; font-weight: 700; fill: var(--color-ink); }
  .sub { font-family: 'EB Garamond', Georgia, serif; font-size: 12px; font-style: italic; fill: var(--color-secondary); }
  .col-h { font-family: 'EB Garamond', Georgia, serif; font-size: 14px; font-weight: 700; fill: var(--color-ink); }
  .step { font-family: 'EB Garamond', Georgia, serif; font-size: 13px; fill: var(--color-ink); }
  .step-dim { font-family: 'EB Garamond', Georgia, serif; font-size: 12px; fill: var(--color-secondary); font-style: italic; }
  .num { font-family: 'EB Garamond', Georgia, serif; font-size: 12px; font-weight: 700; fill: var(--color-white); }
  .out { font-family: 'EB Garamond', Georgia, serif; font-size: 13px; font-weight: 700; fill: var(--color-white); }
  .out-sub { font-family: 'EB Garamond', Georgia, serif; font-size: 11px; font-style: italic; fill: var(--color-border); }
  .cap { font-family: 'EB Garamond', Georgia, serif; font-size: 12px; font-style: italic; fill: var(--color-secondary); }
  .node { transition: opacity 200ms cubic-bezier(0.2,0.8,0.2,1); cursor: pointer; }
  .node:hover { opacity: 0.85; }
  .tooltip { position: absolute; pointer-events: none; opacity: 0; background: var(--color-ink); color: var(--color-white); padding: 6px 10px; font-family: 'EB Garamond', Georgia, serif; font-size: 13px; max-width: 280px; }
  @media (prefers-reduced-motion: reduce) { * { transition: none !important; animation: none !important; } }
</style>
</head>
<body>
<h1>Figure 5.3 — The re-run is fifteen minutes; the drift is a semester</h1>
<p class="subtitle">The fifth calibration step — re-running on the same samples — is the one most people skip.</p>
<div id="chart" role="img" aria-labelledby="t-rr d-rr"></div>
<script src="https://cdnjs.cloudflare.com/ajax/libs/d3/7.9.0/d3.min.js"></script>
<script>
const FALLBACK_DATA = {
  without: [
    { n: 1, title: 'Offset noticed', body: 'AI runs half a point high on the first five.', tip: 'A quick visual scan after the first pass. The discrepancy is real and visible.' },
    { n: 2, title: 'Mental note',     body: '"I will adjust as I review."',                  tip: 'No artifact change. The fix lives only in the teacher\'s head.' },
    { n: 3, title: 'Scale to all',    body: 'Process all 110 essays.',                       tip: 'Mental correction is the only safeguard against the offset.' },
    { n: 4, title: 'Drift propagates', body: 'By essay 40 the offset is invisible.',         tip: 'Cognitive fatigue erodes the mental adjustment. Drift accelerates silently.' },
    { n: 5, title: 'Distribution off', body: 'Grades off by half a level — class-wide.',     tip: 'Real grades on real transcripts now reflect the uncalibrated drift.' }
  ],
  with: [
    { n: 1, title: 'Offset noticed', body: 'Same visual check, same finding.',               tip: 'Identical to the left column. The fork is in step two.' },
    { n: 2, title: 'Prompt revised', body: 'Add anchors, ceiling, sharper language.',         tip: 'The fix lives in the artifact, not the head. Anchor essays at missing levels; explicit rubric ceiling; negative anchor for the over-permissive failure mode.' },
    { n: 3, title: 'Re-run on five', body: 'Fifteen minutes — verify the fix worked.',        tip: 'Re-run on the same five samples. The step most teachers skip is the step that closes the loop.' },
    { n: 4, title: 'Within ±0.5',    body: 'Scale to all 110.',                               tip: 'The prompt is closed. Drift cannot start because the calibration is now in the artifact.' },
    { n: 5, title: 'Distribution true', body: 'Matches teacher judgment. Reviewable.',         tip: 'The grades are defensible because the calibration is documented and repeatable.' }
  ]
};

const tooltip = d3.select('body').append('div').attr('class', 'tooltip');
function showTip(event, html) {
  tooltip.html(html).style('left', (event.pageX + 12) + 'px').style('top', (event.pageY - 28) + 'px')
    .transition().duration(150).style('opacity', 1);
}
function moveTip(event) { tooltip.style('left', (event.pageX + 12) + 'px').style('top', (event.pageY - 28) + 'px'); }
function hideTip() { tooltip.transition().duration(100).style('opacity', 0); }

async function loadData() {
  try { return await d3.json('./05-assessment-grading-and-feedback-with-ai-fig-03.json'); }
  catch { return FALLBACK_DATA; }
}

function draw(data) {
  d3.select('#chart').selectAll('*').remove();
  const container = document.getElementById('chart');
  const W = container.clientWidth || 760;
  const H = container.clientHeight || 540;

  const svg = d3.select('#chart').append('svg')
    .attr('viewBox', `0 0 ${W} ${H}`).attr('width', W).attr('height', H)
    .attr('role', 'img').attr('aria-labelledby', 't-rr d-rr');
  svg.append('title').attr('id', 't-rr').text('The re-run is fifteen minutes; the drift is a semester');
  svg.append('desc').attr('id', 'd-rr').text('Two five-step timelines side by side, contrasting calibration without the closing re-run against calibration with it.');

  // Arrowhead marker
  svg.append('defs').append('marker').attr('id', 'arrL').attr('viewBox', '0 0 10 10').attr('refX', 9).attr('refY', 5)
    .attr('markerWidth', 8).attr('markerHeight', 8).attr('orient', 'auto')
    .append('path').attr('d', 'M0,0 L10,5 L0,10 z').attr('fill', 'var(--color-secondary)');

  // Title & subtitle
  svg.append('text').attr('x', 32).attr('y', 30).attr('class', 'ti').text('The re-run is fifteen minutes; the drift is a semester');
  svg.append('text').attr('x', 32).attr('y', 48).attr('class', 'sub').text('The fifth calibration step is the one most people skip.');

  const colLX = W * 0.27, colRX = W * 0.73;
  const dividerX = W / 2;

  // Column headers
  svg.append('text').attr('x', colLX).attr('y', 82).attr('text-anchor', 'middle').attr('class', 'col-h').text('Without the re-run');
  svg.append('text').attr('x', colRX).attr('y', 82).attr('text-anchor', 'middle').attr('class', 'col-h').text('With the re-run');

  svg.append('line').attr('x1', dividerX).attr('y1', 60).attr('x2', dividerX).attr('y2', H - 100)
    .attr('stroke', 'var(--color-border)').attr('stroke-dasharray', '4 4');

  // Step layout
  const stepY0 = 110, stepH = 50;

  function renderColumn(items, xCenter, dark) {
    const fillCircle = dark ? 'var(--color-ink)' : 'var(--color-secondary)';
    const textX = xCenter + 24;
    items.forEach((d, i) => {
      const y = stepY0 + i * stepH;
      const g = svg.append('g').attr('class', 'node').attr('opacity', 0)
        .attr('tabindex', 0).attr('aria-label', `Step ${d.n}: ${d.title}`)
        .on('mouseover', (e) => showTip(e, `<strong>Step ${d.n}: ${d.title}</strong><br>${d.tip}`))
        .on('mousemove', moveTip).on('mouseout', hideTip)
        .on('keydown', (e) => { if (e.key === 'Enter' || e.key === ' ') showTip(e, `<strong>Step ${d.n}: ${d.title}</strong><br>${d.tip}`); });
      g.transition().duration(320).delay(i * 60).attr('opacity', 1);
      g.append('circle').attr('cx', xCenter).attr('cy', y).attr('r', 12).attr('fill', fillCircle);
      g.append('text').attr('x', xCenter).attr('y', y + 4).attr('text-anchor', 'middle').attr('class', 'num').text(d.n);
      g.append('text').attr('x', textX).attr('y', y - 4).attr('class', 'step').text(d.title);
      g.append('text').attr('x', textX).attr('y', y + 12).attr('class', 'step-dim').text(d.body);
    });
    // arrows between
    for (let i = 0; i < items.length - 1; i++) {
      const y1 = stepY0 + i * stepH + 12;
      const y2 = stepY0 + (i + 1) * stepH - 12;
      svg.append('line').attr('x1', xCenter).attr('y1', y1).attr('x2', xCenter).attr('y2', y2)
        .attr('stroke', 'var(--color-secondary)').attr('stroke-width', 1).attr('marker-end', 'url(#arrL)');
    }
  }

  renderColumn(data.without, 60, false);
  renderColumn(data.with,    dividerX + 28, true);

  // Outcome chips
  const outY = stepY0 + 5 * stepH + 16;
  // Left outcome — red
  svg.append('rect').attr('x', 40).attr('y', outY).attr('width', dividerX - 60).attr('height', 50).attr('fill', 'var(--color-red)');
  svg.append('text').attr('x', 40 + (dividerX - 60) / 2).attr('y', outY + 22).attr('text-anchor', 'middle').attr('class', 'out').text('Outcome: systematic upward drift');
  svg.append('text').attr('x', 40 + (dividerX - 60) / 2).attr('y', outY + 40).attr('text-anchor', 'middle').attr('class', 'out-sub').text('Calibration that is not closed in the prompt');

  // Right outcome — ink
  svg.append('rect').attr('x', dividerX + 20).attr('y', outY).attr('width', dividerX - 60).attr('height', 50).attr('fill', 'var(--color-ink)');
  svg.append('text').attr('x', dividerX + 20 + (dividerX - 60) / 2).attr('y', outY + 22).attr('text-anchor', 'middle').attr('class', 'out').text('Outcome: calibrated and stable');
  svg.append('text').attr('x', dividerX + 20 + (dividerX - 60) / 2).attr('y', outY + 40).attr('text-anchor', 'middle').attr('class', 'out-sub').text('Fifteen minutes spent up front');

  // Footer
  svg.append('text').attr('x', 32).attr('y', H - 32).attr('class', 'cap').text('Calibration that is not closed in the prompt is calibration that is not happening.');
  svg.append('text').attr('x', 32).attr('y', H - 14).attr('class', 'cap').text('Fifteen minutes of re-run beats a semester of corrected distributions.');
}

loadData().then(data => {
  draw(data);
  const ro = new ResizeObserver(() => draw(data));
  ro.observe(document.getElementById('chart'));
});
</script>
</body>
</html>
