<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Figure 12.2 — Goal system vs habit system</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=EB+Garamond:wght@400;600&family=Inter:wght@400;600;700&family=JetBrains+Mono:wght@400&display=swap" rel="stylesheet">
<style>
  :root {
    --color-white:     #FFFFFF;
    --color-ink:       #2a1a0e;
    --color-red:       #C8102E;
    --color-secondary: #545454;
    --color-border:    #D4D4D4;
    --color-ochre:     #C8860E;
  }
  @media (prefers-color-scheme: dark) {
    :root {
      --color-white:     #111111;
      --color-ink:       #F0EBE3;
      --color-red:       #E8243A;
      --color-secondary: #A0978C;
      --color-border:    #2E2E2E;
      --color-ochre:     #D49A30;
    }
  }
  * { box-sizing: border-box; margin: 0; padding: 0; }
  body { background: var(--color-white); color: var(--color-ink); font-family: 'Inter', sans-serif; padding: 24px; }
  h1 { font-family: 'EB Garamond', Georgia, serif; font-weight: 400; font-size: 28px; margin-bottom: 4px; }
  p.subtitle { color: var(--color-secondary); font-size: 13px; margin-bottom: 24px; }
  #chart { width: 100%; height: 520px; }
  .track-label { font-family: 'EB Garamond', Georgia, serif; font-size: 16px; font-weight: 600; fill: var(--color-ink); }
  .track-label.goal { fill: var(--color-secondary); }
  .track-sub   { font-family: 'Inter', sans-serif; font-size: 11px; font-style: italic; fill: var(--color-secondary); }
  .station     { stroke: var(--color-ink); fill: var(--color-white); stroke-width: 1.2; cursor: pointer; transition: stroke-width 200ms cubic-bezier(0.2,0.8,0.2,1); }
  .station.goal { stroke: var(--color-secondary); }
  .station:hover { stroke-width: 2.2; }
  .station-label { font-family: 'Inter', sans-serif; font-size: 11px; font-weight: 600; fill: var(--color-ink); }
  .station-sub   { font-family: 'Inter', sans-serif; font-size: 10px; fill: var(--color-secondary); }
  .endpoint     { fill: var(--color-ink); }
  .endpoint-text{ font-family: 'EB Garamond', Georgia, serif; font-size: 14px; font-weight: 600; fill: var(--color-white); }
  .caption { color: var(--color-secondary); font-size: 13px; margin-top: 16px; max-width: 65ch; }
  .tooltip { position: absolute; pointer-events: none; opacity: 0; background: var(--color-ink); color: var(--color-white); padding: 8px 12px; font-family: 'Inter', sans-serif; font-size: 12px; max-width: 280px; }
  @media (prefers-reduced-motion: reduce) { * { transition: none !important; animation: none !important; } }
</style>
</head>
<body>
<h1>Figure 12.2 — Goal system vs habit system</h1>
<p class="subtitle">Two routes to the same output. Only one is robust to a hard Wednesday.</p>
<div id="chart" role="img" aria-labelledby="chart-title chart-desc"></div>
<p class="caption">After Wood &amp; Neal: habits are not goal-driven, they are context-cued. Hover any station to read the activation cost.</p>
<script src="https://cdnjs.cloudflare.com/ajax/libs/d3/7.9.0/d3.min.js"></script>
<script>
const goalStations = [
  { label: 'Motivation', sub: 'high', tip: 'Activation cost: high. Depends on willpower, which depletes by Wednesday afternoon.' },
  { label: 'Open tool',  sub: 'whichever one', tip: 'Activation cost: low — but no consistency. Different tool each session.' },
  { label: 'Write prompt', sub: 'from scratch', tip: 'Activation cost: very high. Tacit knowledge gets re-derived every time.' },
  { label: 'Use output', sub: 'maybe revise', tip: 'Activation cost: medium. Phase gate is optional, frequently skipped under pressure.' },
  { label: 'Close tab',  sub: 'no save', tip: 'Activation cost: zero — and this is the problem. The prompt is gone.' }
];

const habitStations = [
  { label: 'Sunday 4pm',     sub: 'kitchen table, laptop', tip: 'Context cue: place + time. Triggers the behavior automatically once installed.' },
  { label: 'Context cue',    sub: 'triggers behavior',     tip: 'After ~30 repetitions, context fires the behavior with minimal conscious involvement.' },
  { label: 'Open workflow.md', sub: 'library + schedule',  tip: 'Activation cost: low. The library is already there, named, parameterized.' },
  { label: 'Run entry #01',  sub: 'copy and fill',         tip: 'Activation cost: low. Variables in [ALL CAPS] make filling mechanical.' },
  { label: 'Phase gate',     sub: 'verify before release', tip: 'Activation cost: low. The gate is already named for this entry — see Ch 2.' },
  { label: 'Done',           sub: 'block closed',          tip: 'Block closed on schedule. 30% slack means it finishes inside the window.' }
];

const tooltip = d3.select('body').append('div').attr('class', 'tooltip');
function showTip(event, html) {
  tooltip.html(html).style('left', (event.pageX + 12) + 'px').style('top', (event.pageY - 28) + 'px')
    .transition().duration(150).style('opacity', 1);
}
function moveTip(event) { tooltip.style('left', (event.pageX + 12) + 'px').style('top', (event.pageY - 28) + 'px'); }
function hideTip() { tooltip.transition().duration(100).style('opacity', 0); }

function draw() {
  const container = document.getElementById('chart');
  d3.select('#chart').selectAll('*').remove();
  const totalWidth  = container.clientWidth  || 900;
  const totalHeight = container.clientHeight || 520;

  const svg = d3.select('#chart').append('svg')
    .attr('width', totalWidth).attr('height', totalHeight)
    .attr('role', 'img').attr('aria-labelledby', 'chart-title chart-desc');
  svg.append('title').attr('id', 'chart-title').text('Goal system versus habit system');
  svg.append('desc').attr('id', 'chart-desc').text('Two parallel tracks of stations leading to the same endpoint. Upper track is the goal system and loops back; lower track is the habit system and converges forward.');

  const defs = svg.append('defs');
  defs.append('marker').attr('id', 'arInk2').attr('markerWidth', 8).attr('markerHeight', 6).attr('refX', 7).attr('refY', 3).attr('orient', 'auto')
    .append('polygon').attr('points', '0 0, 8 3, 0 6').attr('fill', 'var(--color-ink)');
  defs.append('marker').attr('id', 'arSec2').attr('markerWidth', 8).attr('markerHeight', 6).attr('refX', 7).attr('refY', 3).attr('orient', 'auto')
    .append('polygon').attr('points', '0 0, 8 3, 0 6').attr('fill', 'var(--color-secondary)');

  const trackPad = 40;
  const usableW  = totalWidth - trackPad * 2;
  const stationH = 60;

  // GOAL TRACK
  const goalY = 100;
  const goalCols = goalStations.length;
  const goalSlot = usableW / goalCols;
  const goalW    = goalSlot - 14;

  svg.append('text').attr('class', 'track-label goal').attr('x', trackPad).attr('y', 50)
    .text('Goal system');
  svg.append('text').attr('class', 'track-sub').attr('x', trackPad).attr('y', 68)
    .text('effortful · depletable · willpower-based');

  goalStations.forEach((s, i) => {
    const x = trackPad + i * goalSlot;
    const g = svg.append('g').attr('tabindex', 0)
      .attr('aria-label', `Goal system station: ${s.label}, ${s.sub}`)
      .on('mouseover', (event) => showTip(event, `<strong>${s.label}</strong><br/>${s.tip}`))
      .on('mousemove', moveTip).on('mouseout', hideTip);
    g.append('rect').attr('class', 'station goal')
      .attr('x', x).attr('y', goalY).attr('width', goalW).attr('height', stationH);
    g.append('text').attr('class', 'station-label').attr('x', x + goalW / 2).attr('y', goalY + 26).attr('text-anchor', 'middle').text(s.label);
    g.append('text').attr('class', 'station-sub').attr('x', x + goalW / 2).attr('y', goalY + 44).attr('text-anchor', 'middle').text(s.sub);

    if (i > 0) {
      const xPrev = trackPad + (i - 1) * goalSlot + goalW;
      svg.append('line').attr('x1', xPrev).attr('y1', goalY + stationH / 2)
        .attr('x2', x - 2).attr('y2', goalY + stationH / 2)
        .attr('stroke', 'var(--color-secondary)').attr('stroke-width', 1.3)
        .attr('marker-end', 'url(#arSec2)');
    }
  });

  // Goal-track loop back: from last station up and around back to first station
  const lastX = trackPad + (goalCols - 1) * goalSlot + goalW / 2;
  const firstX = trackPad + goalW / 2;
  svg.append('path')
    .attr('d', `M ${lastX} ${goalY} C ${lastX} 30, ${firstX} 30, ${firstX} ${goalY}`)
    .attr('fill', 'none').attr('stroke', 'var(--color-red)').attr('stroke-width', 1.4)
    .attr('stroke-dasharray', '4 3').attr('marker-end', 'url(#arSec2)');
  svg.append('text').attr('class', 'track-sub')
    .attr('x', (firstX + lastX) / 2).attr('y', 24).attr('text-anchor', 'middle')
    .style('fill', 'var(--color-red)')
    .text('"next Tuesday — start from scratch"');

  // HABIT TRACK
  const habitY = 280;
  const habitCols = habitStations.length;
  const habitSlot = usableW / habitCols;
  const habitW    = habitSlot - 14;

  svg.append('text').attr('class', 'track-label').attr('x', trackPad).attr('y', 230)
    .text('Habit system');
  svg.append('text').attr('class', 'track-sub').attr('x', trackPad).attr('y', 248)
    .text('context-cued · lower activation cost · works whether motivation is high or low');

  habitStations.forEach((s, i) => {
    const x = trackPad + i * habitSlot;
    const g = svg.append('g').attr('tabindex', 0)
      .attr('aria-label', `Habit system station: ${s.label}, ${s.sub}`)
      .on('mouseover', (event) => showTip(event, `<strong>${s.label}</strong><br/>${s.tip}`))
      .on('mousemove', moveTip).on('mouseout', hideTip);
    g.append('rect').attr('class', 'station')
      .attr('x', x).attr('y', habitY).attr('width', habitW).attr('height', stationH);
    g.append('text').attr('class', 'station-label').attr('x', x + habitW / 2).attr('y', habitY + 26).attr('text-anchor', 'middle').text(s.label);
    g.append('text').attr('class', 'station-sub').attr('x', x + habitW / 2).attr('y', habitY + 44).attr('text-anchor', 'middle').text(s.sub);

    if (i > 0) {
      const xPrev = trackPad + (i - 1) * habitSlot + habitW;
      svg.append('line').attr('x1', xPrev).attr('y1', habitY + stationH / 2)
        .attr('x2', x - 2).attr('y2', habitY + stationH / 2)
        .attr('stroke', 'var(--color-ink)').attr('stroke-width', 1.4)
        .attr('marker-end', 'url(#arInk2)');
    }
  });

  // Merge to endpoint
  const endpointY = 420;
  const endpointW = Math.min(360, totalWidth - trackPad * 2);
  const endpointX = (totalWidth - endpointW) / 2;
  const endpointH = 60;

  // bring goal track down (from rightmost goal station)
  const lastGoalRight = trackPad + (goalCols - 1) * goalSlot + goalW;
  svg.append('path')
    .attr('d', `M ${lastGoalRight - goalW / 2} ${goalY + stationH} L ${lastGoalRight - goalW / 2} ${endpointY - 10}`)
    .attr('fill', 'none').attr('stroke', 'var(--color-secondary)').attr('stroke-width', 1.2)
    .attr('stroke-dasharray', '3 3').attr('marker-end', 'url(#arSec2)');

  // bring habit track down
  const lastHabitRight = trackPad + (habitCols - 1) * habitSlot + habitW;
  svg.append('path')
    .attr('d', `M ${lastHabitRight - habitW / 2} ${habitY + stationH} L ${lastHabitRight - habitW / 2} ${endpointY - 10}`)
    .attr('fill', 'none').attr('stroke', 'var(--color-ink)').attr('stroke-width', 1.4)
    .attr('marker-end', 'url(#arInk2)');

  svg.append('rect').attr('class', 'endpoint')
    .attr('x', endpointX).attr('y', endpointY).attr('width', endpointW).attr('height', endpointH);
  svg.append('text').attr('class', 'endpoint-text')
    .attr('x', endpointX + endpointW / 2).attr('y', endpointY + 28).attr('text-anchor', 'middle')
    .text('Output reaches students');
  svg.append('text').attr('class', 'endpoint-text')
    .attr('x', endpointX + endpointW / 2).attr('y', endpointY + 50).attr('text-anchor', 'middle')
    .style('font-style', 'italic').style('font-size', '12px')
    .text('same endpoint either way');
}

draw();
const ro = new ResizeObserver(() => draw());
ro.observe(document.getElementById('chart'));
</script>
</body>
</html>
