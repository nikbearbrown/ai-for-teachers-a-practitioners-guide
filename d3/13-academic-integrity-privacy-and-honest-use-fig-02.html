<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Figure 13.2 — The Bastani result</title>
  <style>
    :root {
      --color-white:     #FFFFFF;
      --color-ink:       #121212;
      --color-red:       #C8102E;
      --color-secondary: #545454;
      --color-border:    #D4D4D4;
      --color-ochre:     #C8860E;
    }
    @media (prefers-color-scheme: dark) {
      :root {
        --color-white:     #111111;
        --color-ink:       #F0EBE3;
        --color-red:       #E8243A;
        --color-secondary: #A0978C;
        --color-border:    #2E2E2E;
        --color-ochre:     #D49A30;
      }
    }
    * { box-sizing: border-box; margin: 0; padding: 0; }
    body {
      background: var(--color-white);
      color: var(--color-ink);
      font-family: 'EB Garamond', Georgia, serif;
      padding: 32px;
    }
    h1 { font-size: 22px; font-weight: 400; margin-bottom: 4px; }
    .subtitle { font-size: 13px; color: var(--color-secondary); font-style: italic; margin-bottom: 24px; }
    #chart { width: 100%; }
    .axis text { font-family: 'JetBrains Mono', monospace; font-size: 11px; fill: var(--color-secondary); }
    .axis path, .axis line { stroke: var(--color-secondary); }
    .gridline { stroke: var(--color-border); stroke-opacity: 0.6; stroke-dasharray: 2 3; }
    .axis-title { font-family: 'Inter', sans-serif; font-size: 12px; fill: var(--color-secondary); }
    .bar-practice { fill: var(--color-secondary); }
    .bar-exam { fill: var(--color-red); }
    .group-label { font-family: 'Inter', sans-serif; font-size: 13px; fill: var(--color-ink); text-anchor: middle; }
    .group-sublabel { font-family: 'Inter', sans-serif; font-size: 11px; font-style: italic; fill: var(--color-secondary); text-anchor: middle; }
    .bar-value { font-family: 'JetBrains Mono', monospace; font-size: 11px; fill: var(--color-ink); text-anchor: middle; }
    .legend-text { font-family: 'Inter', sans-serif; font-size: 12px; fill: var(--color-ink); }
    .callout-text { font-family: 'Inter', sans-serif; font-size: 12px; fill: var(--color-ink); }
    .ref-line { stroke: var(--color-ink); stroke-width: 1; }
    .caption { font-family: 'Inter', sans-serif; font-size: 12px; font-style: italic; fill: var(--color-secondary); margin-top: 12px; display: block; }
    .tooltip {
      position: absolute;
      pointer-events: none;
      opacity: 0;
      background: var(--color-ink);
      color: var(--color-white);
      padding: 8px 12px;
      font-size: 13px;
      font-family: 'Inter', sans-serif;
      border-radius: 4px;
    }
    @media (prefers-reduced-motion: reduce) { * { transition: none !important; animation: none !important; } }
  </style>
</head>
<body>
  <h1>The Bastani result — the wrapper is the variable</h1>
  <div class="subtitle">Same model. Same students, randomly assigned. Opposite durable outcomes.</div>
  <div id="chart" role="main"></div>
  <span class="caption">Performance paradox: in-session gain ≠ durable learning.</span>
  <script src="https://cdnjs.cloudflare.com/ajax/libs/d3/7.9.0/d3.min.js"></script>
  <script>
    const conditions = [
      { name: 'Control', sub: 'no AI', practice: 100, exam: 100 },
      { name: 'GPT Base', sub: 'unguarded', practice: 148, exam: 83 },
      { name: 'GPT Tutor', sub: 'guarded prompt', practice: 227, exam: 100 }
    ];

    function draw() {
      d3.select('#chart').selectAll('*').remove();

      const margin = { top: 48, right: 40, bottom: 64, left: 64 };
      const totalWidth = document.getElementById('chart').clientWidth || 800;
      const totalHeight = 460;
      const chartWidth = totalWidth - margin.left - margin.right;
      const chartHeight = totalHeight - margin.top - margin.bottom;

      const svg = d3.select('#chart').append('svg')
        .attr('width', totalWidth)
        .attr('height', totalHeight)
        .attr('role', 'img')
        .attr('aria-labelledby', 'chart-title chart-desc');
      svg.append('title').attr('id', 'chart-title').text('The Bastani result: practice gain versus durable exam performance.');
      svg.append('desc').attr('id', 'chart-desc').text('GPT Base raises practice 48 percent but drops exam 17 points. GPT Tutor raises practice 127 percent with no exam loss.');

      const gChart = svg.append('g').attr('class', 'g-chart')
        .attr('transform', `translate(${margin.left},${margin.top})`);

      const xScaleBand = d3.scaleBand()
        .domain(conditions.map(d => d.name))
        .range([0, chartWidth])
        .padding(0.3);

      const innerX = d3.scaleBand()
        .domain(['practice', 'exam'])
        .range([0, xScaleBand.bandwidth()])
        .padding(0.1);

      const yScaleLinear = d3.scaleLinear()
        .domain([0, 250])
        .range([chartHeight, 0]);

      // Gridlines
      gChart.selectAll('.gridline')
        .data(yScaleLinear.ticks(5))
        .join('line')
          .attr('class', 'gridline')
          .attr('x1', 0).attr('x2', chartWidth)
          .attr('y1', d => yScaleLinear(d)).attr('y2', d => yScaleLinear(d))
          .attr('aria-hidden', 'true');

      // Axes
      gChart.append('g').attr('class', 'axis y-axis')
        .call(d3.axisLeft(yScaleLinear).ticks(5));
      gChart.append('g').attr('class', 'axis x-axis')
        .attr('transform', `translate(0, ${chartHeight})`)
        .call(d3.axisBottom(xScaleBand).tickSize(0).tickPadding(10));

      gChart.append('text').attr('class', 'axis-title')
        .attr('transform', `translate(-44, ${chartHeight / 2}) rotate(-90)`)
        .attr('text-anchor', 'middle')
        .text('Score (Control = 100)');

      // Reference line at 100
      gChart.append('line').attr('class', 'ref-line')
        .attr('x1', 0).attr('x2', chartWidth)
        .attr('y1', yScaleLinear(100)).attr('y2', yScaleLinear(100));

      // Bars
      const groupG = gChart.selectAll('.group')
        .data(conditions)
        .join('g')
          .attr('class', 'group')
          .attr('transform', d => `translate(${xScaleBand(d.name)}, 0)`);

      groupG.append('rect')
        .attr('class', 'bar-practice')
        .attr('x', innerX('practice'))
        .attr('y', d => yScaleLinear(d.practice))
        .attr('width', innerX.bandwidth())
        .attr('height', d => chartHeight - yScaleLinear(d.practice))
        .attr('tabindex', 0)
        .attr('aria-label', d => `${d.name} practice score: ${d.practice}`);

      groupG.append('rect')
        .attr('class', 'bar-exam')
        .attr('x', innerX('exam'))
        .attr('y', d => yScaleLinear(d.exam))
        .attr('width', innerX.bandwidth())
        .attr('height', d => chartHeight - yScaleLinear(d.exam))
        .attr('tabindex', 0)
        .attr('aria-label', d => `${d.name} exam score: ${d.exam}`);

      groupG.append('text').attr('class', 'bar-value')
        .attr('x', innerX('practice') + innerX.bandwidth() / 2)
        .attr('y', d => yScaleLinear(d.practice) - 6).text(d => d.practice);
      groupG.append('text').attr('class', 'bar-value')
        .attr('x', innerX('exam') + innerX.bandwidth() / 2)
        .attr('y', d => yScaleLinear(d.exam) - 6).text(d => d.exam);

      // Legend
      const legend = svg.append('g').attr('transform', `translate(${totalWidth - 280}, 16)`);
      legend.append('rect').attr('x', 0).attr('y', 0).attr('width', 14).attr('height', 14).attr('class', 'bar-practice');
      legend.append('text').attr('class', 'legend-text').attr('x', 20).attr('y', 12).text('Practice (with AI)');
      legend.append('rect').attr('x', 130).attr('y', 0).attr('width', 14).attr('height', 14).attr('class', 'bar-exam');
      legend.append('text').attr('class', 'legend-text').attr('x', 150).attr('y', 12).text('Exam (no AI)');

      // Callouts
      const baseX = margin.left + xScaleBand('GPT Base') + xScaleBand.bandwidth() / 2;
      const baseY = margin.top + yScaleLinear(83) + 6;
      svg.append('text').attr('class', 'callout-text')
        .attr('x', baseX + 30).attr('y', baseY + 26).text('48% practice gain → 17-point exam loss');

      const tutorX = margin.left + xScaleBand('GPT Tutor') + xScaleBand.bandwidth() / 2;
      const tutorY = margin.top + yScaleLinear(227) - 6;
      svg.append('text').attr('class', 'callout-text')
        .attr('x', tutorX - 130).attr('y', tutorY - 8).attr('text-anchor', 'middle')
        .text('127% practice gain — no exam loss');

      // Tooltip
      const tooltip = d3.select('body').append('div').attr('class', 'tooltip');

      gChart.selectAll('rect.bar-practice, rect.bar-exam')
        .on('mouseover', (event, d) => {
          const isPractice = event.currentTarget.classList.contains('bar-practice');
          const role = isPractice ? 'Practice (with AI)' : 'Exam (no AI)';
          const val = isPractice ? d.practice : d.exam;
          tooltip.html(`<strong>${d.name}</strong><br>${role}: ${val}`)
            .style('left', (event.pageX + 12) + 'px').style('top', (event.pageY - 28) + 'px')
            .transition().duration(150).style('opacity', 1);
        })
        .on('mousemove', (event) => {
          tooltip.style('left', (event.pageX + 12) + 'px').style('top', (event.pageY - 28) + 'px');
        })
        .on('mouseout', () => tooltip.transition().duration(100).style('opacity', 0));
    }

    draw();
    const ro = new ResizeObserver(() => draw());
    ro.observe(document.getElementById('chart'));
  </script>
</body>
</html>
