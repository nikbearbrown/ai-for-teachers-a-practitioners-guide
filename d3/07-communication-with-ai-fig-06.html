<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Figure 7.6 — Myth versus reality</title>
  <style>
    :root {
      --color-white:     #FFFFFF;
      --color-ink:       #121212;
      --color-red:       #C8102E;
      --color-secondary: #545454;
      --color-border:    #D4D4D4;
      --color-ochre:     #C8860E;
    }
    @media (prefers-color-scheme: dark) {
      :root {
        --color-white:     #111111;
        --color-ink:       #F0EBE3;
        --color-red:       #E8243A;
        --color-secondary: #A0978C;
        --color-border:    #2E2E2E;
        --color-ochre:     #D49A30;
      }
    }
    * { box-sizing: border-box; margin: 0; padding: 0; }
    body { background: var(--color-white); color: var(--color-ink); font-family: 'EB Garamond', Garamond, Georgia, serif; padding: 16px; }
    #chart { width: 100%; min-height: 520px; }
    .ti { font-family: 'EB Garamond', Garamond, Georgia, serif; font-size: 18px; font-weight: 700; fill: var(--color-ink); }
    .sub { font-family: 'EB Garamond', Garamond, Georgia, serif; font-size: 12px; font-style: italic; fill: var(--color-secondary); }
    .hdr { font-family: 'EB Garamond', Garamond, Georgia, serif; font-size: 12px; font-weight: 700; fill: var(--color-white); letter-spacing: 0.6px; }
    .row { font-family: 'EB Garamond', Garamond, Georgia, serif; font-size: 13px; fill: var(--color-ink); }
    .rowb { font-family: 'EB Garamond', Garamond, Georgia, serif; font-size: 13px; font-weight: 700; fill: var(--color-ink); }
    .rownum { font-family: 'EB Garamond', Garamond, Georgia, serif; font-size: 10px; font-weight: 700; fill: var(--color-secondary); letter-spacing: 0.6px; }
    .cap { font-family: 'EB Garamond', Garamond, Georgia, serif; font-size: 12px; font-style: italic; fill: var(--color-secondary); }
    .tooltip { position: absolute; pointer-events: none; opacity: 0; background: var(--color-ink); color: var(--color-white); padding: 6px 10px; font-size: 12px; }
    @media (prefers-reduced-motion: reduce) { * { transition: none !important; animation: none !important; } }
  </style>
</head>
<body>
  <div id="chart" role="main"></div>
  <script src="https://cdnjs.cloudflare.com/ajax/libs/d3/7.9.0/d3.min.js"></script>
  <script>
    const ROWS = [
      { n: 1, topic: 'PARENT COMMUNICATION',
        myth: ['"AI handles parent', 'communication."', 'It does the email.'],
        reality: ['AI handles register conversion', 'of communication the teacher', 'already substantively composed.'] },
      { n: 2, topic: 'TRANSLATION',
        myth: ['"Translation is solved."', 'The output looks fluent,', 'so it must be right.'],
        reality: ['Usable for routine prose', 'in high-resource pairs.', 'Never for procedural rights,', 'medical, custody, discipline.'] },
      { n: 3, topic: 'HARD MESSAGES',
        myth: ['"Use AI for the hard ones —', 'it stays calm."', 'Calmer than a tired teacher.'],
        reality: ['The model is calm', 'about details that did not happen.', 'Calm is the default. Right', 'is your responsibility.'] }
    ];

    function draw() {
      d3.select('#chart').selectAll('*').remove();
      const container = document.getElementById('chart');
      const W = container.clientWidth || 700;
      const H = 520;
      const half = W / 2;

      const svg = d3.select('#chart').append('svg')
        .attr('width', W).attr('height', H)
        .attr('viewBox', `0 0 ${W} ${H}`)
        .attr('role', 'img')
        .attr('aria-labelledby', 'chart-title chart-desc');
      svg.append('title').attr('id', 'chart-title').text('Three myths and three realities about AI-assisted teacher communication');
      svg.append('desc').attr('id', 'chart-desc').text('A two-column comparison figure with three rows pairing common myths with corresponding realities.');

      svg.append('text').attr('class', 'ti').attr('x', 32).attr('y', 34).text('Three plausible-sounding shortcuts.');
      svg.append('text').attr('class', 'sub').attr('x', 32).attr('y', 54).text('Three predictable failure modes.');

      svg.append('rect').attr('x', 32).attr('y', 80).attr('width', half - 36).attr('height', 32).attr('fill', 'var(--color-secondary)');
      svg.append('text').attr('class', 'hdr').attr('x', 48).attr('y', 100).text('MYTH');
      svg.append('rect').attr('x', half + 4).attr('y', 80).attr('width', half - 36).attr('height', 32).attr('fill', 'var(--color-red)');
      svg.append('text').attr('class', 'hdr').attr('x', half + 20).attr('y', 100).text('REALITY');

      svg.append('line').attr('x1', half).attr('y1', 116).attr('x2', half).attr('y2', 116 + 3 * 110)
        .attr('stroke', 'var(--color-border)').attr('stroke-width', 1).attr('aria-hidden', 'true');

      const tooltip = d3.select('body').append('div').attr('class', 'tooltip');
      function show(event, d) {
        tooltip.html(`<strong>Row ${d.n} — ${d.topic}</strong><br>Myth vs. reality`)
          .style('left', (event.pageX + 12) + 'px').style('top', (event.pageY - 28) + 'px')
          .transition().duration(150).style('opacity', 1);
      }
      function move(event) { tooltip.style('left', (event.pageX + 12) + 'px').style('top', (event.pageY - 28) + 'px'); }
      function hide() { tooltip.transition().duration(100).style('opacity', 0); }

      const startY = 120;
      const rowH = 110;

      const groups = svg.selectAll('.row-g').data(ROWS).join('g')
        .attr('class', 'row-g')
        .attr('tabindex', 0)
        .attr('aria-label', d => `Row ${d.n}, ${d.topic}: myth versus reality`)
        .attr('transform', (d, i) => `translate(0, ${startY + i * rowH})`)
        .on('mouseover', show).on('mousemove', move).on('mouseout', hide);

      groups.append('rect').attr('x', 32).attr('y', 0).attr('width', W - 64).attr('height', rowH - 6)
        .attr('fill', 'var(--color-white)').attr('stroke', 'var(--color-border)').attr('stroke-width', 1);
      groups.append('text').attr('class', 'rownum').attr('x', 48).attr('y', 18).text(d => `ROW ${d.n} — ${d.topic}`);

      groups.each(function(d) {
        const g = d3.select(this);
        d.myth.forEach((line, idx) => {
          g.append('text').attr('class', 'row').attr('x', 48).attr('y', 42 + idx * 18).text(line);
        });
        d.reality.forEach((line, idx) => {
          g.append('text').attr('class', idx === 0 ? 'rowb' : 'row').attr('x', half + 20).attr('y', 42 + idx * 18).text(line);
        });
      });

      svg.append('text').attr('class', 'cap').attr('x', W / 2).attr('y', H - 18)
        .attr('text-anchor', 'middle')
        .text('Figure 7.6 — Three plausible-sounding shortcuts. Three predictable failure modes.');
    }
    draw();
    new ResizeObserver(() => draw()).observe(document.getElementById('chart'));
  </script>
</body>
</html>
