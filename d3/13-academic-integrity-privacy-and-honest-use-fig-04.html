<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Figure 13.4 — Teen ChatGPT-for-schoolwork use by group (Pew 2025)</title>
  <style>
    :root {
      --color-white:     #FFFFFF;
      --color-ink:       #121212;
      --color-red:       #C8102E;
      --color-secondary: #545454;
      --color-border:    #D4D4D4;
      --color-ochre:     #C8860E;
    }
    @media (prefers-color-scheme: dark) {
      :root {
        --color-white:     #111111;
        --color-ink:       #F0EBE3;
        --color-red:       #E8243A;
        --color-secondary: #A0978C;
        --color-border:    #2E2E2E;
        --color-ochre:     #D49A30;
      }
    }
    * { box-sizing: border-box; margin: 0; padding: 0; }
    body {
      background: var(--color-white);
      color: var(--color-ink);
      font-family: 'EB Garamond', Georgia, serif;
      padding: 32px;
    }
    h1 { font-size: 22px; font-weight: 400; margin-bottom: 4px; }
    .subtitle { font-size: 13px; color: var(--color-secondary); font-style: italic; margin-bottom: 24px; }
    #chart { width: 100%; }
    .axis text { font-family: 'JetBrains Mono', monospace; font-size: 11px; fill: var(--color-secondary); }
    .axis path, .axis line { stroke: var(--color-secondary); }
    .gridline { stroke: var(--color-border); stroke-opacity: 0.6; stroke-dasharray: 2 3; }
    .bar-rect.bar-all { fill: var(--color-red); }
    .bar-rect.bar-high { fill: var(--color-secondary); }
    .bar-rect.bar-low { fill: #787878; }
    .bar-label { font-family: 'Inter', sans-serif; font-size: 12px; fill: var(--color-ink); }
    .bar-value { font-family: 'JetBrains Mono', monospace; font-size: 12px; fill: var(--color-ink); }
    .section-label { font-family: 'Inter', sans-serif; font-size: 12px; font-style: italic; fill: var(--color-secondary); }
    .section-divider { stroke: var(--color-border); }
    .ref-line { stroke: var(--color-red); stroke-width: 1; stroke-dasharray: 3 3; }
    .ref-label { font-family: 'Inter', sans-serif; font-size: 10px; font-style: italic; fill: var(--color-secondary); }
    .caption { font-family: 'Inter', sans-serif; font-size: 12px; font-style: italic; color: var(--color-secondary); margin-top: 16px; display: block; max-width: 80ch; }
    .tooltip {
      position: absolute;
      pointer-events: none;
      opacity: 0;
      background: var(--color-ink);
      color: var(--color-white);
      padding: 8px 12px;
      font-size: 13px;
      font-family: 'Inter', sans-serif;
      border-radius: 4px;
    }
    @media (prefers-reduced-motion: reduce) { * { transition: none !important; animation: none !important; } }
  </style>
</head>
<body>
  <h1>Teen ChatGPT-for-schoolwork use</h1>
  <div class="subtitle">Pew Research, January 2025 — U.S. teens age 13–17.</div>
  <div id="chart" role="main"></div>
  <span class="caption">A blanket ban interacts asymmetrically with what students have at home. A blanket requirement interacts asymmetrically with differential access to devices, broadband, and paid-tier models.</span>
  <script src="https://cdnjs.cloudflare.com/ajax/libs/d3/7.9.0/d3.min.js"></script>
  <script>
    const allTeens = { group: 'All teens', value: 26, section: 'all', cls: 'bar-all',
      tooltip: 'All U.S. teens 13–17 who report using ChatGPT for schoolwork (Pew, January 2025).' };

    const raceData = [
      { group: 'Black teens', value: 31, section: 'race', cls: 'bar-high',
        tooltip: 'Higher reported use among Black teens than the all-teen average; the cross-tab is non-obvious for many policy designs.' },
      { group: 'Hispanic teens', value: 31, section: 'race', cls: 'bar-high',
        tooltip: 'Higher reported use among Hispanic teens than the all-teen average.' },
      { group: 'White teens', value: 22, section: 'race', cls: 'bar-low',
        tooltip: 'Lower reported use among White teens than the all-teen average.' }
    ].sort((a, b) => b.value - a.value);

    const incomeData = [
      { group: 'Higher-income families', value: 31, section: 'income', cls: 'bar-high',
        tooltip: 'Higher reported use among higher-income families. Differential home access drives the pattern.' },
      { group: 'Lower-income families', value: 18, section: 'income', cls: 'bar-low',
        tooltip: 'Lower reported use among lower-income families. A blanket AI requirement would widen the gap.' }
    ].sort((a, b) => b.value - a.value);

    function draw() {
      d3.select('#chart').selectAll('*').remove();

      const margin = { top: 48, right: 80, bottom: 56, left: 220 };
      const totalWidth = document.getElementById('chart').clientWidth || 800;
      const rowH = 30;
      const sectionGap = 36;
      const totalRows = 1 + raceData.length + incomeData.length;
      const chartHeight = totalRows * rowH + 2 * sectionGap;
      const totalHeight = chartHeight + margin.top + margin.bottom;
      const chartWidth = totalWidth - margin.left - margin.right;

      const svg = d3.select('#chart').append('svg')
        .attr('width', totalWidth)
        .attr('height', totalHeight)
        .attr('role', 'img')
        .attr('aria-labelledby', 'chart-title chart-desc');
      svg.append('title').attr('id', 'chart-title').text('Teen ChatGPT-for-schoolwork use by group, Pew January 2025.');
      svg.append('desc').attr('id', 'chart-desc').text('Horizontal bars: all teens 26 percent, Black 31, Hispanic 31, White 22, higher-income 31, lower-income 18.');

      const gChart = svg.append('g').attr('class', 'g-chart')
        .attr('transform', `translate(${margin.left}, ${margin.top})`);

      const xScaleLinear = d3.scaleLinear()
        .domain([0, 40])
        .range([0, chartWidth]);

      gChart.append('g').attr('class', 'axis x-axis')
        .attr('transform', `translate(0, ${chartHeight})`)
        .call(d3.axisBottom(xScaleLinear).ticks(5).tickFormat(d => d + '%'));

      gChart.selectAll('.gridline')
        .data(xScaleLinear.ticks(5))
        .join('line')
          .attr('class', 'gridline')
          .attr('x1', d => xScaleLinear(d)).attr('x2', d => xScaleLinear(d))
          .attr('y1', 0).attr('y2', chartHeight)
          .attr('aria-hidden', 'true');

      let cursorY = 0;

      // All teens
      drawBar(gChart, allTeens, cursorY);
      cursorY += rowH + sectionGap;

      // Section label: race
      gChart.append('line').attr('class', 'section-divider')
        .attr('x1', -180).attr('x2', chartWidth)
        .attr('y1', cursorY - sectionGap / 2).attr('y2', cursorY - sectionGap / 2);
      gChart.append('text').attr('class', 'section-label')
        .attr('x', -180).attr('y', cursorY - 6)
        .text('By race / ethnicity');

      raceData.forEach((d) => {
        drawBar(gChart, d, cursorY);
        cursorY += rowH;
      });
      cursorY += sectionGap - (sectionGap / 2);

      // Section label: income
      gChart.append('line').attr('class', 'section-divider')
        .attr('x1', -180).attr('x2', chartWidth)
        .attr('y1', cursorY - sectionGap / 2).attr('y2', cursorY - sectionGap / 2);
      gChart.append('text').attr('class', 'section-label')
        .attr('x', -180).attr('y', cursorY - 6)
        .text('By household income');

      incomeData.forEach((d) => {
        drawBar(gChart, d, cursorY);
        cursorY += rowH;
      });

      // Reference line at 26
      gChart.append('line').attr('class', 'ref-line')
        .attr('x1', xScaleLinear(26)).attr('x2', xScaleLinear(26))
        .attr('y1', 0).attr('y2', chartHeight);
      gChart.append('text').attr('class', 'ref-label')
        .attr('x', xScaleLinear(26) + 4).attr('y', -6)
        .text('all-teen average');

      // Tooltip
      const tooltip = d3.select('body').append('div').attr('class', 'tooltip');
      gChart.selectAll('rect.bar-rect')
        .on('mouseover', function (event, d) {
          tooltip.html(`<strong>${d.group}</strong>: ${d.value}%<br>${d.tooltip}`)
            .style('left', (event.pageX + 12) + 'px').style('top', (event.pageY - 28) + 'px')
            .transition().duration(150).style('opacity', 1);
        })
        .on('mousemove', function (event) {
          tooltip.style('left', (event.pageX + 12) + 'px').style('top', (event.pageY - 28) + 'px');
        })
        .on('mouseout', () => tooltip.transition().duration(100).style('opacity', 0));

      function drawBar(parent, d, y) {
        parent.append('text').attr('class', 'bar-label')
          .attr('x', -12).attr('y', y + rowH / 2 + 4)
          .attr('text-anchor', 'end')
          .text(d.group);
        parent.append('rect').attr('class', `bar-rect ${d.cls}`)
          .attr('x', 0).attr('y', y + 4)
          .attr('width', xScaleLinear(d.value)).attr('height', rowH - 8)
          .attr('tabindex', 0)
          .attr('aria-label', `${d.group}: ${d.value} percent`)
          .datum(d);
        parent.append('text').attr('class', 'bar-value')
          .attr('x', xScaleLinear(d.value) + 6).attr('y', y + rowH / 2 + 4)
          .text(d.value + '%');
      }
    }

    draw();
    const ro = new ResizeObserver(() => draw());
    ro.observe(document.getElementById('chart'));
  </script>
</body>
</html>
