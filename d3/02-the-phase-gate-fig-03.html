<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Figure 2.3 — Three-component gate anatomy</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=EB+Garamond:wght@400;500;700&family=Inter:wght@400;600;700&family=JetBrains+Mono:wght@400&display=swap" rel="stylesheet">
<style>
  :root { --color-white:#FFFFFF; --color-ink:#121212; --color-red:#C8102E; --color-secondary:#545454; --color-border:#D4D4D4; --color-ochre:#C8860E; }
  @media (prefers-color-scheme: dark) {
    :root { --color-white:#111111; --color-ink:#F0EBE3; --color-red:#E8243A; --color-secondary:#A0978C; --color-border:#2E2E2E; --color-ochre:#D49A30; }
  }
  * { box-sizing: border-box; margin: 0; padding: 0; }
  body { background: var(--color-white); color: var(--color-ink); font-family: 'Inter', sans-serif; padding: 24px; }
  h1 { font-family: 'EB Garamond', Georgia, serif; font-weight: 400; font-size: 28px; margin-bottom: 4px; }
  p.subtitle { color: var(--color-secondary); font-size: 13px; margin-bottom: 24px; }
  #chart { width: 100%; height: 460px; }
  .block { fill: var(--color-white); stroke: var(--color-ink); stroke-width: 1; transition: stroke 200ms cubic-bezier(0.2,0.8,0.2,1); }
  .block.center { stroke-width: 1.8; }
  .block:hover { stroke: var(--color-red); cursor: pointer; }
  .num { font-family: 'EB Garamond', Georgia, serif; font-size: 28px; font-weight: 700; fill: var(--color-ink); }
  .head { font-family: 'EB Garamond', Georgia, serif; font-size: 14px; font-weight: 700; fill: var(--color-ink); }
  .lb { font-family: 'EB Garamond', Georgia, serif; font-size: 12px; fill: var(--color-ink); }
  .sm { font-family: 'EB Garamond', Georgia, serif; font-size: 11px; fill: var(--color-secondary); }
  .fail { font-family: 'EB Garamond', Georgia, serif; font-size: 12px; font-style: italic; fill: var(--color-secondary); }
  .cap { font-family: 'EB Garamond', Georgia, serif; font-size: 12px; font-style: italic; fill: var(--color-secondary); }
  .tooltip { position: absolute; pointer-events: none; opacity: 0; background: var(--color-ink); color: var(--color-white); padding: 6px 10px; font-size: 12px; max-width: 260px; }
  @media (prefers-reduced-motion: reduce) { * { transition: none !important; animation: none !important; } }
</style>
</head>
<body>
<h1>Figure 2.3 — Three components, in sequence</h1>
<p class="subtitle">Block 1 names what AI did. Block 2 names the human operation. Block 3 names what happens next.</p>
<div id="chart" role="img" aria-labelledby="t-anat d-anat"></div>
<script src="https://cdnjs.cloudflare.com/ajax/libs/d3/7.9.0/d3.min.js"></script>
<script>
const blocks = [
  { n: '1', title: 'Upstream task', l1: 'What AI did,', l2: 'specifically.', ex: '"AI scored 120 essays against the rubric."', fail: '"AI did some grading."', tip: 'Specific verb, specific count, specific object.' },
  { n: '2', title: 'Cognitive operation', l1: 'What only a human', l2: 'can do here.', ex: '"Hand-grade 5; compare; adjust rubric."', fail: '"Teacher reviews the output."', tip: 'A cognitive verb naming a specific act. Not "review".', center: true },
  { n: '3', title: 'Downstream action', l1: 'What happens only', l2: 'after the human acts.', ex: '"Bulk grading proceeds with recalibration."', fail: '"Scores are released."', tip: 'The action depends on the operation. Not unconditional release.' }
];

const tooltip = d3.select('body').append('div').attr('class', 'tooltip');
function showTip(e, html) { tooltip.html(html).style('left', (e.pageX+12)+'px').style('top', (e.pageY-28)+'px').transition().duration(150).style('opacity', 1); }
function moveTip(e) { tooltip.style('left', (e.pageX+12)+'px').style('top', (e.pageY-28)+'px'); }
function hideTip() { tooltip.transition().duration(100).style('opacity', 0); }

function draw() {
  d3.select('#chart').selectAll('*').remove();
  const container = document.getElementById('chart');
  const W = container.clientWidth || 760, H = container.clientHeight || 460;
  const svg = d3.select('#chart').append('svg').attr('viewBox', `0 0 ${W} ${H}`).attr('width', W).attr('height', H)
    .attr('role', 'img').attr('aria-labelledby', 't-anat d-anat');
  svg.append('title').attr('id', 't-anat').text('Three-component gate anatomy');
  svg.append('desc').attr('id', 'd-anat').text('Three labeled blocks connected by arrows: upstream task, cognitive operation, downstream action. Failure modes shown below.');

  const defs = svg.append('defs');
  defs.append('marker').attr('id', 'ar3').attr('markerWidth', 8).attr('markerHeight', 6).attr('refX', 7).attr('refY', 3).attr('orient', 'auto')
    .append('polygon').attr('points', '0 0, 8 3, 0 6').attr('fill', 'var(--color-ink)');

  const boxW = (W - 100) / 3 - 24, boxH = 130;
  const yTop = 60;
  blocks.forEach((b, i) => {
    const x = 32 + i * (boxW + 36);
    const g = svg.append('g').attr('tabindex', 0).attr('role', 'group').attr('aria-label', `Component ${b.n}: ${b.title}. ${b.tip}`)
      .on('mouseover', (e) => showTip(e, `<strong>${b.title}</strong><br>${b.tip}`))
      .on('mousemove', moveTip).on('mouseout', hideTip);
    g.append('rect').attr('class', `block${b.center ? ' center' : ''}`).attr('x', x).attr('y', yTop).attr('width', boxW).attr('height', boxH);
    g.append('text').attr('x', x + 16).attr('y', yTop + 32).attr('class', 'num').text(b.n);
    g.append('text').attr('x', x + 16).attr('y', yTop + 56).attr('class', 'head').text(b.title);
    g.append('text').attr('x', x + 16).attr('y', yTop + 78).attr('class', 'lb').text(b.l1);
    g.append('text').attr('x', x + 16).attr('y', yTop + 94).attr('class', 'lb').text(b.l2);
    g.append('text').attr('x', x + 16).attr('y', yTop + 116).attr('class', 'sm').text(b.ex);

    if (i < blocks.length - 1) {
      svg.append('line').attr('x1', x + boxW + 4).attr('y1', yTop + boxH/2).attr('x2', x + boxW + 32).attr('y2', yTop + boxH/2)
        .attr('stroke', 'var(--color-ink)').attr('stroke-width', 1).attr('marker-end', 'url(#ar3)');
    }
  });

  // Failure rail
  const failY = yTop + boxH + 50;
  svg.append('line').attr('x1', 32).attr('y1', failY - 16).attr('x2', W - 32).attr('y2', failY - 16)
    .attr('stroke', 'var(--color-border)').attr('stroke-width', 0.5);
  svg.append('text').attr('x', 32).attr('y', failY).attr('class', 'head').text('Vague version, collapses to a phrase:');
  blocks.forEach((b, i) => {
    const x = 32 + i * (boxW + 36) + boxW/2;
    svg.append('text').attr('x', x).attr('y', failY + 30).attr('text-anchor', 'middle').attr('class', 'fail').text(b.fail);
  });

  svg.append('text').attr('x', W/2).attr('y', H - 30).attr('text-anchor', 'middle').attr('class', 'cap')
    .text('Name all three in one sentence each. If you cannot, there is no gate.');
}

draw();
const ro = new ResizeObserver(() => draw());
ro.observe(document.getElementById('chart'));
</script>
</body>
</html>
