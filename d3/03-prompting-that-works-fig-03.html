<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Figure 3.3 — The prompting loop</title>
<style>
  :root {
    --color-white:     #FFFFFF;
    --color-ink:       #121212;
    --color-red:       #C8102E;
    --color-secondary: #545454;
    --color-border:    #D4D4D4;
    --color-ochre:     #C8860E;
  }
  @media (prefers-color-scheme: dark) {
    :root {
      --color-white:     #111111;
      --color-ink:       #F0EBE3;
      --color-red:       #E8243A;
      --color-secondary: #A0978C;
      --color-border:    #2E2E2E;
      --color-ochre:     #D49A30;
    }
  }
  * { box-sizing: border-box; margin: 0; padding: 0; }
  body {
    background: var(--color-white);
    color: var(--color-ink);
    font-family: 'EB Garamond', 'Garamond', Georgia, serif;
    padding: 24px;
  }
  #chart { width: 100%; max-width: 1080px; }
  .chart-title { font-size: 18px; font-weight: 700; fill: var(--color-ink); }
  .chart-subtitle { font-size: 13px; fill: var(--color-secondary); }
  .round { font-size: 12px; font-weight: 700; letter-spacing: 0.5px; fill: var(--color-red); }
  .node-rect { fill: var(--color-white); stroke: var(--color-ink); stroke-width: 1; }
  .node-rect-active { stroke: var(--color-red); stroke-width: 2; }
  .node-head { font-size: 14px; font-weight: 700; fill: var(--color-ink); }
  .prompt-line { font-size: 12px; fill: var(--color-ink); }
  .body-line { font-size: 11px; fill: var(--color-secondary); }
  .node-rule { stroke: var(--color-border); stroke-width: 1; }
  .annot { font-size: 11px; font-style: italic; fill: var(--color-ochre); }
  .diag { font-size: 11px; font-style: italic; fill: var(--color-secondary); }
  .flow-line { stroke: var(--color-ink); stroke-width: 1; fill: none; }
  .footer { font-size: 12px; font-style: italic; fill: var(--color-secondary); }
  @media (prefers-reduced-motion: reduce) { * { transition: none !important; animation: none !important; } }
</style>
</head>
<body>
<div id="chart" role="main"></div>
<script src="https://cdnjs.cloudflare.com/ajax/libs/d3/7.9.0/d3.min.js"></script>
<script>
(function () {
  const FALLBACK_DATA = [
    {
      id: 'r1',
      round: 'ROUND 1',
      head: 'Vague prompt',
      prompt: ['"Write a lesson plan', 'on photosynthesis', 'for 5th grade."'],
      body:   ['Topic, not a capability.',
               '"Optional plant."',
               'No misconception named.'],
      annot:  'the model fills in the average'
    },
    {
      id: 'r2',
      round: 'ROUND 2',
      head: 'Four-component',
      prompt: ['Role · Context · Task', '· Constraints',
               'NGSS 5-LS1-1, ELLs,', 'soil misconception'],
      body:   ['Real objective.',
               'Hook surfaces misconception.',
               'Lab uses listed materials.'],
      annot:  'specification narrows the probability space'
    },
    {
      id: 'r3',
      round: 'ROUND 3',
      head: 'Gap-closing follow-up',
      prompt: ['"Revise the lab to', 'produce evidence in',
               '25 minutes. Keep', 'the rest of the plan."'],
      body:   ['Sealed-bag condensation lab.',
               'Argument lands in class.',
               'Rest of plan unchanged.'],
      annot:  'name what to change, name what to keep'
    }
  ];
  const EDGES = [
    { from: 0, to: 1, diag: ['missing: standard,', 'misconception,', 'materials, level'] },
    { from: 1, to: 2, diag: ['gap: lab needs', 'a week — class is', '25 minutes'] }
  ];

  const tooltip = d3.select('body').append('div')
    .attr('class', 'tooltip')
    .style('position', 'absolute')
    .style('pointer-events', 'none')
    .style('opacity', 0)
    .style('background', 'var(--color-white)')
    .style('border', '1px solid var(--color-border)')
    .style('padding', '8px 10px')
    .style('font-family', 'EB Garamond, Garamond, Georgia, serif')
    .style('font-size', '12px')
    .style('color', 'var(--color-ink)');

  function showTooltip(event, d) {
    tooltip.html(`<strong>${d.round} — ${d.head}</strong><br><em>${d.annot}</em>`)
      .style('left', (event.pageX + 12) + 'px')
      .style('top',  (event.pageY - 28) + 'px')
      .transition().duration(150).style('opacity', 1);
  }
  function moveTooltip(event) {
    tooltip.style('left', (event.pageX + 12) + 'px')
      .style('top',  (event.pageY - 28) + 'px');
  }
  function hideTooltip() {
    tooltip.transition().duration(100).style('opacity', 0);
  }

  function draw() {
    d3.select('#chart').selectAll('svg').remove();
    const container = document.getElementById('chart');
    const totalWidth  = Math.max(720, container.clientWidth || 1080);
    const totalHeight = 460;
    const margin = { top: 80, right: 32, bottom: 64, left: 32 };

    const svg = d3.select('#chart').append('svg')
      .attr('width', totalWidth)
      .attr('height', totalHeight)
      .attr('viewBox', `0 0 ${totalWidth} ${totalHeight}`)
      .attr('role', 'img')
      .attr('aria-labelledby', 'chart-title chart-desc');
    svg.append('title').attr('id', 'chart-title').text('The prompting loop');
    svg.append('desc').attr('id', 'chart-desc')
      .text('Three rounds of prompting form a diagnostic loop. Each round closes a gap the previous output revealed.');

    // arrow defs
    const defs = svg.append('defs');
    defs.append('marker')
      .attr('id', 'arrow-ink').attr('markerWidth', 8).attr('markerHeight', 6)
      .attr('refX', 7).attr('refY', 3).attr('orient', 'auto')
      .append('polygon').attr('points', '0 0, 8 3, 0 6')
      .attr('fill', 'var(--color-ink)');

    svg.append('text').attr('class', 'chart-title')
      .attr('x', margin.left).attr('y', 28).text('The prompting loop');
    svg.append('text').attr('class', 'chart-subtitle')
      .attr('x', margin.left).attr('y', 48)
      .text('Three rounds, seven minutes, one reusable lesson plan. Each round narrows the probability space.');

    const innerW = totalWidth - margin.left - margin.right;
    const nodeW = Math.min(220, (innerW - 80) / 3);
    const gap = (innerW - nodeW * 3) / 2;
    const yNode = margin.top;
    const nodeH = 180;

    FALLBACK_DATA.forEach((d, i) => {
      const x = margin.left + i * (nodeW + gap);
      const g = svg.append('g').attr('class', 'g-node')
        .attr('tabindex', 0)
        .attr('aria-label', `${d.round} — ${d.head}: ${d.annot}`)
        .datum(d);

      // round label above
      g.append('text').attr('class', 'round')
        .attr('x', x + nodeW / 2).attr('y', yNode - 12)
        .attr('text-anchor', 'middle').text(d.round);

      const rect = g.append('rect').attr('class', 'node-rect')
        .attr('x', x).attr('y', yNode)
        .attr('width', nodeW).attr('height', nodeH);

      g.append('text').attr('class', 'node-head')
        .attr('x', x + nodeW / 2).attr('y', yNode + 24)
        .attr('text-anchor', 'middle').text(d.head);

      d.prompt.forEach((line, k) => {
        g.append('text').attr('class', 'prompt-line')
          .attr('x', x + nodeW / 2).attr('y', yNode + 46 + k * 14)
          .attr('text-anchor', 'middle').text(line);
      });

      // separator
      const yRule = yNode + 46 + d.prompt.length * 14 + 4;
      g.append('line').attr('class', 'node-rule')
        .attr('x1', x + 16).attr('y1', yRule)
        .attr('x2', x + nodeW - 16).attr('y2', yRule);

      d.body.forEach((line, k) => {
        g.append('text').attr('class', 'body-line')
          .attr('x', x + nodeW / 2).attr('y', yRule + 18 + k * 14)
          .attr('text-anchor', 'middle').text(line);
      });

      // annotation below node
      g.append('text').attr('class', 'annot')
        .attr('x', x + nodeW / 2).attr('y', yNode + nodeH + 22)
        .attr('text-anchor', 'middle').text(d.annot);

      g.on('mouseover', (event, dd) => {
        d3.selectAll('.g-node rect').classed('node-rect-active', false);
        rect.classed('node-rect-active', true);
        showTooltip(event, dd);
      });
      g.on('mousemove', moveTooltip);
      g.on('mouseout', () => {
        hideTooltip();
        rect.classed('node-rect-active', false);
      });
      g.on('keydown', (event) => {
        if (event.key === 'Enter' || event.key === ' ') {
          event.preventDefault();
          d3.selectAll('.g-node rect').classed('node-rect-active', false);
          rect.classed('node-rect-active', true);
        }
      });
    });

    // Edges between nodes (curved Béziers with diagnostic labels)
    EDGES.forEach(e => {
      const xFrom = margin.left + e.from * (nodeW + gap) + nodeW;
      const xTo   = margin.left + e.to   * (nodeW + gap);
      const yMid = yNode + nodeH / 2;
      const cx1 = xFrom + (xTo - xFrom) * 0.35;
      const cx2 = xFrom + (xTo - xFrom) * 0.65;
      svg.append('path').attr('class', 'flow-line')
        .attr('d', `M${xFrom + 4} ${yMid} C ${cx1} ${yMid - 18}, ${cx2} ${yMid + 18}, ${xTo - 4} ${yMid}`)
        .attr('marker-end', 'url(#arrow-ink)');

      const xMid = (xFrom + xTo) / 2;
      e.diag.forEach((line, k) => {
        svg.append('text').attr('class', 'diag')
          .attr('x', xMid).attr('y', yMid - 32 + k * 14)
          .attr('text-anchor', 'middle').text(line);
      });
    });

    svg.append('text').attr('class', 'footer')
      .attr('x', margin.left).attr('y', totalHeight - 30)
      .text('The first output’s job is to reveal what you forgot to specify.');
    svg.append('text').attr('class', 'footer')
      .attr('x', margin.left).attr('y', totalHeight - 14)
      .text('Three prompts. Seven minutes. A lesson plan reusable next year by changing one line.');
  }

  draw();
  const ro = new ResizeObserver(() => draw());
  ro.observe(document.getElementById('chart'));
})();
</script>
</body>
</html>
