<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 700 480" role="img" aria-labelledby="t07f2 d07f2">
  <title id="t07f2">Three-question decision tree for AI-assisted teacher communication</title>
  <desc id="d07f2">A vertical decision tree starting at the message to draft and branching through the school-board-readable test, the information versus relational-evidence test, and the factual-drift harm test, terminating in four outcomes: stop and rewrite, teacher-only lane, routine AI lane, and sensitive AI lane.</desc>
  <defs>
    <style>
      .ti { font-family: 'EB Garamond', Garamond, Georgia, serif; font-size: 18px; font-weight: 700; fill: #2a1a0e; }
      .sub { font-family: 'EB Garamond', Garamond, Georgia, serif; font-size: 12px; font-style: italic; fill: #4a4540; }
      .node { font-family: 'EB Garamond', Garamond, Georgia, serif; font-size: 12px; fill: #2a1a0e; }
      .nodeb { font-family: 'EB Garamond', Garamond, Georgia, serif; font-size: 12px; font-weight: 700; fill: #2a1a0e; }
      .leaf { font-family: 'EB Garamond', Garamond, Georgia, serif; font-size: 11px; fill: #fdfcfb; font-weight: 700; }
      .branch { font-family: 'EB Garamond', Garamond, Georgia, serif; font-size: 10px; font-weight: 700; fill: #4a4540; letter-spacing: 0.4px; }
      .cap { font-family: 'EB Garamond', Garamond, Georgia, serif; font-size: 12px; font-style: italic; fill: #4a4540; }
    </style>
    <marker id="arr07f2" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M 0 0 L 10 5 L 0 10 z" fill="#4a4540"/>
    </marker>
  </defs>
  <rect width="700" height="480" fill="#fdfcfb"/>

  <text x="32" y="34" class="ti">The sort happens before the draft</text>
  <text x="32" y="54" class="sub">Three questions, every message, every time.</text>

  <rect x="280" y="80" width="140" height="40" fill="#fdfcfb" stroke="#2a1a0e" stroke-width="1.5"/>
  <text x="350" y="105" text-anchor="middle" class="nodeb">Message to draft</text>

  <line x1="350" y1="120" x2="350" y2="138" stroke="#4a4540" stroke-width="1.5" marker-end="url(#arr07f2)"/>

  <path d="M 350 145 L 460 180 L 350 215 L 240 180 z" fill="#fdfcfb" stroke="#4a4540" stroke-width="1.5"/>
  <text x="350" y="176" text-anchor="middle" class="node">School-board-readable</text>
  <text x="350" y="192" text-anchor="middle" class="node">in six months?</text>

  <text x="200" y="194" class="branch">NO</text>
  <line x1="240" y1="180" x2="170" y2="180" stroke="#4a4540" stroke-width="1.5"/>
  <line x1="170" y1="180" x2="170" y2="222" stroke="#4a4540" stroke-width="1.5" marker-end="url(#arr07f2)"/>
  <rect x="90" y="230" width="160" height="44" fill="#2a1a0e" stroke="none"/>
  <text x="170" y="248" text-anchor="middle" class="leaf">Stop</text>
  <text x="170" y="264" text-anchor="middle" class="leaf">Rewrite substance first</text>

  <text x="358" y="234" class="branch">YES</text>
  <line x1="350" y1="215" x2="350" y2="252" stroke="#4a4540" stroke-width="1.5" marker-end="url(#arr07f2)"/>

  <path d="M 350 260 L 470 295 L 350 330 L 230 295 z" fill="#fdfcfb" stroke="#4a4540" stroke-width="1.5"/>
  <text x="350" y="290" text-anchor="middle" class="node">Information or</text>
  <text x="350" y="306" text-anchor="middle" class="node">relational evidence?</text>

  <text x="490" y="290" class="branch">RELATIONAL</text>
  <line x1="470" y1="295" x2="565" y2="295" stroke="#4a4540" stroke-width="1.5"/>
  <line x1="565" y1="295" x2="565" y2="252" stroke="#4a4540" stroke-width="1.5" marker-end="url(#arr07f2)"/>
  <rect x="495" y="220" width="160" height="44" fill="#2a1a0e" stroke="none"/>
  <text x="575" y="238" text-anchor="middle" class="leaf">Teacher-only lane</text>
  <text x="575" y="254" text-anchor="middle" class="leaf">model does not draft</text>

  <text x="358" y="348" class="branch">INFORMATION</text>
  <line x1="350" y1="330" x2="350" y2="362" stroke="#4a4540" stroke-width="1.5" marker-end="url(#arr07f2)"/>

  <path d="M 350 370 L 470 400 L 350 430 L 230 400 z" fill="#fdfcfb" stroke="#4a4540" stroke-width="1.5"/>
  <text x="350" y="396" text-anchor="middle" class="node">Could small drift</text>
  <text x="350" y="412" text-anchor="middle" class="node">cause real harm?</text>

  <text x="160" y="394" class="branch">NO</text>
  <line x1="230" y1="400" x2="135" y2="400" stroke="#4a4540" stroke-width="1.5"/>
  <line x1="135" y1="400" x2="135" y2="384" stroke="#4a4540" stroke-width="1.5" marker-end="url(#arr07f2)"/>
  <rect x="55" y="340" width="160" height="44" fill="#8a8480" stroke="none"/>
  <text x="135" y="358" text-anchor="middle" class="leaf">Routine AI lane</text>
  <text x="135" y="374" text-anchor="middle" class="leaf">bullets, AI, review</text>

  <text x="490" y="394" class="branch">YES</text>
  <line x1="470" y1="400" x2="565" y2="400" stroke="#4a4540" stroke-width="1.5"/>
  <line x1="565" y1="400" x2="565" y2="384" stroke="#4a4540" stroke-width="1.5" marker-end="url(#arr07f2)"/>
  <rect x="495" y="340" width="160" height="44" fill="#4a4540" stroke="none"/>
  <text x="575" y="358" text-anchor="middle" class="leaf">Sensitive AI lane</text>
  <text x="575" y="374" text-anchor="middle" class="leaf">teacher writes substance</text>

  <text x="350" y="462" class="cap" text-anchor="middle">Figure 7.2 — The sort happens before the draft. Same three questions, every message, every time.</text>
</svg>
