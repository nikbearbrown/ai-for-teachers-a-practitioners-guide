<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 700 420" role="img" aria-labelledby="t-fig01 d-fig01" font-family="'EB Garamond', Georgia, 'Times New Roman', serif">
  <title id="t-fig01">The 5.9-hour anchor</title>
  <desc id="d-fig01">A display-size 5.9 hours per week figure at the center, with three callouts naming the boundaries of the claim: weekly AI users only, ad hoc use without systematic workflow design, and after the learning curve.</desc>

  <defs>
    <marker id="dot01" viewBox="0 0 6 6" refX="3" refY="3" markerWidth="6" markerHeight="6">
      <circle cx="3" cy="3" r="2" fill="#4a4540"/>
    </marker>
  </defs>

  <rect x="0" y="0" width="700" height="420" fill="#fdfcfb"/>

  <!-- Eyebrow above anchor -->
  <text x="350" y="118" text-anchor="middle" font-size="13" letter-spacing="2.5" fill="#8a8480">THE MEASURED DIVIDEND</text>
  <line x1="280" y1="128" x2="420" y2="128" stroke="#c8c4c0" stroke-width="1"/>

  <!-- Central anchor number -->
  <text x="350" y="240" text-anchor="middle" font-size="150" font-weight="400" fill="#2a1a0e">5.9</text>
  <text x="350" y="278" text-anchor="middle" font-size="22" font-style="italic" fill="#4a4540">hours per week</text>

  <!-- Callout 1: 11 o'clock (top-left) -->
  <line x1="265" y1="172" x2="175" y2="92" stroke="#8a8480" stroke-width="1" stroke-dasharray="3 3" marker-end="url(#dot01)"/>
  <text x="28" y="50" font-size="14" font-weight="700" fill="#2a1a0e">Weekly users only</text>
  <text x="28" y="70" font-size="13" fill="#4a4540">The ~30% of U.S. public K-12</text>
  <text x="28" y="88" font-size="13" fill="#4a4540">teachers reaching for AI at least</text>
  <text x="28" y="106" font-size="13" fill="#4a4540">once a week — not all teachers.</text>

  <!-- Callout 2: 1 o'clock (top-right) -->
  <line x1="435" y1="172" x2="540" y2="92" stroke="#8a8480" stroke-width="1" stroke-dasharray="3 3" marker-end="url(#dot01)"/>
  <text x="470" y="50" font-size="14" font-weight="700" fill="#2a1a0e">Ad hoc use</text>
  <text x="470" y="70" font-size="13" fill="#4a4540">Reaching for a tool when a task</text>
  <text x="470" y="88" font-size="13" fill="#4a4540">feels heavy. No systematic</text>
  <text x="470" y="106" font-size="13" fill="#4a4540">workflow redesign assumed.</text>

  <!-- Callout 3: 5 o'clock (bottom-right) -->
  <line x1="405" y1="305" x2="505" y2="358" stroke="#8a8480" stroke-width="1" stroke-dasharray="3 3" marker-end="url(#dot01)"/>
  <text x="470" y="378" font-size="14" font-weight="700" fill="#2a1a0e">After the learning curve</text>
  <text x="470" y="398" font-size="13" fill="#4a4540">Not week one. The return</text>
  <text x="470" y="416" font-size="13" fill="#4a4540">after the investment clears.</text>

  <!-- Source caption -->
  <text x="28" y="408" font-size="11" font-style="italic" fill="#8a8480">Source: Walton Family Foundation &amp; Gallup (2025), n=2,232 U.S. public K-12 teachers.</text>
</svg>
