<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 700 480" role="img" aria-labelledby="fig01-title fig01-desc" font-family="'EB Garamond', Georgia, serif">
  <title id="fig01-title">Three independent failure modes of AI-text detection</title>
  <desc id="fig01-desc">Three stacked horizontal rows naming detection failures: tools unreliable (Weber-Wulff 2023; OpenAI 26% withdrawal), errors biased (Liang 2023, more than 50% TOEFL misclassification), institutions walking back (Vanderbilt arithmetic, 1% of 75,000 equals 750 wrongly flagged). Any one row is enough; together they constitute a settled case.</desc>

  <defs>
    <marker id="arrow01" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse">
      <path d="M0,0 L10,5 L0,10 z" fill="#2a1a0e"/>
    </marker>
  </defs>

  <rect x="0" y="0" width="700" height="480" fill="#fdfcfb"/>

  <!-- Title -->
  <text x="40" y="44" font-size="22" fill="#2a1a0e">Three independent failure modes</text>
  <text x="40" y="68" font-size="14" font-style="italic" fill="#4a4540">Any one disqualifies detection as a primary tool. Together: settled case.</text>

  <line x1="40" y1="84" x2="660" y2="84" stroke="#c8c4c0" stroke-width="1"/>

  <!-- Row 1 -->
  <g>
    <rect x="40" y="104" width="620" height="96" fill="#f5f2ee" stroke="#c8c4c0" stroke-width="1"/>
    <rect x="40" y="104" width="44" height="96" fill="#2a1a0e"/>
    <text x="62" y="160" font-size="28" fill="#fdfcfb" text-anchor="middle">1</text>

    <text x="100" y="130" font-size="17" fill="#2a1a0e">Tools are unreliable on their own terms</text>
    <text x="100" y="152" font-size="13" fill="#4a4540">Weber-Wulff et al. (2023): 12 tools across 756 cases &#8212; &#8220;neither accurate nor reliable.&#8221;</text>
    <text x="100" y="170" font-size="13" fill="#4a4540">Paraphrase, translation, and light edits collapse detection.</text>
    <text x="100" y="190" font-size="12" font-style="italic" fill="#8a8480">OpenAI withdraws its own classifier, July 20, 2023 &#8212; 26% true-positive accuracy.</text>

    <text x="640" y="140" font-size="32" fill="#2a1a0e" text-anchor="end">26%</text>
    <text x="640" y="160" font-size="11" fill="#8a8480" text-anchor="end">true-positive at withdrawal</text>
  </g>

  <!-- Row 2 -->
  <g>
    <rect x="40" y="216" width="620" height="96" fill="#f5f2ee" stroke="#c8c4c0" stroke-width="1"/>
    <rect x="40" y="216" width="44" height="96" fill="#2a1a0e"/>
    <text x="62" y="272" font-size="28" fill="#fdfcfb" text-anchor="middle">2</text>

    <text x="100" y="242" font-size="17" fill="#2a1a0e">Errors are systematically biased</text>
    <text x="100" y="264" font-size="13" fill="#4a4540">Liang et al. (2023), Patterns: seven detectors on TOEFL essays by non-native writers.</text>
    <text x="100" y="282" font-size="13" fill="#4a4540">Near-perfect on eighth-grade essays. Wrong on the protected class.</text>
    <text x="100" y="302" font-size="12" font-style="italic" fill="#8a8480">Mechanism: low perplexity is the test &#8212; multilingual writers fail it for non-AI reasons.</text>

    <text x="640" y="252" font-size="32" fill="#2a1a0e" text-anchor="end">&gt;50%</text>
    <text x="640" y="272" font-size="11" fill="#8a8480" text-anchor="end">TOEFL essays misclassified</text>
  </g>

  <!-- Row 3 -->
  <g>
    <rect x="40" y="328" width="620" height="96" fill="#f5f2ee" stroke="#c8c4c0" stroke-width="1"/>
    <rect x="40" y="328" width="44" height="96" fill="#2a1a0e"/>
    <text x="62" y="384" font-size="28" fill="#fdfcfb" text-anchor="middle">3</text>

    <text x="100" y="354" font-size="17" fill="#2a1a0e">Institutions are walking back</text>
    <text x="100" y="376" font-size="13" fill="#4a4540">Vanderbilt (Aug 2023): 1% &#215; 75,000 papers = 750 wrongly flagged students per year.</text>
    <text x="100" y="394" font-size="13" fill="#4a4540">Yale, Johns Hopkins, Northwestern follow the same exit.</text>
    <text x="100" y="414" font-size="12" font-style="italic" fill="#8a8480">Stated alternative: invest in pedagogy and assignment design.</text>

    <text x="640" y="364" font-size="32" fill="#2a1a0e" text-anchor="end">750</text>
    <text x="640" y="384" font-size="11" fill="#8a8480" text-anchor="end">wrongly flagged at 1% FP rate</text>
  </g>

  <!-- Footer -->
  <line x1="40" y1="446" x2="660" y2="446" stroke="#c8c4c0" stroke-width="1"/>
  <text x="40" y="466" font-size="12" font-style="italic" fill="#4a4540">Each row is independent. Any one is enough. Together they constitute a settled case.</text>
</svg>
