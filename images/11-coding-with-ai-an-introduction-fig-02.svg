<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 700 480" role="img" aria-labelledby="fig02-title fig02-desc" font-family="'EB Garamond', Garamond, Georgia, serif">
  <title id="fig02-title">The five-component specification</title>
  <desc id="fig02-desc">A central node labeled Working Specification with five spokes radiating to labeled tiles: Intent, Constraints, Success Criteria, Exclusions, and Output Format. Each tile carries a short clarifying example.</desc>
  <defs>
    <marker id="arrow02" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M0,0 L10,5 L0,10 z" fill="#4a4540"/>
    </marker>
  </defs>
  <rect x="0" y="0" width="700" height="480" fill="#fdfcfb"/>

  <text x="350" y="34" text-anchor="middle" font-size="22" fill="#2a1a0e">The five-component specification</text>
  <text x="350" y="56" text-anchor="middle" font-size="13" font-style="italic" fill="#4a4540">What the careful writer hands to the builder</text>

  <!-- center -->
  <rect x="270" y="210" width="160" height="60" fill="#c8c4c0" stroke="#2a1a0e" stroke-width="2"/>
  <text x="350" y="237" text-anchor="middle" font-size="15" fill="#2a1a0e">Working</text>
  <text x="350" y="256" text-anchor="middle" font-size="15" fill="#2a1a0e">specification</text>

  <!-- spokes -->
  <line x1="270" y1="220" x2="180" y2="135" stroke="#4a4540" stroke-width="1" marker-end="url(#arrow02)"/>
  <line x1="430" y1="220" x2="520" y2="135" stroke="#4a4540" stroke-width="1" marker-end="url(#arrow02)"/>
  <line x1="270" y1="260" x2="180" y2="345" stroke="#4a4540" stroke-width="1" marker-end="url(#arrow02)"/>
  <line x1="430" y1="260" x2="520" y2="345" stroke="#4a4540" stroke-width="1" marker-end="url(#arrow02)"/>
  <line x1="350" y1="270" x2="350" y2="395" stroke="#4a4540" stroke-width="1" marker-end="url(#arrow02)"/>

  <!-- Intent (top-left) -->
  <rect x="40" y="100" width="220" height="78" fill="#f5f2ee" stroke="#8a8480" stroke-width="1"/>
  <text x="150" y="122" text-anchor="middle" font-size="15" fill="#2a1a0e">1. Intent</text>
  <text x="150" y="144" text-anchor="middle" font-size="11" fill="#4a4540">why the tool exists,</text>
  <text x="150" y="160" text-anchor="middle" font-size="11" fill="#4a4540">what goal it serves</text>
  <text x="150" y="174" text-anchor="middle" font-size="10" font-style="italic" fill="#4a4540">"flag drops of 3+ pts"</text>

  <!-- Constraints (top-right) -->
  <rect x="440" y="100" width="220" height="78" fill="#f5f2ee" stroke="#8a8480" stroke-width="1"/>
  <text x="550" y="122" text-anchor="middle" font-size="15" fill="#2a1a0e">2. Constraints</text>
  <text x="550" y="144" text-anchor="middle" font-size="11" fill="#4a4540">format, privacy,</text>
  <text x="550" y="160" text-anchor="middle" font-size="11" fill="#4a4540">environment, libraries</text>
  <text x="550" y="174" text-anchor="middle" font-size="10" font-style="italic" fill="#4a4540">"no network, std lib only"</text>

  <!-- Success criteria (bottom-left) -->
  <rect x="40" y="310" width="220" height="78" fill="#f5f2ee" stroke="#8a8480" stroke-width="1"/>
  <text x="150" y="332" text-anchor="middle" font-size="15" fill="#2a1a0e">3. Success criteria</text>
  <text x="150" y="354" text-anchor="middle" font-size="11" fill="#4a4540">how you know it worked,</text>
  <text x="150" y="370" text-anchor="middle" font-size="11" fill="#4a4540">hand-computed test rows</text>
  <text x="150" y="384" text-anchor="middle" font-size="10" font-style="italic" fill="#4a4540">"3 of 5 rows pass"</text>

  <!-- Exclusions (bottom-right) -->
  <rect x="440" y="310" width="220" height="78" fill="#f5f2ee" stroke="#8a8480" stroke-width="1"/>
  <text x="550" y="332" text-anchor="middle" font-size="15" fill="#2a1a0e">4. Exclusions</text>
  <text x="550" y="354" text-anchor="middle" font-size="11" fill="#4a4540">what it must not do,</text>
  <text x="550" y="370" text-anchor="middle" font-size="11" fill="#4a4540">touch, or include</text>
  <text x="550" y="384" text-anchor="middle" font-size="10" font-style="italic" fill="#4a4540">"do NOT include grades"</text>

  <!-- Output format (bottom-center) -->
  <rect x="240" y="400" width="220" height="58" fill="#f5f2ee" stroke="#8a8480" stroke-width="1"/>
  <text x="350" y="422" text-anchor="middle" font-size="15" fill="#2a1a0e">5. Output format</text>
  <text x="350" y="442" text-anchor="middle" font-size="11" fill="#4a4540">the deliverable's structure</text>
  <text x="350" y="456" text-anchor="middle" font-size="10" font-style="italic" fill="#4a4540">"drafts.txt, one block per student"</text>
</svg>
