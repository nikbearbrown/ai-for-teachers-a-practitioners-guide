<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 760 460" role="img" aria-labelledby="fig01-title fig01-desc" font-family="'EB Garamond', Garamond, Georgia, serif">
  <title id="fig01-title">Two different jobs: teacher writing versus writing instruction</title>
  <desc id="fig01-desc">Two side-by-side panels. Left panel shows AI as renderer for teacher-produced bullets. Right panel shows AI bypassing the cognitive work a student assignment was designed to produce.</desc>

  <defs>
    <marker id="arrow01" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse">
      <path d="M0,0 L10,5 L0,10 z" fill="#2a1a0e"/>
    </marker>
    <marker id="arrowMuted01" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse">
      <path d="M0,0 L10,5 L0,10 z" fill="#8a8480"/>
    </marker>
  </defs>

  <rect x="0" y="0" width="760" height="460" fill="#fdfcfb"/>

  <text x="380" y="34" text-anchor="middle" font-size="20" font-style="italic" fill="#2a1a0e">Same model. Opposite uses.</text>

  <rect x="24" y="60" width="346" height="372" fill="#f5f2ee" stroke="#8a8480" stroke-width="1"/>
  <text x="197" y="92" text-anchor="middle" font-size="18" fill="#2a1a0e">Teacher writing</text>
  <text x="197" y="112" text-anchor="middle" font-size="13" font-style="italic" fill="#4a4540">Syllabi, rubrics, parent updates</text>

  <rect x="56" y="138" width="120" height="76" fill="#fdfcfb" stroke="#2a1a0e" stroke-width="1.2"/>
  <text x="116" y="166" text-anchor="middle" font-size="14" fill="#2a1a0e">Teacher's</text>
  <text x="116" y="184" text-anchor="middle" font-size="14" fill="#2a1a0e">judgment</text>
  <text x="116" y="202" text-anchor="middle" font-size="11" font-style="italic" fill="#4a4540">substance decided</text>

  <rect x="218" y="138" width="120" height="76" fill="#fdfcfb" stroke="#2a1a0e" stroke-width="1.2"/>
  <text x="278" y="170" text-anchor="middle" font-size="14" fill="#2a1a0e">Model</text>
  <text x="278" y="190" text-anchor="middle" font-size="11" font-style="italic" fill="#4a4540">renders register</text>

  <line x1="176" y1="176" x2="218" y2="176" stroke="#2a1a0e" stroke-width="1.4" marker-end="url(#arrow01)"/>

  <rect x="98" y="252" width="196" height="64" fill="#fdfcfb" stroke="#2a1a0e" stroke-width="1.2"/>
  <text x="196" y="282" text-anchor="middle" font-size="14" fill="#2a1a0e">Syllabus draft</text>
  <text x="196" y="302" text-anchor="middle" font-size="11" font-style="italic" fill="#4a4540">teacher reviews, fixes</text>

  <line x1="278" y1="214" x2="244" y2="252" stroke="#2a1a0e" stroke-width="1.4" marker-end="url(#arrow01)"/>

  <text x="197" y="350" text-anchor="middle" font-size="13" fill="#2a1a0e">Cognitive work already happened.</text>
  <text x="197" y="370" text-anchor="middle" font-size="13" fill="#2a1a0e">Model renders what the teacher knows.</text>
  <text x="197" y="402" text-anchor="middle" font-size="14" font-style="italic" fill="#2a1a0e">Fit: skilled co-writer.</text>

  <rect x="390" y="60" width="346" height="372" fill="#f5f2ee" stroke="#8a8480" stroke-width="1"/>
  <text x="563" y="92" text-anchor="middle" font-size="18" fill="#2a1a0e">Writing instruction</text>
  <text x="563" y="112" text-anchor="middle" font-size="13" font-style="italic" fill="#4a4540">Student essays, analytical writing</text>

  <rect x="422" y="138" width="120" height="76" fill="#fdfcfb" stroke="#2a1a0e" stroke-width="1.2"/>
  <text x="482" y="166" text-anchor="middle" font-size="14" fill="#2a1a0e">Student's</text>
  <text x="482" y="184" text-anchor="middle" font-size="14" fill="#2a1a0e">cognition</text>
  <text x="482" y="202" text-anchor="middle" font-size="11" font-style="italic" fill="#8a8480">work not yet done</text>

  <rect x="584" y="138" width="120" height="76" fill="#fdfcfb" stroke="#2a1a0e" stroke-width="1.2"/>
  <text x="644" y="170" text-anchor="middle" font-size="14" fill="#2a1a0e">Model</text>
  <text x="644" y="190" text-anchor="middle" font-size="11" font-style="italic" fill="#4a4540">drafts the essay</text>

  <line x1="542" y1="176" x2="584" y2="176" stroke="#8a8480" stroke-width="1.2" stroke-dasharray="4 3" marker-end="url(#arrowMuted01)"/>
  <text x="563" y="232" text-anchor="middle" font-size="11" font-style="italic" fill="#8a8480">bypass</text>

  <rect x="464" y="252" width="196" height="64" fill="#fdfcfb" stroke="#2a1a0e" stroke-width="1.2"/>
  <text x="562" y="282" text-anchor="middle" font-size="14" fill="#2a1a0e">Polished essay</text>
  <text x="562" y="302" text-anchor="middle" font-size="11" font-style="italic" fill="#4a4540">looks like evidence</text>

  <line x1="644" y1="214" x2="610" y2="252" stroke="#2a1a0e" stroke-width="1.4" marker-end="url(#arrow01)"/>

  <text x="563" y="350" text-anchor="middle" font-size="13" fill="#2a1a0e">Drafting is the learning event.</text>
  <text x="563" y="370" text-anchor="middle" font-size="13" fill="#2a1a0e">Artifact without process is empty.</text>
  <text x="563" y="402" text-anchor="middle" font-size="14" font-style="italic" fill="#2a1a0e">Fit: ghostwriter (wrong fit).</text>

  <text x="380" y="446" text-anchor="middle" font-size="12" font-style="italic" fill="#4a4540">The rules come from the use, not from the tool.</text>
</svg>
