<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 700 480" role="img" aria-labelledby="t05-3 d05-3">
  <title id="t05-3">The re-run is fifteen minutes; the drift is a semester</title>
  <desc id="d05-3">Two-column timeline contrasting a calibration workflow that scales without the closing re-run against one that closes the gap in the prompt before scaling. The left column drifts; the right column lands accurately.</desc>
  <defs>
    <marker id="arr-3" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto">
      <path d="M0,0 L10,5 L0,10 z" fill="#4a4540"/>
    </marker>
    <style>
      .ti { font-family: 'EB Garamond', Georgia, 'Times New Roman', serif; font-size: 16px; font-weight: bold; fill: #2a1a0e; }
      .sub { font-family: 'EB Garamond', Georgia, 'Times New Roman', serif; font-size: 11px; font-style: italic; fill: #4a4540; }
      .col-h { font-family: 'EB Garamond', Georgia, 'Times New Roman', serif; font-size: 13px; font-weight: bold; fill: #2a1a0e; }
      .step { font-family: 'EB Garamond', Georgia, 'Times New Roman', serif; font-size: 12px; fill: #2a1a0e; }
      .step-dim { font-family: 'EB Garamond', Georgia, 'Times New Roman', serif; font-size: 11px; fill: #8a8480; font-style: italic; }
      .num { font-family: 'EB Garamond', Georgia, 'Times New Roman', serif; font-size: 11px; font-weight: bold; fill: #fdfcfb; }
      .out-bad { font-family: 'EB Garamond', Georgia, 'Times New Roman', serif; font-size: 12px; font-weight: bold; fill: #fdfcfb; }
      .out-good { font-family: 'EB Garamond', Georgia, 'Times New Roman', serif; font-size: 12px; font-weight: bold; fill: #fdfcfb; }
      .cap { font-family: 'EB Garamond', Georgia, 'Times New Roman', serif; font-size: 11px; font-style: italic; fill: #4a4540; }
    </style>
  </defs>
  <rect width="700" height="480" fill="#fdfcfb"/>

  <text x="32" y="28" class="ti">The re-run is fifteen minutes; the drift is a semester</text>
  <text x="32" y="46" class="sub">The fifth calibration step — re-running on the same samples — is the one most people skip.</text>

  <!-- Column headers -->
  <text x="180" y="82" text-anchor="middle" class="col-h">Without the re-run</text>
  <text x="520" y="82" text-anchor="middle" class="col-h">With the re-run</text>
  <line x1="350" y1="60" x2="350" y2="460" stroke="#c8c4c0" stroke-width="1" stroke-dasharray="4 4"/>

  <!-- LEFT column steps -->
  <!-- Step 1 -->
  <circle cx="60" cy="118" r="11" fill="#4a4540"/>
  <text x="60" y="122" text-anchor="middle" class="num">1</text>
  <text x="80" y="116" class="step">Offset noticed (AI runs half-point high)</text>
  <text x="80" y="131" class="step-dim">Quick visual check on the first five</text>

  <!-- Step 2 -->
  <circle cx="60" cy="160" r="11" fill="#4a4540"/>
  <text x="60" y="164" text-anchor="middle" class="num">2</text>
  <text x="80" y="158" class="step">Mental note: "I'll adjust as I review"</text>
  <text x="80" y="173" class="step-dim">No change to the prompt</text>

  <!-- Step 3 -->
  <circle cx="60" cy="202" r="11" fill="#4a4540"/>
  <text x="60" y="206" text-anchor="middle" class="num">3</text>
  <text x="80" y="200" class="step">Scale to all 110 essays</text>
  <text x="80" y="215" class="step-dim">Mental correction is the only safeguard</text>

  <!-- Step 4 -->
  <circle cx="60" cy="244" r="11" fill="#4a4540"/>
  <text x="60" y="248" text-anchor="middle" class="num">4</text>
  <text x="80" y="242" class="step">Drift propagates across essays</text>
  <text x="80" y="257" class="step-dim">By essay 40 the offset is invisible</text>

  <!-- Step 5 -->
  <circle cx="60" cy="286" r="11" fill="#4a4540"/>
  <text x="60" y="290" text-anchor="middle" class="num">5</text>
  <text x="80" y="284" class="step">Grade distribution off by half a level</text>
  <text x="80" y="299" class="step-dim">Real grades on real transcripts</text>

  <!-- Outcome chip left -->
  <rect x="40" y="332" width="280" height="46" fill="#2a1a0e"/>
  <text x="180" y="352" text-anchor="middle" class="out-bad">Outcome: systematic upward drift</text>
  <text x="180" y="370" text-anchor="middle" class="cap" fill="#c8c4c0">Calibration that is not closed in the prompt</text>

  <!-- RIGHT column steps -->
  <!-- Step 1 -->
  <circle cx="400" cy="118" r="11" fill="#2a1a0e"/>
  <text x="400" y="122" text-anchor="middle" class="num">1</text>
  <text x="420" y="116" class="step">Offset noticed (AI runs half-point high)</text>
  <text x="420" y="131" class="step-dim">Same visual check on the first five</text>

  <!-- Step 2 -->
  <circle cx="400" cy="160" r="11" fill="#2a1a0e"/>
  <text x="400" y="164" text-anchor="middle" class="num">2</text>
  <text x="420" y="158" class="step">Prompt revised — anchors, ceiling, language</text>
  <text x="420" y="173" class="step-dim">The fix lives in the artifact, not the head</text>

  <!-- Step 3 -->
  <circle cx="400" cy="202" r="11" fill="#2a1a0e"/>
  <text x="400" y="206" text-anchor="middle" class="num">3</text>
  <text x="420" y="200" class="step">Re-run on the same five samples</text>
  <text x="420" y="215" class="step-dim">Fifteen minutes — verifies the fix worked</text>

  <!-- Step 4 -->
  <circle cx="400" cy="244" r="11" fill="#2a1a0e"/>
  <text x="400" y="248" text-anchor="middle" class="num">4</text>
  <text x="420" y="242" class="step">Within ±0.5 — scale to all 110</text>
  <text x="420" y="257" class="step-dim">Drift cannot start; the prompt is closed</text>

  <!-- Step 5 -->
  <circle cx="400" cy="286" r="11" fill="#2a1a0e"/>
  <text x="400" y="290" text-anchor="middle" class="num">5</text>
  <text x="420" y="284" class="step">Distribution matches teacher judgment</text>
  <text x="420" y="299" class="step-dim">Reviewable, defensible, repeatable</text>

  <!-- Outcome chip right -->
  <rect x="380" y="332" width="280" height="46" fill="#2a1a0e"/>
  <text x="520" y="352" text-anchor="middle" class="out-good">Outcome: calibrated and stable</text>
  <text x="520" y="370" text-anchor="middle" class="cap" fill="#c8c4c0">Fifteen minutes spent up front</text>

  <!-- Arrows down each column -->
  <path d="M60,300 L60,326" stroke="#4a4540" stroke-width="1.2" marker-end="url(#arr-3)"/>
  <path d="M400,300 L400,326" stroke="#4a4540" stroke-width="1.2" marker-end="url(#arr-3)"/>

  <text x="32" y="416" class="cap">The mental adjustment does not survive thirty essays.</text>
  <text x="32" y="434" class="cap">Calibration that is not closed in the prompt is calibration that is not happening.</text>
  <text x="32" y="452" class="cap">Fifteen minutes of re-run beats a semester of corrected distributions.</text>
</svg>
