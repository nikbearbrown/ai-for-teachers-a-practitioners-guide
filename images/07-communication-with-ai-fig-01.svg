<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 700 480" role="img" aria-labelledby="t07f1 d07f1">
  <title id="t07f1">A teacher's communication week as five categories</title>
  <desc id="d07f1">Five horizontal rows naming five categories of teacher communication, each with what the parent reads for in the middle and the appropriate AI role on the right. Categories range from routine informational at the top through progress notes, administrative documentation, sensitive communications, down to relational-evidence messages at the bottom, with sensitivity rising as the rows descend.</desc>
  <defs>
    <style>
      .ti { font-family: 'EB Garamond', Garamond, Georgia, serif; font-size: 18px; font-weight: 700; fill: #2a1a0e; }
      .sub { font-family: 'EB Garamond', Garamond, Georgia, serif; font-size: 12px; font-style: italic; fill: #4a4540; }
      .hdr { font-family: 'EB Garamond', Garamond, Georgia, serif; font-size: 10px; font-weight: 700; fill: #4a4540; letter-spacing: 0.6px; }
      .cat { font-family: 'EB Garamond', Garamond, Georgia, serif; font-size: 13px; font-weight: 700; fill: #2a1a0e; }
      .desc { font-family: 'EB Garamond', Garamond, Georgia, serif; font-size: 12px; fill: #2a1a0e; }
      .role-light { font-family: 'EB Garamond', Garamond, Georgia, serif; font-size: 11px; fill: #2a1a0e; }
      .role-dark { font-family: 'EB Garamond', Garamond, Georgia, serif; font-size: 11px; fill: #fdfcfb; }
      .cap { font-family: 'EB Garamond', Garamond, Georgia, serif; font-size: 12px; font-style: italic; fill: #4a4540; }
      .axislbl { font-family: 'EB Garamond', Garamond, Georgia, serif; font-size: 10px; fill: #4a4540; }
    </style>
    <marker id="arr07f1" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M 0 0 L 10 5 L 0 10 z" fill="#4a4540"/>
    </marker>
  </defs>
  <rect width="700" height="480" fill="#fdfcfb"/>

  <text x="32" y="34" class="ti">A teacher's communication week, sorted before drafting</text>
  <text x="32" y="54" class="sub">Same label outside. Five different gate positions inside. The sort decides who drafts.</text>

  <text x="44" y="92" class="hdr">CATEGORY</text>
  <text x="240" y="92" class="hdr">WHAT THE PARENT READS FOR</text>
  <text x="520" y="92" class="hdr">AI ROLE</text>
  <line x1="32" y1="100" x2="668" y2="100" stroke="#8a8480" stroke-width="1"/>

  <line x1="20" y1="118" x2="20" y2="430" stroke="#8a8480" stroke-width="1"/>
  <text x="14" y="120" class="axislbl" text-anchor="end" transform="rotate(-90 14 120)">routine</text>
  <text x="14" y="430" class="axislbl" text-anchor="start" transform="rotate(-90 14 430)">sensitivity rises</text>
  <path d="M 20 425 L 17 418 L 23 418 z" fill="#4a4540"/>

  <rect x="32" y="116" width="200" height="52" fill="#fdfcfb" stroke="#c8c4c0" stroke-width="1"/>
  <text x="44" y="138" class="cat">Routine informational</text>
  <text x="44" y="156" class="desc">field-trip dates, schedules</text>
  <text x="240" y="138" class="desc">information; was the date</text>
  <text x="240" y="154" class="desc">right?</text>
  <rect x="498" y="124" width="160" height="36" fill="#8a8480" stroke="none"/>
  <text x="578" y="147" text-anchor="middle" class="role-dark">AI drafts, teacher reviews</text>

  <rect x="32" y="176" width="200" height="52" fill="#fdfcfb" stroke="#c8c4c0" stroke-width="1"/>
  <text x="44" y="198" class="cat">Progress and pattern</text>
  <text x="44" y="216" class="desc">three-late, work-strong notes</text>
  <text x="240" y="198" class="desc">information plus evidence</text>
  <text x="240" y="214" class="desc">you know their kid</text>
  <rect x="498" y="184" width="160" height="36" fill="#4a4540" stroke="none"/>
  <text x="578" y="207" text-anchor="middle" class="role-dark">bullets, AI, review</text>

  <rect x="32" y="236" width="200" height="52" fill="#fdfcfb" stroke="#c8c4c0" stroke-width="1"/>
  <text x="44" y="258" class="cat">Administrative</text>
  <text x="44" y="276" class="desc">IEP notes, incident reports</text>
  <text x="240" y="258" class="desc">district reads this six</text>
  <text x="240" y="274" class="desc">months from now</text>
  <rect x="498" y="244" width="160" height="36" fill="#4a4540" stroke="none"/>
  <text x="578" y="267" text-anchor="middle" class="role-dark">teacher notes, AI renders</text>

  <rect x="32" y="296" width="200" height="52" fill="#fdfcfb" stroke="#c8c4c0" stroke-width="1"/>
  <text x="44" y="318" class="cat">Sensitive</text>
  <text x="44" y="336" class="desc">behavioral, custody, legal</text>
  <text x="240" y="318" class="desc">information, evidence,</text>
  <text x="240" y="334" class="desc">institutional signal</text>
  <rect x="498" y="304" width="160" height="36" fill="#2a1a0e" stroke="none"/>
  <text x="578" y="327" text-anchor="middle" class="role-dark">teacher writes substance</text>

  <rect x="32" y="356" width="200" height="52" fill="#fdfcfb" stroke="#c8c4c0" stroke-width="1"/>
  <text x="44" y="378" class="cat">Relational evidence</text>
  <text x="44" y="396" class="desc">"I noticed Maya today"</text>
  <text x="240" y="378" class="desc">you noticed my kid</text>
  <text x="240" y="394" class="desc">not warmth, noticing</text>
  <rect x="498" y="364" width="160" height="36" fill="#2a1a0e" stroke="#2a1a0e" stroke-width="1"/>
  <text x="578" y="387" text-anchor="middle" class="role-dark">AI does not draft</text>

  <text x="350" y="450" class="cap" text-anchor="middle">Figure 7.1 — Same week, five different gate positions. The sort happens before the draft.</text>
</svg>
