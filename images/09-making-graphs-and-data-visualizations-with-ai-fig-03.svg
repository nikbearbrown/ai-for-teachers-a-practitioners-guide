<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 700 480" role="img" aria-labelledby="f3-title f3-desc" font-family="'EB Garamond', Garamond, Georgia, serif">
  <title id="f3-title">Three distributions, one mean of 72</title>
  <desc id="f3-desc">Top row shows three identical bar charts, each labeled mean = 72, hiding the spread. Bottom row shows the underlying strip plots: class A clusters tightly near 72; class B is bimodal with one cluster near 60 and another near 84; class C has a long lower tail of eight students between 45 and 55 and a main cluster between 75 and 78. The teaching response to each class should be different.</desc>
  <defs>
    <marker id="f3-arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse">
      <path d="M0,0 L10,5 L0,10 z" fill="#4a4540"/>
    </marker>
  </defs>

  <rect x="0" y="0" width="700" height="480" fill="#fdfcfb"/>

  <text x="350" y="32" text-anchor="middle" font-size="20" fill="#2a1a0e">Same mean, three different classes</text>
  <text x="350" y="52" text-anchor="middle" font-size="13" fill="#4a4540" font-style="italic">Bar of means hides the answer to your question. Distribution charts reveal it.</text>

  <!-- TOP ROW: three identical bars -->
  <g transform="translate(40,80)">
    <text x="0" y="0" font-size="13" fill="#2a1a0e" font-weight="bold">What the bar chart shows</text>
    <!-- panel A -->
    <g transform="translate(0,16)">
      <text x="100" y="14" text-anchor="middle" font-size="11" fill="#4a4540">Class A &#8212; mean = 72</text>
      <line x1="20" y1="120" x2="200" y2="120" stroke="#4a4540" stroke-width="1"/>
      <line x1="20" y1="24"  x2="20" y2="120" stroke="#4a4540" stroke-width="1"/>
      <rect x="80" y="33.6" width="40" height="86.4" fill="#2a1a0e"/>
      <text x="100" y="135" font-size="9" fill="#4a4540" text-anchor="middle">Class A</text>
    </g>
    <!-- panel B -->
    <g transform="translate(210,16)">
      <text x="100" y="14" text-anchor="middle" font-size="11" fill="#4a4540">Class B &#8212; mean = 72</text>
      <line x1="20" y1="120" x2="200" y2="120" stroke="#4a4540" stroke-width="1"/>
      <line x1="20" y1="24"  x2="20" y2="120" stroke="#4a4540" stroke-width="1"/>
      <rect x="80" y="33.6" width="40" height="86.4" fill="#2a1a0e"/>
      <text x="100" y="135" font-size="9" fill="#4a4540" text-anchor="middle">Class B</text>
    </g>
    <!-- panel C -->
    <g transform="translate(420,16)">
      <text x="100" y="14" text-anchor="middle" font-size="11" fill="#4a4540">Class C &#8212; mean = 72</text>
      <line x1="20" y1="120" x2="200" y2="120" stroke="#4a4540" stroke-width="1"/>
      <line x1="20" y1="24"  x2="20" y2="120" stroke="#4a4540" stroke-width="1"/>
      <rect x="80" y="33.6" width="40" height="86.4" fill="#2a1a0e"/>
      <text x="100" y="135" font-size="9" fill="#4a4540" text-anchor="middle">Class C</text>
    </g>
  </g>

  <text x="350" y="248" text-anchor="middle" font-size="12" fill="#8a8480" font-style="italic">Three identical bars. Three completely different classes underneath.</text>
  <line x1="350" y1="258" x2="350" y2="278" stroke="#4a4540" stroke-width="1.2" marker-end="url(#f3-arrow)"/>

  <!-- BOTTOM ROW: strip plots -->
  <g transform="translate(40,290)">
    <text x="0" y="0" font-size="13" fill="#2a1a0e" font-weight="bold">What the strip plot reveals</text>

    <!-- Class A: tight cluster around 72 (range 70-74) -->
    <g transform="translate(0,16)">
      <text x="100" y="14" text-anchor="middle" font-size="11" fill="#4a4540">A: tight cluster</text>
      <line x1="10" y1="60" x2="190" y2="60" stroke="#8a8480" stroke-width="1"/>
      <line x1="10" y1="56" x2="10" y2="64" stroke="#8a8480" stroke-width="1"/>
      <line x1="190" y1="56" x2="190" y2="64" stroke="#8a8480" stroke-width="1"/>
      <text x="10"  y="78" font-size="9" fill="#4a4540" text-anchor="middle">40</text>
      <text x="190" y="78" font-size="9" fill="#4a4540" text-anchor="middle">100</text>
      <!-- points: 70..74 mapped to x = 10 + (v-40)/60*180 -->
      <!-- 70 -> 100, 71 -> 103, 72 -> 106, 73 -> 109, 74 -> 112 -->
      <g fill="#2a1a0e" fill-opacity="0.7">
        <circle cx="100" cy="56" r="3"/>
        <circle cx="100" cy="64" r="3"/>
        <circle cx="103" cy="52" r="3"/>
        <circle cx="103" cy="60" r="3"/>
        <circle cx="103" cy="68" r="3"/>
        <circle cx="106" cy="48" r="3"/>
        <circle cx="106" cy="56" r="3"/>
        <circle cx="106" cy="64" r="3"/>
        <circle cx="106" cy="72" r="3"/>
        <circle cx="109" cy="52" r="3"/>
        <circle cx="109" cy="60" r="3"/>
        <circle cx="109" cy="68" r="3"/>
        <circle cx="112" cy="56" r="3"/>
        <circle cx="112" cy="64" r="3"/>
      </g>
      <!-- mean tick -->
      <line x1="106" y1="40" x2="106" y2="80" stroke="#2a1a0e" stroke-width="1.5" stroke-dasharray="2 2"/>
      <text x="106" y="36" font-size="9" fill="#2a1a0e" text-anchor="middle">mean 72</text>
      <text x="100" y="105" font-size="10" fill="#4a4540" text-anchor="middle" font-style="italic">curriculum is working</text>
    </g>

    <!-- Class B: bimodal (~60 and ~84) -->
    <g transform="translate(210,16)">
      <text x="100" y="14" text-anchor="middle" font-size="11" fill="#4a4540">B: bimodal</text>
      <line x1="10" y1="60" x2="190" y2="60" stroke="#8a8480" stroke-width="1"/>
      <line x1="10" y1="56" x2="10" y2="64" stroke="#8a8480" stroke-width="1"/>
      <line x1="190" y1="56" x2="190" y2="64" stroke="#8a8480" stroke-width="1"/>
      <text x="10"  y="78" font-size="9" fill="#4a4540" text-anchor="middle">40</text>
      <text x="190" y="78" font-size="9" fill="#4a4540" text-anchor="middle">100</text>
      <!-- cluster ~60: v=58..62 -> x=64..76 -->
      <g fill="#2a1a0e" fill-opacity="0.7">
        <circle cx="64" cy="56" r="3"/>
        <circle cx="64" cy="64" r="3"/>
        <circle cx="68" cy="52" r="3"/>
        <circle cx="68" cy="60" r="3"/>
        <circle cx="68" cy="68" r="3"/>
        <circle cx="72" cy="56" r="3"/>
        <circle cx="72" cy="64" r="3"/>
        <circle cx="76" cy="60" r="3"/>
        <!-- cluster ~84: v=82..86 -> x=136..148 -->
        <circle cx="136" cy="56" r="3"/>
        <circle cx="136" cy="64" r="3"/>
        <circle cx="140" cy="52" r="3"/>
        <circle cx="140" cy="60" r="3"/>
        <circle cx="140" cy="68" r="3"/>
        <circle cx="144" cy="56" r="3"/>
        <circle cx="144" cy="64" r="3"/>
        <circle cx="148" cy="60" r="3"/>
      </g>
      <line x1="106" y1="40" x2="106" y2="80" stroke="#2a1a0e" stroke-width="1.5" stroke-dasharray="2 2"/>
      <text x="106" y="36" font-size="9" fill="#2a1a0e" text-anchor="middle">mean 72</text>
      <text x="100" y="105" font-size="10" fill="#4a4540" text-anchor="middle" font-style="italic">two groups need different things</text>
    </g>

    <!-- Class C: long lower tail + cluster ~76 -->
    <g transform="translate(420,16)">
      <text x="100" y="14" text-anchor="middle" font-size="11" fill="#4a4540">C: long lower tail</text>
      <line x1="10" y1="60" x2="190" y2="60" stroke="#8a8480" stroke-width="1"/>
      <line x1="10" y1="56" x2="10" y2="64" stroke="#8a8480" stroke-width="1"/>
      <line x1="190" y1="56" x2="190" y2="64" stroke="#8a8480" stroke-width="1"/>
      <text x="10"  y="78" font-size="9" fill="#4a4540" text-anchor="middle">40</text>
      <text x="190" y="78" font-size="9" fill="#4a4540" text-anchor="middle">100</text>
      <!-- tail ~45-55: x = 10 + (v-40)/60*180. 45->25, 47->31, 50->40, 52->46, 55->55 -->
      <g fill="#2a1a0e" fill-opacity="0.75">
        <circle cx="25" cy="60" r="3"/>
        <circle cx="31" cy="56" r="3"/>
        <circle cx="31" cy="64" r="3"/>
        <circle cx="40" cy="60" r="3"/>
        <circle cx="46" cy="56" r="3"/>
        <circle cx="46" cy="64" r="3"/>
        <circle cx="52" cy="60" r="3"/>
        <circle cx="55" cy="60" r="3"/>
        <!-- main cluster 75-78 -> x = 115..124 -->
        <circle cx="115" cy="52" r="3"/>
        <circle cx="115" cy="60" r="3"/>
        <circle cx="115" cy="68" r="3"/>
        <circle cx="118" cy="48" r="3"/>
        <circle cx="118" cy="56" r="3"/>
        <circle cx="118" cy="64" r="3"/>
        <circle cx="118" cy="72" r="3"/>
        <circle cx="121" cy="52" r="3"/>
        <circle cx="121" cy="60" r="3"/>
        <circle cx="121" cy="68" r="3"/>
        <circle cx="124" cy="56" r="3"/>
        <circle cx="124" cy="64" r="3"/>
      </g>
      <line x1="106" y1="40" x2="106" y2="80" stroke="#2a1a0e" stroke-width="1.5" stroke-dasharray="2 2"/>
      <text x="106" y="36" font-size="9" fill="#2a1a0e" text-anchor="middle">mean 72</text>
      <text x="100" y="105" font-size="10" fill="#4a4540" text-anchor="middle" font-style="italic">eight students need intervention</text>
    </g>
  </g>

  <text x="350" y="460" text-anchor="middle" font-size="11" fill="#8a8480" font-style="italic">When the equity question is &#8220;who is being left behind?&#8221;, a bar of means cannot answer it.</text>
</svg>
