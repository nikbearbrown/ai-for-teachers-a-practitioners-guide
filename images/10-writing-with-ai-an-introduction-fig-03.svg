<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 760 480" role="img" aria-labelledby="fig03-title fig03-desc" font-family="'EB Garamond', Garamond, Georgia, serif">
  <title id="fig03-title">Flower &amp; Hayes recursive model of writing</title>
  <desc id="fig03-desc">Three mental processes — planning, translating, reviewing — connected by bidirectional arrows showing recursive orchestration. Task environment and long-term memory bracket the process loop.</desc>

  <defs>
    <marker id="arrow03" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="9" markerHeight="9" orient="auto-start-reverse">
      <path d="M0,0 L10,5 L0,10 z" fill="#2a1a0e"/>
    </marker>
    <marker id="arrow03start" viewBox="0 0 10 10" refX="1" refY="5" markerWidth="9" markerHeight="9" orient="auto-start-reverse">
      <path d="M10,0 L0,5 L10,10 z" fill="#2a1a0e"/>
    </marker>
  </defs>

  <rect x="0" y="0" width="760" height="480" fill="#fdfcfb"/>

  <text x="380" y="34" text-anchor="middle" font-size="20" fill="#2a1a0e">Writing as recursive orchestration</text>
  <text x="380" y="56" text-anchor="middle" font-size="13" font-style="italic" fill="#4a4540">After Flower &amp; Hayes, 1981 — the artifact is the residue of the process</text>

  <rect x="120" y="92" width="520" height="48" fill="#f5f2ee" stroke="#8a8480" stroke-width="1"/>
  <text x="380" y="116" text-anchor="middle" font-size="14" fill="#2a1a0e">Task environment</text>
  <text x="380" y="132" text-anchor="middle" font-size="11" font-style="italic" fill="#4a4540">prompt, audience, accumulated text so far</text>

  <rect x="120" y="384" width="520" height="48" fill="#f5f2ee" stroke="#8a8480" stroke-width="1"/>
  <text x="380" y="408" text-anchor="middle" font-size="14" fill="#2a1a0e">Long-term memory</text>
  <text x="380" y="424" text-anchor="middle" font-size="11" font-style="italic" fill="#4a4540">knowledge of topic, audience, writing plans</text>

  <ellipse cx="380" cy="200" rx="92" ry="44" fill="#fdfcfb" stroke="#2a1a0e" stroke-width="1.4"/>
  <text x="380" y="198" text-anchor="middle" font-size="17" fill="#2a1a0e">Planning</text>
  <text x="380" y="218" text-anchor="middle" font-size="11" font-style="italic" fill="#4a4540">generate, organize, set goals</text>

  <ellipse cx="220" cy="320" rx="92" ry="44" fill="#fdfcfb" stroke="#2a1a0e" stroke-width="1.4"/>
  <text x="220" y="318" text-anchor="middle" font-size="17" fill="#2a1a0e">Translating</text>
  <text x="220" y="338" text-anchor="middle" font-size="11" font-style="italic" fill="#4a4540">put thought into prose</text>

  <ellipse cx="540" cy="320" rx="92" ry="44" fill="#fdfcfb" stroke="#2a1a0e" stroke-width="1.4"/>
  <text x="540" y="318" text-anchor="middle" font-size="17" fill="#2a1a0e">Reviewing</text>
  <text x="540" y="338" text-anchor="middle" font-size="11" font-style="italic" fill="#4a4540">read, evaluate, revise</text>

  <line x1="316" y1="232" x2="270" y2="282" stroke="#2a1a0e" stroke-width="1.4" marker-end="url(#arrow03)" marker-start="url(#arrow03start)"/>
  <line x1="444" y1="232" x2="490" y2="282" stroke="#2a1a0e" stroke-width="1.4" marker-end="url(#arrow03)" marker-start="url(#arrow03start)"/>
  <line x1="312" y1="320" x2="448" y2="320" stroke="#2a1a0e" stroke-width="1.4" marker-end="url(#arrow03)" marker-start="url(#arrow03start)"/>

  <line x1="380" y1="140" x2="380" y2="156" stroke="#8a8480" stroke-width="1" stroke-dasharray="3 3" marker-end="url(#arrow03)"/>
  <line x1="220" y1="364" x2="220" y2="384" stroke="#8a8480" stroke-width="1" stroke-dasharray="3 3" marker-end="url(#arrow03)"/>
  <line x1="540" y1="364" x2="540" y2="384" stroke="#8a8480" stroke-width="1" stroke-dasharray="3 3" marker-end="url(#arrow03)"/>

  <text x="380" y="464" text-anchor="middle" font-size="12" font-style="italic" fill="#4a4540">Each process can interrupt and call any other. The cognition lives in the loop.</text>
</svg>
