<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 700 480" role="img" aria-labelledby="f2-title f2-desc" font-family="'EB Garamond', Garamond, Georgia, serif">
  <title id="f2-title">Cairo&apos;s four failure modes of the &quot;compared with what?&quot; check</title>
  <desc id="f2-desc">A 2x2 grid naming four ways a chart fails Cairo&apos;s reference test: raw counts where rates are needed, time series without baseline, cross-section without controls, and single-value claims without anchor. Each cell pairs the failure with its honest replacement.</desc>
  <defs>
    <marker id="f2-arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse">
      <path d="M0,0 L10,5 L0,10 z" fill="#4a4540"/>
    </marker>
  </defs>

  <rect x="0" y="0" width="700" height="480" fill="#fdfcfb"/>

  <text x="350" y="32" text-anchor="middle" font-size="20" fill="#2a1a0e">Compared with what?</text>
  <text x="350" y="52" text-anchor="middle" font-size="13" fill="#4a4540" font-style="italic">Four ways a chart makes a claim with no basis &#8212; and the fix for each</text>

  <!-- Cell 1: Top left -->
  <g transform="translate(40,80)">
    <rect x="0" y="0" width="300" height="160" fill="#f5f2ee" stroke="#8a8480" stroke-width="1"/>
    <text x="12" y="22" font-size="13" fill="#2a1a0e" font-weight="bold">1 &#8212; Absolute counts</text>
    <text x="12" y="42" font-size="11" fill="#4a4540">Fails: &#8220;30 proficient in Ms. A&apos;s class,</text>
    <text x="12" y="56" font-size="11" fill="#4a4540">22 in Mr. B&apos;s.&#8221; Class sizes not shown.</text>
    <!-- mini bars -->
    <g transform="translate(20,80)">
      <rect x="0"  y="20" width="40" height="50" fill="#2a1a0e"/>
      <rect x="50" y="34" width="40" height="36" fill="#2a1a0e"/>
      <text x="20"  y="84" font-size="9"  fill="#4a4540" text-anchor="middle">30</text>
      <text x="70"  y="84" font-size="9"  fill="#4a4540" text-anchor="middle">22</text>
    </g>
    <line x1="120" y1="110" x2="150" y2="110" stroke="#4a4540" stroke-width="1.2" marker-end="url(#f2-arrow)"/>
    <g transform="translate(160,80)">
      <rect x="0"  y="6"  width="40" height="64" fill="#2a1a0e"/>
      <rect x="50" y="8"  width="40" height="62" fill="#2a1a0e"/>
      <text x="20" y="84" font-size="9" fill="#4a4540" text-anchor="middle">94%</text>
      <text x="70" y="84" font-size="9" fill="#4a4540" text-anchor="middle">92%</text>
    </g>
    <text x="12" y="148" font-size="11" fill="#2a1a0e" font-style="italic">Fix: rates per class (30/32 vs 22/24).</text>
  </g>

  <!-- Cell 2: Top right -->
  <g transform="translate(360,80)">
    <rect x="0" y="0" width="300" height="160" fill="#f5f2ee" stroke="#8a8480" stroke-width="1"/>
    <text x="12" y="22" font-size="13" fill="#2a1a0e" font-weight="bold">2 &#8212; Time series without baseline</text>
    <text x="12" y="42" font-size="11" fill="#4a4540">Fails: &#8220;Scores rose 72 to 78 this year.&#8221;</text>
    <text x="12" y="56" font-size="11" fill="#4a4540">Prior trajectory not shown.</text>
    <!-- short line: just two points -->
    <g transform="translate(20,80)">
      <line x1="0" y1="60" x2="80" y2="30" stroke="#2a1a0e" stroke-width="1.5"/>
      <circle cx="0"  cy="60" r="3" fill="#2a1a0e"/>
      <circle cx="80" cy="30" r="3" fill="#2a1a0e"/>
      <text x="0"  y="80" font-size="9" fill="#4a4540" text-anchor="middle">72</text>
      <text x="80" y="80" font-size="9" fill="#4a4540" text-anchor="middle">78</text>
    </g>
    <line x1="120" y1="110" x2="150" y2="110" stroke="#4a4540" stroke-width="1.2" marker-end="url(#f2-arrow)"/>
    <g transform="translate(160,80)">
      <line x1="0"  y1="72" x2="30" y2="60"  stroke="#2a1a0e" stroke-width="1.5"/>
      <line x1="30" y1="60" x2="60" y2="48"  stroke="#2a1a0e" stroke-width="1.5"/>
      <line x1="60" y1="48" x2="90" y2="36"  stroke="#2a1a0e" stroke-width="1.5"/>
      <line x1="90" y1="36" x2="120" y2="24" stroke="#2a1a0e" stroke-width="1.5"/>
      <circle cx="0"   cy="72" r="2.5" fill="#2a1a0e"/>
      <circle cx="30"  cy="60" r="2.5" fill="#2a1a0e"/>
      <circle cx="60"  cy="48" r="2.5" fill="#2a1a0e"/>
      <circle cx="90"  cy="36" r="2.5" fill="#2a1a0e"/>
      <circle cx="120" cy="24" r="2.5" fill="#2a1a0e"/>
      <text x="60" y="80" font-size="9" fill="#4a4540" text-anchor="middle">prior 4 years on the same slope</text>
    </g>
    <text x="12" y="148" font-size="11" fill="#2a1a0e" font-style="italic">Fix: show enough prior years to see the trajectory.</text>
  </g>

  <!-- Cell 3: Bottom left -->
  <g transform="translate(40,260)">
    <rect x="0" y="0" width="300" height="160" fill="#f5f2ee" stroke="#8a8480" stroke-width="1"/>
    <text x="12" y="22" font-size="13" fill="#2a1a0e" font-weight="bold">3 &#8212; Cross-section without controls</text>
    <text x="12" y="42" font-size="11" fill="#4a4540">Fails: AP versus general-track outcomes.</text>
    <text x="12" y="56" font-size="11" fill="#4a4540">Selection into groups ignored.</text>
    <!-- two stacked groups -->
    <g transform="translate(30,80)">
      <rect x="0"  y="0"  width="40" height="60" fill="#2a1a0e"/>
      <rect x="50" y="20" width="40" height="40" fill="#8a8480"/>
      <text x="20" y="76" font-size="9" fill="#4a4540" text-anchor="middle">AP</text>
      <text x="70" y="76" font-size="9" fill="#4a4540" text-anchor="middle">General</text>
    </g>
    <line x1="120" y1="110" x2="150" y2="110" stroke="#4a4540" stroke-width="1.2" marker-end="url(#f2-arrow)"/>
    <g transform="translate(170,80)">
      <text x="0" y="0"  font-size="10" fill="#2a1a0e">match on:</text>
      <text x="0" y="16" font-size="10" fill="#4a4540">&#8226; prior GPA</text>
      <text x="0" y="30" font-size="10" fill="#4a4540">&#8226; attendance</text>
      <text x="0" y="44" font-size="10" fill="#4a4540">&#8226; demographics</text>
      <text x="0" y="58" font-size="10" fill="#4a4540">&#8226; counselor</text>
    </g>
    <text x="12" y="148" font-size="11" fill="#2a1a0e" font-style="italic">Fix: matched controls, or do not infer.</text>
  </g>

  <!-- Cell 4: Bottom right -->
  <g transform="translate(360,260)">
    <rect x="0" y="0" width="300" height="160" fill="#f5f2ee" stroke="#8a8480" stroke-width="1"/>
    <text x="12" y="22" font-size="13" fill="#2a1a0e" font-weight="bold">4 &#8212; Single-value claim</text>
    <text x="12" y="42" font-size="11" fill="#4a4540">Fails: &#8220;76% proficient.&#8221; Good or bad?</text>
    <text x="12" y="56" font-size="11" fill="#4a4540">Reader has nothing to compare against.</text>
    <g transform="translate(40,76)">
      <text x="0" y="20" font-size="32" fill="#2a1a0e">76%</text>
    </g>
    <line x1="130" y1="110" x2="160" y2="110" stroke="#4a4540" stroke-width="1.2" marker-end="url(#f2-arrow)"/>
    <g transform="translate(170,80)">
      <line x1="0" y1="20" x2="100" y2="20" stroke="#8a8480" stroke-width="1"/>
      <circle cx="55" cy="20" r="3" fill="#2a1a0e"/>
      <text x="55" y="14" font-size="9" fill="#2a1a0e" text-anchor="middle">us 76</text>
      <circle cx="22" cy="20" r="2.5" fill="#4a4540"/>
      <text x="22" y="38" font-size="8" fill="#4a4540" text-anchor="middle">state 65</text>
      <circle cx="78" cy="20" r="2.5" fill="#4a4540"/>
      <text x="78" y="38" font-size="8" fill="#4a4540" text-anchor="middle">target 80</text>
    </g>
    <text x="12" y="148" font-size="11" fill="#2a1a0e" font-style="italic">Fix: anchor to state, peer, target, or prior year.</text>
  </g>

  <text x="350" y="460" text-anchor="middle" font-size="11" fill="#8a8480" font-style="italic">Every quantitative claim a chart makes requires an explicit reference. Without one, the reader invents one.</text>
</svg>
