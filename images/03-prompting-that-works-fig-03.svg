<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 700 420" role="img" aria-labelledby="t33 d33">
  <title id="t33">The prompting loop — three rounds of diagnostic narrowing</title>
  <desc id="d33">A horizontal three-node flowchart of the prompt-iteration loop. Round 1: a one-line vague prompt produces generic output, annotated the model fills in the average. Round 2: a four-component prompt produces a usable draft, annotated specification narrows the probability space. Round 3: a gap-closing follow-up produces the final draft, annotated name what to change, name what to keep. Arrows between nodes carry the diagnostic observations that triggered the next round.</desc>
  <defs>
    <style>
      .ti { font-family: 'EB Garamond', Georgia, 'Times New Roman', serif; font-size: 14px; font-weight: bold; fill: #2a1a0e; }
      .sub { font-family: 'EB Garamond', Georgia, 'Times New Roman', serif; font-size: 10px; fill: #4a4540; }
      .rd { font-family: 'EB Garamond', Georgia, 'Times New Roman', serif; font-size: 11px; font-weight: bold; fill: #C8102E; letter-spacing: 0.5px; }
      .hd { font-family: 'EB Garamond', Georgia, 'Times New Roman', serif; font-size: 12px; font-weight: bold; fill: #2a1a0e; }
      .lb { font-family: 'EB Garamond', Georgia, 'Times New Roman', serif; font-size: 11px; fill: #2a1a0e; }
      .sm { font-family: 'EB Garamond', Georgia, 'Times New Roman', serif; font-size: 10px; fill: #4a4540; }
      .ann { font-family: 'EB Garamond', Georgia, 'Times New Roman', serif; font-size: 10px; font-style: italic; fill: #C8860E; }
      .diag { font-family: 'EB Garamond', Georgia, 'Times New Roman', serif; font-size: 10px; font-style: italic; fill: #4a4540; }
      .cap { font-family: 'EB Garamond', Georgia, 'Times New Roman', serif; font-size: 10px; font-style: italic; fill: #4a4540; }
    </style>
    <marker id="ar1" markerWidth="8" markerHeight="6" refX="7" refY="3" orient="auto">
      <polygon points="0 0, 8 3, 0 6" fill="#2a1a0e"/>
    </marker>
  </defs>
  <rect width="700" height="420" fill="#fdfcfb"/>

  <text x="32" y="28" class="ti">The prompting loop</text>
  <text x="32" y="44" class="sub">Three rounds, seven minutes, one reusable lesson plan. Each round narrows the probability space.</text>

  <!-- Round 1 node -->
  <text x="120" y="84" text-anchor="middle" class="rd">ROUND 1</text>
  <rect x="40" y="96" width="160" height="156" fill="#ffffff" stroke="#2a1a0e" stroke-width="1"/>
  <text x="120" y="120" text-anchor="middle" class="hd">Vague prompt</text>
  <text x="120" y="142" text-anchor="middle" class="lb">"Write a lesson plan</text>
  <text x="120" y="156" text-anchor="middle" class="lb">on photosynthesis</text>
  <text x="120" y="170" text-anchor="middle" class="lb">for 5th grade."</text>
  <line x1="56" y1="186" x2="184" y2="186" stroke="#c8c4c0" stroke-width="1"/>
  <text x="120" y="204" text-anchor="middle" class="sm">Topic, not a capability.</text>
  <text x="120" y="218" text-anchor="middle" class="sm">"Optional plant."</text>
  <text x="120" y="232" text-anchor="middle" class="sm">No misconception named.</text>
  <text x="120" y="270" text-anchor="middle" class="ann">the model fills in the average</text>

  <!-- Arrow 1 → 2 with diagnostic -->
  <line x1="202" y1="174" x2="248" y2="174" stroke="#2a1a0e" stroke-width="1" marker-end="url(#ar1)"/>
  <text x="225" y="158" text-anchor="middle" class="diag">missing: standard,</text>
  <text x="225" y="170" text-anchor="middle" class="diag">misconception,</text>
  <text x="225" y="194" text-anchor="middle" class="diag">materials, level</text>

  <!-- Round 2 node -->
  <text x="330" y="84" text-anchor="middle" class="rd">ROUND 2</text>
  <rect x="250" y="96" width="160" height="156" fill="#ffffff" stroke="#2a1a0e" stroke-width="1"/>
  <text x="330" y="120" text-anchor="middle" class="hd">Four-component</text>
  <text x="330" y="142" text-anchor="middle" class="lb">Role · Context · Task</text>
  <text x="330" y="156" text-anchor="middle" class="lb">· Constraints</text>
  <text x="330" y="170" text-anchor="middle" class="sm">NGSS 5-LS1-1, ELLs,</text>
  <text x="330" y="184" text-anchor="middle" class="sm">soil misconception</text>
  <line x1="266" y1="196" x2="394" y2="196" stroke="#c8c4c0" stroke-width="1"/>
  <text x="330" y="214" text-anchor="middle" class="sm">Real objective.</text>
  <text x="330" y="228" text-anchor="middle" class="sm">Hook surfaces misconception.</text>
  <text x="330" y="242" text-anchor="middle" class="sm">Lab uses listed materials.</text>
  <text x="330" y="270" text-anchor="middle" class="ann">specification narrows the probability space</text>

  <!-- Arrow 2 → 3 with diagnostic -->
  <line x1="412" y1="174" x2="458" y2="174" stroke="#2a1a0e" stroke-width="1" marker-end="url(#ar1)"/>
  <text x="435" y="158" text-anchor="middle" class="diag">gap: lab needs a</text>
  <text x="435" y="170" text-anchor="middle" class="diag">week — class is</text>
  <text x="435" y="194" text-anchor="middle" class="diag">25 minutes</text>

  <!-- Round 3 node -->
  <text x="540" y="84" text-anchor="middle" class="rd">ROUND 3</text>
  <rect x="460" y="96" width="160" height="156" fill="#ffffff" stroke="#2a1a0e" stroke-width="1"/>
  <text x="540" y="120" text-anchor="middle" class="hd">Gap-closing follow-up</text>
  <text x="540" y="142" text-anchor="middle" class="lb">"Revise the lab to</text>
  <text x="540" y="156" text-anchor="middle" class="lb">produce evidence in</text>
  <text x="540" y="170" text-anchor="middle" class="lb">25 minutes. Keep</text>
  <text x="540" y="184" text-anchor="middle" class="lb">the rest of the plan."</text>
  <line x1="476" y1="196" x2="604" y2="196" stroke="#c8c4c0" stroke-width="1"/>
  <text x="540" y="214" text-anchor="middle" class="sm">Sealed-bag condensation lab.</text>
  <text x="540" y="228" text-anchor="middle" class="sm">Argument lands in class.</text>
  <text x="540" y="242" text-anchor="middle" class="sm">Rest of plan unchanged.</text>
  <text x="540" y="270" text-anchor="middle" class="ann">name what to change, name what to keep</text>

  <!-- Center horizontal rule labelled -->
  <text x="350" y="340" text-anchor="middle" class="cap">The first output's job is to reveal what you forgot to specify.</text>
  <text x="350" y="360" text-anchor="middle" class="cap">Each round closes one gap. The output disappears when the session ends; the prompt is what lasts.</text>

  <!-- Footer reading -->
  <text x="32" y="400" class="cap">Three prompts. Seven minutes. A lesson plan reusable next year by changing one line.</text>
</svg>
