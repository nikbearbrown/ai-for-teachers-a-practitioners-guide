<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 700 540" role="img" aria-labelledby="t07f4 d07f4">
  <title id="t07f4">Three failure modes of AI-drafted sensitive communication</title>
  <desc id="d07f4">Three stacked panels naming three failure modes of AI-drafted sensitive communication. Panel one is fabricated specificity. Panel two is smoothed-over substance. Panel three is legal drift. Each panel has three labeled rows: cause, what the parent reads, and what the record shows. A shared footer chip names the shared cause: the model was asked to invent substance.</desc>
  <defs>
    <style>
      .ti { font-family: 'EB Garamond', Garamond, Georgia, serif; font-size: 18px; font-weight: 700; fill: #2a1a0e; }
      .sub { font-family: 'EB Garamond', Garamond, Georgia, serif; font-size: 12px; font-style: italic; fill: #4a4540; }
      .panel { font-family: 'EB Garamond', Garamond, Georgia, serif; font-size: 14px; font-weight: 700; fill: #fdfcfb; letter-spacing: 0.4px; }
      .rowlbl { font-family: 'EB Garamond', Garamond, Georgia, serif; font-size: 10px; font-weight: 700; fill: #4a4540; letter-spacing: 0.6px; }
      .rowtxt { font-family: 'EB Garamond', Garamond, Georgia, serif; font-size: 12px; fill: #2a1a0e; }
      .footer { font-family: 'EB Garamond', Garamond, Georgia, serif; font-size: 13px; font-style: italic; fill: #fdfcfb; }
      .footerlbl { font-family: 'EB Garamond', Garamond, Georgia, serif; font-size: 10px; font-weight: 700; fill: #fdfcfb; letter-spacing: 0.6px; }
      .cap { font-family: 'EB Garamond', Garamond, Georgia, serif; font-size: 12px; font-style: italic; fill: #4a4540; }
    </style>
  </defs>
  <rect width="700" height="540" fill="#fdfcfb"/>

  <text x="32" y="34" class="ti">Three failures, one shared cause</text>
  <text x="32" y="54" class="sub">The model was asked to invent substance.</text>

  <rect x="32" y="80" width="636" height="120" fill="#fdfcfb" stroke="#8a8480" stroke-width="1"/>
  <rect x="32" y="80" width="160" height="120" fill="#2a1a0e" stroke="none"/>
  <text x="48" y="106" class="panel">Fabricated</text>
  <text x="48" y="124" class="panel">specificity</text>
  <text x="48" y="146" class="rowlbl" fill="#c8c4c0">PANEL 1</text>

  <text x="208" y="102" class="rowlbl">CAUSE</text>
  <text x="208" y="118" class="rowtxt">Thin prompt; no bullets. Model pattern-matches what such notes usually say.</text>

  <text x="208" y="142" class="rowlbl">PARENT READS</text>
  <text x="208" y="158" class="rowtxt">Confident details the student correctly denies.</text>

  <text x="208" y="182" class="rowlbl">RECORD SHOWS</text>
  <text x="208" y="198" class="rowtxt">Claims the teacher cannot substantiate, now in writing, now in the file.</text>

  <rect x="32" y="212" width="636" height="120" fill="#fdfcfb" stroke="#8a8480" stroke-width="1"/>
  <rect x="32" y="212" width="160" height="120" fill="#2a1a0e" stroke="none"/>
  <text x="48" y="238" class="panel">Smoothed-over</text>
  <text x="48" y="256" class="panel">substance</text>
  <text x="48" y="278" class="rowlbl" fill="#c8c4c0">PANEL 2</text>

  <text x="208" y="234" class="rowlbl">CAUSE</text>
  <text x="208" y="250" class="rowtxt">Model defaults to professional warmth. Concern is rendered as reassurance.</text>

  <text x="208" y="274" class="rowlbl">PARENT READS</text>
  <text x="208" y="290" class="rowtxt">Friendly note. The seriousness never lands.</text>

  <text x="208" y="314" class="rowlbl">RECORD SHOWS</text>
  <text x="208" y="330" class="rowtxt">No evidence the concern was conveyed. Six weeks later, the parent agrees.</text>

  <rect x="32" y="344" width="636" height="120" fill="#fdfcfb" stroke="#8a8480" stroke-width="1"/>
  <rect x="32" y="344" width="160" height="120" fill="#2a1a0e" stroke="none"/>
  <text x="48" y="370" class="panel">Legal</text>
  <text x="48" y="388" class="panel">drift</text>
  <text x="48" y="410" class="rowlbl" fill="#c8c4c0">PANEL 3</text>

  <text x="208" y="366" class="rowlbl">CAUSE</text>
  <text x="208" y="382" class="rowtxt">Model adds institutional phrasings — "out of an abundance of caution."</text>

  <text x="208" y="406" class="rowlbl">PARENT READS</text>
  <text x="208" y="422" class="rowtxt">Implications the teacher did not intend; the district did not authorize.</text>

  <text x="208" y="446" class="rowlbl">RECORD SHOWS</text>
  <text x="208" y="462" class="rowtxt">Publisher liability runs to the signer, not the composer.</text>

  <rect x="32" y="476" width="636" height="40" fill="#4a4540" stroke="none"/>
  <text x="48" y="490" class="footerlbl">SHARED CAUSE</text>
  <text x="48" y="508" class="footer">The model was asked to invent substance.</text>

  <text x="350" y="532" class="cap" text-anchor="middle">Figure 7.4 — Three different failures, one shared cause: the model was asked to invent substance.</text>
</svg>
