<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 700 420" role="img" aria-labelledby="t04f1 d04f1">
  <title id="t04f1">Two layers of a lesson plan</title>
  <desc id="d04f1">Two-column comparison. The left column lists six structural elements AI handles reliably. The right column lists four pedagogical-content-knowledge moves only the teacher can supply. A caption below names the gap between the columns as the place where teaching lives.</desc>
  <defs>
    <style>
      .ti { font-family: 'EB Garamond', Georgia, 'Times New Roman', serif; font-size: 16px; font-weight: bold; fill: #2a1a0e; }
      .sub { font-family: 'EB Garamond', Georgia, 'Times New Roman', serif; font-size: 12px; font-style: italic; fill: #4a4540; }
      .hd { font-family: 'EB Garamond', Georgia, 'Times New Roman', serif; font-size: 13px; font-weight: bold; fill: #2a1a0e; }
      .lb { font-family: 'EB Garamond', Georgia, 'Times New Roman', serif; font-size: 12px; fill: #2a1a0e; }
      .sm { font-family: 'EB Garamond', Georgia, 'Times New Roman', serif; font-size: 11px; fill: #4a4540; }
      .cap { font-family: 'EB Garamond', Georgia, 'Times New Roman', serif; font-size: 12px; font-style: italic; fill: #2a1a0e; }
      .gap { font-family: 'EB Garamond', Georgia, 'Times New Roman', serif; font-size: 11px; fill: #8a8480; }
    </style>
    <marker id="ar4f1" markerWidth="9" markerHeight="7" refX="8" refY="3.5" orient="auto">
      <polygon points="0 0, 9 3.5, 0 7" fill="#2a1a0e"/>
    </marker>
  </defs>

  <rect width="700" height="420" fill="#fdfcfb"/>

  <text x="350" y="28" text-anchor="middle" class="ti">A lesson plan has two layers. AI handles one. You handle the other.</text>
  <text x="350" y="46" text-anchor="middle" class="sub">Sort any element on sight: structural goes left, pedagogical content knowledge goes right.</text>

  <!-- Column headers -->
  <rect x="40" y="62" width="300" height="22" fill="#4a4540"/>
  <text x="190" y="78" text-anchor="middle" class="hd" fill="#fdfcfb">Structural layer — AI does well</text>

  <rect x="360" y="62" width="300" height="22" fill="#2a1a0e"/>
  <text x="510" y="78" text-anchor="middle" class="hd" fill="#fdfcfb">PCK layer — teacher supplies</text>

  <!-- Left column tiles (structural) -->
  <g>
    <rect x="40" y="94" width="300" height="32" fill="#f5f2ee" stroke="#8a8480" stroke-width="1"/>
    <text x="190" y="114" text-anchor="middle" class="lb">Objectives in verb-list form</text>

    <rect x="40" y="130" width="300" height="32" fill="#f5f2ee" stroke="#8a8480" stroke-width="1"/>
    <text x="190" y="150" text-anchor="middle" class="lb">Timed activity sequence</text>

    <rect x="40" y="166" width="300" height="32" fill="#f5f2ee" stroke="#8a8480" stroke-width="1"/>
    <text x="190" y="186" text-anchor="middle" class="lb">Differentiation templates</text>

    <rect x="40" y="202" width="300" height="32" fill="#f5f2ee" stroke="#8a8480" stroke-width="1"/>
    <text x="190" y="222" text-anchor="middle" class="lb">Exit ticket prompts (first draft)</text>

    <rect x="40" y="238" width="300" height="32" fill="#f5f2ee" stroke="#8a8480" stroke-width="1"/>
    <text x="190" y="258" text-anchor="middle" class="lb">Standards citations (verify)</text>

    <rect x="40" y="274" width="300" height="32" fill="#f5f2ee" stroke="#8a8480" stroke-width="1"/>
    <text x="190" y="294" text-anchor="middle" class="lb">Worksheet first drafts</text>
  </g>

  <!-- Right column tiles (PCK) -->
  <g>
    <rect x="360" y="94" width="300" height="44" fill="#c8c4c0" stroke="#2a1a0e" stroke-width="1.2"/>
    <text x="510" y="112" text-anchor="middle" class="lb">Which misconception this class</text>
    <text x="510" y="128" text-anchor="middle" class="lb">will carry into Tuesday</text>

    <rect x="360" y="142" width="300" height="44" fill="#c8c4c0" stroke="#2a1a0e" stroke-width="1.2"/>
    <text x="510" y="160" text-anchor="middle" class="lb">Which analogy backfires</text>
    <text x="510" y="176" text-anchor="middle" class="lb">for these students</text>

    <rect x="360" y="190" width="300" height="44" fill="#c8c4c0" stroke="#2a1a0e" stroke-width="1.2"/>
    <text x="510" y="208" text-anchor="middle" class="lb">Sub-topic order that does not</text>
    <text x="510" y="224" text-anchor="middle" class="lb">collapse for this population</text>

    <rect x="360" y="238" width="300" height="44" fill="#c8c4c0" stroke="#2a1a0e" stroke-width="1.2"/>
    <text x="510" y="256" text-anchor="middle" class="lb">Exit-ticket question that surfaces</text>
    <text x="510" y="272" text-anchor="middle" class="lb">the right confusion</text>
  </g>

  <!-- Gap arrow + caption -->
  <line x1="340" y1="335" x2="360" y2="335" stroke="#2a1a0e" stroke-width="1.2" marker-end="url(#ar4f1)"/>
  <text x="350" y="358" text-anchor="middle" class="gap">the gap between columns</text>

  <text x="350" y="388" text-anchor="middle" class="cap">The structural layer is delegable. The PCK layer is not.</text>
  <text x="350" y="404" text-anchor="middle" class="sm">Treating structural completeness as overall completeness is the trap.</text>
</svg>
