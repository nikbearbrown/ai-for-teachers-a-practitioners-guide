<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 700 420" role="img" aria-labelledby="t04f3 d04f3">
  <title id="t04f3">AI dividend by planning horizon</title>
  <desc id="d04f3">Line chart with planning horizon on the x-axis (tomorrow, next week, unit at two to three weeks, semester, full year) and dividend index from zero to one hundred on the y-axis. The curve rises from 18 at tomorrow to 52 at next week, peaks at 88 at unit scale, then drops to 64 at semester and 32 at the full-year mark.</desc>
  <defs>
    <style>
      .ti { font-family: 'EB Garamond', Georgia, 'Times New Roman', serif; font-size: 16px; font-weight: bold; fill: #2a1a0e; }
      .sub { font-family: 'EB Garamond', Georgia, 'Times New Roman', serif; font-size: 12px; font-style: italic; fill: #4a4540; }
      .ax { font-family: 'EB Garamond', Georgia, 'Times New Roman', serif; font-size: 11px; fill: #4a4540; }
      .axt { font-family: 'EB Garamond', Georgia, 'Times New Roman', serif; font-size: 12px; font-weight: bold; fill: #2a1a0e; }
      .lb { font-family: 'EB Garamond', Georgia, 'Times New Roman', serif; font-size: 11px; fill: #2a1a0e; }
      .call { font-family: 'EB Garamond', Georgia, 'Times New Roman', serif; font-size: 11px; font-style: italic; fill: #2a1a0e; }
      .peak { font-family: 'EB Garamond', Georgia, 'Times New Roman', serif; font-size: 12px; font-weight: bold; fill: #2a1a0e; }
      .cap { font-family: 'EB Garamond', Georgia, 'Times New Roman', serif; font-size: 12px; font-style: italic; fill: #2a1a0e; }
    </style>
  </defs>

  <rect width="700" height="420" fill="#fdfcfb"/>

  <text x="350" y="28" text-anchor="middle" class="ti">AI dividend rises and then falls with planning horizon.</text>
  <text x="350" y="46" text-anchor="middle" class="sub">Unit-scale planning is the sweet spot; Monday-night and August-year-ahead both leak the dividend.</text>

  <!-- Axes -->
  <line x1="90" y1="80" x2="90" y2="330" stroke="#2a1a0e" stroke-width="1"/>
  <line x1="90" y1="330" x2="640" y2="330" stroke="#2a1a0e" stroke-width="1"/>

  <!-- y axis ticks: 0, 25, 50, 75, 100 -->
  <g>
    <line x1="86" y1="330" x2="90" y2="330" stroke="#2a1a0e" stroke-width="1"/>
    <text x="82" y="334" text-anchor="end" class="ax">0</text>

    <line x1="86" y1="267.5" x2="90" y2="267.5" stroke="#2a1a0e" stroke-width="1"/>
    <text x="82" y="271" text-anchor="end" class="ax">25</text>
    <line x1="90" y1="267.5" x2="640" y2="267.5" stroke="#c8c4c0" stroke-width="0.6"/>

    <line x1="86" y1="205" x2="90" y2="205" stroke="#2a1a0e" stroke-width="1"/>
    <text x="82" y="209" text-anchor="end" class="ax">50</text>
    <line x1="90" y1="205" x2="640" y2="205" stroke="#c8c4c0" stroke-width="0.6"/>

    <line x1="86" y1="142.5" x2="90" y2="142.5" stroke="#2a1a0e" stroke-width="1"/>
    <text x="82" y="146" text-anchor="end" class="ax">75</text>
    <line x1="90" y1="142.5" x2="640" y2="142.5" stroke="#c8c4c0" stroke-width="0.6"/>

    <line x1="86" y1="80" x2="90" y2="80" stroke="#2a1a0e" stroke-width="1"/>
    <text x="82" y="84" text-anchor="end" class="ax">100</text>
  </g>

  <text x="38" y="205" text-anchor="middle" class="axt" transform="rotate(-90 38 205)">Dividend index</text>

  <!-- x axis tick labels -->
  <g>
    <line x1="160" y1="330" x2="160" y2="334" stroke="#2a1a0e" stroke-width="1"/>
    <text x="160" y="350" text-anchor="middle" class="ax">tomorrow's</text>
    <text x="160" y="364" text-anchor="middle" class="ax">lesson</text>

    <line x1="265" y1="330" x2="265" y2="334" stroke="#2a1a0e" stroke-width="1"/>
    <text x="265" y="350" text-anchor="middle" class="ax">next week's</text>
    <text x="265" y="364" text-anchor="middle" class="ax">lesson</text>

    <line x1="370" y1="330" x2="370" y2="334" stroke="#2a1a0e" stroke-width="1"/>
    <text x="370" y="350" text-anchor="middle" class="ax">unit</text>
    <text x="370" y="364" text-anchor="middle" class="ax">(2&#8211;3 weeks)</text>

    <line x1="475" y1="330" x2="475" y2="334" stroke="#2a1a0e" stroke-width="1"/>
    <text x="475" y="350" text-anchor="middle" class="ax">semester</text>

    <line x1="580" y1="330" x2="580" y2="334" stroke="#2a1a0e" stroke-width="1"/>
    <text x="580" y="350" text-anchor="middle" class="ax">full year</text>
  </g>

  <text x="370" y="394" text-anchor="middle" class="axt">Planning horizon</text>

  <!-- Filled area under the curve -->
  <path d="M 160 285 C 200 260, 230 230, 265 200 C 305 168, 340 130, 370 110 C 405 130, 445 155, 475 170 C 520 195, 555 230, 580 250 L 580 330 L 160 330 Z"
        fill="#c8c4c0" fill-opacity="0.55"/>

  <!-- Curve stroke -->
  <path d="M 160 285 C 200 260, 230 230, 265 200 C 305 168, 340 130, 370 110 C 405 130, 445 155, 475 170 C 520 195, 555 230, 580 250"
        fill="none" stroke="#2a1a0e" stroke-width="1.8"/>

  <!-- Data points -->
  <circle cx="160" cy="285" r="3.5" fill="#4a4540"/>
  <circle cx="265" cy="200" r="3.5" fill="#4a4540"/>
  <circle cx="370" cy="110" r="5" fill="#2a1a0e" stroke="#fdfcfb" stroke-width="1.4"/>
  <circle cx="475" cy="170" r="3.5" fill="#4a4540"/>
  <circle cx="580" cy="250" r="3.5" fill="#4a4540"/>

  <!-- Peak callout -->
  <line x1="370" y1="110" x2="370" y2="84" stroke="#2a1a0e" stroke-width="1"/>
  <text x="370" y="76" text-anchor="middle" class="peak">Sweet spot</text>

  <!-- Tomorrow callout -->
  <line x1="160" y1="285" x2="160" y2="305" stroke="#8a8480" stroke-width="1" stroke-dasharray="3 2"/>
  <text x="120" y="307" text-anchor="middle" class="call">heavy PCK</text>
  <text x="120" y="321" text-anchor="middle" class="call">revision cost</text>

  <!-- Full-year callout -->
  <line x1="580" y1="250" x2="620" y2="232" stroke="#8a8480" stroke-width="1" stroke-dasharray="3 2"/>
  <text x="640" y="222" text-anchor="end" class="call">discards in-year</text>
  <text x="640" y="236" text-anchor="end" class="call">PCK accumulation</text>

  <!-- Value labels next to each point -->
  <text x="160" y="278" text-anchor="middle" class="lb">18</text>
  <text x="265" y="193" text-anchor="middle" class="lb">52</text>
  <text x="370" y="102" text-anchor="middle" class="lb">88</text>
  <text x="475" y="163" text-anchor="middle" class="lb">64</text>
  <text x="580" y="243" text-anchor="middle" class="lb">32</text>
</svg>
