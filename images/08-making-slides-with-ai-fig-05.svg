<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 700 480" role="img" aria-labelledby="f5-title f5-desc" font-family="'EB Garamond', Garamond, Georgia, serif">
  <title id="f5-title">Textbook figure versus projection figure</title>
  <desc id="f5-desc">The same mitochondrion figure, drawn for two different reading conditions. Left: a five-panel print figure at fourteen inches reading distance with small labels. Right: a one-panel rebuild for projection at fifteen to fifty feet, with larger type and the caption migrated to the notes field.</desc>
  <rect width="700" height="480" fill="#fdfcfb"/>

  <!-- Eyebrow row -->
  <text x="160" y="34" text-anchor="middle" font-size="11" letter-spacing="2" fill="#8a8480">PRINT — 14 inches</text>
  <text x="500" y="34" text-anchor="middle" font-size="11" letter-spacing="2" fill="#8a8480">PROJECTION — 15 to 50 feet</text>

  <!-- LEFT: textbook figure (small five-panel composite) -->
  <rect x="50" y="56" width="220" height="280" fill="#fdfcfb" stroke="#c8c4c0" stroke-width="1"/>
  <text x="160" y="78" text-anchor="middle" font-size="14" fill="#2a1a0e">Mitochondrion (composite)</text>

  <!-- Five tiny panels -->
  <g transform="translate(70,96)">
    <rect x="0" y="0" width="55" height="55" fill="#f5f2ee" stroke="#4a4540" stroke-width="0.8"/>
    <text x="4" y="12" font-size="8" fill="#2a1a0e">(a)</text>
    <ellipse cx="28" cy="32" rx="18" ry="11" fill="none" stroke="#4a4540" stroke-width="0.8"/>
    <rect x="60" y="0" width="55" height="55" fill="#f5f2ee" stroke="#4a4540" stroke-width="0.8"/>
    <text x="64" y="12" font-size="8" fill="#2a1a0e">(b)</text>
    <path d="M 70 38 Q 88 22 106 38" stroke="#4a4540" stroke-width="0.8" fill="none"/>
    <rect x="120" y="0" width="55" height="55" fill="#f5f2ee" stroke="#4a4540" stroke-width="0.8"/>
    <text x="124" y="12" font-size="8" fill="#2a1a0e">(c)</text>
    <line x1="130" y1="38" x2="170" y2="38" stroke="#4a4540" stroke-width="0.8"/>
    <line x1="130" y1="44" x2="170" y2="44" stroke="#4a4540" stroke-width="0.8"/>
  </g>
  <g transform="translate(100,166)">
    <rect x="0" y="0" width="55" height="55" fill="#f5f2ee" stroke="#4a4540" stroke-width="0.8"/>
    <text x="4" y="12" font-size="8" fill="#2a1a0e">(d)</text>
    <circle cx="28" cy="32" r="11" fill="none" stroke="#4a4540" stroke-width="0.8"/>
    <rect x="60" y="0" width="55" height="55" fill="#f5f2ee" stroke="#4a4540" stroke-width="0.8"/>
    <text x="64" y="12" font-size="8" fill="#2a1a0e">(e)</text>
    <path d="M 68 38 L 88 22 L 108 38" stroke="#4a4540" stroke-width="0.8" fill="none"/>
  </g>

  <line x1="70" y1="246" x2="250" y2="246" stroke="#c8c4c0" stroke-width="0.8"/>
  <text x="70" y="266" font-size="9" fill="#4a4540">Fig. 8.5  Mitochondrial structure showing (a) outer</text>
  <text x="70" y="278" font-size="9" fill="#4a4540">membrane, (b) intermembrane space, (c) cristae, (d)</text>
  <text x="70" y="290" font-size="9" fill="#4a4540">matrix and (e) ETC complexes I–IV plus ATP synthase.</text>
  <text x="70" y="316" font-size="11" font-style="italic" fill="#8a8480">caption directly beneath, page-width</text>

  <!-- RIGHT: projection rebuild -->
  <rect x="390" y="56" width="260" height="280" fill="#fdfcfb" stroke="#2a1a0e" stroke-width="1.5"/>
  <text x="408" y="86" font-size="18" fill="#2a1a0e">Cristae fold the membrane.</text>

  <!-- Single panel large -->
  <g transform="translate(420,116)">
    <ellipse cx="100" cy="80" rx="100" ry="62" fill="none" stroke="#2a1a0e" stroke-width="1.6"/>
    <path d="M 30 60 Q 50 40 70 60 Q 90 80 110 60 Q 130 40 150 60 Q 170 80 180 60" stroke="#4a4540" stroke-width="1.4" fill="none"/>
    <text x="100" y="160" text-anchor="middle" font-size="14" fill="#4a4540">inner membrane (cristae)</text>
  </g>

  <line x1="410" y1="306" x2="630" y2="306" stroke="#c8c4c0" stroke-width="0.8"/>
  <text x="410" y="326" font-size="11" font-style="italic" fill="#8a8480">caption moved to notes field — read separately</text>

  <!-- Footer comparison -->
  <text x="350" y="376" text-anchor="middle" font-size="14" font-style="italic" fill="#2a1a0e">Different reading distance, different figure.</text>
  <text x="350" y="402" text-anchor="middle" font-size="12" fill="#4a4540">type sized for the back of the room — labels reduced, panels collapsed</text>
  <text x="350" y="422" text-anchor="middle" font-size="12" fill="#4a4540">Bringhurst: hierarchy ratios approach 2:1 at display scale</text>
</svg>
