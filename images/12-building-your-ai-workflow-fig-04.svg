<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 700 460" role="img" aria-labelledby="t1204 d1204">
  <title id="t1204">Prompt output quality over 24 months, with and without a six-month maintenance cycle</title>
  <desc id="d1204">Line chart with months zero to twenty-four on the x-axis and prompt quality from zero to one on the y-axis. One line decays continuously from one to about thirty hundredths over twenty-four months. A second line decays slightly between each six-month maintenance event and snaps back to one at months six, twelve, and eighteen, holding near full quality across the full period.</desc>
  <defs>
    <style>
      .ti  { font-family: 'EB Garamond', Georgia, 'Times New Roman', serif; font-size: 14px; font-weight: bold; fill: #2a1a0e; }
      .sub { font-family: 'EB Garamond', Georgia, 'Times New Roman', serif; font-size: 11px; font-style: italic; fill: #4a4540; }
      .ax  { font-family: 'EB Garamond', Georgia, 'Times New Roman', serif; font-size: 10px; fill: #4a4540; }
      .axT { font-family: 'EB Garamond', Georgia, 'Times New Roman', serif; font-size: 11px; font-weight: bold; fill: #2a1a0e; }
      .lab { font-family: 'EB Garamond', Georgia, 'Times New Roman', serif; font-size: 11px; font-weight: bold; fill: #2a1a0e; }
      .labS{ font-family: 'EB Garamond', Georgia, 'Times New Roman', serif; font-size: 10px; font-style: italic; fill: #4a4540; }
      .ann { font-family: 'EB Garamond', Georgia, 'Times New Roman', serif; font-size: 10px; fill: #4a4540; }
      .cap { font-family: 'EB Garamond', Georgia, 'Times New Roman', serif; font-size: 11px; fill: #2a1a0e; }
    </style>
    <marker id="arBlk12d" markerWidth="8" markerHeight="6" refX="7" refY="3" orient="auto">
      <polygon points="0 0, 8 3, 0 6" fill="#2a1a0e"/>
    </marker>
  </defs>
  <rect width="700" height="460" fill="#fdfcfb"/>

  <text x="32" y="28" class="ti">Prompts have a shelf life. Maintenance is what makes the library compound.</text>
  <text x="32" y="44" class="sub">Same library, two policies. The maintenance events are thirty minutes apiece, twice a year.</text>

  <!-- Plot area: x = months [0..24] mapped to [80..640]; y = quality [0..1] mapped to [340..100] -->
  <!-- Background -->
  <rect x="80" y="100" width="560" height="240" fill="#fdfcfb" stroke="#c8c4c0" stroke-width="1"/>

  <!-- Gridlines y -->
  <g stroke="#c8c4c0" stroke-width="1" stroke-dasharray="2 3">
    <line x1="80" y1="100" x2="640" y2="100"/>
    <line x1="80" y1="160" x2="640" y2="160"/>
    <line x1="80" y1="220" x2="640" y2="220"/>
    <line x1="80" y1="280" x2="640" y2="280"/>
  </g>

  <!-- y axis ticks (0, 0.25, 0.5, 0.75, 1.0) -->
  <g class="ax">
    <text x="74" y="344" text-anchor="end">0.00</text>
    <text x="74" y="284" text-anchor="end">0.25</text>
    <text x="74" y="224" text-anchor="end">0.50</text>
    <text x="74" y="164" text-anchor="end">0.75</text>
    <text x="74" y="104" text-anchor="end">1.00</text>
  </g>

  <!-- x axis ticks (every 3 months from 0..24) at positions 80, 80+70, ... -->
  <g class="ax" text-anchor="middle">
    <text x="80"  y="356">0</text>
    <text x="150" y="356">3</text>
    <text x="220" y="356">6</text>
    <text x="290" y="356">9</text>
    <text x="360" y="356">12</text>
    <text x="430" y="356">15</text>
    <text x="500" y="356">18</text>
    <text x="570" y="356">21</text>
    <text x="640" y="356">24</text>
  </g>

  <!-- axis lines -->
  <line x1="80" y1="100" x2="80" y2="340" stroke="#2a1a0e" stroke-width="1.2"/>
  <line x1="80" y1="340" x2="640" y2="340" stroke="#2a1a0e" stroke-width="1.2"/>

  <!-- axis titles -->
  <text x="360" y="378" text-anchor="middle" class="axT">months since the prompt was first captured</text>
  <text x="40" y="220" text-anchor="middle" class="axT" transform="rotate(-90 40 220)">prompt output quality (relative)</text>

  <!-- Maintenance event vertical ticks at months 6, 12, 18 -->
  <g stroke="#4a4540" stroke-width="1" stroke-dasharray="3 3">
    <line x1="220" y1="100" x2="220" y2="340"/>
    <line x1="360" y1="100" x2="360" y2="340"/>
    <line x1="500" y1="100" x2="500" y2="340"/>
  </g>
  <text x="220" y="92" text-anchor="middle" class="ann">30-min review</text>
  <text x="360" y="92" text-anchor="middle" class="ann">30-min review</text>
  <text x="500" y="92" text-anchor="middle" class="ann">30-min review</text>

  <!-- LINE 1: NO MAINTENANCE — smooth decay from (0,1.0) to (24,0.30) -->
  <!-- Anchors: (0,1.0)=80,100 ; (6,0.80)=220,148 ; (12,0.60)=360,196 ; (18,0.45)=500,232 ; (24,0.30)=640,268 -->
  <path d="M 80 100
           C 130 108, 175 130, 220 148
           C 265 166, 315 178, 360 196
           C 405 214, 455 224, 500 232
           C 545 240, 595 256, 640 268"
        fill="none" stroke="#2a1a0e" stroke-width="2.2" stroke-dasharray="6 4"/>

  <!-- Endpoint label -->
  <circle cx="640" cy="268" r="3" fill="#2a1a0e"/>
  <text x="630" y="288" text-anchor="end" class="lab">no maintenance</text>
  <text x="630" y="302" text-anchor="end" class="labS">~ 0.30 by month 24</text>

  <!-- LINE 2: SIX-MONTH MAINTENANCE — small dips then snap-back to 1.0 at months 6, 12, 18 -->
  <!-- Segments: (0,1.0)=80,100 -> (6,0.85)=220,136 ; vertical snap back to (6,1.0)=220,100 ;
       (6,1.0) -> (12,0.85)=360,136 ; snap to (12,1.0)=360,100 ;
       (12,1.0) -> (18,0.85)=500,136 ; snap to (18,1.0)=500,100 ;
       (18,1.0) -> (24,0.92)=640,119 -->
  <path d="M 80 100 L 220 136
           L 220 100
           L 360 136
           L 360 100
           L 500 136
           L 500 100
           L 640 119"
        fill="none" stroke="#2a1a0e" stroke-width="2.4"/>

  <!-- Snap-back markers -->
  <circle cx="220" cy="100" r="3.5" fill="#2a1a0e"/>
  <circle cx="360" cy="100" r="3.5" fill="#2a1a0e"/>
  <circle cx="500" cy="100" r="3.5" fill="#2a1a0e"/>
  <circle cx="640" cy="119" r="3" fill="#2a1a0e"/>

  <!-- Maintained line label -->
  <text x="120" y="86" class="lab">six-month maintenance</text>
  <text x="120" y="98" class="labS">held near 1.00 across 24 months</text>

  <!-- Mid-chart annotation pointing at one snap-back -->
  <line x1="408" y1="118" x2="364" y2="102" stroke="#4a4540" stroke-width="1" marker-end="url(#arBlk12d)"/>
  <text x="412" y="118" class="ann">30 minutes restores the entry to baseline</text>

  <!-- Legend -->
  <rect x="80" y="402" width="560" height="36" fill="#f5f2ee" stroke="#c8c4c0" stroke-width="1"/>
  <line x1="96" y1="416" x2="128" y2="416" stroke="#2a1a0e" stroke-width="2.2" stroke-dasharray="6 4"/>
  <text x="136" y="420" class="ax">no maintenance — silent decay; nobody notices until a grading dispute surfaces it</text>
  <line x1="96" y1="432" x2="128" y2="432" stroke="#2a1a0e" stroke-width="2.4"/>
  <text x="136" y="436" class="ax">six-month maintenance — January and July, thirty minutes, renewed / revised / retired</text>

  <!-- Caption -->
  <text x="32" y="454" class="cap">A working heuristic, not a measured shelf life — calibrated to roughly two model generations.</text>
</svg>
