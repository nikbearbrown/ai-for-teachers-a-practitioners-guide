<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 700 480" role="img" aria-labelledby="t6 d6" font-family="'EB Garamond', Garamond, Georgia, 'Times New Roman', serif">
  <title id="t6">Performance-paradox demonstration &#8212; a single class period</title>
  <desc id="d6">A four-phase classroom timeline that compresses the Bastani finding into a felt experience: framing, Set A with full AI access, immediate Set B with no AI, and a paired-score reflection.</desc>
  <defs>
    <marker id="arr6" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M0,0 L10,5 L0,10 z" fill="#2a1a0e"/>
    </marker>
  </defs>

  <rect x="0" y="0" width="700" height="480" fill="#fdfcfb"/>

  <text x="350" y="32" text-anchor="middle" font-size="22" fill="#2a1a0e">Run the Bastani study on yourselves.</text>
  <text x="350" y="56" text-anchor="middle" font-size="14" fill="#4a4540" font-style="italic">One class period. Two problem sets. The numbers do the teaching.</text>

  <!-- horizontal timeline -->
  <line x1="60" y1="120" x2="640" y2="120" stroke="#4a4540" stroke-width="1"/>

  <!-- phase 1 -->
  <circle cx="120" cy="120" r="6" fill="#2a1a0e"/>
  <text x="120" y="104" text-anchor="middle" font-size="11" fill="#8a8480" font-style="italic">5 min</text>
  <text x="120" y="148" text-anchor="middle" font-size="14" fill="#2a1a0e">1. Frame honestly</text>

  <rect x="60" y="170" width="120" height="120" fill="#f5f2ee" stroke="#4a4540" stroke-width="1"/>
  <text x="120" y="194" text-anchor="middle" font-size="12" fill="#2a1a0e">Tell the class</text>
  <text x="120" y="210" text-anchor="middle" font-size="12" fill="#2a1a0e">the design.</text>
  <text x="120" y="236" text-anchor="middle" font-size="11" fill="#4a4540" font-style="italic">No deception.</text>
  <text x="120" y="252" text-anchor="middle" font-size="11" fill="#4a4540" font-style="italic">No grade.</text>
  <text x="120" y="276" text-anchor="middle" font-size="11" fill="#4a4540" font-style="italic">The students are</text>
  <text x="120" y="286" text-anchor="middle" font-size="11" fill="#4a4540" font-style="italic">the subjects.</text>

  <!-- phase 2 -->
  <circle cx="290" cy="120" r="6" fill="#2a1a0e"/>
  <text x="290" y="104" text-anchor="middle" font-size="11" fill="#8a8480" font-style="italic">30 min</text>
  <text x="290" y="148" text-anchor="middle" font-size="14" fill="#2a1a0e">2. Set A &#8212; AI on</text>

  <rect x="230" y="170" width="120" height="120" fill="#f5f2ee" stroke="#4a4540" stroke-width="1"/>
  <text x="290" y="194" text-anchor="middle" font-size="12" fill="#2a1a0e">6&#8211;8 problems.</text>
  <text x="290" y="212" text-anchor="middle" font-size="12" fill="#2a1a0e">Full AI access.</text>
  <text x="290" y="236" text-anchor="middle" font-size="11" fill="#4a4540" font-style="italic">Any tool, any way.</text>
  <text x="290" y="262" text-anchor="middle" font-size="11" fill="#2a1a0e">Confidence rating:</text>
  <text x="290" y="276" text-anchor="middle" font-size="11" fill="#2a1a0e" font-style="italic">&#8220;How well do I</text>
  <text x="290" y="286" text-anchor="middle" font-size="11" fill="#2a1a0e" font-style="italic">understand this?&#8221;</text>

  <!-- phase 3 -->
  <circle cx="460" cy="120" r="6" fill="#2a1a0e"/>
  <text x="460" y="104" text-anchor="middle" font-size="11" fill="#8a8480" font-style="italic">15 min</text>
  <text x="460" y="148" text-anchor="middle" font-size="14" fill="#2a1a0e">3. Set B &#8212; AI off</text>

  <rect x="400" y="170" width="120" height="120" fill="#f5f2ee" stroke="#2a1a0e" stroke-width="1.5"/>
  <text x="460" y="194" text-anchor="middle" font-size="12" fill="#2a1a0e">Same concept.</text>
  <text x="460" y="210" text-anchor="middle" font-size="12" fill="#2a1a0e">Same difficulty.</text>
  <text x="460" y="226" text-anchor="middle" font-size="12" fill="#2a1a0e">Different surface.</text>
  <text x="460" y="252" text-anchor="middle" font-size="11" fill="#4a4540" font-style="italic">No AI.</text>
  <text x="460" y="266" text-anchor="middle" font-size="11" fill="#4a4540" font-style="italic">No notes.</text>
  <text x="460" y="280" text-anchor="middle" font-size="11" fill="#4a4540" font-style="italic">No phones.</text>

  <!-- phase 4 -->
  <circle cx="610" cy="120" r="6" fill="#2a1a0e"/>
  <text x="610" y="104" text-anchor="middle" font-size="11" fill="#8a8480" font-style="italic">10 min</text>
  <text x="610" y="148" text-anchor="middle" font-size="14" fill="#2a1a0e">4. Reflect</text>

  <rect x="550" y="170" width="120" height="120" fill="#f5f2ee" stroke="#4a4540" stroke-width="1"/>
  <text x="610" y="194" text-anchor="middle" font-size="12" fill="#2a1a0e">Hand back</text>
  <text x="610" y="210" text-anchor="middle" font-size="12" fill="#2a1a0e">both scores +</text>
  <text x="610" y="226" text-anchor="middle" font-size="12" fill="#2a1a0e">confidence.</text>
  <text x="610" y="252" text-anchor="middle" font-size="11" fill="#4a4540" font-style="italic">What do these</text>
  <text x="610" y="266" text-anchor="middle" font-size="11" fill="#4a4540" font-style="italic">three numbers</text>
  <text x="610" y="280" text-anchor="middle" font-size="11" fill="#4a4540" font-style="italic">tell you?</text>

  <!-- connector arrows -->
  <line x1="180" y1="230" x2="226" y2="230" stroke="#2a1a0e" stroke-width="1" marker-end="url(#arr6)"/>
  <line x1="350" y1="230" x2="396" y2="230" stroke="#2a1a0e" stroke-width="1" marker-end="url(#arr6)"/>
  <line x1="520" y1="230" x2="546" y2="230" stroke="#2a1a0e" stroke-width="1" marker-end="url(#arr6)"/>

  <!-- diagnostic outcomes panel -->
  <rect x="60" y="320" width="580" height="120" fill="#fdfcfb" stroke="#4a4540" stroke-width="1"/>
  <text x="76" y="342" font-size="13" fill="#2a1a0e" font-style="italic">What the gap means &#8212; diagnostic, not verdict.</text>
  <line x1="60" y1="350" x2="640" y2="350" stroke="#c8c4c0" stroke-width="1"/>

  <text x="76" y="372" font-size="13" fill="#2a1a0e">large gap, high confidence</text>
  <text x="320" y="372" font-size="13" fill="#4a4540">&#8594; fluency was the AI&#8217;s. Borrowing.</text>

  <text x="76" y="396" font-size="13" fill="#2a1a0e">small gap, matched scores</text>
  <text x="320" y="396" font-size="13" fill="#4a4540">&#8594; capability was being built. Building.</text>

  <text x="76" y="420" font-size="13" fill="#2a1a0e">low scores on both</text>
  <text x="320" y="420" font-size="13" fill="#4a4540">&#8594; the concept needs more work, not the AI.</text>

  <text x="350" y="468" text-anchor="middle" font-size="11" fill="#8a8480" font-style="italic">Figure 14.6 &#8212; one period, one concept; produces a personal data point, not a proof.</text>
</svg>
