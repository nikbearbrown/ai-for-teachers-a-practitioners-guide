<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 700 480" role="img" aria-labelledby="t3 d3" font-family="'EB Garamond', Garamond, Georgia, 'Times New Roman', serif">
  <title id="t3">Storage strength versus retrieval strength: the fluency trap</title>
  <desc id="d3">Two stacked panels. Re-reading and AI-as-explainer raise retrieval strength quickly while storage strength stays flat. Retrieval practice and AI-as-quizzer raise storage strength gradually; retrieval strength dips during practice and recovers by the test.</desc>
  <defs>
    <marker id="arr3" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse">
      <path d="M0,0 L10,5 L0,10 z" fill="#4a4540"/>
    </marker>
  </defs>

  <rect x="0" y="0" width="700" height="480" fill="#fdfcfb"/>

  <text x="350" y="30" text-anchor="middle" font-size="22" fill="#2a1a0e">Two parameters the introspective system cannot tell apart.</text>
  <text x="350" y="54" text-anchor="middle" font-size="14" fill="#4a4540" font-style="italic">Bjork &amp; Bjork: fluency now is not durability later.</text>

  <!-- Panel A: Re-reading / AI-as-explainer -->
  <text x="80" y="84" font-size="14" fill="#2a1a0e" font-style="italic">A. Re-read &#8212; or ask the AI to explain</text>

  <line x1="80" y1="100" x2="80" y2="220" stroke="#4a4540" stroke-width="1"/>
  <line x1="80" y1="220" x2="640" y2="220" stroke="#4a4540" stroke-width="1"/>

  <text x="70" y="106" font-size="10" fill="#4a4540" text-anchor="end">high</text>
  <text x="70" y="222" font-size="10" fill="#4a4540" text-anchor="end">low</text>
  <text x="84" y="236" font-size="11" fill="#4a4540" font-style="italic">study session</text>
  <text x="360" y="236" font-size="11" fill="#4a4540" text-anchor="middle" font-style="italic">2 days</text>
  <text x="630" y="236" font-size="11" fill="#4a4540" text-anchor="end" font-style="italic">exam (2 weeks)</text>

  <!-- retrieval strength: spikes high during/after rereading, decays steeply -->
  <path d="M 80 200 Q 160 110 240 108 Q 320 110 400 140 Q 480 175 560 200 Q 600 208 640 212" fill="none" stroke="#2a1a0e" stroke-width="2"/>
  <text x="220" y="100" font-size="12" fill="#2a1a0e">retrieval strength</text>

  <!-- storage strength: nearly flat low -->
  <path d="M 80 208 L 200 207 L 320 206 L 440 207 L 560 208 L 640 208" fill="none" stroke="#8a8480" stroke-width="2" stroke-dasharray="5,4"/>
  <text x="450" y="202" font-size="12" fill="#4a4540">storage strength &#8212; flat</text>

  <!-- vertical exam line -->
  <line x1="600" y1="100" x2="600" y2="220" stroke="#8a8480" stroke-width="1" stroke-dasharray="2,3"/>

  <text x="86" y="252" font-size="11" fill="#4a4540" font-style="italic">feels like learning; brain stays empty.</text>

  <!-- Panel B: Retrieval practice / AI-as-quizzer -->
  <text x="80" y="288" font-size="14" fill="#2a1a0e" font-style="italic">B. Retrieve &#8212; or ask the AI to quiz you</text>

  <line x1="80" y1="304" x2="80" y2="424" stroke="#4a4540" stroke-width="1"/>
  <line x1="80" y1="424" x2="640" y2="424" stroke="#4a4540" stroke-width="1"/>

  <text x="70" y="310" font-size="10" fill="#4a4540" text-anchor="end">high</text>
  <text x="70" y="426" font-size="10" fill="#4a4540" text-anchor="end">low</text>
  <text x="84" y="440" font-size="11" fill="#4a4540" font-style="italic">study session</text>
  <text x="360" y="440" font-size="11" fill="#4a4540" text-anchor="middle" font-style="italic">2 days</text>
  <text x="630" y="440" font-size="11" fill="#4a4540" text-anchor="end" font-style="italic">exam (2 weeks)</text>

  <!-- retrieval strength: starts lower, modest rise, gentle decay -->
  <path d="M 80 400 Q 160 360 240 350 Q 320 348 400 354 Q 480 362 560 372 Q 600 376 640 380" fill="none" stroke="#2a1a0e" stroke-width="2"/>
  <text x="220" y="346" font-size="12" fill="#2a1a0e">retrieval strength</text>

  <!-- storage strength: rises across panel and ends above retrieval -->
  <path d="M 80 410 Q 200 380 320 360 Q 440 340 560 332 Q 600 330 640 328" fill="none" stroke="#8a8480" stroke-width="2" stroke-dasharray="5,4"/>
  <text x="450" y="322" font-size="12" fill="#4a4540">storage strength &#8212; grows</text>

  <line x1="600" y1="304" x2="600" y2="424" stroke="#8a8480" stroke-width="1" stroke-dasharray="2,3"/>

  <text x="86" y="456" font-size="11" fill="#4a4540" font-style="italic">feels harder; brain is being built. desirable difficulty.</text>

  <text x="350" y="476" text-anchor="middle" font-size="11" fill="#8a8480" font-style="italic">Figure 14.3 &#8212; schematic, not measured curves. The mechanism, not the numbers.</text>
</svg>
