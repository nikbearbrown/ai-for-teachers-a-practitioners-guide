<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 760 480" role="img" aria-labelledby="fig04-title fig04-desc" font-family="'EB Garamond', Garamond, Georgia, serif">
  <title id="fig04-title">GPT detectors misclassify non-native English writers</title>
  <desc id="fig04-desc">Two grouped bar sets show false-positive rates for AI detection across seven detectors. Native-speaker essays are flagged at near-zero rates; non-native TOEFL essays are flagged at more than half on average.</desc>

  <defs>
    <marker id="arrow04" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse">
      <path d="M0,0 L10,5 L0,10 z" fill="#2a1a0e"/>
    </marker>
  </defs>

  <rect x="0" y="0" width="760" height="480" fill="#fdfcfb"/>

  <text x="380" y="34" text-anchor="middle" font-size="20" fill="#2a1a0e">False-positive rate by writer population</text>
  <text x="380" y="56" text-anchor="middle" font-size="13" font-style="italic" fill="#4a4540">After Liang et al., 2023 — seven detectors, two populations</text>

  <line x1="100" y1="392" x2="700" y2="392" stroke="#2a1a0e" stroke-width="1.2"/>
  <line x1="100" y1="100" x2="100" y2="392" stroke="#2a1a0e" stroke-width="1.2"/>

  <g font-size="11" fill="#4a4540">
    <line x1="96" y1="392" x2="100" y2="392" stroke="#4a4540"/>
    <text x="90" y="396" text-anchor="end">0%</text>
    <line x1="96" y1="333" x2="100" y2="333" stroke="#4a4540"/>
    <text x="90" y="337" text-anchor="end">20%</text>
    <line x1="96" y1="275" x2="100" y2="275" stroke="#4a4540"/>
    <text x="90" y="279" text-anchor="end">40%</text>
    <line x1="96" y1="217" x2="100" y2="217" stroke="#4a4540"/>
    <text x="90" y="221" text-anchor="end">60%</text>
    <line x1="96" y1="158" x2="100" y2="158" stroke="#4a4540"/>
    <text x="90" y="162" text-anchor="end">80%</text>
    <line x1="96" y1="100" x2="100" y2="100" stroke="#4a4540"/>
    <text x="90" y="104" text-anchor="end">100%</text>
  </g>
  <text x="48" y="246" text-anchor="middle" font-size="12" font-style="italic" fill="#4a4540" transform="rotate(-90 48 246)">Essays flagged as AI-generated</text>

  <g stroke="#c8c4c0" stroke-width="0.8" stroke-dasharray="2 3">
    <line x1="100" y1="333" x2="700" y2="333"/>
    <line x1="100" y1="275" x2="700" y2="275"/>
    <line x1="100" y1="217" x2="700" y2="217"/>
    <line x1="100" y1="158" x2="700" y2="158"/>
  </g>

  <!-- Native group label -->
  <text x="260" y="412" text-anchor="middle" font-size="14" fill="#2a1a0e">Native English (US 8th-graders)</text>
  <text x="260" y="428" text-anchor="middle" font-size="11" font-style="italic" fill="#4a4540">human-written essays, never AI-generated</text>

  <!-- Native bars: 7 detectors at ~3% each -->
  <g>
    <rect x="130" y="383" width="22" height="9" fill="#c8c4c0" stroke="#2a1a0e" stroke-width="1"/>
    <rect x="156" y="386" width="22" height="6" fill="#c8c4c0" stroke="#2a1a0e" stroke-width="1"/>
    <rect x="182" y="378" width="22" height="14" fill="#c8c4c0" stroke="#2a1a0e" stroke-width="1"/>
    <rect x="208" y="381" width="22" height="11" fill="#c8c4c0" stroke="#2a1a0e" stroke-width="1"/>
    <rect x="234" y="389" width="22" height="3" fill="#c8c4c0" stroke="#2a1a0e" stroke-width="1"/>
    <rect x="260" y="384" width="22" height="8" fill="#c8c4c0" stroke="#2a1a0e" stroke-width="1"/>
    <rect x="286" y="387" width="22" height="5" fill="#c8c4c0" stroke="#2a1a0e" stroke-width="1"/>
  </g>
  <line x1="316" y1="375" x2="356" y2="375" stroke="#2a1a0e" stroke-width="1"/>
  <text x="370" y="378" font-size="12" font-style="italic" fill="#2a1a0e">~3% avg.</text>

  <!-- Non-native group label -->
  <text x="540" y="412" text-anchor="middle" font-size="14" fill="#2a1a0e">Non-native English (TOEFL)</text>
  <text x="540" y="428" text-anchor="middle" font-size="11" font-style="italic" fill="#4a4540">human-written essays, never AI-generated</text>

  <!-- Non-native bars: 7 detectors hovering 50-80% -->
  <g>
    <rect x="410" y="208" width="22" height="184" fill="#4a4540" stroke="#2a1a0e" stroke-width="1"/>
    <rect x="436" y="178" width="22" height="214" fill="#4a4540" stroke="#2a1a0e" stroke-width="1"/>
    <rect x="462" y="226" width="22" height="166" fill="#4a4540" stroke="#2a1a0e" stroke-width="1"/>
    <rect x="488" y="244" width="22" height="148" fill="#4a4540" stroke="#2a1a0e" stroke-width="1"/>
    <rect x="514" y="200" width="22" height="192" fill="#4a4540" stroke="#2a1a0e" stroke-width="1"/>
    <rect x="540" y="232" width="22" height="160" fill="#4a4540" stroke="#2a1a0e" stroke-width="1"/>
    <rect x="566" y="190" width="22" height="202" fill="#4a4540" stroke="#2a1a0e" stroke-width="1"/>
  </g>
  <line x1="596" y1="217" x2="640" y2="217" stroke="#2a1a0e" stroke-width="1"/>
  <text x="650" y="220" font-size="12" font-style="italic" fill="#2a1a0e">&gt; 50% avg.</text>

  <line x1="370" y1="370" x2="400" y2="222" stroke="#2a1a0e" stroke-width="1" stroke-dasharray="3 3" marker-end="url(#arrow04)"/>
  <text x="378" y="298" font-size="13" font-style="italic" fill="#2a1a0e">same prose pattern,</text>
  <text x="378" y="314" font-size="13" font-style="italic" fill="#2a1a0e">opposite mechanism</text>

  <text x="380" y="468" text-anchor="middle" font-size="12" font-style="italic" fill="#4a4540">Detectors register low text perplexity, not authorship. Non-native writers and AI both write low-perplexity prose.</text>
</svg>
