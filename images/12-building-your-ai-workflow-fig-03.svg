<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 760 460" role="img" aria-labelledby="t1203 d1203">
  <title id="t1203">Rogers and CBAM plateau map for teacher AI adoption</title>
  <desc id="d1203">Two-row stage progression. Top row shows Rogers's five sequential stages of innovation diffusion with an ad-hoc-adoption plateau flag wedged between Implementation and Confirmation. Bottom row shows the six condensed CBAM stages of concern with a logistics plateau flag wedged between Management and Consequence. A sweep arrow beneath both rows labels the workflow document as the move that crosses both plateaus.</desc>
  <defs>
    <style>
      .ti  { font-family: 'EB Garamond', Georgia, 'Times New Roman', serif; font-size: 14px; font-weight: bold; fill: #2a1a0e; }
      .sub { font-family: 'EB Garamond', Georgia, 'Times New Roman', serif; font-size: 11px; font-style: italic; fill: #4a4540; }
      .rowLab { font-family: 'EB Garamond', Georgia, 'Times New Roman', serif; font-size: 12px; font-weight: bold; fill: #2a1a0e; }
      .rowSub { font-family: 'EB Garamond', Georgia, 'Times New Roman', serif; font-size: 10px; font-style: italic; fill: #4a4540; }
      .stage  { font-family: 'EB Garamond', Georgia, 'Times New Roman', serif; font-size: 11px; font-weight: bold; fill: #2a1a0e; }
      .stageS { font-family: 'EB Garamond', Georgia, 'Times New Roman', serif; font-size: 9px; fill: #4a4540; }
      .flag   { font-family: 'EB Garamond', Georgia, 'Times New Roman', serif; font-size: 10px; font-weight: bold; fill: #fdfcfb; }
      .flagS  { font-family: 'EB Garamond', Georgia, 'Times New Roman', serif; font-size: 9px; font-style: italic; fill: #fdfcfb; }
      .sweep  { font-family: 'EB Garamond', Georgia, 'Times New Roman', serif; font-size: 11px; font-weight: bold; fill: #2a1a0e; }
      .cap    { font-family: 'EB Garamond', Georgia, 'Times New Roman', serif; font-size: 11px; fill: #2a1a0e; }
    </style>
    <marker id="arBlk12c" markerWidth="9" markerHeight="7" refX="8" refY="3.5" orient="auto">
      <polygon points="0 0, 9 3.5, 0 7" fill="#2a1a0e"/>
    </marker>
    <marker id="arSweep12c" markerWidth="10" markerHeight="8" refX="9" refY="4" orient="auto">
      <polygon points="0 0, 10 4, 0 8" fill="#4a4540"/>
    </marker>
  </defs>
  <rect width="760" height="460" fill="#fdfcfb"/>

  <text x="32" y="28" class="ti">Two adoption frameworks, the same plateau, the same structural fix.</text>
  <text x="32" y="44" class="sub">Rogers names a sequence of stages. Hall and Hord name a sequence of concerns. Most teachers stall at the same place in both.</text>

  <!-- ROW 1: ROGERS -->
  <text x="32" y="82" class="rowLab">Rogers (1962/2003) — Diffusion of Innovations</text>
  <text x="32" y="96" class="rowSub">five sequential stages of individual adoption</text>

  <!-- Row 1 connecting baseline -->
  <line x1="40" y1="148" x2="720" y2="148" stroke="#c8c4c0" stroke-width="1"/>

  <!-- Stage boxes — Rogers -->
  <g>
    <rect x="40"  y="116" width="120" height="64" fill="#fdfcfb" stroke="#8a8480" stroke-width="1"/>
    <text x="100" y="138" text-anchor="middle" class="stage">Knowledge</text>
    <text x="100" y="154" text-anchor="middle" class="stageS">"there is a tool"</text>
    <text x="100" y="168" text-anchor="middle" class="stageS">heard about it</text>

    <rect x="166" y="116" width="120" height="64" fill="#fdfcfb" stroke="#8a8480" stroke-width="1"/>
    <text x="226" y="138" text-anchor="middle" class="stage">Persuasion</text>
    <text x="226" y="154" text-anchor="middle" class="stageS">forms an attitude</text>
    <text x="226" y="168" text-anchor="middle" class="stageS">about the tool</text>

    <rect x="292" y="116" width="120" height="64" fill="#fdfcfb" stroke="#8a8480" stroke-width="1"/>
    <text x="352" y="138" text-anchor="middle" class="stage">Decision</text>
    <text x="352" y="154" text-anchor="middle" class="stageS">accepts or rejects</text>
    <text x="352" y="168" text-anchor="middle" class="stageS">the innovation</text>

    <rect x="418" y="116" width="124" height="64" fill="#f5f2ee" stroke="#2a1a0e" stroke-width="1.4"/>
    <text x="480" y="138" text-anchor="middle" class="stage">Implementation</text>
    <text x="480" y="154" text-anchor="middle" class="stageS">tool is being used</text>
    <text x="480" y="168" text-anchor="middle" class="stageS">most teachers stop here</text>

    <rect x="600" y="116" width="120" height="64" fill="#fdfcfb" stroke="#8a8480" stroke-width="1"/>
    <text x="660" y="138" text-anchor="middle" class="stage">Confirmation</text>
    <text x="660" y="154" text-anchor="middle" class="stageS">integrated, evaluated</text>
    <text x="660" y="168" text-anchor="middle" class="stageS">evidence it works</text>
  </g>

  <!-- arrows -->
  <line x1="160" y1="148" x2="164" y2="148" stroke="#2a1a0e" stroke-width="1" marker-end="url(#arBlk12c)"/>
  <line x1="286" y1="148" x2="290" y2="148" stroke="#2a1a0e" stroke-width="1" marker-end="url(#arBlk12c)"/>
  <line x1="412" y1="148" x2="416" y2="148" stroke="#2a1a0e" stroke-width="1" marker-end="url(#arBlk12c)"/>

  <!-- Plateau flag between Implementation and Confirmation -->
  <rect x="546" y="116" width="52" height="64" fill="#2a1a0e" stroke="#2a1a0e"/>
  <text x="572" y="140" text-anchor="middle" class="flag">AD HOC</text>
  <text x="572" y="154" text-anchor="middle" class="flag">ADOPTION</text>
  <text x="572" y="170" text-anchor="middle" class="flagS">fresh decision</text>
  <text x="572" y="180" text-anchor="middle" class="flagS">every use</text>

  <!-- ROW 2: CBAM -->
  <text x="32" y="220" class="rowLab">Hall &amp; Hord — Concerns-Based Adoption Model (CBAM)</text>
  <text x="32" y="234" class="rowSub">six condensed stages of concern as the user moves through the innovation</text>

  <line x1="40" y1="286" x2="720" y2="286" stroke="#c8c4c0" stroke-width="1"/>

  <g>
    <rect x="40"  y="254" width="98" height="64" fill="#fdfcfb" stroke="#8a8480" stroke-width="1"/>
    <text x="89"  y="276" text-anchor="middle" class="stage">Awareness</text>
    <text x="89"  y="292" text-anchor="middle" class="stageS">"what is this?"</text>
    <text x="89"  y="306" text-anchor="middle" class="stageS">no concerns yet</text>

    <rect x="144" y="254" width="98" height="64" fill="#fdfcfb" stroke="#8a8480" stroke-width="1"/>
    <text x="193" y="276" text-anchor="middle" class="stage">Personal</text>
    <text x="193" y="292" text-anchor="middle" class="stageS">"how does this</text>
    <text x="193" y="306" text-anchor="middle" class="stageS">affect me?"</text>

    <rect x="248" y="254" width="100" height="64" fill="#f5f2ee" stroke="#2a1a0e" stroke-width="1.4"/>
    <text x="298" y="276" text-anchor="middle" class="stage">Management</text>
    <text x="298" y="292" text-anchor="middle" class="stageS">"do I have time</text>
    <text x="298" y="306" text-anchor="middle" class="stageS">and materials?"</text>

    <rect x="412" y="254" width="100" height="64" fill="#fdfcfb" stroke="#8a8480" stroke-width="1"/>
    <text x="462" y="276" text-anchor="middle" class="stage">Consequence</text>
    <text x="462" y="292" text-anchor="middle" class="stageS">"is this affecting</text>
    <text x="462" y="306" text-anchor="middle" class="stageS">students?"</text>

    <rect x="518" y="254" width="100" height="64" fill="#fdfcfb" stroke="#8a8480" stroke-width="1"/>
    <text x="568" y="276" text-anchor="middle" class="stage">Collaboration</text>
    <text x="568" y="292" text-anchor="middle" class="stageS">"who else should</text>
    <text x="568" y="306" text-anchor="middle" class="stageS">be doing this?"</text>

    <rect x="624" y="254" width="96" height="64" fill="#fdfcfb" stroke="#8a8480" stroke-width="1"/>
    <text x="672" y="276" text-anchor="middle" class="stage">Refocusing</text>
    <text x="672" y="292" text-anchor="middle" class="stageS">"could we use this</text>
    <text x="672" y="306" text-anchor="middle" class="stageS">in a better way?"</text>
  </g>

  <line x1="138" y1="286" x2="142" y2="286" stroke="#2a1a0e" stroke-width="1" marker-end="url(#arBlk12c)"/>
  <line x1="242" y1="286" x2="246" y2="286" stroke="#2a1a0e" stroke-width="1" marker-end="url(#arBlk12c)"/>
  <line x1="512" y1="286" x2="516" y2="286" stroke="#2a1a0e" stroke-width="1" marker-end="url(#arBlk12c)"/>
  <line x1="618" y1="286" x2="622" y2="286" stroke="#2a1a0e" stroke-width="1" marker-end="url(#arBlk12c)"/>

  <!-- Plateau flag between Management and Consequence -->
  <rect x="352" y="254" width="56" height="64" fill="#2a1a0e" stroke="#2a1a0e"/>
  <text x="380" y="278" text-anchor="middle" class="flag">STUCK ON</text>
  <text x="380" y="292" text-anchor="middle" class="flag">LOGISTICS</text>
  <text x="380" y="308" text-anchor="middle" class="flagS">time + materials</text>
  <text x="380" y="318" text-anchor="middle" class="flagS">still the load</text>

  <!-- Sweep arrow beneath both rows -->
  <path d="M 480 360 Q 580 372 660 360" fill="none" stroke="#4a4540" stroke-width="1.4" marker-end="url(#arSweep12c)"/>
  <path d="M 298 388 Q 380 400 462 388" fill="none" stroke="#4a4540" stroke-width="1.4" marker-end="url(#arSweep12c)"/>

  <text x="380" y="354" class="sweep" text-anchor="middle">workflow.md moves you past both plateaus</text>
  <text x="380" y="416" class="rowSub" text-anchor="middle">the captured library answers the management question once; the schedule answers it weekly.</text>

  <!-- Caption -->
  <line x1="32" y1="430" x2="728" y2="430" stroke="#c8c4c0" stroke-width="1"/>
  <text x="32" y="448" class="cap">Two different vocabularies, the same plateau. The fix is structural, not motivational.</text>
</svg>
