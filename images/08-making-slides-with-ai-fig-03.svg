<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 700 480" role="img" aria-labelledby="f3-title f3-desc" font-family="'EB Garamond', Garamond, Georgia, serif">
  <title id="f3-title">The five-question slide diagnostic</title>
  <desc id="f3-desc">A printable half-page card. Five numbered questions, each followed by the corrective action indented beneath. Designed to be taped above a monitor or stapled inside a course packet.</desc>
  <rect width="700" height="480" fill="#fdfcfb"/>

  <!-- Card frame -->
  <rect x="60" y="40" width="580" height="400" fill="#f5f2ee" stroke="#2a1a0e" stroke-width="1.5"/>

  <!-- Eyebrow + title -->
  <text x="84" y="78" font-size="11" letter-spacing="2" fill="#8a8480">SLIDE DECK PASS</text>
  <text x="84" y="112" font-size="26" fill="#2a1a0e">The five-question diagnostic</text>
  <line x1="84" y1="126" x2="180" y2="126" stroke="#2a1a0e" stroke-width="1.5"/>

  <!-- Question 1 -->
  <text x="84" y="166" font-size="14" fill="#4a4540">1</text>
  <text x="108" y="166" font-size="15" fill="#2a1a0e">Is the headline a claim or a topic label?</text>
  <text x="108" y="184" font-size="12" font-style="italic" fill="#8a8480">If label, rewrite as an assertion the evidence supports.</text>

  <!-- Question 2 -->
  <text x="84" y="214" font-size="14" fill="#4a4540">2</text>
  <text x="108" y="214" font-size="15" fill="#2a1a0e">Would this slide teach without a speaker?</text>
  <text x="108" y="232" font-size="12" font-style="italic" fill="#8a8480">If yes, move prose to the notes field; sparsen the body.</text>

  <!-- Question 3 -->
  <text x="84" y="262" font-size="14" fill="#4a4540">3</text>
  <text x="108" y="262" font-size="15" fill="#2a1a0e">Is there a sentence you are about to say aloud?</text>
  <text x="108" y="280" font-size="12" font-style="italic" fill="#8a8480">Redundancy collision — move it to the notes field.</text>

  <!-- Question 4 -->
  <text x="84" y="310" font-size="14" fill="#4a4540">4</text>
  <text x="108" y="310" font-size="15" fill="#2a1a0e">Does the visual form match the content structure?</text>
  <text x="108" y="328" font-size="12" font-style="italic" fill="#8a8480">List, comparison, process, distribution — rebuild if mismatched.</text>

  <!-- Question 5 -->
  <text x="84" y="358" font-size="14" fill="#4a4540">5</text>
  <text x="108" y="358" font-size="15" fill="#2a1a0e">Is every color encoding something?</text>
  <text x="108" y="376" font-size="12" font-style="italic" fill="#8a8480">Count categories; count colors. Cut the excess.</text>

  <line x1="84" y1="402" x2="616" y2="402" stroke="#c8c4c0" stroke-width="0.8"/>
  <text x="84" y="422" font-size="12" fill="#8a8480">Thirty seconds per slide. Five minutes for a ten-slide deck.</text>
</svg>
