<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 760 480" role="img" aria-labelledby="fig05-title fig05-desc" font-family="'EB Garamond', Garamond, Georgia, serif">
  <title id="fig05-title">Wing's computational thinking, mapped onto Ms. R's polynomial spec</title>
  <desc id="fig05-desc">A two-column mapping table. Left column names six computational-thinking moves from Wing (2006); right column shows the exact corresponding clause in Ms. R's polynomial-grapher paragraph.</desc>
  <defs>
    <marker id="arrow05" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M0,0 L10,5 L0,10 z" fill="#4a4540"/>
    </marker>
  </defs>
  <rect x="0" y="0" width="760" height="480" fill="#fdfcfb"/>

  <text x="380" y="34" text-anchor="middle" font-size="22" fill="#2a1a0e">Computational thinking on a Sunday afternoon</text>
  <text x="380" y="56" text-anchor="middle" font-size="13" font-style="italic" fill="#4a4540">Wing's 2006 moves, mapped onto Ms. R's spec</text>

  <!-- Column headers -->
  <line x1="40" y1="86" x2="720" y2="86" stroke="#2a1a0e" stroke-width="1.4"/>
  <text x="60" y="106" font-size="13" fill="#4a4540">Wing (2006) — the move</text>
  <text x="400" y="106" font-size="13" fill="#4a4540">Ms. R's paragraph — the clause</text>
  <line x1="40" y1="116" x2="720" y2="116" stroke="#c8c4c0" stroke-width="1"/>

  <g font-size="13" fill="#2a1a0e">
    <!-- Row 1 -->
    <text x="60" y="142">Identify inputs</text>
    <line x1="220" y1="138" x2="385" y2="138" stroke="#4a4540" stroke-width="1" marker-end="url(#arrow05)"/>
    <text x="400" y="142" font-style="italic" fill="#4a4540">&quot;four sliders for a, b, c, d, each −5 to 5&quot;</text>
    <line x1="40" y1="156" x2="720" y2="156" stroke="#c8c4c0" stroke-width="1" stroke-dasharray="3 3"/>

    <!-- Row 2 -->
    <text x="60" y="182">Identify outputs</text>
    <line x1="220" y1="178" x2="385" y2="178" stroke="#4a4540" stroke-width="1" marker-end="url(#arrow05)"/>
    <text x="400" y="182" font-style="italic" fill="#4a4540">&quot;curve, real roots, y-intercept, equation&quot;</text>
    <line x1="40" y1="196" x2="720" y2="196" stroke="#c8c4c0" stroke-width="1" stroke-dasharray="3 3"/>

    <!-- Row 3 -->
    <text x="60" y="222">Decompose</text>
    <line x1="220" y1="218" x2="385" y2="218" stroke="#4a4540" stroke-width="1" marker-end="url(#arrow05)"/>
    <text x="400" y="222" font-style="italic" fill="#4a4540">rendering / interaction / calculation</text>
    <line x1="40" y1="236" x2="720" y2="236" stroke="#c8c4c0" stroke-width="1" stroke-dasharray="3 3"/>

    <!-- Row 4 -->
    <text x="60" y="262">Abstract</text>
    <line x1="220" y1="258" x2="385" y2="258" stroke="#4a4540" stroke-width="1" marker-end="url(#arrow05)"/>
    <text x="400" y="262" font-style="italic" fill="#4a4540">cubic generalized to y = ax³ + bx² + cx + d</text>
    <line x1="40" y1="276" x2="720" y2="276" stroke="#c8c4c0" stroke-width="1" stroke-dasharray="3 3"/>

    <!-- Row 5 -->
    <text x="60" y="302">Anticipate failure</text>
    <line x1="220" y1="298" x2="385" y2="298" stroke="#4a4540" stroke-width="1" marker-end="url(#arrow05)"/>
    <text x="400" y="302" font-style="italic" fill="#4a4540">&quot;when a = 0 the cubic becomes a quadratic&quot;</text>
    <line x1="40" y1="316" x2="720" y2="316" stroke="#c8c4c0" stroke-width="1" stroke-dasharray="3 3"/>

    <!-- Row 6 -->
    <text x="60" y="342">Constrain environment</text>
    <line x1="220" y1="338" x2="385" y2="338" stroke="#4a4540" stroke-width="1" marker-end="url(#arrow05)"/>
    <text x="400" y="342" font-style="italic" fill="#4a4540">&quot;self-contained — no internet at runtime&quot;</text>
  </g>
  <line x1="40" y1="358" x2="720" y2="358" stroke="#2a1a0e" stroke-width="1.4"/>

  <text x="380" y="404" text-anchor="middle" font-size="13" fill="#4a4540">The model can supply the semicolons.</text>
  <text x="380" y="424" text-anchor="middle" font-size="13" font-style="italic" fill="#2a1a0e">It cannot supply the judgment about what the tool should do.</text>
</svg>
