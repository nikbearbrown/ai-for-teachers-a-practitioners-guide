<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 700 480" role="img" aria-labelledby="fig02-title fig02-desc" font-family="'EB Garamond', Georgia, serif">
  <title id="fig02-title">The Bastani result &#8212; practice gain versus durable learning</title>
  <desc id="fig02-desc">Grouped bar chart of three conditions (Control, GPT Base, GPT Tutor) on two outcomes (practice performance and unaided exam score). GPT Base practice rises 48 percent above control while exam drops 17 points below. GPT Tutor practice rises 127 percent above control while exam stays at the control level.</desc>

  <defs>
    <marker id="arrow02" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse">
      <path d="M0,0 L10,5 L0,10 z" fill="#2a1a0e"/>
    </marker>
  </defs>

  <rect x="0" y="0" width="700" height="480" fill="#fdfcfb"/>

  <!-- Title -->
  <text x="40" y="40" font-size="22" fill="#2a1a0e">Bastani et al. (2025) &#8212; the wrapper is the variable</text>
  <text x="40" y="62" font-size="13" font-style="italic" fill="#4a4540">Same model. Same students, randomly assigned. Opposite durable outcomes.</text>

  <!-- Legend -->
  <g transform="translate(440,38)">
    <rect x="0" y="0" width="14" height="14" fill="#4a4540"/>
    <text x="20" y="12" font-size="12" fill="#4a4540">Practice (with AI)</text>
    <rect x="120" y="0" width="14" height="14" fill="#2a1a0e"/>
    <text x="140" y="12" font-size="12" fill="#4a4540">Exam (no AI)</text>
  </g>

  <!-- Y axis 0..250 -->
  <line x1="100" y1="100" x2="100" y2="380" stroke="#4a4540" stroke-width="1"/>
  <line x1="100" y1="380" x2="660" y2="380" stroke="#4a4540" stroke-width="1"/>

  <g font-size="11" fill="#8a8480">
    <text x="94" y="384" text-anchor="end">0</text>
    <line x1="100" y1="324" x2="660" y2="324" stroke="#c8c4c0" stroke-dasharray="2 3"/>
    <text x="94" y="328" text-anchor="end">50</text>
    <line x1="100" y1="268" x2="660" y2="268" stroke="#c8c4c0" stroke-dasharray="2 3"/>
    <text x="94" y="272" text-anchor="end">100</text>
    <line x1="100" y1="212" x2="660" y2="212" stroke="#c8c4c0" stroke-dasharray="2 3"/>
    <text x="94" y="216" text-anchor="end">150</text>
    <line x1="100" y1="156" x2="660" y2="156" stroke="#c8c4c0" stroke-dasharray="2 3"/>
    <text x="94" y="160" text-anchor="end">200</text>
    <line x1="100" y1="100" x2="660" y2="100" stroke="#c8c4c0" stroke-dasharray="2 3"/>
    <text x="94" y="104" text-anchor="end">250</text>
  </g>

  <text x="40" y="240" font-size="12" font-style="italic" fill="#4a4540" transform="rotate(-90 40 240)">Score (Control = 100)</text>

  <!-- Reference line at 100 -->
  <line x1="100" y1="268" x2="660" y2="268" stroke="#2a1a0e" stroke-width="1"/>
  <text x="664" y="272" font-size="11" fill="#4a4540">Control = 100</text>

  <!-- Bars: y = 380 - value * 1.12 -->
  <!-- Control 100/100 -->
  <g>
    <rect x="140" y="268" width="44" height="112" fill="#4a4540"/>
    <rect x="190" y="268" width="44" height="112" fill="#2a1a0e"/>
    <text x="162" y="262" font-size="12" fill="#2a1a0e" text-anchor="middle">100</text>
    <text x="212" y="262" font-size="12" fill="#2a1a0e" text-anchor="middle">100</text>
    <text x="187" y="404" font-size="13" fill="#2a1a0e" text-anchor="middle">Control</text>
    <text x="187" y="420" font-size="11" font-style="italic" fill="#8a8480" text-anchor="middle">no AI</text>
  </g>

  <!-- GPT Base 148/83 -->
  <g>
    <rect x="320" y="214.24" width="44" height="165.76" fill="#4a4540"/>
    <rect x="370" y="287.04" width="44" height="92.96" fill="#2a1a0e"/>
    <text x="342" y="208" font-size="12" fill="#2a1a0e" text-anchor="middle">148</text>
    <text x="392" y="281" font-size="12" fill="#2a1a0e" text-anchor="middle">83</text>
    <text x="367" y="404" font-size="13" fill="#2a1a0e" text-anchor="middle">GPT Base</text>
    <text x="367" y="420" font-size="11" font-style="italic" fill="#8a8480" text-anchor="middle">unguarded</text>
  </g>

  <!-- GPT Tutor 227/100 -->
  <g>
    <rect x="500" y="125.76" width="44" height="254.24" fill="#4a4540"/>
    <rect x="550" y="268" width="44" height="112" fill="#2a1a0e"/>
    <text x="522" y="120" font-size="12" fill="#2a1a0e" text-anchor="middle">227</text>
    <text x="572" y="262" font-size="12" fill="#2a1a0e" text-anchor="middle">100</text>
    <text x="547" y="404" font-size="13" fill="#2a1a0e" text-anchor="middle">GPT Tutor</text>
    <text x="547" y="420" font-size="11" font-style="italic" fill="#8a8480" text-anchor="middle">guarded prompt</text>
  </g>

  <!-- Callouts -->
  <g>
    <line x1="392" y1="287" x2="436" y2="338" stroke="#2a1a0e" stroke-width="1" marker-end="url(#arrow02)"/>
    <text x="440" y="336" font-size="11" fill="#2a1a0e">48% practice gain</text>
    <text x="440" y="350" font-size="11" fill="#2a1a0e">&#8594; 17-point exam loss</text>
  </g>
  <g>
    <line x1="522" y1="126" x2="476" y2="92" stroke="#2a1a0e" stroke-width="1" marker-end="url(#arrow02)"/>
    <text x="240" y="88" font-size="11" fill="#2a1a0e">127% practice gain &#8212; no exam loss</text>
  </g>

  <!-- Caption -->
  <text x="40" y="456" font-size="12" font-style="italic" fill="#4a4540">The wrapper changed; the model did not. Performance paradox: in-session gain &#8800; durable learning.</text>
</svg>
