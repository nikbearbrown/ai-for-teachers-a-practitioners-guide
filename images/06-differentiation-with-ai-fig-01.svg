<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 700 420" role="img" aria-labelledby="t06f1 d06f1">
  <title id="t06f1">What the Lexile formula measures, and what it does not</title>
  <desc id="d06f1">An infographic showing two input boxes — average sentence length and average word frequency — feeding into a formula box that outputs a Lexile score. To the right, a callout lists four things the formula does not measure: inferential demand, prior knowledge load, causal structure, abstractness of ideas.</desc>
  <defs>
    <style>
      .ti { font-family: 'EB Garamond', Georgia, 'Times New Roman', serif; font-size: 17px; font-weight: bold; fill: #2a1a0e; }
      .hd { font-family: 'EB Garamond', Georgia, 'Times New Roman', serif; font-size: 13px; font-weight: bold; fill: #2a1a0e; }
      .lb { font-family: 'EB Garamond', Georgia, 'Times New Roman', serif; font-size: 12px; fill: #2a1a0e; }
      .sm { font-family: 'EB Garamond', Georgia, 'Times New Roman', serif; font-size: 11px; fill: #4a4540; }
      .cap { font-family: 'EB Garamond', Georgia, 'Times New Roman', serif; font-size: 11px; font-style: italic; fill: #4a4540; }
      .tile-in { fill: #f5f2ee; stroke: #4a4540; stroke-width: 1; }
      .tile-out { fill: #2a1a0e; }
      .callout-box { fill: #fdfcfb; stroke: #2a1a0e; stroke-width: 1.4; }
      .callout-stripe { fill: #2a1a0e; }
    </style>
    <marker id="arr6a" markerWidth="9" markerHeight="7" refX="8" refY="3.5" orient="auto">
      <polygon points="0 0, 9 3.5, 0 7" fill="#2a1a0e"/>
    </marker>
  </defs>
  <rect width="700" height="420" fill="#fdfcfb"/>

  <text x="350" y="28" text-anchor="middle" class="ti">What the Lexile formula measures &amp; what it does not</text>
  <text x="350" y="46" text-anchor="middle" class="sm">Two surface statistics in. One number out. The judgment lives in the callout.</text>

  <!-- LEFT: two input boxes -->
  <g>
    <rect class="tile-in" x="40" y="100" width="180" height="72"/>
    <text x="130" y="128" text-anchor="middle" class="hd">Average sentence length</text>
    <text x="130" y="148" text-anchor="middle" class="sm">words per sentence —</text>
    <text x="130" y="163" text-anchor="middle" class="sm">longer raises the score</text>

    <rect class="tile-in" x="40" y="200" width="180" height="72"/>
    <text x="130" y="228" text-anchor="middle" class="hd">Average word frequency</text>
    <text x="130" y="248" text-anchor="middle" class="sm">how common the words are —</text>
    <text x="130" y="263" text-anchor="middle" class="sm">rarer raises the score</text>
  </g>

  <!-- arrows into formula -->
  <path d="M 220 136 L 290 184" fill="none" stroke="#2a1a0e" stroke-width="1.2" marker-end="url(#arr6a)"/>
  <path d="M 220 236 L 290 196" fill="none" stroke="#2a1a0e" stroke-width="1.2" marker-end="url(#arr6a)"/>

  <!-- CENTER: formula box -->
  <g>
    <rect class="tile-out" x="295" y="158" width="140" height="64"/>
    <text x="365" y="184" text-anchor="middle" class="hd" fill="#fdfcfb">Lexile score</text>
    <text x="365" y="204" text-anchor="middle" class="sm" fill="#c8c4c0">a single number</text>
  </g>

  <!-- arrow out to callout -->
  <path d="M 435 190 L 480 190" fill="none" stroke="#2a1a0e" stroke-width="1.2" marker-end="url(#arr6a)"/>

  <!-- RIGHT: "does NOT measure" callout -->
  <g>
    <rect class="callout-box" x="488" y="90" width="190" height="200"/>
    <rect class="callout-stripe" x="488" y="90" width="4" height="200"/>
    <text x="500" y="112" class="hd">Does NOT measure</text>
    <line x1="500" y1="122" x2="668" y2="122" stroke="#8a8480" stroke-width="0.6" stroke-dasharray="3 2"/>
    <text x="500" y="146" class="lb">— inferential demand</text>
    <text x="500" y="176" class="lb">— prior knowledge load</text>
    <text x="500" y="206" class="lb">— causal structure</text>
    <text x="500" y="236" class="lb">— abstractness of ideas</text>
    <text x="500" y="268" class="sm">everything that decides whether</text>
    <text x="500" y="282" class="sm">the concept survived</text>
  </g>

  <!-- footer -->
  <line x1="40" y1="340" x2="660" y2="340" stroke="#c8c4c0" stroke-width="0.6"/>
  <text x="350" y="362" text-anchor="middle" class="cap">The formula is what the AI optimizes for.</text>
  <text x="350" y="378" text-anchor="middle" class="cap">The callout is what stays invisible until you ask.</text>
</svg>
