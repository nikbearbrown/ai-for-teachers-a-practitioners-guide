<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 700 420" role="img" aria-labelledby="t1201 d1201">
  <title id="t1201">Tacit-to-explicit knowledge conversion and the decay path</title>
  <desc id="d1201">Three labeled boxes. Tacit knowledge on the left connects through a capture-event arrow to explicit knowledge on the right; a dashed decay arrow loops from tacit knowledge down to a third box labeled closed tab, reinvented next Tuesday. The diagram makes the difference between captured and uncaptured knowledge visible.</desc>
  <defs>
    <style>
      .ti  { font-family: 'EB Garamond', Georgia, 'Times New Roman', serif; font-size: 14px; font-weight: bold; fill: #2a1a0e; }
      .sub { font-family: 'EB Garamond', Georgia, 'Times New Roman', serif; font-size: 11px; font-style: italic; fill: #4a4540; }
      .hd  { font-family: 'EB Garamond', Georgia, 'Times New Roman', serif; font-size: 12px; font-weight: bold; fill: #2a1a0e; }
      .lb  { font-family: 'EB Garamond', Georgia, 'Times New Roman', serif; font-size: 11px; fill: #2a1a0e; }
      .sm  { font-family: 'EB Garamond', Georgia, 'Times New Roman', serif; font-size: 10px; fill: #4a4540; }
      .arr { font-family: 'EB Garamond', Georgia, 'Times New Roman', serif; font-size: 10px; font-style: italic; fill: #2a1a0e; }
      .arrD{ font-family: 'EB Garamond', Georgia, 'Times New Roman', serif; font-size: 10px; font-style: italic; fill: #4a4540; }
      .badge { font-family: 'EB Garamond', Georgia, 'Times New Roman', serif; font-size: 11px; font-weight: bold; fill: #fdfcfb; letter-spacing: 0.4px; }
      .cap { font-family: 'EB Garamond', Georgia, 'Times New Roman', serif; font-size: 11px; fill: #2a1a0e; }
    </style>
    <marker id="arBlk12a" markerWidth="9" markerHeight="7" refX="8" refY="3.5" orient="auto">
      <polygon points="0 0, 9 3.5, 0 7" fill="#2a1a0e"/>
    </marker>
    <marker id="arGry12a" markerWidth="9" markerHeight="7" refX="8" refY="3.5" orient="auto">
      <polygon points="0 0, 9 3.5, 0 7" fill="#4a4540"/>
    </marker>
  </defs>
  <rect width="700" height="420" fill="#fdfcfb"/>

  <text x="32" y="28" class="ti">The capture event decides whether the knowledge survives the closed tab.</text>
  <text x="32" y="44" class="sub">Tacit prompts converted into explicit entries become a reusable asset. Uncaptured, they evaporate.</text>

  <!-- NODE A — Tacit -->
  <rect x="40" y="116" width="170" height="120" fill="#fdfcfb" stroke="#8a8480" stroke-width="1"/>
  <rect x="40" y="116" width="170" height="22" fill="#2a1a0e"/>
  <text x="50" y="132" class="badge">TACIT KNOWLEDGE</text>
  <text x="50" y="156" class="hd">In your head</text>
  <text x="50" y="174" class="sm">— prompt patterns</text>
  <text x="50" y="190" class="sm">— trust judgments</text>
  <text x="50" y="206" class="sm">— phase-gate habits</text>
  <text x="50" y="222" class="sm">— what worked Tuesday</text>

  <!-- arrow A to B with capture label -->
  <line x1="210" y1="176" x2="276" y2="176" stroke="#2a1a0e" stroke-width="1.4" marker-end="url(#arBlk12a)"/>
  <text x="243" y="166" text-anchor="middle" class="arr">capture event</text>
  <text x="243" y="194" text-anchor="middle" class="sm">"the prompt worked — save to workflow.md"</text>

  <!-- NODE B — Explicit -->
  <rect x="284" y="116" width="186" height="120" fill="#f5f2ee" stroke="#8a8480" stroke-width="1"/>
  <rect x="284" y="116" width="186" height="22" fill="#2a1a0e"/>
  <text x="294" y="132" class="badge">EXPLICIT KNOWLEDGE</text>
  <text x="294" y="156" class="hd">In workflow.md</text>
  <text x="294" y="174" class="sm">— organized by task</text>
  <text x="294" y="190" class="sm">— named, parameterized</text>
  <text x="294" y="206" class="sm">— maintained twice a year</text>
  <text x="294" y="222" class="sm">— reusable by future-you</text>

  <!-- arrow B to outcome -->
  <line x1="470" y1="176" x2="540" y2="176" stroke="#2a1a0e" stroke-width="1.4" marker-end="url(#arBlk12a)"/>

  <!-- OUTCOME — works on hard Wednesday -->
  <rect x="544" y="148" width="120" height="56" fill="#fdfcfb" stroke="#2a1a0e" stroke-width="1"/>
  <text x="604" y="172" text-anchor="middle" class="hd">Works on a</text>
  <text x="604" y="188" text-anchor="middle" class="hd">hard Wednesday</text>

  <!-- NODE C — Closed tab (decay) -->
  <rect x="60" y="296" width="220" height="64" fill="#f5f2ee" stroke="#4a4540" stroke-width="1.2" stroke-dasharray="4 4"/>
  <text x="170" y="318" text-anchor="middle" class="hd">Closed tab</text>
  <text x="170" y="336" text-anchor="middle" class="arrD">reinvented next Tuesday</text>
  <text x="170" y="352" text-anchor="middle" class="sm">written from scratch, slightly worse</text>

  <!-- dashed decay arrow A to C -->
  <path d="M 124 236 Q 124 270 124 296" fill="none" stroke="#4a4540" stroke-width="1.2" stroke-dasharray="4 4" marker-end="url(#arGry12a)"/>
  <text x="142" y="270" class="arrD">no capture</text>

  <!-- comparison arrow to side -->
  <line x1="288" y1="320" x2="540" y2="320" stroke="#8a8480" stroke-width="1" stroke-dasharray="3 3"/>
  <text x="414" y="312" text-anchor="middle" class="sm">same teacher, same talent, different infrastructure</text>

  <!-- Caption -->
  <line x1="32" y1="380" x2="668" y2="380" stroke="#c8c4c0" stroke-width="1"/>
  <text x="32" y="398" class="cap">The library is the difference between knowledge that compounds and knowledge that evaporates.</text>
</svg>
