<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 700 480" role="img" aria-labelledby="f1-title f1-desc" font-family="'EB Garamond', Garamond, Georgia, serif">
  <title id="f1-title">Same six-teacher data, two charts: truncated axis versus zero baseline</title>
  <desc id="f1-desc">Two side-by-side bar charts of the same six teacher means. The left chart truncates the y-axis at 70 and visually exaggerates differences; the right chart starts at zero and shows the six classes cluster tightly within seven points.</desc>
  <defs>
    <marker id="f1-arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M0,0 L10,5 L0,10 z" fill="#2a1a0e"/>
    </marker>
  </defs>

  <rect x="0" y="0" width="700" height="480" fill="#fdfcfb"/>

  <text x="350" y="32" text-anchor="middle" font-size="20" fill="#2a1a0e">Same data, two stories</text>
  <text x="350" y="52" text-anchor="middle" font-size="13" fill="#4a4540" font-style="italic">Six teachers, same course. The axis decides what the reader sees.</text>

  <!-- LEFT panel: truncated axis -->
  <g transform="translate(40,80)">
    <text x="140" y="0" text-anchor="middle" font-size="14" fill="#2a1a0e">y-axis starts at 70 (default)</text>
    <text x="140" y="18" text-anchor="middle" font-size="11" fill="#8a8480" font-style="italic">Sandoval looks like he is failing</text>

    <line x1="40" y1="40" x2="40" y2="280" stroke="#4a4540" stroke-width="1"/>
    <line x1="40" y1="280" x2="280" y2="280" stroke="#4a4540" stroke-width="1"/>
    <g font-size="10" fill="#4a4540">
      <text x="34" y="282" text-anchor="end">70</text>
      <text x="34" y="234" text-anchor="end">72</text>
      <text x="34" y="186" text-anchor="end">74</text>
      <text x="34" y="138" text-anchor="end">76</text>
      <text x="34" y="90" text-anchor="end">78</text>
      <text x="34" y="44" text-anchor="end">80</text>
    </g>
    <g stroke="#c8c4c0" stroke-width="0.5">
      <line x1="40" y1="232" x2="280" y2="232"/>
      <line x1="40" y1="184" x2="280" y2="184"/>
      <line x1="40" y1="136" x2="280" y2="136"/>
      <line x1="40" y1="88" x2="280" y2="88"/>
      <line x1="40" y1="40" x2="280" y2="40"/>
    </g>

    <rect x="55"  y="83.2"  width="30" height="196.8" fill="#2a1a0e"/>
    <rect x="92"  y="116.8" width="30" height="163.2" fill="#2a1a0e"/>
    <rect x="129" y="152.8" width="30" height="127.2" fill="#2a1a0e"/>
    <rect x="166" y="181.6" width="30" height="98.4"  fill="#2a1a0e"/>
    <rect x="203" y="193.6" width="30" height="86.4"  fill="#2a1a0e"/>
    <rect x="240" y="246.4" width="30" height="33.6"  fill="#2a1a0e"/>

    <g font-size="9" fill="#4a4540" text-anchor="middle">
      <text x="70"  y="295">Adams</text>
      <text x="107" y="295">Brennan</text>
      <text x="144" y="295">Connor</text>
      <text x="181" y="295">Diaz</text>
      <text x="218" y="295">Edelstein</text>
      <text x="255" y="295">Sandoval</text>
    </g>

    <text x="140" y="318" text-anchor="middle" font-size="11" fill="#4a4540" font-style="italic">Visual ratio Adams : Sandoval &#8776; 6 to 1</text>
    <text x="140" y="334" text-anchor="middle" font-size="11" fill="#4a4540" font-style="italic">Actual ratio 78.2 / 71.4 &#8776; 1.1 to 1</text>
    <line x1="290" y1="170" x2="320" y2="170" stroke="#2a1a0e" stroke-width="1.2" marker-end="url(#f1-arrow)"/>
  </g>

  <!-- RIGHT panel: zero baseline -->
  <g transform="translate(380,80)">
    <text x="140" y="0" text-anchor="middle" font-size="14" fill="#2a1a0e">y-axis starts at 0 (corrected)</text>
    <text x="140" y="18" text-anchor="middle" font-size="11" fill="#8a8480" font-style="italic">Six classes cluster within 7 points</text>

    <line x1="40" y1="40" x2="40" y2="280" stroke="#4a4540" stroke-width="1"/>
    <line x1="40" y1="280" x2="280" y2="280" stroke="#4a4540" stroke-width="1"/>
    <g font-size="10" fill="#4a4540">
      <text x="34" y="282" text-anchor="end">0</text>
      <text x="34" y="234" text-anchor="end">20</text>
      <text x="34" y="186" text-anchor="end">40</text>
      <text x="34" y="138" text-anchor="end">60</text>
      <text x="34" y="90" text-anchor="end">80</text>
      <text x="34" y="44" text-anchor="end">100</text>
    </g>
    <g stroke="#c8c4c0" stroke-width="0.5">
      <line x1="40" y1="232" x2="280" y2="232"/>
      <line x1="40" y1="184" x2="280" y2="184"/>
      <line x1="40" y1="136" x2="280" y2="136"/>
      <line x1="40" y1="88" x2="280" y2="88"/>
      <line x1="40" y1="40" x2="280" y2="40"/>
    </g>

    <rect x="55"  y="92.32"  width="30" height="187.68" fill="#2a1a0e"/>
    <rect x="92"  y="95.68"  width="30" height="184.32" fill="#2a1a0e"/>
    <rect x="129" y="99.28"  width="30" height="180.72" fill="#2a1a0e"/>
    <rect x="166" y="102.16" width="30" height="177.84" fill="#2a1a0e"/>
    <rect x="203" y="103.36" width="30" height="176.64" fill="#2a1a0e"/>
    <rect x="240" y="108.64" width="30" height="171.36" fill="#2a1a0e"/>

    <line x1="40" y1="112" x2="280" y2="112" stroke="#4a4540" stroke-width="1" stroke-dasharray="4 3"/>
    <text x="278" y="108" text-anchor="end" font-size="10" fill="#4a4540">Proficiency benchmark = 70</text>

    <g font-size="9" fill="#4a4540" text-anchor="middle">
      <text x="70"  y="295">Adams</text>
      <text x="107" y="295">Brennan</text>
      <text x="144" y="295">Connor</text>
      <text x="181" y="295">Diaz</text>
      <text x="218" y="295">Edelstein</text>
      <text x="255" y="295">Sandoval</text>
    </g>

    <text x="140" y="318" text-anchor="middle" font-size="11" fill="#4a4540" font-style="italic">All six above benchmark; range = 6.8 points</text>
    <text x="140" y="334" text-anchor="middle" font-size="11" fill="#4a4540" font-style="italic">Visual ratio matches the data</text>
  </g>

  <text x="350" y="460" text-anchor="middle" font-size="11" fill="#8a8480" font-style="italic">Tufte&apos;s proportional-ink rule: bar length encodes (value &#8722; baseline). Truncated baselines distort the encoding.</text>
</svg>
