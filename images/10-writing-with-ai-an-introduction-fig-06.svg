<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 760 480" role="img" aria-labelledby="fig06-title fig06-desc" font-family="'EB Garamond', Garamond, Georgia, serif">
  <title id="fig06-title">Three instructional uses of AI in writing</title>
  <desc id="fig06-desc">A three-column table contrasting Socratic AI, Feedback AI, and Elaboration AI by what the student supplies, what the model does, where cognitive work remains, and the typical failure mode.</desc>

  <rect x="0" y="0" width="760" height="480" fill="#fdfcfb"/>

  <text x="380" y="34" text-anchor="middle" font-size="20" fill="#2a1a0e">AI in the process, not in the product</text>
  <text x="380" y="56" text-anchor="middle" font-size="13" font-style="italic" fill="#4a4540">Three prompt patterns that keep the cognitive work with the student</text>

  <!-- Column dividers -->
  <line x1="220" y1="84" x2="220" y2="440" stroke="#8a8480" stroke-width="1"/>
  <line x1="400" y1="84" x2="400" y2="440" stroke="#8a8480" stroke-width="1"/>
  <line x1="580" y1="84" x2="580" y2="440" stroke="#8a8480" stroke-width="1"/>

  <!-- Header row -->
  <rect x="40" y="84" width="680" height="44" fill="#f5f2ee" stroke="#8a8480" stroke-width="1"/>
  <text x="130" y="112" text-anchor="middle" font-size="13" font-style="italic" fill="#4a4540">Dimension</text>
  <text x="310" y="112" text-anchor="middle" font-size="16" fill="#2a1a0e">Socratic AI</text>
  <text x="490" y="112" text-anchor="middle" font-size="16" fill="#2a1a0e">Feedback AI</text>
  <text x="650" y="112" text-anchor="middle" font-size="16" fill="#2a1a0e">Elaboration AI</text>

  <!-- Row 1: Student input -->
  <line x1="40" y1="128" x2="720" y2="128" stroke="#8a8480" stroke-width="1"/>
  <text x="130" y="158" text-anchor="middle" font-size="13" fill="#2a1a0e">Student supplies</text>
  <text x="130" y="176" text-anchor="middle" font-size="11" font-style="italic" fill="#8a8480">input to model</text>
  <text x="310" y="158" text-anchor="middle" font-size="13" fill="#2a1a0e">a working thesis</text>
  <text x="310" y="178" text-anchor="middle" font-size="11" font-style="italic" fill="#4a4540">"I'm arguing that X"</text>
  <text x="490" y="158" text-anchor="middle" font-size="13" fill="#2a1a0e">a drafted paragraph</text>
  <text x="490" y="178" text-anchor="middle" font-size="11" font-style="italic" fill="#4a4540">already written</text>
  <text x="650" y="158" text-anchor="middle" font-size="13" fill="#2a1a0e">an underdeveloped idea</text>
  <text x="650" y="178" text-anchor="middle" font-size="11" font-style="italic" fill="#4a4540">gestured at, not made</text>

  <!-- Row 2: Model behavior -->
  <line x1="40" y1="196" x2="720" y2="196" stroke="#8a8480" stroke-width="1"/>
  <text x="130" y="226" text-anchor="middle" font-size="13" fill="#2a1a0e">Model behavior</text>
  <text x="130" y="244" text-anchor="middle" font-size="11" font-style="italic" fill="#8a8480">what it does</text>
  <text x="310" y="226" text-anchor="middle" font-size="13" fill="#2a1a0e">asks, never answers</text>
  <text x="310" y="246" text-anchor="middle" font-size="11" font-style="italic" fill="#4a4540">three hostile-reader questions</text>
  <text x="490" y="226" text-anchor="middle" font-size="13" fill="#2a1a0e">marks the moves</text>
  <text x="490" y="246" text-anchor="middle" font-size="11" font-style="italic" fill="#4a4540">analysis vs. restatement vs. decoration</text>
  <text x="650" y="226" text-anchor="middle" font-size="13" fill="#2a1a0e">names what's missing</text>
  <text x="650" y="246" text-anchor="middle" font-size="11" font-style="italic" fill="#4a4540">"the next sentence must..."</text>

  <!-- Row 3: residual cognition -->
  <line x1="40" y1="264" x2="720" y2="264" stroke="#8a8480" stroke-width="1"/>
  <text x="130" y="294" text-anchor="middle" font-size="13" fill="#2a1a0e">Residual cognition</text>
  <text x="130" y="312" text-anchor="middle" font-size="11" font-style="italic" fill="#8a8480">what stays with student</text>
  <text x="310" y="294" text-anchor="middle" font-size="13" fill="#2a1a0e">formulate the defense</text>
  <text x="310" y="314" text-anchor="middle" font-size="11" font-style="italic" fill="#4a4540">Flower-Hayes planning move</text>
  <text x="490" y="294" text-anchor="middle" font-size="13" fill="#2a1a0e">decide what to revise</text>
  <text x="490" y="314" text-anchor="middle" font-size="11" font-style="italic" fill="#4a4540">Sommers 1982 at scale</text>
  <text x="650" y="294" text-anchor="middle" font-size="13" fill="#2a1a0e">write the missing sentence</text>
  <text x="650" y="314" text-anchor="middle" font-size="11" font-style="italic" fill="#4a4540">argument-completion</text>

  <!-- Row 4: failure mode -->
  <line x1="40" y1="332" x2="720" y2="332" stroke="#8a8480" stroke-width="1"/>
  <text x="130" y="362" text-anchor="middle" font-size="13" fill="#2a1a0e">Failure mode</text>
  <text x="130" y="380" text-anchor="middle" font-size="11" font-style="italic" fill="#8a8480">how it breaks</text>
  <text x="310" y="362" text-anchor="middle" font-size="13" fill="#2a1a0e">re-prompted as drafter</text>
  <text x="310" y="382" text-anchor="middle" font-size="11" font-style="italic" fill="#4a4540">"never mind the Socratic thing"</text>
  <text x="490" y="362" text-anchor="middle" font-size="13" fill="#2a1a0e">slides into rewriting</text>
  <text x="490" y="382" text-anchor="middle" font-size="11" font-style="italic" fill="#4a4540">model offers replacement prose</text>
  <text x="650" y="362" text-anchor="middle" font-size="13" fill="#2a1a0e">writes the sentence for them</text>
  <text x="650" y="382" text-anchor="middle" font-size="11" font-style="italic" fill="#4a4540">prompt drift to ghostwriting</text>

  <!-- Bottom border -->
  <line x1="40" y1="400" x2="720" y2="400" stroke="#8a8480" stroke-width="1"/>
  <rect x="40" y="84" width="680" height="316" fill="none" stroke="#2a1a0e" stroke-width="1.2"/>

  <text x="380" y="442" text-anchor="middle" font-size="13" font-style="italic" fill="#2a1a0e">In all three patterns, the artifact the student turns in is still the student's draft.</text>
  <text x="380" y="464" text-anchor="middle" font-size="12" font-style="italic" fill="#4a4540">Don't police prompts. Make the underlying assignment AI-survivable.</text>
</svg>
