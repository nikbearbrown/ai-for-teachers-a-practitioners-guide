<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 700 480" role="img" aria-labelledby="t05-4 d05-4">
  <title id="t05-4">Bastani — practice gains, exam losses</title>
  <desc id="d05-4">Three grouped bar pairs for the Bastani 2025 experiment. Each pair shows practice performance (light bar) and unaided exam score (dark bar) indexed so the control practice value equals 100. GPT Base practice rises about 48 percent over control, but the GPT Base exam falls 17 percent below the control exam. GPT Tutor closes most but not all of that gap.</desc>
  <defs>
    <marker id="arr-4" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto">
      <path d="M0,0 L10,5 L0,10 z" fill="#4a4540"/>
    </marker>
    <style>
      .ti { font-family: 'EB Garamond', Georgia, 'Times New Roman', serif; font-size: 16px; font-weight: bold; fill: #2a1a0e; }
      .sub { font-family: 'EB Garamond', Georgia, 'Times New Roman', serif; font-size: 11px; font-style: italic; fill: #4a4540; }
      .axis { font-family: 'EB Garamond', Georgia, 'Times New Roman', serif; font-size: 10px; fill: #4a4540; }
      .grp { font-family: 'EB Garamond', Georgia, 'Times New Roman', serif; font-size: 12px; font-weight: bold; fill: #2a1a0e; }
      .val { font-family: 'EB Garamond', Georgia, 'Times New Roman', serif; font-size: 11px; font-weight: bold; fill: #2a1a0e; }
      .val-on-dark { font-family: 'EB Garamond', Georgia, 'Times New Roman', serif; font-size: 11px; font-weight: bold; fill: #fdfcfb; }
      .legend { font-family: 'EB Garamond', Georgia, 'Times New Roman', serif; font-size: 11px; fill: #2a1a0e; }
      .call { font-family: 'EB Garamond', Georgia, 'Times New Roman', serif; font-size: 11px; font-style: italic; fill: #4a4540; }
      .cap { font-family: 'EB Garamond', Georgia, 'Times New Roman', serif; font-size: 11px; font-style: italic; fill: #4a4540; }
      .source { font-family: 'EB Garamond', Georgia, 'Times New Roman', serif; font-size: 10px; fill: #8a8480; letter-spacing: 0.4px; }
    </style>
  </defs>
  <rect width="700" height="480" fill="#fdfcfb"/>

  <text x="32" y="28" class="ti">Bastani — practice gains, exam losses</text>
  <text x="32" y="46" class="sub">Turkish high-school math, ~1,000 students. Practice with AI rises; unaided exam falls.</text>

  <!-- Legend -->
  <rect x="430" y="62" width="14" height="10" fill="#c8c4c0" stroke="#4a4540" stroke-width="0.6"/>
  <text x="450" y="71" class="legend">Practice (with AI)</text>
  <rect x="560" y="62" width="14" height="10" fill="#2a1a0e"/>
  <text x="580" y="71" class="legend">Unaided exam</text>

  <!-- Chart area -->
  <!-- Y axis -->
  <line x1="80" y1="100" x2="80" y2="360" stroke="#4a4540" stroke-width="1"/>
  <!-- X axis -->
  <line x1="80" y1="360" x2="660" y2="360" stroke="#4a4540" stroke-width="1"/>

  <!-- Gridlines / y-axis ticks -->
  <line x1="80" y1="100" x2="660" y2="100" stroke="#c8c4c0" stroke-width="0.6" stroke-dasharray="3 3"/>
  <line x1="80" y1="160" x2="660" y2="160" stroke="#c8c4c0" stroke-width="0.6" stroke-dasharray="3 3"/>
  <line x1="80" y1="220" x2="660" y2="220" stroke="#c8c4c0" stroke-width="0.6" stroke-dasharray="3 3"/>
  <line x1="80" y1="280" x2="660" y2="280" stroke="#c8c4c0" stroke-width="0.6" stroke-dasharray="3 3"/>

  <text x="74" y="103" text-anchor="end" class="axis">200</text>
  <text x="74" y="163" text-anchor="end" class="axis">175</text>
  <text x="74" y="223" text-anchor="end" class="axis">150</text>
  <text x="74" y="283" text-anchor="end" class="axis">125</text>
  <text x="74" y="343" text-anchor="end" class="axis">100</text>
  <text x="74" y="363" text-anchor="end" class="axis">0</text>

  <text x="36" y="230" class="axis" transform="rotate(-90 36 230)" text-anchor="middle">index (control practice = 100)</text>

  <!-- Reference line at 100 (control practice baseline) -->
  <line x1="80" y1="340" x2="660" y2="340" stroke="#4a4540" stroke-width="0.8" stroke-dasharray="6 4"/>
  <text x="664" y="343" class="axis">control = 100</text>

  <!-- Bars: y from 340 (100) going up; scale: 60px per 25pts so 360 baseline at 0 doesn't matter; use 340-y -->
  <!-- Helper: y100=340, y148=340-115.2=224.8, y227=340-304.8=35.2 — but capped at 100 ceiling y=100 (=200). Adjust scale: 1 unit = 240/200 = 1.2px from y=340 going up. So height per index: (340-100)/200 = 1.2. y= 340 - val*1.2 -->
  <!-- Control: practice=100 (y=220), exam=100 (y=220) -->
  <!-- Group 1: Control -->
  <text x="180" y="392" text-anchor="middle" class="grp">Control (no AI)</text>
  <text x="180" y="408" text-anchor="middle" class="cap">baseline practice and exam</text>
  <rect x="130" y="220" width="48" height="120" fill="#c8c4c0" stroke="#4a4540" stroke-width="0.6"/>
  <rect x="182" y="220" width="48" height="120" fill="#2a1a0e"/>
  <text x="154" y="214" text-anchor="middle" class="val">100</text>
  <text x="206" y="214" text-anchor="middle" class="val">100</text>

  <!-- Group 2: GPT Base — practice 148 (y=340-177.6=162.4), exam 83 (y=340-99.6=240.4) -->
  <text x="370" y="392" text-anchor="middle" class="grp">GPT Base (unscaffolded)</text>
  <text x="370" y="408" text-anchor="middle" class="cap">practice up 48% — exam down 17%</text>
  <rect x="320" y="162.4" width="48" height="177.6" fill="#c8c4c0" stroke="#4a4540" stroke-width="0.6"/>
  <rect x="372" y="240.4" width="48" height="99.6" fill="#2a1a0e"/>
  <text x="344" y="156" text-anchor="middle" class="val">148</text>
  <text x="396" y="234" text-anchor="middle" class="val">83</text>

  <!-- Group 3: GPT Tutor — practice 227 (y=340-272.4=67.6), exam ~96 (y=340-115.2=224.8) -->
  <text x="560" y="392" text-anchor="middle" class="grp">GPT Tutor (Socratic)</text>
  <text x="560" y="408" text-anchor="middle" class="cap">practice up 127% — exam mostly recovers</text>
  <rect x="510" y="106" width="48" height="234" fill="#c8c4c0" stroke="#4a4540" stroke-width="0.6"/>
  <rect x="562" y="224.8" width="48" height="115.2" fill="#2a1a0e"/>
  <text x="534" y="100" text-anchor="middle" class="val">227</text>
  <text x="586" y="219" text-anchor="middle" class="val">96</text>

  <!-- Callout: 17% reduction between control exam and GPT Base exam -->
  <path d="M230,205 L300,205" stroke="#4a4540" stroke-width="1" marker-end="url(#arr-4)"/>
  <text x="265" y="200" text-anchor="middle" class="call">–17% on unaided exam</text>

  <!-- Footer -->
  <line x1="32" y1="430" x2="668" y2="430" stroke="#c8c4c0" stroke-width="1"/>
  <text x="32" y="450" class="cap">The artifact improved. The learning did not. Same model, different gate location.</text>
  <text x="32" y="466" class="source">SOURCE — BASTANI ET AL. 2025, PNAS 122(26)</text>
</svg>
