<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 700 460" role="img" aria-labelledby="t32 d32">
  <title id="t32">The four-component prompt card — role, context, task, constraints</title>
  <desc id="d32">A laminated-card-style reference showing the four-component prompt template. On the left, a stacked card lists ROLE, CONTEXT, TASK, and CONSTRAINTS with example slot text. Ochre callouts on the right name the structural work each line performs.</desc>
  <defs>
    <style>
      .ti { font-family: 'EB Garamond', Georgia, 'Times New Roman', serif; font-size: 14px; font-weight: bold; fill: #2a1a0e; }
      .sub { font-family: 'EB Garamond', Georgia, 'Times New Roman', serif; font-size: 10px; fill: #4a4540; }
      .key { font-family: 'EB Garamond', Georgia, 'Times New Roman', serif; font-size: 12px; font-weight: bold; fill: #2a1a0e; letter-spacing: 0.5px; }
      .slot { font-family: 'EB Garamond', Georgia, 'Times New Roman', serif; font-size: 11px; fill: #4a4540; font-style: italic; }
      .work { font-family: 'EB Garamond', Georgia, 'Times New Roman', serif; font-size: 11px; font-weight: bold; fill: #C8860E; }
      .workSub { font-family: 'EB Garamond', Georgia, 'Times New Roman', serif; font-size: 10px; fill: #4a4540; }
      .cap { font-family: 'EB Garamond', Georgia, 'Times New Roman', serif; font-size: 10px; font-style: italic; fill: #4a4540; }
    </style>
    <marker id="ar1" markerWidth="8" markerHeight="6" refX="7" refY="3" orient="auto">
      <polygon points="0 0, 8 3, 0 6" fill="#C8860E"/>
    </marker>
  </defs>
  <rect width="700" height="460" fill="#fdfcfb"/>

  <text x="32" y="28" class="ti">The four-component prompt card</text>
  <text x="32" y="44" class="sub">After thirty prompts the moves become reflex. Each line does distinct structural work.</text>

  <!-- Left card -->
  <rect x="32" y="68" width="300" height="356" fill="#ffffff" stroke="#2a1a0e" stroke-width="1"/>

  <!-- ROLE row -->
  <text x="48" y="100" class="key">ROLE</text>
  <text x="48" y="120" class="slot">You are a veteran 8th-grade</text>
  <text x="48" y="136" class="slot">U.S. History teacher.</text>
  <line x1="48" y1="152" x2="316" y2="152" stroke="#c8c4c0" stroke-width="1"/>

  <!-- CONTEXT row -->
  <text x="48" y="172" class="key">CONTEXT</text>
  <text x="48" y="192" class="slot">8th grade, causes of the</text>
  <text x="48" y="208" class="slot">Revolution. Class read</text>
  <text x="48" y="224" class="slot">three of five causes.</text>
  <line x1="48" y1="240" x2="316" y2="240" stroke="#c8c4c0" stroke-width="1"/>

  <!-- TASK row -->
  <text x="48" y="260" class="key">TASK</text>
  <text x="48" y="280" class="slot">Eight multiple-choice items,</text>
  <text x="48" y="296" class="slot">four choices each, one per</text>
  <text x="48" y="312" class="slot">cause. Numbered Markdown.</text>
  <line x1="48" y1="328" x2="316" y2="328" stroke="#c8c4c0" stroke-width="1"/>

  <!-- CONSTRAINTS row -->
  <text x="48" y="348" class="key">CONSTRAINTS</text>
  <text x="48" y="368" class="slot">6th-grade reading level.</text>
  <text x="48" y="384" class="slot">No date-recall items.</text>
  <text x="48" y="400" class="slot">One misconception distractor</text>
  <text x="48" y="416" class="slot">per item.</text>

  <!-- Right callouts with arrows pointing to each row -->
  <!-- ROLE callout -->
  <line x1="332" y1="110" x2="380" y2="110" stroke="#C8860E" stroke-width="1" marker-end="url(#ar1)"/>
  <text x="392" y="106" class="work">Selects a corpus region</text>
  <text x="392" y="122" class="workSub">vocabulary, pacing, pedagogical instinct</text>
  <text x="392" y="138" class="workSub">— the part the model can lean on</text>

  <!-- CONTEXT callout -->
  <line x1="332" y1="200" x2="380" y2="200" stroke="#C8860E" stroke-width="1" marker-end="url(#ar1)"/>
  <text x="392" y="196" class="work">Lands the output in your room</text>
  <text x="392" y="212" class="workSub">grade, standard, class profile</text>
  <text x="392" y="228" class="workSub">— most under-supplied by teachers</text>

  <!-- TASK callout -->
  <line x1="332" y1="290" x2="380" y2="290" stroke="#C8860E" stroke-width="1" marker-end="url(#ar1)"/>
  <text x="392" y="286" class="work">Specifies the deliverable</text>
  <text x="392" y="302" class="workSub">format, length, quality criteria</text>
  <text x="392" y="318" class="workSub">— what the model can execute and verify</text>

  <!-- CONSTRAINTS callout -->
  <line x1="332" y1="378" x2="380" y2="378" stroke="#C8860E" stroke-width="1" marker-end="url(#ar1)"/>
  <text x="392" y="374" class="work">Names what to avoid</text>
  <text x="392" y="390" class="workSub">few, sharp, paired with positive direction</text>
  <text x="392" y="406" class="workSub">— three well-chosen beat fifteen scattered</text>

  <!-- Footer caption -->
  <text x="32" y="444" class="cap">Role · Context · Task · Constraints — invisible after thirty prompts, durable across model generations.</text>
</svg>
