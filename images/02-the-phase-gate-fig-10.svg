<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 700 420" role="img" aria-labelledby="t10 d10">
  <title id="t10">Gate 1 time-cost comparison</title>
  <desc id="d10">Two stacked horizontal bars compare rubric calibration with and without a gate. The top bar (no gate) shows zero upfront, then a long block for three to five hours of essay-by-essay second-guessing, with a hatched late-stage block for unwinding a discovered bias. The bottom bar (with gate) shows 25 minutes upfront, then the bulk pass running cleanly.</desc>
  <defs>
    <style>
      .ti { font-family: 'EB Garamond', Georgia, 'Times New Roman', serif; font-size: 16px; font-weight: bold; fill: #2a1a0e; }
      .sub { font-family: 'EB Garamond', Georgia, 'Times New Roman', serif; font-size: 11px; fill: #4a4540; }
      .head { font-family: 'EB Garamond', Georgia, 'Times New Roman', serif; font-size: 12px; font-weight: bold; fill: #2a1a0e; }
      .lb { font-family: 'EB Garamond', Georgia, 'Times New Roman', serif; font-size: 11px; fill: #2a1a0e; }
      .sm { font-family: 'EB Garamond', Georgia, 'Times New Roman', serif; font-size: 10px; fill: #4a4540; }
      .val { font-family: 'EB Garamond', Georgia, 'Times New Roman', serif; font-size: 11px; fill: #fdfcfb; }
      .cap { font-family: 'EB Garamond', Georgia, 'Times New Roman', serif; font-size: 11px; font-style: italic; fill: #4a4540; }
    </style>
    <pattern id="hatch10" patternUnits="userSpaceOnUse" width="6" height="6" patternTransform="rotate(45)">
      <line x1="0" y1="0" x2="0" y2="6" stroke="#4a4540" stroke-width="1.4"/>
    </pattern>
  </defs>
  <rect width="700" height="420" fill="#fdfcfb"/>

  <text x="32" y="34" class="ti">Gate 1: 25 minutes saves three to five hours</text>
  <text x="32" y="52" class="sub">Time-cost of rubric calibration. Same teacher, same bulk grade, two workflows.</text>

  <!-- Time axis: 0..5 hours -->
  <line x1="180" y1="84" x2="660" y2="84" stroke="#4a4540" stroke-width="1"/>
  <text x="180" y="76" text-anchor="middle" class="sm">0</text>
  <text x="276" y="76" text-anchor="middle" class="sm">1 hr</text>
  <text x="372" y="76" text-anchor="middle" class="sm">2 hr</text>
  <text x="468" y="76" text-anchor="middle" class="sm">3 hr</text>
  <text x="564" y="76" text-anchor="middle" class="sm">4 hr</text>
  <text x="660" y="76" text-anchor="middle" class="sm">5 hr</text>

  <!-- ticks -->
  <g stroke="#8a8480" stroke-width="0.5">
    <line x1="276" y1="80" x2="276" y2="88"/>
    <line x1="372" y1="80" x2="372" y2="88"/>
    <line x1="468" y1="80" x2="468" y2="88"/>
    <line x1="564" y1="80" x2="564" y2="88"/>
  </g>

  <!-- BAR 1: No gate -->
  <text x="32" y="140" class="head">Without the gate</text>
  <text x="32" y="156" class="sm">Skip calibration; bulk grade; then re-check.</text>

  <!-- Bulk pass: 0 -> ~25 min == 40 px -->
  <rect x="180" y="170" width="40" height="32" fill="#8a8480"/>
  <text x="200" y="190" text-anchor="middle" class="val">bulk</text>

  <!-- Per-essay second-guessing 3-5 hrs -->
  <rect x="220" y="170" width="384" height="32" fill="#4a4540"/>
  <text x="412" y="190" text-anchor="middle" class="val">3&#8211;5 hr essay-by-essay second-guessing</text>

  <!-- Late discovery bias unwinding (hatched) -->
  <rect x="604" y="170" width="56" height="32" fill="url(#hatch10)" stroke="#2a1a0e" stroke-width="1"/>
  <text x="632" y="216" text-anchor="middle" class="sm">bias discovery,</text>
  <text x="632" y="228" text-anchor="middle" class="sm">4 weeks later</text>

  <!-- BAR 2: With gate -->
  <text x="32" y="278" class="head">With the gate</text>
  <text x="32" y="294" class="sm">25 min calibrate on 5; bulk grade proceeds.</text>

  <!-- Calibration: 25 min ~= 40 px, darker -->
  <rect x="180" y="308" width="40" height="32" fill="#2a1a0e"/>
  <text x="200" y="328" text-anchor="middle" class="val">25 min</text>
  <text x="200" y="354" text-anchor="middle" class="sm">calibration</text>

  <!-- Bulk pass clean: ~30 min -->
  <rect x="220" y="308" width="44" height="32" fill="#8a8480"/>
  <text x="242" y="328" text-anchor="middle" class="val">bulk</text>

  <!-- Recovered time band -->
  <rect x="264" y="316" width="340" height="16" fill="#f5f2ee" stroke="#8a8480" stroke-width="0.5" stroke-dasharray="3 3"/>
  <text x="434" y="328" text-anchor="middle" class="sm">time recovered (3&#8211;5 hr) &#8212; the bulk pass does not need re-checking</text>

  <text x="350" y="394" text-anchor="middle" class="cap">Cognitively dense time concentrated in five essays beats cognitively wasteful time spread across 120.</text>
</svg>
