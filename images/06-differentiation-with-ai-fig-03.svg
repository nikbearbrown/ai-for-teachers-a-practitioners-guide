<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 700 420" role="img" aria-labelledby="t06f3 d06f3">
  <title id="t06f3">The IEP and 504 phase gate</title>
  <desc id="d06f3">A single-row flow diagram with three rectangular nodes: AI proposes, Licensed specialist and team authorize, Teacher implements. Solid arrows connect them left to right. Below the row, a dashed shortcut arrow goes from node 1 directly to node 3, crossed with an X and labeled "skips legal authorization and clinical judgment."</desc>
  <defs>
    <style>
      .ti { font-family: 'EB Garamond', Georgia, 'Times New Roman', serif; font-size: 17px; font-weight: bold; fill: #2a1a0e; }
      .hd { font-family: 'EB Garamond', Georgia, 'Times New Roman', serif; font-size: 13px; font-weight: bold; fill: #2a1a0e; }
      .lb { font-family: 'EB Garamond', Georgia, 'Times New Roman', serif; font-size: 12px; fill: #2a1a0e; }
      .sm { font-family: 'EB Garamond', Georgia, 'Times New Roman', serif; font-size: 11px; fill: #4a4540; }
      .cap { font-family: 'EB Garamond', Georgia, 'Times New Roman', serif; font-size: 11px; font-style: italic; fill: #4a4540; }
      .tile-node { fill: #f5f2ee; stroke: #4a4540; stroke-width: 1; }
      .tile-gate { fill: #fdfcfb; stroke: #2a1a0e; stroke-width: 1.4; }
      .gate-stripe { fill: #2a1a0e; }
      .step-num { font-family: 'EB Garamond', Georgia, 'Times New Roman', serif; font-size: 11px; font-weight: bold; fill: #8a8480; letter-spacing: 0.5px; }
      .shortcut-text { font-family: 'EB Garamond', Georgia, 'Times New Roman', serif; font-size: 11px; font-weight: bold; fill: #2a1a0e; }
    </style>
    <marker id="arr6c" markerWidth="9" markerHeight="7" refX="8" refY="3.5" orient="auto">
      <polygon points="0 0, 9 3.5, 0 7" fill="#2a1a0e"/>
    </marker>
    <marker id="arr6cgray" markerWidth="9" markerHeight="7" refX="8" refY="3.5" orient="auto">
      <polygon points="0 0, 9 3.5, 0 7" fill="#8a8480"/>
    </marker>
  </defs>
  <rect width="700" height="420" fill="#fdfcfb"/>

  <text x="350" y="30" text-anchor="middle" class="ti">The IEP and 504 phase gate</text>
  <text x="350" y="50" text-anchor="middle" class="sm">AI proposes. The team authorizes. The teacher implements what the team authorized.</text>

  <!-- step labels above each node -->
  <text x="115" y="86" text-anchor="middle" class="step-num">STEP 1</text>
  <text x="350" y="86" text-anchor="middle" class="step-num">STEP 2 — THE GATE</text>
  <text x="585" y="86" text-anchor="middle" class="step-num">STEP 3</text>

  <!-- NODE 1: AI proposes -->
  <g>
    <rect class="tile-node" x="30" y="98" width="170" height="120"/>
    <text x="115" y="124" text-anchor="middle" class="hd">AI proposes</text>
    <line x1="50" y1="134" x2="180" y2="134" stroke="#c8c4c0" stroke-width="0.6"/>
    <text x="115" y="156" text-anchor="middle" class="sm">from anonymized profile,</text>
    <text x="115" y="172" text-anchor="middle" class="sm">suggests accommodations</text>
    <text x="115" y="188" text-anchor="middle" class="sm">from a standard library</text>
    <text x="115" y="210" text-anchor="middle" class="cap">a starting point, not a plan</text>
  </g>

  <!-- arrow 1 -->
  <path d="M 200 158 L 262 158" fill="none" stroke="#2a1a0e" stroke-width="1.4" marker-end="url(#arr6c)"/>

  <!-- NODE 2: Licensed specialist and team authorize (the gate) -->
  <g>
    <rect class="tile-gate" x="265" y="98" width="170" height="120"/>
    <rect class="gate-stripe" x="265" y="98" width="4" height="120"/>
    <text x="354" y="124" text-anchor="middle" class="hd">Licensed specialist</text>
    <text x="354" y="140" text-anchor="middle" class="hd">and team authorize</text>
    <line x1="285" y1="150" x2="425" y2="150" stroke="#8a8480" stroke-width="0.6"/>
    <text x="354" y="170" text-anchor="middle" class="sm">review against student history,</text>
    <text x="354" y="186" text-anchor="middle" class="sm">evaluation results, response</text>
    <text x="354" y="202" text-anchor="middle" class="sm">to prior intervention</text>
  </g>

  <!-- arrow 2 -->
  <path d="M 435 158 L 497 158" fill="none" stroke="#2a1a0e" stroke-width="1.4" marker-end="url(#arr6c)"/>

  <!-- NODE 3: Teacher implements -->
  <g>
    <rect class="tile-node" x="500" y="98" width="170" height="120"/>
    <text x="585" y="124" text-anchor="middle" class="hd">Teacher implements</text>
    <line x1="520" y1="134" x2="650" y2="134" stroke="#c8c4c0" stroke-width="0.6"/>
    <text x="585" y="156" text-anchor="middle" class="sm">what the team</text>
    <text x="585" y="172" text-anchor="middle" class="sm">has authorized —</text>
    <text x="585" y="188" text-anchor="middle" class="sm">no more, no less</text>
    <text x="585" y="210" text-anchor="middle" class="cap">execution, not authorization</text>
  </g>

  <!-- gate caption -->
  <text x="350" y="240" text-anchor="middle" class="cap">the middle box is the legal act — performed by the team, with the licensed specialist present</text>

  <!-- SHORTCUT — dashed arrow under the row -->
  <path d="M 115 280 C 200 340, 500 340, 585 280" fill="none" stroke="#2a1a0e" stroke-width="1.2" stroke-dasharray="6 4" marker-end="url(#arr6c)"/>

  <!-- X across the shortcut -->
  <g transform="translate(350 318)">
    <rect x="-12" y="-12" width="24" height="24" fill="#fdfcfb" stroke="#2a1a0e" stroke-width="1.2"/>
    <line x1="-7" y1="-7" x2="7" y2="7" stroke="#2a1a0e" stroke-width="2"/>
    <line x1="-7" y1="7" x2="7" y2="-7" stroke="#2a1a0e" stroke-width="2"/>
  </g>

  <!-- shortcut label -->
  <text x="350" y="362" text-anchor="middle" class="shortcut-text">skips legal authorization &amp; clinical judgment</text>
  <text x="350" y="378" text-anchor="middle" class="cap">looks like efficiency. Reads, in court and in practice, as the skipped step.</text>

  <!-- footer -->
  <line x1="40" y1="398" x2="660" y2="398" stroke="#c8c4c0" stroke-width="0.6"/>
  <text x="350" y="414" text-anchor="middle" class="cap">IDEA §1414 requires the team. The model does not satisfy it.</text>
</svg>
