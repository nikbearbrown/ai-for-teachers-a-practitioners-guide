<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 700 600" role="img" aria-labelledby="fig03-title fig03-desc" font-family="'EB Garamond', Georgia, serif">
  <title id="fig03-title">Five-question diagnostic decision tree for AI-survivable assessment</title>
  <desc id="fig03-desc">A top-down decision tree of five yes-or-no questions. Each yes branch continues downward; each no branch peels to the right toward a single redesign-target terminal. Five consecutive yes answers converge on an AI-survivable terminal at the bottom.</desc>

  <defs>
    <marker id="arrow03" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse">
      <path d="M0,0 L10,5 L0,10 z" fill="#2a1a0e"/>
    </marker>
    <marker id="arrow03-grey" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse">
      <path d="M0,0 L10,5 L0,10 z" fill="#8a8480"/>
    </marker>
  </defs>

  <rect x="0" y="0" width="700" height="600" fill="#fdfcfb"/>

  <!-- Title -->
  <text x="40" y="36" font-size="20" fill="#2a1a0e">Five-question diagnostic &#8212; one assignment at a time</text>
  <text x="40" y="56" font-size="12" font-style="italic" fill="#4a4540">Find the smallest move that converts a &#8220;no&#8221; into a &#8220;yes.&#8221;</text>

  <!-- Node 1 -->
  <rect x="120" y="80" width="280" height="58" fill="#f5f2ee" stroke="#2a1a0e" stroke-width="1"/>
  <text x="260" y="102" text-anchor="middle" font-size="13" fill="#2a1a0e">1. Defense in conversation required?</text>
  <text x="260" y="124" text-anchor="middle" font-size="11" font-style="italic" fill="#4a4540">Smallest move: a 10-minute oral conference</text>
  <line x1="260" y1="138" x2="260" y2="172" stroke="#2a1a0e" marker-end="url(#arrow03)"/>
  <text x="266" y="158" font-size="11" fill="#4a4540">yes</text>
  <line x1="400" y1="109" x2="500" y2="109" stroke="#8a8480" marker-end="url(#arrow03-grey)"/>
  <text x="416" y="103" font-size="11" fill="#8a8480">no</text>

  <!-- Node 2 -->
  <rect x="120" y="178" width="280" height="58" fill="#f5f2ee" stroke="#2a1a0e" stroke-width="1"/>
  <text x="260" y="200" text-anchor="middle" font-size="13" fill="#2a1a0e">2. Novel application beyond training cutoff?</text>
  <text x="260" y="222" text-anchor="middle" font-size="11" font-style="italic" fill="#4a4540">Smallest move: link to the last 12 months</text>
  <line x1="260" y1="236" x2="260" y2="270" stroke="#2a1a0e" marker-end="url(#arrow03)"/>
  <text x="266" y="256" font-size="11" fill="#4a4540">yes</text>
  <line x1="400" y1="207" x2="500" y2="207" stroke="#8a8480" marker-end="url(#arrow03-grey)"/>
  <text x="416" y="201" font-size="11" fill="#8a8480">no</text>

  <!-- Node 3 -->
  <rect x="120" y="276" width="280" height="58" fill="#f5f2ee" stroke="#2a1a0e" stroke-width="1"/>
  <text x="260" y="298" text-anchor="middle" font-size="13" fill="#2a1a0e">3. Process trail required?</text>
  <text x="260" y="320" text-anchor="middle" font-size="11" font-style="italic" fill="#4a4540">Smallest move: dated drafts + reflection memo</text>
  <line x1="260" y1="334" x2="260" y2="368" stroke="#2a1a0e" marker-end="url(#arrow03)"/>
  <text x="266" y="354" font-size="11" fill="#4a4540">yes</text>
  <line x1="400" y1="305" x2="500" y2="305" stroke="#8a8480" marker-end="url(#arrow03-grey)"/>
  <text x="416" y="299" font-size="11" fill="#8a8480">no</text>

  <!-- Node 4 -->
  <rect x="120" y="374" width="280" height="58" fill="#f5f2ee" stroke="#2a1a0e" stroke-width="1"/>
  <text x="260" y="396" text-anchor="middle" font-size="13" fill="#2a1a0e">4. Real-time unassisted performance?</text>
  <text x="260" y="418" text-anchor="middle" font-size="11" font-style="italic" fill="#4a4540">Smallest move: one in-class artifact</text>
  <line x1="260" y1="432" x2="260" y2="466" stroke="#2a1a0e" marker-end="url(#arrow03)"/>
  <text x="266" y="452" font-size="11" fill="#4a4540">yes</text>
  <line x1="400" y1="403" x2="500" y2="403" stroke="#8a8480" marker-end="url(#arrow03-grey)"/>
  <text x="416" y="397" font-size="11" fill="#8a8480">no</text>

  <!-- Node 5 -->
  <rect x="120" y="472" width="280" height="58" fill="#f5f2ee" stroke="#2a1a0e" stroke-width="1"/>
  <text x="260" y="494" text-anchor="middle" font-size="13" fill="#2a1a0e">5. Would artifact alone reveal learning?</text>
  <text x="260" y="516" text-anchor="middle" font-size="11" font-style="italic" fill="#4a4540">Smallest move: portfolio + defense</text>
  <line x1="260" y1="530" x2="260" y2="556" stroke="#2a1a0e" marker-end="url(#arrow03)"/>
  <text x="266" y="546" font-size="11" fill="#4a4540">yes</text>
  <line x1="400" y1="501" x2="500" y2="501" stroke="#8a8480" marker-end="url(#arrow03-grey)"/>
  <text x="416" y="495" font-size="11" fill="#8a8480">no</text>

  <!-- Redesign-target terminal (ochre swapped to warm grey #8a8480 since palette is warm grayscale only) -->
  <rect x="500" y="240" width="160" height="120" fill="#c8c4c0" stroke="#2a1a0e" stroke-width="1"/>
  <text x="580" y="276" text-anchor="middle" font-size="14" fill="#2a1a0e">Redesign target</text>
  <text x="580" y="300" text-anchor="middle" font-size="11" font-style="italic" fill="#2a1a0e">Find the smallest move</text>
  <text x="580" y="318" text-anchor="middle" font-size="11" font-style="italic" fill="#2a1a0e">that turns this &#8220;no&#8221;</text>
  <text x="580" y="336" text-anchor="middle" font-size="11" font-style="italic" fill="#2a1a0e">into a &#8220;yes.&#8221;</text>

  <!-- Convergence guides from each no path into the terminal -->
  <path d="M520 109 Q540 109 540 240" fill="none" stroke="#8a8480" stroke-dasharray="2 3"/>
  <path d="M520 207 Q535 207 540 240" fill="none" stroke="#8a8480" stroke-dasharray="2 3"/>
  <path d="M520 305 Q525 305 540 305" fill="none" stroke="#8a8480" stroke-dasharray="2 3"/>
  <path d="M520 403 Q525 380 540 360" fill="none" stroke="#8a8480" stroke-dasharray="2 3"/>
  <path d="M520 501 Q525 460 540 360" fill="none" stroke="#8a8480" stroke-dasharray="2 3"/>

  <!-- Final AI-survivable terminal -->
  <rect x="120" y="560" width="280" height="36" fill="#2a1a0e"/>
  <text x="260" y="584" text-anchor="middle" font-size="15" fill="#fdfcfb">AI-survivable</text>
</svg>
