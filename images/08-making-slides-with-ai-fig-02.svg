<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 700 480" role="img" aria-labelledby="f2-title f2-desc" font-family="'EB Garamond', Garamond, Georgia, serif">
  <title id="f2-title">Content-type to visual-form matching guide</title>
  <desc id="f2-desc">Five content structures — list, comparison, process, distribution, single quantity — paired with the visual form that fits each. Bullets are the right answer for only one row.</desc>
  <defs>
    <marker id="f2-arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M0,0 L10,5 L0,10 z" fill="#2a1a0e"/>
    </marker>
  </defs>
  <rect width="700" height="480" fill="#fdfcfb"/>

  <text x="30" y="34" font-size="20" font-style="italic" fill="#2a1a0e">Match the form to the structure.</text>

  <!-- Column headers -->
  <text x="160" y="74" text-anchor="middle" font-size="13" fill="#8a8480">content structure</text>
  <text x="500" y="74" text-anchor="middle" font-size="13" fill="#8a8480">visual form</text>
  <line x1="30" y1="84" x2="670" y2="84" stroke="#c8c4c0" stroke-width="1"/>

  <!-- Row 1: list -->
  <text x="50" y="118" font-size="17" fill="#2a1a0e">List</text>
  <text x="50" y="138" font-size="12" font-style="italic" fill="#8a8480">co-membership only</text>
  <g transform="translate(380,100)">
    <circle cx="6" cy="10" r="2.5" fill="#2a1a0e"/>
    <line x1="16" y1="10" x2="200" y2="10" stroke="#4a4540" stroke-width="0.8"/>
    <circle cx="6" cy="26" r="2.5" fill="#2a1a0e"/>
    <line x1="16" y1="26" x2="180" y2="26" stroke="#4a4540" stroke-width="0.8"/>
    <circle cx="6" cy="42" r="2.5" fill="#2a1a0e"/>
    <line x1="16" y1="42" x2="210" y2="42" stroke="#4a4540" stroke-width="0.8"/>
  </g>
  <line x1="30" y1="160" x2="670" y2="160" stroke="#c8c4c0" stroke-width="0.6"/>

  <!-- Row 2: comparison -->
  <text x="50" y="194" font-size="17" fill="#2a1a0e">Comparison</text>
  <text x="50" y="214" font-size="12" font-style="italic" fill="#8a8480">two axes against each other</text>
  <g transform="translate(380,176)">
    <rect x="0" y="0" width="60" height="30" fill="#f5f2ee" stroke="#2a1a0e" stroke-width="1"/>
    <rect x="60" y="0" width="60" height="30" fill="#c8c4c0" stroke="#2a1a0e" stroke-width="1"/>
    <rect x="0" y="30" width="60" height="30" fill="#c8c4c0" stroke="#2a1a0e" stroke-width="1"/>
    <rect x="60" y="30" width="60" height="30" fill="#8a8480" stroke="#2a1a0e" stroke-width="1"/>
    <text x="140" y="22" font-size="12" fill="#4a4540">2×2 matrix</text>
    <text x="140" y="40" font-size="12" fill="#8a8480">or table</text>
  </g>
  <line x1="30" y1="240" x2="670" y2="240" stroke="#c8c4c0" stroke-width="0.6"/>

  <!-- Row 3: process -->
  <text x="50" y="274" font-size="17" fill="#2a1a0e">Process</text>
  <text x="50" y="294" font-size="12" font-style="italic" fill="#8a8480">temporal or causal flow</text>
  <g transform="translate(380,258)">
    <rect x="0" y="6" width="38" height="22" fill="#f5f2ee" stroke="#2a1a0e" stroke-width="1"/>
    <text x="19" y="22" text-anchor="middle" font-size="11" fill="#2a1a0e">A</text>
    <line x1="38" y1="17" x2="68" y2="17" stroke="#4a4540" stroke-width="1.2" marker-end="url(#f2-arrow)"/>
    <rect x="74" y="6" width="38" height="22" fill="#f5f2ee" stroke="#2a1a0e" stroke-width="1"/>
    <text x="93" y="22" text-anchor="middle" font-size="11" fill="#2a1a0e">B</text>
    <line x1="112" y1="17" x2="142" y2="17" stroke="#4a4540" stroke-width="1.2" marker-end="url(#f2-arrow)"/>
    <rect x="148" y="6" width="38" height="22" fill="#f5f2ee" stroke="#2a1a0e" stroke-width="1"/>
    <text x="167" y="22" text-anchor="middle" font-size="11" fill="#2a1a0e">C</text>
    <text x="210" y="22" font-size="12" fill="#4a4540">directed diagram</text>
  </g>
  <line x1="30" y1="320" x2="670" y2="320" stroke="#c8c4c0" stroke-width="0.6"/>

  <!-- Row 4: distribution -->
  <text x="50" y="354" font-size="17" fill="#2a1a0e">Distribution</text>
  <text x="50" y="374" font-size="12" font-style="italic" fill="#8a8480">quantities across categories</text>
  <g transform="translate(380,338)">
    <rect x="0" y="22" width="20" height="22" fill="#4a4540"/>
    <rect x="26" y="6" width="20" height="38" fill="#4a4540"/>
    <rect x="52" y="14" width="20" height="30" fill="#4a4540"/>
    <rect x="78" y="28" width="20" height="16" fill="#4a4540"/>
    <line x1="0" y1="44" x2="100" y2="44" stroke="#2a1a0e" stroke-width="1"/>
    <text x="120" y="34" font-size="12" fill="#4a4540">bar or column chart</text>
  </g>
  <line x1="30" y1="402" x2="670" y2="402" stroke="#c8c4c0" stroke-width="0.6"/>

  <!-- Row 5: single quantity -->
  <text x="50" y="436" font-size="17" fill="#2a1a0e">Single quantity</text>
  <text x="50" y="456" font-size="12" font-style="italic" fill="#8a8480">one number worth seeing</text>
  <g transform="translate(380,416)">
    <text x="0" y="44" font-size="46" fill="#2a1a0e">32</text>
    <text x="74" y="36" font-size="13" fill="#4a4540">ATP / glucose</text>
    <text x="74" y="52" font-size="12" font-style="italic" fill="#8a8480">number set large</text>
  </g>
</svg>
