<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 700 420" role="img" aria-labelledby="t01 d01">
  <title id="t01">Failed workflow of the opening case</title>
  <desc id="d01">A five-step linear pipeline runs from essay upload through AI scoring, dashboard queue, three-second teacher click, and delivered feedback. A dashed overlay marks the missing cognitive operation between dashboard and click; a separate annotation shows three parent calls landing on the delivered feedback.</desc>
  <defs>
    <style>
      .ti { font-family: 'EB Garamond', Georgia, 'Times New Roman', serif; font-size: 16px; font-weight: bold; fill: #2a1a0e; }
      .sub { font-family: 'EB Garamond', Georgia, 'Times New Roman', serif; font-size: 11px; fill: #4a4540; }
      .lb { font-family: 'EB Garamond', Georgia, 'Times New Roman', serif; font-size: 12px; fill: #2a1a0e; }
      .sm { font-family: 'EB Garamond', Georgia, 'Times New Roman', serif; font-size: 10px; fill: #4a4540; }
      .badge { font-family: 'EB Garamond', Georgia, 'Times New Roman', serif; font-size: 12px; font-weight: bold; fill: #2a1a0e; }
      .miss { font-family: 'EB Garamond', Georgia, 'Times New Roman', serif; font-size: 12px; font-style: italic; fill: #2a1a0e; }
      .cap { font-family: 'EB Garamond', Georgia, 'Times New Roman', serif; font-size: 11px; font-style: italic; fill: #4a4540; }
    </style>
    <marker id="ar1" markerWidth="8" markerHeight="6" refX="7" refY="3" orient="auto">
      <polygon points="0 0, 8 3, 0 6" fill="#2a1a0e"/>
    </marker>
    <marker id="arDk" markerWidth="8" markerHeight="6" refX="7" refY="3" orient="auto">
      <polygon points="0 0, 8 3, 0 6" fill="#4a4540"/>
    </marker>
  </defs>
  <rect width="700" height="420" fill="#fdfcfb"/>

  <text x="32" y="34" class="ti">A workflow designed to skip an operation</text>
  <text x="32" y="52" class="sub">Five steps from essay upload to delivered feedback. The click happens. The operation does not.</text>

  <!-- 99.4% floating badge above click step -->
  <text x="491" y="92" text-anchor="middle" class="badge">99.4% approved</text>
  <text x="491" y="108" text-anchor="middle" class="sm">&#8776; 3 seconds per essay</text>
  <line x1="491" y1="114" x2="491" y2="148" stroke="#4a4540" stroke-width="1" marker-end="url(#arDk)"/>

  <!-- Step 1: Essay uploaded -->
  <rect x="32" y="180" width="100" height="60" fill="#f5f2ee" stroke="#2a1a0e" stroke-width="1"/>
  <text x="82" y="206" text-anchor="middle" class="lb">Essay</text>
  <text x="82" y="222" text-anchor="middle" class="lb">uploaded</text>

  <line x1="132" y1="210" x2="156" y2="210" stroke="#2a1a0e" stroke-width="1" marker-end="url(#ar1)"/>

  <!-- Step 2: AI scores -->
  <rect x="160" y="180" width="110" height="60" fill="#f5f2ee" stroke="#2a1a0e" stroke-width="1"/>
  <text x="215" y="200" text-anchor="middle" class="lb">AI scores</text>
  <text x="215" y="216" text-anchor="middle" class="sm">against the rubric</text>
  <text x="215" y="230" text-anchor="middle" class="sm">+ paragraph feedback</text>

  <line x1="270" y1="210" x2="294" y2="210" stroke="#2a1a0e" stroke-width="1" marker-end="url(#ar1)"/>

  <!-- Step 3: Dashboard -->
  <rect x="298" y="180" width="110" height="60" fill="#f5f2ee" stroke="#2a1a0e" stroke-width="1"/>
  <text x="353" y="200" text-anchor="middle" class="lb">Dashboard</text>
  <text x="353" y="216" text-anchor="middle" class="sm">&#8220;pending approval&#8221;</text>
  <text x="353" y="230" text-anchor="middle" class="sm">120 essays queued</text>

  <line x1="408" y1="210" x2="432" y2="210" stroke="#2a1a0e" stroke-width="1" marker-end="url(#ar1)"/>

  <!-- Step 4: Click approve -->
  <rect x="436" y="180" width="110" height="60" fill="#f5f2ee" stroke="#2a1a0e" stroke-width="1"/>
  <text x="491" y="200" text-anchor="middle" class="lb">Teacher clicks</text>
  <text x="491" y="216" text-anchor="middle" class="lb">&#8220;approve&#8221;</text>
  <text x="491" y="230" text-anchor="middle" class="sm">&#8776; 3 seconds</text>

  <line x1="546" y1="210" x2="570" y2="210" stroke="#2a1a0e" stroke-width="1" marker-end="url(#ar1)"/>

  <!-- Step 5: Delivered -->
  <rect x="574" y="180" width="92" height="60" fill="#f5f2ee" stroke="#2a1a0e" stroke-width="1"/>
  <text x="620" y="206" text-anchor="middle" class="lb">Feedback to</text>
  <text x="620" y="222" text-anchor="middle" class="lb">student</text>

  <!-- Dashed overlay between dashboard and click — the missing operation -->
  <rect x="392" y="266" width="200" height="60" fill="#fdfcfb" stroke="#2a1a0e" stroke-width="1.4" stroke-dasharray="4 4"/>
  <text x="492" y="286" text-anchor="middle" class="miss">missing operation</text>
  <text x="492" y="302" text-anchor="middle" class="sm">&#8220;Does this comment fit</text>
  <text x="492" y="316" text-anchor="middle" class="sm">what I know about this student?&#8221;</text>
  <path d="M 420 266 L 420 245" fill="none" stroke="#4a4540" stroke-width="1" stroke-dasharray="3 3" marker-end="url(#arDk)"/>

  <!-- Three parent calls landing at delivery -->
  <text x="620" y="266" text-anchor="middle" class="badge">3 parent calls</text>
  <text x="620" y="282" text-anchor="middle" class="sm">same week</text>
  <line x1="620" y1="256" x2="620" y2="244" stroke="#4a4540" stroke-width="1" marker-end="url(#arDk)"/>

  <text x="350" y="386" text-anchor="middle" class="cap">The dashboard records the click. Nobody can tell, from the dashboard, whether the operation happened.</text>
</svg>
