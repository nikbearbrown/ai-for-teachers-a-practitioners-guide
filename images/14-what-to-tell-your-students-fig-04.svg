<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 700 480" role="img" aria-labelledby="t4 d4" font-family="'EB Garamond', Garamond, Georgia, 'Times New Roman', serif">
  <title id="t4">Annotated Feynman test conversation</title>
  <desc id="d4">A mocked-up chat thread between a student and an AI. Each turn is labelled with the cognitive operation it performs; the student retrieves and revises, the AI asks and points.</desc>
  <defs>
    <marker id="arr4" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse">
      <path d="M0,0 L10,5 L0,10 z" fill="#4a4540"/>
    </marker>
  </defs>

  <rect x="0" y="0" width="700" height="480" fill="#fdfcfb"/>

  <text x="350" y="32" text-anchor="middle" font-size="22" fill="#2a1a0e">Student explains. AI probes. Gaps appear.</text>
  <text x="350" y="56" text-anchor="middle" font-size="14" fill="#4a4540" font-style="italic">A Feynman-test session with the AI cast as audience, not author.</text>

  <!-- chat frame -->
  <rect x="40" y="80" width="430" height="376" fill="#f5f2ee" stroke="#4a4540" stroke-width="1"/>
  <text x="56" y="100" font-size="11" fill="#8a8480" font-style="italic">topic: photosynthesis &#8212; explain it to me</text>
  <line x1="40" y1="108" x2="470" y2="108" stroke="#c8c4c0" stroke-width="1"/>

  <!-- Turn 1: student -->
  <rect x="56" y="120" width="320" height="58" fill="#fdfcfb" stroke="#8a8480" stroke-width="1"/>
  <text x="64" y="138" font-size="11" fill="#8a8480" font-style="italic">student</text>
  <text x="64" y="156" font-size="13" fill="#2a1a0e">&#8220;Plants take in sunlight and CO&#8322;,</text>
  <text x="64" y="172" font-size="13" fill="#2a1a0e">turn them into sugar and oxygen.&#8221;</text>

  <!-- Turn 2: AI -->
  <rect x="96" y="190" width="320" height="58" fill="#fdfcfb" stroke="#4a4540" stroke-width="1"/>
  <text x="104" y="208" font-size="11" fill="#8a8480" font-style="italic">AI &#8212; probing</text>
  <text x="104" y="226" font-size="13" fill="#2a1a0e">&#8220;What does &#8216;turn them into&#8217; mean</text>
  <text x="104" y="242" font-size="13" fill="#2a1a0e">at the level of the molecules?&#8221;</text>

  <!-- Turn 3: student -->
  <rect x="56" y="260" width="320" height="58" fill="#fdfcfb" stroke="#8a8480" stroke-width="1"/>
  <text x="64" y="278" font-size="11" fill="#8a8480" font-style="italic">student &#8212; retrieving</text>
  <text x="64" y="296" font-size="13" fill="#2a1a0e">&#8220;Uh &#8212; the bonds in CO&#8322; break, the</text>
  <text x="64" y="312" font-size="13" fill="#2a1a0e">carbon ends up in &#8230; glucose? I think?&#8221;</text>

  <!-- Turn 4: AI -->
  <rect x="96" y="330" width="320" height="76" fill="#fdfcfb" stroke="#4a4540" stroke-width="1"/>
  <text x="104" y="348" font-size="11" fill="#8a8480" font-style="italic">AI &#8212; pointing to gap</text>
  <text x="104" y="366" font-size="13" fill="#2a1a0e">&#8220;What provides the energy to break</text>
  <text x="104" y="382" font-size="13" fill="#2a1a0e">those bonds? Where does the oxygen</text>
  <text x="104" y="398" font-size="13" fill="#2a1a0e">in O&#8322; actually come from?&#8221;</text>

  <text x="56" y="430" font-size="12" fill="#2a1a0e" font-style="italic">after &#8212; the AI lists every place I got stuck.</text>
  <text x="56" y="446" font-size="12" fill="#4a4540" font-style="italic">go work on those. that is the lesson.</text>

  <!-- Annotations on the right -->
  <line x1="486" y1="146" x2="510" y2="146" stroke="#4a4540" stroke-width="1"/>
  <text x="518" y="142" font-size="13" fill="#2a1a0e" font-style="italic">student does the</text>
  <text x="518" y="158" font-size="13" fill="#2a1a0e" font-style="italic">load-bearing work:</text>
  <text x="518" y="174" font-size="12" fill="#4a4540">retrieves from memory,</text>
  <text x="518" y="188" font-size="12" fill="#4a4540">picks the words.</text>

  <line x1="486" y1="218" x2="510" y2="218" stroke="#4a4540" stroke-width="1"/>
  <text x="518" y="214" font-size="13" fill="#2a1a0e" font-style="italic">AI does adjacent work:</text>
  <text x="518" y="230" font-size="12" fill="#4a4540">forces specificity,</text>
  <text x="518" y="244" font-size="12" fill="#4a4540">refuses to fill gaps.</text>

  <line x1="486" y1="288" x2="510" y2="288" stroke="#4a4540" stroke-width="1"/>
  <text x="518" y="284" font-size="13" fill="#2a1a0e" font-style="italic">retrieval attempt &#8212;</text>
  <text x="518" y="300" font-size="13" fill="#2a1a0e" font-style="italic">desirable difficulty</text>
  <text x="518" y="316" font-size="12" fill="#4a4540">storage strength builds</text>
  <text x="518" y="330" font-size="12" fill="#4a4540">on the struggle.</text>

  <line x1="486" y1="368" x2="510" y2="368" stroke="#4a4540" stroke-width="1"/>
  <text x="518" y="364" font-size="13" fill="#2a1a0e" font-style="italic">gap surfaced &#8212;</text>
  <text x="518" y="380" font-size="13" fill="#2a1a0e" font-style="italic">go study the gap.</text>

  <text x="350" y="474" text-anchor="middle" font-size="11" fill="#8a8480" font-style="italic">Figure 14.4 &#8212; mocked conversation; cognitive roles labelled at each turn.</text>
</svg>
