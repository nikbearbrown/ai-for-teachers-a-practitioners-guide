<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 700 420" role="img" aria-labelledby="t07f3 d07f3">
  <title id="t07f3">The three-step phase gate for AI-assisted teacher writing</title>
  <desc id="d07f3">A horizontal three-step pipeline. Step one is teacher writes bullets, the what — you supply this. Step two is model writes prose, the how — model does this. Step three is teacher reads prose against bullets, the check — never skip this. A red callout below step three flags it as the step most often skipped under time pressure and the step that catches the failures.</desc>
  <defs>
    <style>
      .ti { font-family: 'EB Garamond', Garamond, Georgia, serif; font-size: 18px; font-weight: 700; fill: #2a1a0e; }
      .sub { font-family: 'EB Garamond', Garamond, Georgia, serif; font-size: 12px; font-style: italic; fill: #4a4540; }
      .stepnum { font-family: 'EB Garamond', Garamond, Georgia, serif; font-size: 28px; font-weight: 700; fill: #fdfcfb; }
      .steptitle { font-family: 'EB Garamond', Garamond, Georgia, serif; font-size: 14px; font-weight: 700; fill: #2a1a0e; }
      .stepwhat { font-family: 'EB Garamond', Garamond, Georgia, serif; font-size: 11px; font-style: italic; fill: #4a4540; }
      .actor { font-family: 'EB Garamond', Garamond, Georgia, serif; font-size: 12px; fill: #2a1a0e; }
      .actorb { font-family: 'EB Garamond', Garamond, Georgia, serif; font-size: 12px; font-weight: 700; fill: #2a1a0e; }
      .callout { font-family: 'EB Garamond', Garamond, Georgia, serif; font-size: 12px; fill: #fdfcfb; }
      .calloutb { font-family: 'EB Garamond', Garamond, Georgia, serif; font-size: 12px; font-weight: 700; fill: #fdfcfb; }
      .cap { font-family: 'EB Garamond', Garamond, Georgia, serif; font-size: 12px; font-style: italic; fill: #4a4540; }
    </style>
    <marker id="arr07f3" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse">
      <path d="M 0 0 L 10 5 L 0 10 z" fill="#2a1a0e"/>
    </marker>
  </defs>
  <rect width="700" height="420" fill="#fdfcfb"/>

  <text x="32" y="34" class="ti">The phase gate is three steps. Two of them involve you.</text>
  <text x="32" y="54" class="sub">Bullets, prose, check. Skip the check and the failures land.</text>

  <rect x="32" y="100" width="188" height="120" fill="#fdfcfb" stroke="#2a1a0e" stroke-width="1.5"/>
  <rect x="32" y="100" width="50" height="120" fill="#2a1a0e" stroke="none"/>
  <text x="57" y="170" text-anchor="middle" class="stepnum">1</text>
  <text x="98" y="128" class="steptitle">Teacher writes</text>
  <text x="98" y="146" class="steptitle">bullets</text>
  <text x="98" y="170" class="stepwhat">the what</text>
  <text x="98" y="198" class="actorb">You supply this</text>

  <line x1="220" y1="160" x2="252" y2="160" stroke="#2a1a0e" stroke-width="1.5" marker-end="url(#arr07f3)"/>

  <rect x="256" y="100" width="188" height="120" fill="#fdfcfb" stroke="#8a8480" stroke-width="1.5"/>
  <rect x="256" y="100" width="50" height="120" fill="#8a8480" stroke="none"/>
  <text x="281" y="170" text-anchor="middle" class="stepnum">2</text>
  <text x="322" y="128" class="steptitle">Model writes</text>
  <text x="322" y="146" class="steptitle">prose</text>
  <text x="322" y="170" class="stepwhat">the how</text>
  <text x="322" y="198" class="actor">Model does this</text>

  <line x1="444" y1="160" x2="476" y2="160" stroke="#2a1a0e" stroke-width="1.5" marker-end="url(#arr07f3)"/>

  <rect x="480" y="100" width="188" height="120" fill="#fdfcfb" stroke="#2a1a0e" stroke-width="1.5"/>
  <rect x="480" y="100" width="50" height="120" fill="#2a1a0e" stroke="none"/>
  <text x="505" y="170" text-anchor="middle" class="stepnum">3</text>
  <text x="546" y="128" class="steptitle">Teacher reads</text>
  <text x="546" y="146" class="steptitle">prose vs bullets</text>
  <text x="546" y="170" class="stepwhat">the check</text>
  <text x="546" y="198" class="actorb">You supply this</text>

  <line x1="574" y1="220" x2="574" y2="244" stroke="#4a4540" stroke-width="1.5" marker-end="url(#arr07f3)"/>
  <rect x="350" y="252" width="318" height="80" fill="#2a1a0e" stroke="#2a1a0e" stroke-width="1"/>
  <text x="368" y="276" class="calloutb">The step skipped under time pressure</text>
  <text x="368" y="296" class="callout">is the step that catches the failures.</text>
  <text x="368" y="316" class="callout">Read every claim against your bullets.</text>

  <text x="350" y="384" class="cap" text-anchor="middle">Figure 7.3 — The phase gate is three steps. Two of them involve you.</text>
</svg>
