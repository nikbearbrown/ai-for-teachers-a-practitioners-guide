<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 700 420" role="img" aria-labelledby="t04f2 d04f2">
  <title id="t04f2">Backward design and where AI prompts collapse it</title>
  <desc id="d04f2">Three-stage backward-design flow: Stage 1 (understanding), Stage 2 (evidence), Stage 3 (activities). A default AI prompt curves over Stages 1 and 2 and lands at Stage 3, marked with an X. A two-sentence sticky note feeds Stage 1, then Stage 2, then a Stage 3 prompt, marked with a check.</desc>
  <defs>
    <style>
      .ti { font-family: 'EB Garamond', Georgia, 'Times New Roman', serif; font-size: 16px; font-weight: bold; fill: #2a1a0e; }
      .sub { font-family: 'EB Garamond', Georgia, 'Times New Roman', serif; font-size: 12px; font-style: italic; fill: #4a4540; }
      .stg { font-family: 'EB Garamond', Georgia, 'Times New Roman', serif; font-size: 14px; font-weight: bold; fill: #2a1a0e; }
      .stgsub { font-family: 'EB Garamond', Georgia, 'Times New Roman', serif; font-size: 11px; fill: #4a4540; }
      .verdict { font-family: 'EB Garamond', Georgia, 'Times New Roman', serif; font-size: 11px; font-style: italic; fill: #2a1a0e; }
      .sm { font-family: 'EB Garamond', Georgia, 'Times New Roman', serif; font-size: 11px; fill: #4a4540; }
      .mark { font-family: 'EB Garamond', Georgia, 'Times New Roman', serif; font-size: 22px; font-weight: bold; fill: #2a1a0e; }
      .cap { font-family: 'EB Garamond', Georgia, 'Times New Roman', serif; font-size: 12px; font-style: italic; fill: #2a1a0e; }
    </style>
    <marker id="ar4f2a" markerWidth="9" markerHeight="7" refX="8" refY="3.5" orient="auto">
      <polygon points="0 0, 9 3.5, 0 7" fill="#2a1a0e"/>
    </marker>
    <marker id="ar4f2b" markerWidth="9" markerHeight="7" refX="8" refY="3.5" orient="auto">
      <polygon points="0 0, 9 3.5, 0 7" fill="#8a8480"/>
    </marker>
  </defs>

  <rect width="700" height="420" fill="#fdfcfb"/>

  <text x="350" y="28" text-anchor="middle" class="ti">Backward design, and where the default AI prompt collapses it.</text>
  <text x="350" y="46" text-anchor="middle" class="sub">Ninety seconds of Stage 1 + Stage 2 turn a generic draft into one aimed at your room.</text>

  <!-- Top path: default AI prompt skips to Stage 3 -->
  <rect x="40" y="74" width="150" height="42" fill="#f5f2ee" stroke="#8a8480" stroke-width="1"/>
  <text x="115" y="92" text-anchor="middle" class="stgsub">Default AI prompt</text>
  <text x="115" y="106" text-anchor="middle" class="sm">"write a 50-minute lesson on X"</text>

  <!-- Curved arrow jumping over Stages 1 + 2 -->
  <path d="M 190 95 Q 380 30 540 195" fill="none" stroke="#8a8480" stroke-width="1.4" stroke-dasharray="4 3" marker-end="url(#ar4f2b)"/>
  <text x="380" y="68" text-anchor="middle" class="verdict">skips Stages 1 and 2</text>
  <text x="385" y="86" text-anchor="middle" class="mark">&#215;</text>

  <!-- Three Stage boxes -->
  <g>
    <rect x="60" y="180" width="170" height="58" fill="#f5f2ee" stroke="#2a1a0e" stroke-width="1.2"/>
    <text x="145" y="202" text-anchor="middle" class="stg">Stage 1</text>
    <text x="145" y="220" text-anchor="middle" class="stgsub">What should students</text>
    <text x="145" y="233" text-anchor="middle" class="stgsub">understand?</text>

    <rect x="265" y="180" width="170" height="58" fill="#f5f2ee" stroke="#2a1a0e" stroke-width="1.2"/>
    <text x="350" y="202" text-anchor="middle" class="stg">Stage 2</text>
    <text x="350" y="220" text-anchor="middle" class="stgsub">What evidence shows</text>
    <text x="350" y="233" text-anchor="middle" class="stgsub">they understand?</text>

    <rect x="470" y="180" width="170" height="58" fill="#c8c4c0" stroke="#2a1a0e" stroke-width="1.2"/>
    <text x="555" y="202" text-anchor="middle" class="stg">Stage 3</text>
    <text x="555" y="220" text-anchor="middle" class="stgsub">What activities produce</text>
    <text x="555" y="233" text-anchor="middle" class="stgsub">that evidence?</text>
  </g>

  <!-- Arrows between stages -->
  <line x1="230" y1="209" x2="263" y2="209" stroke="#2a1a0e" stroke-width="1.4" marker-end="url(#ar4f2a)"/>
  <line x1="435" y1="209" x2="468" y2="209" stroke="#2a1a0e" stroke-width="1.4" marker-end="url(#ar4f2a)"/>

  <!-- Bottom path: sticky note feeds Stage 1 then Stage 2 then Stage 3 prompt -->
  <rect x="40" y="290" width="150" height="50" fill="#fdfcfb" stroke="#2a1a0e" stroke-width="1.2"/>
  <text x="115" y="308" text-anchor="middle" class="stgsub">Two-sentence sticky note</text>
  <text x="115" y="322" text-anchor="middle" class="sm">Stage 1 + Stage 2 in 90 sec</text>
  <text x="115" y="335" text-anchor="middle" class="sm">written by the teacher</text>

  <!-- Arrows from sticky note feeding the stages -->
  <path d="M 115 290 Q 115 260 145 244" fill="none" stroke="#2a1a0e" stroke-width="1.4" marker-end="url(#ar4f2a)"/>
  <path d="M 190 315 Q 280 300 320 244" fill="none" stroke="#2a1a0e" stroke-width="1.4" marker-end="url(#ar4f2a)"/>

  <!-- Final AI prompt rectangle below Stage 3 -->
  <rect x="470" y="290" width="170" height="50" fill="#fdfcfb" stroke="#2a1a0e" stroke-width="1.2"/>
  <text x="555" y="308" text-anchor="middle" class="stgsub">Stage 3 AI prompt</text>
  <text x="555" y="322" text-anchor="middle" class="sm">given the targets + evidence,</text>
  <text x="555" y="335" text-anchor="middle" class="sm">propose activities</text>

  <!-- Arrow from Stage 3 down to AI prompt -->
  <line x1="555" y1="238" x2="555" y2="288" stroke="#2a1a0e" stroke-width="1.4" marker-end="url(#ar4f2a)"/>

  <text x="350" y="370" text-anchor="middle" class="verdict">Sticky note first, then prompt. The model proposes structure for a purpose you have already specified.</text>
  <text x="555" y="358" text-anchor="middle" class="mark">&#10003;</text>

  <text x="350" y="404" text-anchor="middle" class="cap">The ninety seconds before the prompt are the most important ninety seconds in the workflow.</text>
</svg>
