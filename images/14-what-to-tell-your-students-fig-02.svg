<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 700 480" role="img" aria-labelledby="t2 d2" font-family="'EB Garamond', Garamond, Georgia, 'Times New Roman', serif">
  <title id="t2">Bastani et al. (2025): practice gain versus exam outcome by condition</title>
  <desc id="d2">Three conditions compared on two measures. The unconstrained-AI group rises during practice and falls below the no-AI control on the unassisted exam; the tutor-prompted group lands near the control on both.</desc>
  <defs>
    <marker id="arr2" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse">
      <path d="M0,0 L10,5 L0,10 z" fill="#4a4540"/>
    </marker>
  </defs>

  <rect x="0" y="0" width="700" height="480" fill="#fdfcfb"/>

  <text x="350" y="32" text-anchor="middle" font-size="22" fill="#2a1a0e">Practice scores rose. Exam scores told a different story.</text>
  <text x="350" y="56" text-anchor="middle" font-size="14" fill="#4a4540" font-style="italic">Bastani et al., PNAS 2025 &#8212; high-school mathematics, three conditions, ~1,000 students.</text>

  <line x1="100" y1="120" x2="100" y2="380" stroke="#4a4540" stroke-width="1"/>
  <line x1="100" y1="380" x2="640" y2="380" stroke="#4a4540" stroke-width="1"/>

  <g font-size="11" fill="#4a4540">
    <line x1="96" y1="380" x2="100" y2="380" stroke="#4a4540"/>
    <text x="92" y="384" text-anchor="end">70</text>
    <line x1="96" y1="328" x2="100" y2="328" stroke="#4a4540"/>
    <text x="92" y="332" text-anchor="end">85</text>
    <line x1="96" y1="276" x2="100" y2="276" stroke="#4a4540"/>
    <text x="92" y="280" text-anchor="end">100</text>
    <line x1="96" y1="224" x2="100" y2="224" stroke="#4a4540"/>
    <text x="92" y="228" text-anchor="end">115</text>
    <line x1="96" y1="172" x2="100" y2="172" stroke="#4a4540"/>
    <text x="92" y="176" text-anchor="end">130</text>
    <line x1="96" y1="120" x2="100" y2="120" stroke="#4a4540"/>
    <text x="92" y="124" text-anchor="end">145</text>
  </g>

  <text x="40" y="250" transform="rotate(-90 40 250)" text-anchor="middle" font-size="13" fill="#4a4540" font-style="italic">score, control = 100</text>

  <line x1="100" y1="276" x2="640" y2="276" stroke="#8a8480" stroke-width="1" stroke-dasharray="3,4"/>
  <text x="568" y="270" font-size="11" fill="#8a8480" font-style="italic">control baseline</text>

  <!-- Group 1: No AI -->
  <g>
    <rect x="150" y="276" width="44" height="104" fill="#c8c4c0" stroke="#4a4540" stroke-width="1"/>
    <text x="172" y="270" text-anchor="middle" font-size="11" fill="#2a1a0e">100</text>
    <rect x="200" y="276" width="44" height="104" fill="#8a8480" stroke="#4a4540" stroke-width="1"/>
    <text x="222" y="270" text-anchor="middle" font-size="11" fill="#2a1a0e">100</text>
    <text x="197" y="400" text-anchor="middle" font-size="13" fill="#2a1a0e">No AI</text>
    <text x="197" y="416" text-anchor="middle" font-size="11" fill="#4a4540" font-style="italic">control</text>
  </g>

  <!-- Group 2: Unconstrained AI -->
  <g>
    <rect x="320" y="155" width="44" height="121" fill="#4a4540" stroke="#2a1a0e" stroke-width="1"/>
    <text x="342" y="148" text-anchor="middle" font-size="11" fill="#2a1a0e">+ 35</text>
    <rect x="370" y="276" width="44" height="59" fill="#2a1a0e" stroke="#2a1a0e" stroke-width="1"/>
    <text x="392" y="352" text-anchor="middle" font-size="11" fill="#fdfcfb">&#8722; 17</text>
    <text x="367" y="400" text-anchor="middle" font-size="13" fill="#2a1a0e">Unconstrained AI</text>
    <text x="367" y="416" text-anchor="middle" font-size="11" fill="#4a4540" font-style="italic">ask it anything</text>
  </g>

  <!-- Group 3: Tutor-prompted AI -->
  <g>
    <rect x="490" y="248" width="44" height="28" fill="#4a4540" stroke="#2a1a0e" stroke-width="1"/>
    <text x="512" y="242" text-anchor="middle" font-size="11" fill="#2a1a0e">+ 8</text>
    <rect x="540" y="269" width="44" height="7" fill="#8a8480" stroke="#2a1a0e" stroke-width="1"/>
    <text x="562" y="263" text-anchor="middle" font-size="11" fill="#2a1a0e">~ 0</text>
    <text x="537" y="400" text-anchor="middle" font-size="13" fill="#2a1a0e">Tutor-prompted AI</text>
    <text x="537" y="416" text-anchor="middle" font-size="11" fill="#4a4540" font-style="italic">hints, not answers</text>
  </g>

  <g transform="translate(100,440)">
    <rect x="0" y="0" width="14" height="14" fill="#4a4540" stroke="#2a1a0e"/>
    <text x="20" y="11" font-size="12" fill="#2a1a0e">practice score (with AI)</text>
    <rect x="180" y="0" width="14" height="14" fill="#8a8480" stroke="#2a1a0e"/>
    <text x="200" y="11" font-size="12" fill="#2a1a0e">exam score (no AI)</text>
  </g>

  <line x1="430" y1="180" x2="430" y2="340" stroke="#4a4540" stroke-width="1" stroke-dasharray="2,3" marker-end="url(#arr2)"/>
  <text x="445" y="200" font-size="12" fill="#2a1a0e" font-style="italic">the gap is the lesson:</text>
  <text x="445" y="216" font-size="12" fill="#2a1a0e" font-style="italic">felt fluent, didn&#8217;t learn.</text>

  <text x="350" y="468" text-anchor="middle" font-size="12" fill="#8a8480" font-style="italic">Figure 14.2 &#8212; illustrative magnitudes; verify against the published paper before citing.</text>
</svg>
