<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 700 480" role="img" aria-labelledby="f4-title f4-desc" font-family="'EB Garamond', Garamond, Georgia, serif">
  <title id="f4-title">Before and after — slide anatomy on the oxidative phosphorylation example</title>
  <desc id="f4-desc">Two slide mockups side by side. Left: the AI-generated original with topic label, three prose bullets, a stock photo and empty notes. Right: the rewrite with an assertion headline, a labeled mechanism diagram, and a populated notes block.</desc>
  <defs>
    <marker id="f4-arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M0,0 L10,5 L0,10 z" fill="#2a1a0e"/>
    </marker>
  </defs>
  <rect width="700" height="480" fill="#fdfcfb"/>

  <!-- Column headers -->
  <text x="170" y="34" text-anchor="middle" font-size="13" letter-spacing="2" fill="#8a8480">BEFORE</text>
  <text x="530" y="34" text-anchor="middle" font-size="13" letter-spacing="2" fill="#8a8480">AFTER</text>

  <!-- LEFT slide: AI-generated original -->
  <rect x="40" y="56" width="260" height="146" fill="#fdfcfb" stroke="#2a1a0e" stroke-width="1.5"/>
  <text x="56" y="86" font-size="15" fill="#2a1a0e">Oxidative Phosphorylation</text>
  <text x="56" y="106" font-size="9" fill="#4a4540">• Oxidative phosphorylation is the metabolic</text>
  <text x="56" y="118" font-size="9" fill="#4a4540">  pathway in which the mitochondrion uses ...</text>
  <text x="56" y="134" font-size="9" fill="#4a4540">• The proton gradient established across the</text>
  <text x="56" y="146" font-size="9" fill="#4a4540">  inner membrane drives ATP synthase ...</text>
  <text x="56" y="162" font-size="9" fill="#4a4540">• This process, discovered by Peter Mitchell</text>
  <text x="56" y="174" font-size="9" fill="#4a4540">  in 1961 (Nobel 1978), accounts for ...</text>
  <rect x="216" y="148" width="70" height="44" fill="#c8c4c0" stroke="#8a8480" stroke-width="0.8"/>
  <text x="251" y="174" text-anchor="middle" font-size="9" font-style="italic" fill="#4a4540">stock photo</text>

  <!-- Notes (empty) -->
  <rect x="40" y="214" width="260" height="62" fill="#f5f2ee" stroke="#c8c4c0" stroke-width="1"/>
  <text x="56" y="234" font-size="11" letter-spacing="1" fill="#8a8480">NOTES</text>
  <text x="170" y="252" text-anchor="middle" font-size="11" font-style="italic" fill="#8a8480">empty</text>

  <!-- Failure annotations (left) -->
  <text x="40" y="298" font-size="11" fill="#4a4540">Failures named:</text>
  <text x="40" y="318" font-size="11" font-style="italic" fill="#2a1a0e">— topic label</text>
  <text x="40" y="334" font-size="11" font-style="italic" fill="#2a1a0e">— redundant prose</text>
  <text x="40" y="350" font-size="11" font-style="italic" fill="#2a1a0e">— seductive detail</text>
  <text x="40" y="366" font-size="11" font-style="italic" fill="#2a1a0e">— decorative color</text>
  <text x="40" y="382" font-size="11" font-style="italic" fill="#2a1a0e">— notes field unused</text>

  <!-- Center arrow -->
  <line x1="320" y1="140" x2="380" y2="140" stroke="#2a1a0e" stroke-width="1.5" marker-end="url(#f4-arrow)"/>
  <text x="350" y="128" text-anchor="middle" font-size="11" font-style="italic" fill="#8a8480">rewrite</text>

  <!-- RIGHT slide: rebuilt -->
  <rect x="400" y="56" width="260" height="146" fill="#fdfcfb" stroke="#2a1a0e" stroke-width="1.5"/>
  <text x="416" y="84" font-size="14" fill="#2a1a0e">The proton gradient</text>
  <text x="416" y="100" font-size="14" fill="#2a1a0e">powers ATP synthase.</text>

  <!-- Mechanism diagram -->
  <g transform="translate(420,116)">
    <!-- Membrane -->
    <line x1="0" y1="40" x2="220" y2="40" stroke="#4a4540" stroke-width="1.2"/>
    <line x1="0" y1="56" x2="220" y2="56" stroke="#4a4540" stroke-width="1.2"/>
    <!-- H+ ions above -->
    <text x="10" y="30" font-size="11" fill="#2a1a0e">H+</text>
    <text x="36" y="30" font-size="11" fill="#2a1a0e">H+</text>
    <text x="62" y="30" font-size="11" fill="#2a1a0e">H+</text>
    <text x="88" y="30" font-size="11" fill="#2a1a0e">H+</text>
    <!-- ATP synthase rotor -->
    <rect x="110" y="34" width="28" height="28" fill="#c8c4c0" stroke="#2a1a0e" stroke-width="1"/>
    <text x="124" y="52" text-anchor="middle" font-size="9" fill="#2a1a0e">rotor</text>
    <!-- Arrow through -->
    <line x1="124" y1="26" x2="124" y2="70" stroke="#2a1a0e" stroke-width="1.5" marker-end="url(#f4-arrow)"/>
    <!-- Output -->
    <text x="160" y="78" font-size="11" fill="#2a1a0e">~32 ATP</text>
    <text x="160" y="90" font-size="9" fill="#8a8480">per glucose</text>
  </g>

  <!-- Notes (populated) -->
  <rect x="400" y="214" width="260" height="62" fill="#f5f2ee" stroke="#c8c4c0" stroke-width="1"/>
  <text x="416" y="234" font-size="11" letter-spacing="1" fill="#8a8480">NOTES</text>
  <line x1="416" y1="244" x2="644" y2="244" stroke="#4a4540" stroke-width="0.7"/>
  <line x1="416" y1="252" x2="644" y2="252" stroke="#4a4540" stroke-width="0.7"/>
  <line x1="416" y1="260" x2="644" y2="260" stroke="#4a4540" stroke-width="0.7"/>
  <line x1="416" y1="268" x2="620" y2="268" stroke="#4a4540" stroke-width="0.7"/>

  <!-- Right annotations -->
  <text x="400" y="298" font-size="11" fill="#4a4540">Each region by function:</text>
  <text x="400" y="318" font-size="11" font-style="italic" fill="#2a1a0e">— headline = the claim</text>
  <text x="400" y="334" font-size="11" font-style="italic" fill="#2a1a0e">— body = the evidence</text>
  <text x="400" y="350" font-size="11" font-style="italic" fill="#2a1a0e">— notes = the explanation</text>
  <text x="400" y="366" font-size="11" font-style="italic" fill="#2a1a0e">— color encodes a path</text>
  <text x="400" y="382" font-size="11" font-style="italic" fill="#2a1a0e">— diagram in place of prose</text>

  <text x="350" y="440" text-anchor="middle" font-size="14" font-style="italic" fill="#2a1a0e">No new content — only a decision about where each thing belongs.</text>
</svg>
