<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 700 420" role="img" aria-labelledby="fig01-title fig01-desc" font-family="'EB Garamond', Garamond, Georgia, serif">
  <title id="fig01-title">The bottleneck shift</title>
  <desc id="fig01-desc">Two horizontal pipelines compare where the bottleneck sits before and after AI coding assistants. Before: thinking flows into typing-syntax, which is the bottleneck, before shipping. After: thinking is the bottleneck, and typing-syntax becomes thin and delegated to the model.</desc>
  <defs>
    <marker id="arrow01" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse">
      <path d="M0,0 L10,5 L0,10 z" fill="#2a1a0e"/>
    </marker>
  </defs>
  <rect x="0" y="0" width="700" height="420" fill="#fdfcfb"/>

  <text x="350" y="34" text-anchor="middle" font-size="22" fill="#2a1a0e">The bottleneck shift</text>
  <text x="350" y="56" text-anchor="middle" font-size="13" font-style="italic" fill="#4a4540">Where the slow step lived before, and where it lives now</text>

  <text x="34" y="110" font-size="15" fill="#4a4540">Before 2022</text>
  <line x1="34" y1="118" x2="160" y2="118" stroke="#c8c4c0" stroke-width="1"/>

  <rect x="34" y="138" width="120" height="60" fill="#f5f2ee" stroke="#8a8480" stroke-width="1"/>
  <text x="94" y="166" text-anchor="middle" font-size="14" fill="#2a1a0e">Thinking</text>
  <text x="94" y="184" text-anchor="middle" font-size="11" fill="#4a4540">specification</text>

  <line x1="158" y1="168" x2="208" y2="168" stroke="#2a1a0e" stroke-width="1.2" marker-end="url(#arrow01)"/>

  <rect x="212" y="118" width="220" height="100" fill="#c8c4c0" stroke="#2a1a0e" stroke-width="2"/>
  <text x="322" y="156" text-anchor="middle" font-size="16" fill="#2a1a0e">Typing syntax</text>
  <text x="322" y="178" text-anchor="middle" font-size="11" fill="#4a4540">brackets, semicolons,</text>
  <text x="322" y="194" text-anchor="middle" font-size="11" fill="#4a4540">library names, indentation</text>
  <text x="322" y="212" text-anchor="middle" font-size="11" font-style="italic" fill="#2a1a0e">— the bottleneck —</text>

  <line x1="434" y1="168" x2="484" y2="168" stroke="#2a1a0e" stroke-width="1.2" marker-end="url(#arrow01)"/>

  <rect x="488" y="138" width="178" height="60" fill="#f5f2ee" stroke="#8a8480" stroke-width="1"/>
  <text x="577" y="166" text-anchor="middle" font-size="14" fill="#2a1a0e">Working tool</text>
  <text x="577" y="184" text-anchor="middle" font-size="11" fill="#4a4540">shipped</text>

  <line x1="34" y1="246" x2="666" y2="246" stroke="#c8c4c0" stroke-width="1" stroke-dasharray="4 4"/>

  <text x="34" y="276" font-size="15" fill="#4a4540">After 2024</text>
  <line x1="34" y1="284" x2="160" y2="284" stroke="#c8c4c0" stroke-width="1"/>

  <rect x="34" y="300" width="220" height="100" fill="#c8c4c0" stroke="#2a1a0e" stroke-width="2"/>
  <text x="144" y="338" text-anchor="middle" font-size="16" fill="#2a1a0e">Thinking</text>
  <text x="144" y="360" text-anchor="middle" font-size="11" fill="#4a4540">intent, constraints,</text>
  <text x="144" y="376" text-anchor="middle" font-size="11" fill="#4a4540">edge cases, criteria</text>
  <text x="144" y="394" text-anchor="middle" font-size="11" font-style="italic" fill="#2a1a0e">— the bottleneck —</text>

  <line x1="256" y1="350" x2="306" y2="350" stroke="#2a1a0e" stroke-width="1.2" marker-end="url(#arrow01)"/>

  <rect x="310" y="320" width="178" height="60" fill="#f5f2ee" stroke="#8a8480" stroke-width="1" stroke-dasharray="3 3"/>
  <text x="399" y="348" text-anchor="middle" font-size="14" fill="#2a1a0e">Typing syntax</text>
  <text x="399" y="366" text-anchor="middle" font-size="11" font-style="italic" fill="#4a4540">delegated to the model</text>

  <line x1="490" y1="350" x2="540" y2="350" stroke="#2a1a0e" stroke-width="1.2" marker-end="url(#arrow01)"/>

  <rect x="544" y="320" width="122" height="60" fill="#f5f2ee" stroke="#8a8480" stroke-width="1"/>
  <text x="605" y="348" text-anchor="middle" font-size="14" fill="#2a1a0e">Working tool</text>
  <text x="605" y="366" text-anchor="middle" font-size="11" fill="#4a4540">shipped</text>
</svg>
